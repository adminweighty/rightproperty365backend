# Local development dependencies, for machines where Docker is available.
# Nothing in the Go build, tests or dev startup requires this file: without
# DATABASE_URL the API runs on in-memory stores.
#
#   docker compose up -d
#   DATABASE_URL for this stack (sslmode=disable is fine: it never leaves this machine):
#   postgres://rp365:rp365_local_dev_only@localhost:5432/rp365?sslmode=disable
#
# The credentials below are throwaway LOCAL defaults, overridable from the
# environment. Never reuse them anywhere else.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rp365}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rp365_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-rp365}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Search engine for GET /v1/listings (optional: without ELASTICSEARCH_URL the
  # API searches in the database). Single node, security OFF: local
  # development only, reachable from this machine only. Never run it like this
  # anywhere else. After starting it: ELASTICSEARCH_URL=http://localhost:9200,
  # then `go run ./cmd/reindex` to build the index.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # S3-compatible object storage for the future media module.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rp365local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rp365_local_dev_only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  elasticsearch-data:
  postgres-data:
  minio-data:
