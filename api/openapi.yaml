          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "409":
          $ref: "#/components/responses/AppointmentConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/appointments/{id}/reschedule:
    post:
      tags: [appointments]
      operationId: rescheduleMyAppointment
      summary: Propose a new time (customer)
      description: |
        `REQUESTED` or `CONFIRMED` -> `RESCHEDULE_REQUESTED` with `proposed_start_utc` and
        `proposed_by` `CUSTOMER`. `start_utc` itself does not change until the professional
        accepts (`POST /v1/inbox/appointments/{id}/confirm`). A confirmed appointment stops
        being confirmed the moment a new time is proposed.

        Also allowed while the appointment is `RESCHEDULE_REQUESTED` with `proposed_by`
        `PROFESSIONAL`: the customer's time replaces the professional's (a counter-proposal).
        `409 INVALID_STATE` when the customer's own proposal is still waiting, or the
        appointment is closed.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentReschedule"
      responses:
        "200":
          $ref: "#/components/responses/CustomerAppointment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "409":
          $ref: "#/components/responses/AppointmentConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/appointments/{id}/accept:
    post:
      tags: [appointments]
      operationId: acceptMyAppointment
      summary: Accept the time the professional proposed (customer)
      description: |
        Only when `status` is `RESCHEDULE_REQUESTED` and `proposed_by` is `PROFESSIONAL`
        (`can_accept`): the appointment becomes `CONFIRMED` at the proposed time. No body.
        `409 SLOT_TAKEN` when the professional meanwhile has another confirmed appointment that
        overlaps; `409 INVALID_STATE` otherwise, including when the proposed time has passed.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          $ref: "#/components/responses/CustomerAppointment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "409":
          $ref: "#/components/responses/AppointmentConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/inbox/appointments:
    get:
      tags: [appointments]
      operationId: listReceivedAppointments
      summary: Appointments received by the caller (the professional's list and calendar)
      description: |
        `401` when not signed in. `403 FORBIDDEN` unless the caller is a member of an
        organisation that takes appointments (agency, law firm, property manager, developer,
        host, service provider) or an **approved** landlord or property seller.

        **What is returned** (decided on the server; the filters only narrow it):
        - OWNER and MANAGER: every appointment of their organisation.
        - AGENT and STAFF: those assigned to them, plus the organisation's **unassigned
          property viewings**. A consultation addressed to their own agent profile is assigned
          to them.
        - A landlord or property seller: those for the listings they own directly.

        Another organisation's appointments are never returned. Ordered by `start_utc`,
        **soonest first**; pass `from` (for example the start of today) for a calendar or an
        "upcoming" list. Items carry the customer's `contact`; this and
        `GET /v1/inbox/appointments/{id}` are the only places it is returned. List items carry
        no `timeline`.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: from
          in: query
          description: Only appointments starting at or after this instant.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only appointments starting before this instant. Must be after `from`.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/AppointmentStatusFilter"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/AppointmentType"
        - name: listing_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AppointmentPage"
        - $ref: "#/components/parameters/AppointmentPageSize"
      responses:
        "200":
          description: One page (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedAppointmentPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/inbox/appointments/{id}:
    get:
      tags: [appointments]
      operationId: getReceivedAppointment
      summary: One received appointment, with its timeline
      description: "`404` for an appointment the caller may not see (another organisation's, another agent's)."
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          $ref: "#/components/responses/ReceivedAppointment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/inbox/appointments/{id}/confirm:
    post:
      tags: [appointments]
      operationId: confirmReceivedAppointment
      summary: Confirm the requested time, or accept the customer's proposed time (professional)
      description: |
        The body is optional. What happens depends on the appointment and on `start_utc`:

        | Appointment | `start_utc` in the body | Result |
        | --- | --- | --- |
        | `REQUESTED` | absent, or equal to the appointment's `start_utc` | `CONFIRMED` at the requested time |
        | `RESCHEDULE_REQUESTED`, `proposed_by` `CUSTOMER` | absent, or equal to `proposed_start_utc` | `CONFIRMED` at the customer's proposed time (**this is how a professional accepts a customer's proposal: `POST .../confirm` with no body or `{}`**) |
        | either of the above | a **different** time | **Not confirmed.** `RESCHEDULE_REQUESTED` with that time as `proposed_start_utc` and `proposed_by` `PROFESSIONAL`; the customer must accept it (`POST /v1/me/appointments/{id}/accept`) |
        | anything else | any | `409 INVALID_STATE` |

        `duration_minutes` and `location_note`, when sent, are saved in every successful case.

        `409 SLOT_TAKEN`: confirming would give the professional (the assigned user, or the
        organisation when nobody is assigned) two `CONFIRMED` appointments that overlap.
        Back-to-back appointments are fine. `409 INVALID_STATE` also when the time to confirm
        has already passed. The customer is told by email.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentConfirm"
      responses:
        "200":
          $ref: "#/components/responses/ReceivedAppointment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "409":
          $ref: "#/components/responses/AppointmentConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/inbox/appointments/{id}/reschedule:
    post:
      tags: [appointments]
      operationId: rescheduleReceivedAppointment
      summary: Propose a new time (professional)
      description: |
        `REQUESTED` or `CONFIRMED` -> `RESCHEDULE_REQUESTED` with `proposed_by` `PROFESSIONAL`;
        the customer must accept. Also allowed as a counter-proposal while the customer's
        proposal is waiting. `409 INVALID_STATE` when the professional's own proposal is still
        waiting, or the appointment is closed. `start_utc` must differ from the current start.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentReschedule"
      responses:
        "200":
          $ref: "#/components/responses/ReceivedAppointment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "409":
          $ref: "#/components/responses/AppointmentConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/inbox/appointments/{id}/cancel:
    post:
      tags: [appointments]
      operationId: cancelReceivedAppointment
      summary: Cancel (professional); a reason is required
      description: |
        `REQUESTED`, `CONFIRMED` or `RESCHEDULE_REQUESTED` -> `CANCELLED` with `cancelled_by`
        `PROFESSIONAL`. The reason is shown to the customer and sent to them by email (with
        anything that looks like a phone number, an email address or a link removed from the
        email).
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          $ref: "#/components/responses/ReceivedAppointment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "409":
          $ref: "#/components/responses/AppointmentConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/inbox/appointments/{id}/complete:
    post:
      tags: [appointments]
      operationId: completeReceivedAppointment
      summary: Mark a confirmed appointment as having taken place
      description: "`CONFIRMED` -> `COMPLETED`, only once the start time has passed (`409 INVALID_STATE` before). No body. Nobody is emailed."
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          $ref: "#/components/responses/ReceivedAppointment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "409":
          $ref: "#/components/responses/AppointmentConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/inbox/appointments/{id}/no-show:
    post:
      tags: [appointments]
      operationId: noShowReceivedAppointment
      summary: Mark a confirmed appointment the customer did not attend
      description: "`CONFIRMED` -> `NO_SHOW`, only once the start time has passed (`409 INVALID_STATE` before). No body. Nobody is emailed."
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          $ref: "#/components/responses/ReceivedAppointment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "409":
          $ref: "#/components/responses/AppointmentConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/inbox/appointments/{id}/assign:
    post:
      tags: [appointments]
      operationId: assignReceivedAppointment
      summary: Assign to a member of the organisation (OWNER and MANAGER only)
      description: |
        Gives an open appointment of the caller's organisation to one of its members; the
        status does not change, and a timeline entry `ASSIGNED` is added (not shown to the
        customer). `403 FORBIDDEN` for AGENT and STAFF (and for a direct owner); `400
        VALIDATION_FAILED` on `user_id` when that user is not an active member of the same
        organisation; `409 INVALID_STATE` when the appointment is closed; `409 SLOT_TAKEN` when
        the appointment is `CONFIRMED` and the new assignee already has a confirmed appointment
        at that time.

        **There is no endpoint that lists an organisation's members yet**, so a client can
        only offer the user IDs it already knows (for example `assigned_to.user_id` of other
        appointments).
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
      responses:
        "200":
          $ref: "#/components/responses/ReceivedAppointment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "409":
          $ref: "#/components/responses/AppointmentConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/inbox/summary:
    get:
      tags: [appointments]
      operationId: getInboxSummary
      summary: Badge counts for the apps
      description: |
        The numbers behind the app's badges, each scoped exactly as its own inbox. Any
        signed-in caller may ask (`401` otherwise); a caller who receives nothing gets zeros,
        never `403`.

        - `property_requests.new` and `business_enquiries.new`: the requests and enquiries the
          caller can see in `GET /v1/agent/property-requests` and
          `GET /v1/inbox/business-enquiries`. Neither has a read or lead status yet, so "new"
          is **every** one of them, capped at 100.
        - `appointments.requested` and `appointments.reschedule_requested`: appointments in
          those statuses (whoever proposed the new time). `appointments.upcoming_confirmed`:
          `CONFIRMED` appointments that have not ended.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

components:
  parameters:
    AppointmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppointmentStatusFilter:
      name: status
      in: query
      description: One status, or several separated by commas.
      schema:
        type: string
      examples:
        one:
          value: REQUESTED
        several:
          value: REQUESTED,RESCHEDULE_REQUESTED
    AppointmentPage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    AppointmentPageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ReferenceMarket:
      name: market
      in: query
      required: false
      description: |
        Market code (case-insensitive). Keeps the rows of that market plus the rows that apply
        to every market. Without it, rows of all markets are returned.
      schema:
        type: string
        pattern: "^[A-Za-z]{2}$"
      example: ZW
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The `ETag` of a previous response. A match answers `304` with no body.
      schema:
        type: string

  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: rp_session
      description: |
        Web session. Set by `POST /v1/auth/login` and `POST /v1/auth/verify-email`; HttpOnly,
        SameSite=Lax, Path=/, Secure outside development. State-changing requests authenticated
        this way must carry an allowlisted `Origin` header (`403 CSRF_ORIGIN` otherwise).
    bearerToken:
      type: http
      scheme: bearer
      description: |
        Mobile/API session: the opaque `access_token` returned by login with
        `"token_delivery": "bearer"`. Not a JWT. Exempt from the CSRF origin check. Customer
        scope only: admin sessions are never issued or accepted as bearer tokens.

  headers:
    ETag:
      description: Strong validator of the response body. Changes whenever the content changes.
      schema:
        type: string
      example: '"8884076b694c80c9a86962905377343a"'
    Cache-Control:
      description: "`public, max-age=60, stale-while-revalidate=300`. The response is the same for every caller."
      schema:
        type: string
    CatalogueCacheControl:
      description: "`public, max-age=30, stale-while-revalidate=120`. The response is the same for every caller and never depends on a session."
      schema:
        type: string
    X-Request-Id:
      description: Request identifier (echoed from the request or generated). Equals `trace_id` in error bodies.
      schema:
        type: string

  responses:
    CustomerAppointment:
      description: The appointment as its customer sees it, with its timeline.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CustomerAppointmentEnvelope"
    ReceivedAppointment:
      description: The appointment as the professional sees it, with the customer's contact details and the timeline.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReceivedAppointmentEnvelope"
    AppointmentNotFound:
      description: "`APPOINTMENT_NOT_FOUND`: no such appointment, or it is not the caller's to see."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AppointmentConflict:
      description: |
        `INVALID_STATE`: the appointment's status does not allow this (or the time concerned has
        passed). `SLOT_TAKEN`: the professional already has a confirmed appointment that
        overlaps. Nothing was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotModified:
      description: The `If-None-Match` validator still matches. No body.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/Cache-Control"
    VerificationSent:
      description: Accepted. The same answer is given whether or not the email has an account.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [status]
            properties:
              status:
                type: string
                const: VERIFICATION_SENT
    Authenticated:
      description: |
        Signed in. With cookie delivery the response sets `rp_session` and has no
        `access_token`; with bearer delivery it has `access_token` and sets no cookie.
        (`verify-email` for an account holding a platform role returns `user` only.)
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        Set-Cookie:
          description: "`rp_session=<token>; Path=/; HttpOnly; SameSite=Lax` (plus `Secure` outside development). Cookie delivery only."
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResult"
    ValidationFailed:
      description: "`VALIDATION_FAILED` (per-field messages in `error.fields`) or `INVALID_JSON`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OnboardingNotFound:
      description: "`ONBOARDING_NOT_FOUND`: the caller does not hold that role, the role does not exist, or there is no application."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OnboardingInvalidState:
      description: "`INVALID_STATE`: the application's status does not allow this (for example editing after it was submitted, or deciding one that is not `SUBMITTED`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: "Not signed in, or the session is invalid, expired or revoked (`UNAUTHENTICATED`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: "Signed in but not allowed to use this route (`FORBIDDEN`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CsrfOrigin:
      description: |
        `CSRF_ORIGIN`: the request was authenticated by the session cookie but its `Origin`
        header is missing or not allowlisted. Never returned for bearer or anonymous requests.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLarge:
      description: The body exceeds 64 KB (`PAYLOAD_TOO_LARGE`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnsupportedMediaType:
      description: The Content-Type is not `application/json` (`UNSUPPORTED_MEDIA_TYPE`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Too many requests from this IP (`RATE_LIMITED`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected server error (`INTERNAL`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Timeout:
      description: The request exceeded the server-side time limit (`TIMEOUT`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      required: [error, trace_id]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              enum:
                - VALIDATION_FAILED
                - INVALID_JSON
                - UNSUPPORTED_MEDIA_TYPE
                - PAYLOAD_TOO_LARGE
                - LISTING_NOT_FOUND
                - LISTING_UNAVAILABLE
                - IDEMPOTENCY_CONFLICT
                - REFERENCE_SET_NOT_FOUND
                - DIRECTORY_KIND_NOT_FOUND
                - PROFILE_NOT_FOUND
                - RECIPIENT_NOT_FOUND
                - RECIPIENT_UNAVAILABLE
                - UNAUTHENTICATED
                - FORBIDDEN
                - CSRF_ORIGIN
                - INVALID_CREDENTIALS
                - EMAIL_NOT_VERIFIED
                - INVALID_TOKEN
                - RATE_LIMITED
                - ORIGIN_NOT_ALLOWED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - NOT_READY
                - TIMEOUT
                - INTERNAL
            message:
              type: string
              description: Human-readable summary. Not stable; do not parse.
            fields:
              type: object
              description: Per-field messages, present for `VALIDATION_FAILED`. Keys are JSON paths such as `guest_contact.email`.
              additionalProperties:
                type: string
        trace_id:
          type: string
          description: Same value as the `X-Request-Id` response header.

    Coded:
      type: object
      description: A reference-data code with its current label. If the row has been retired the label repeats the code.
      required: [code, label]
      additionalProperties: false
      properties:
        code: { type: string }
        label: { type: string }

    Money:
      type: object
      description: An exact amount. `amount` is a decimal string with two decimal places; never parse it as a float for arithmetic.
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$", examples: ["385000.00"] }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: ISO 4217, examples: [USD] }

    Photo:
      type: object
      required: [url, alt, width, height]
      additionalProperties: false
      properties:
        url:
          type: string
          description: |
            Today a site-relative path served by the web app (`/assets/images/<file>.jpg`),
            returned exactly as stored. Object storage and uploads are not built; when they are,
            this becomes an absolute URL.
          examples: [/assets/images/listing-house-borrowdale.jpg]
        alt: { type: string }
        width: { type: integer, minimum: 1, description: Pixel width of the image file. }
        height: { type: integer, minimum: 1 }

    Logo:
      type: object
      description: |
        New in 0.17.0. The logo of a directory profile (for an agent: their photo). The image
        is served by `GET /v1/directory/{kind}/{slug}/logo` exactly as it was uploaded (PNG or
        JPEG, at most 2 MB, 128 to 4096 pixels each way; not resized).
      required: [url, width, height]
      additionalProperties: false
      properties:
        url:
          type: string
          description: |
            A path **relative to the API origin** (it starts with `/v1/`): prefix it with the
            API base URL. It is not relative to the web site. It ends in `?v=<version>`, the
            first 12 characters of the image's checksum, so it changes whenever the logo does.
          examples: ["/v1/directory/agencies/sample-estates/logo?v=3f2a9c0d1b7e"]
        width: { type: [integer, "null"], minimum: 1, description: "Pixel width of the image; null when not recorded." }
        height: { type: [integer, "null"], minimum: 1, description: "Pixel height of the image; null when not recorded." }

    ProfileLink:
      type: object
      description: New in 0.17.0. The address of a public profile page (`/v1/directory/{kind}/{slug}`).
      required: [kind, slug]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/DirectoryKind"
        slug: { type: string }

    ProfileRef:
      type: object
      description: A PUBLIC reference to a directory profile (`/v1/directory/{kind}/{slug}`). Never contact details.
      required: [kind, slug, name, verified, logo]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/DirectoryKind"
        slug: { type: string }
        name: { type: string }
        verified:
          type: boolean
          description: |
            True when the profile is public: published and verified. Inside
            `Listing.advertiser`, `agency.verified` equals `advertiser.verified`, and
            `agent.verified` is true only when the agent's own profile is verified **and** the
            business is. A reference with `verified: false` has no public page to link to.
        logo:
          oneOf:
            - $ref: "#/components/schemas/Logo"
            - type: "null"
          description: |
            New in 0.17.0. The profile's own logo; null when it has none, or when the profile is
            not public. For an agent it is the agent's own photo only: fall back to the
            agency's logo, then to initials (or use `advertiser.display.logo`, which already
            applies that order).

    AdvertiserDisplay:
      type: object
      description: |
        New in 0.17.0. Everything a listing card needs to show who advertises the listing,
        already resolved, so a client needs no further lookup. Precedence:

        | The listing belongs to | `name` | `secondary_name` | `role_label` | `logo` | `verified` | `profile` |
        |---|---|---|---|---|---|---|
        | a business with an assigned agent | the business | the agent | the business's kind | the business's logo, else the agent's photo, else null | the business is verified | the business's page |
        | a business, no agent profile | the business | null | the business's kind | the business's logo, else null | the business is verified | the business's page |
        | a direct owner, for sale | the owner's name | null | `Property Seller (Vendor)` | null | the owner's `PRIVATE_SELLER` / `LANDLORD` role is approved | null |
        | a direct owner, to rent | the owner's name | null | `Landlord` | null | as above | null |

        A "business" is any organisation: an agency, a law firm, a property manager, a
        developer or a host. `role_label` is the label of the organisation's kind in the
        `organisation_kinds` reference set (`Real Estate Agency`, `Law Firm`, `Property
        Manager`, `Property Developer`, `Host`), or of the owner's role in `account_roles`: read
        it, do not hard-code it. A direct owner's `name` falls back to `Private seller` when
        the account's name is not known.

        `verified` never comes from a copy: it is the stored verification, read with the
        listing. On a listing returned by a public endpoint it is always true (an unverified
        advertiser's listing is not public).
      required: [name, secondary_name, role_label, logo, verified, profile]
      additionalProperties: false
      properties:
        name: { type: string, examples: [Sample Estates] }
        secondary_name: { type: [string, "null"], description: "The assigned agent's name when the listing has both a business and an agent.", examples: [Tendai Ncube] }
        role_label: { type: string, examples: [Real Estate Agency] }
        logo:
          oneOf:
            - $ref: "#/components/schemas/Logo"
            - type: "null"
          description: The best logo there is; null means show initials.
        verified: { type: boolean }
        profile:
          oneOf:
            - $ref: "#/components/schemas/ProfileLink"
            - type: "null"
          description: The public page to link the name and the logo to; null for a direct owner (they have no public page).

    AgentDisplay:
      type: object
      description: |
        New in 0.17.0. The assigned agent as a person, for a detail page that shows the agent
        next to the business, each with their own Verified badge.
      required: [name, role_label, verified, logo, profile]
      additionalProperties: false
      properties:
        name: { type: string, examples: [Tendai Ncube] }
        role_label:
          type: string
          description: "The label of `AGENT` in `account_roles` (`Estate Agent`), or of `SALES_AGENT` / `LETTINGS_AGENT` for an agent with that specialism."
          examples: [Estate Agent]
        verified: { type: boolean, description: "True only when the agent's own profile is verified and the business is. It does not decide whether the listing is public." }
        logo:
          oneOf:
            - $ref: "#/components/schemas/Logo"
            - type: "null"
          description: The agent's own photo; null when they have none (no fallback here).
        profile:
          oneOf:
            - $ref: "#/components/schemas/ProfileLink"
            - type: "null"
          description: The agent's public page; null when their profile is not public.

    ListingVerification:
      type: object
      description: |
        New in 0.17.0. Which checks stand behind a listing.

        `advertiser_verified` is **always true** on a listing returned by a public endpoint:
        that is the guarantee. `listing_reviewed` is a separate, weaker fact: whether a platform
        administrator or moderator reviewed the listing itself. There is no review workflow
        yet, so today it is true only for the sample data; a real listing says `false`.
      required: [advertiser_verified, advertiser_verified_at, listing_reviewed, listing_reviewed_at]
      additionalProperties: false
      properties:
        advertiser_verified: { type: boolean }
        advertiser_verified_at:
          type: [string, "null"]
          format: date-time
          description: When the business's profile was verified, or the direct owner's role approved. Null when that time was not recorded.
        listing_reviewed: { type: boolean }
        listing_reviewed_at: { type: [string, "null"], format: date-time }

    ManagedProfile:
      type: object
      description: New in 0.17.0. A directory profile as the people who manage it see it (`GET /v1/me/profiles`).
      required: [kind, slug, name, verified, logo]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/DirectoryKind"
        slug: { type: string }
        name: { type: string }
        verified: { type: boolean, description: "True when the profile is public (published and verified)." }
        logo:
          oneOf:
            - $ref: "#/components/schemas/Logo"
            - type: "null"
          description: The profile's logo; null when it has none. The image is served only while the profile is public.

    TrustSummary:
      type: object
      description: New in 0.17.0. See `GET /v1/trust/summary`.
      required: [verified_advertisers, public_listings, listings_from_verified_advertisers, listings_reviewed, generated_at]
      additionalProperties: false
      properties:
        verified_advertisers:
          type: object
          required: [organisations, direct_owners]
          additionalProperties: false
          properties:
            organisations: { type: integer, minimum: 0, description: "Active organisations with a published, verified profile of their own (every kind, service providers included)." }
            direct_owners: { type: integer, minimum: 0, description: "Active accounts whose `PRIVATE_SELLER` or `LANDLORD` role is approved." }
        public_listings: { type: integer, minimum: 0, description: Listings the API shows right now. }
        listings_from_verified_advertisers: { type: integer, minimum: 0, description: "PUBLISHED, unexpired listings whose advertiser is verified. Equals `public_listings`." }
        listings_reviewed: { type: integer, minimum: 0, description: Public listings that were themselves reviewed. }
        generated_at: { type: string, format: date-time, description: To the minute. }

    ListingAdvertiser:
      type: object
      description: |
        Who advertises the listing: public profile references and, for a direct owner, the
        owner's name. There is no phone number, email address or street address here or
        anywhere else in a listing: a listing is answered with `POST /v1/property-requests`.

        For a card, read `display`; for a detail page that also shows the agent as a person,
        read `agent_display`. `name` and `verified` repeat `display.name` and
        `display.verified` for clients written before 0.17.0.
      required: [type, name, verified, agency, agent, display, agent_display]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [agency, private_seller]
          description: "`agency` for every business (an agency, a law firm, a property manager, a developer, a host); `private_seller` for a direct owner, whether they sell or let."
        name:
          type: string
          description: |
            Equals `display.name`: the business's name, or the direct owner's name.
            **Changed in 0.17.0** for a direct owner: it used to be the fixed text `Private
            seller` and is now the owner's account name (for example `Grace Mhlanga`).
        verified:
          type: boolean
          description: "Equals `display.verified`: the business is verified, or the direct owner's role is approved. Read from the stored verification every time, never from a copy on the listing."
        display:
          $ref: "#/components/schemas/AdvertiserDisplay"
        agent_display:
          oneOf:
            - $ref: "#/components/schemas/AgentDisplay"
            - type: "null"
          description: The assigned agent as a person. Null for a direct owner and when the listing has no assigned agent with a profile.
        agency:
          oneOf:
            - $ref: "#/components/schemas/ProfileRef"
            - type: "null"
          description: |
            The public profile of the organisation that advertises the listing. Usually an
            agency (`kind` `agencies`); for a listing owned by another kind of organisation it
            is that organisation's own profile, for example a host's (`kind` `hosts`) for a
            short stay. `type` is `agency` for every organisation. Null for a private seller.
        agent:
          oneOf:
            - $ref: "#/components/schemas/ProfileRef"
            - type: "null"
          description: The assigned agent's profile. Null for a private seller, or when no agent is assigned.

    Listing:
      type: object
      description: A public listing. The same object is used in search results, on the detail endpoint and on profiles.
      required: [id, slug, reference, title, deal, category, property_type, price, price_period, suburb, city, region, country, market_code,
                 bedrooms, bathrooms, floor_area, land_area, max_guests, min_nights, summary, description, features, featured, photos, advertiser,
                 verification, published_at, expires_at, updated_at, availability]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: "Use as `listing_id` in `POST /v1/property-requests`." }
        slug: { type: string, examples: [four-bedroom-family-home-borrowdale] }
        reference: { type: string, description: Human reference of the listing., examples: [RP-ZW-10001] }
        title: { type: string }
        deal:
          allOf: [{ $ref: "#/components/schemas/Coded" }]
          description: "`deal_types` code and label, e.g. `sale` / `For sale`."
        category:
          allOf: [{ $ref: "#/components/schemas/Coded" }]
          description: "`property_categories` code and label."
        property_type:
          allOf: [{ $ref: "#/components/schemas/Coded" }]
          description: "`property_types` code and label."
        price:
          $ref: "#/components/schemas/Money"
        price_period:
          type: [string, "null"]
          enum: [month, night, null]
          description: "A `price_periods` code: `month` for a monthly rent, `night` for a short stay (always, and only, category `short-stay`); null for a sale price. Labels (`per month`, `per night`) are in `GET /v1/reference/price_periods`."
        suburb:
          oneOf:
            - $ref: "#/components/schemas/Place"
            - type: "null"
          description: "`suburbs` code and label. **Null when the listing names no suburb** (always the case when its city is free text). Changed in 0.15.0: it used to be always an object."
        city:
          allOf: [{ $ref: "#/components/schemas/Place" }]
          description: "Always present. A `cities` code and label, or — in a country without reference places — `code: null` and the city as free text in `label`. Changed in 0.15.0: `code` is nullable."
        region:
          oneOf:
            - $ref: "#/components/schemas/Place"
            - type: "null"
          description: "The region (province) of the city: a `regions` code and label, or `code: null` with the free-text region that came with a free-text city. Null when there is none."
        country:
          $ref: "#/components/schemas/Country"
        market_code: { type: string, pattern: "^[A-Z]{2}$", description: "The same code as `country.code`." }
        bedrooms: { type: [integer, "null"], minimum: 0 }
        bathrooms: { type: [integer, "null"], minimum: 0 }
        floor_area: { type: [integer, "null"], minimum: 0, description: Square metres. }
        land_area: { type: [integer, "null"], minimum: 0, description: Square metres. }
        max_guests: { type: [integer, "null"], minimum: 1, description: "Short stays only: how many guests the place sleeps. Null for every other category (and for a short stay that does not say)." }
        min_nights: { type: [integer, "null"], minimum: 1, description: "Short stays only: the shortest stay, in nights (1 when the listing does not say). Null for every other category." }
        summary: { type: string, description: One sentence for cards. }
        description: { type: string, description: Plain text. }
        features:
          type: array
          description: "`listing_features` codes and labels, in the advertiser's order."
          items:
            $ref: "#/components/schemas/Coded"
        featured: { type: boolean }
        photos:
          type: array
          description: In display order; the first is the cover. May be empty.
          items:
            $ref: "#/components/schemas/Photo"
        advertiser:
          $ref: "#/components/schemas/ListingAdvertiser"
        verification:
          $ref: "#/components/schemas/ListingVerification"
        published_at: { type: string, format: date-time, description: Start of the current publication cycle (UTC). }
        expires_at: { type: string, format: date-time, description: End of the current publication cycle (90 days after `published_at`). Always in the future for a returned listing. }
        updated_at: { type: string, format: date-time }
        availability:
          oneOf:
            - $ref: "#/components/schemas/ListingAvailability"
            - type: "null"
          description: "New in 0.16.0. Set for short stays; **null for every other category**. The calendar itself is `GET /v1/listings/{slug}/availability`."
      example:
        id: 0195c0de-0000-7000-8000-000000000001
        slug: four-bedroom-family-home-borrowdale
        reference: RP-ZW-10001
        title: Four-bedroom family home with garden
        deal: { code: sale, label: For sale }
        category: { code: residential, label: Residential }
        property_type: { code: house, label: House }
        price: { amount: "385000.00", currency: USD }
        price_period: null
        suburb: { code: borrowdale, label: Borrowdale }
        city: { code: harare, label: Harare }
        market_code: ZW
        bedrooms: 4
        bathrooms: 3
        floor_area: 320
        land_area: 2000
        summary: Single-storey home on a walled half-acre with borehole and solar backup.
        description: A well-kept single-storey home set back from a quiet road.
        features:
          - { code: borehole, label: Borehole }
          - { code: solar-backup, label: Solar backup }
        featured: true
        photos:
          - { url: /assets/images/listing-house-borrowdale.jpg, alt: White two-storey house with a tiled roof under a blue sky, width: 1200, height: 800 }
        advertiser:
          type: agency
          name: Sample Estates
          verified: true
          agency:
            kind: agencies
            slug: sample-estates
            name: Sample Estates
            verified: true
            logo: { url: "/v1/directory/agencies/sample-estates/logo?v=3f2a9c0d1b7e", width: 256, height: 256 }
          agent: { kind: agents, slug: tendai-ncube, name: Tendai Ncube, verified: true, logo: null }
          display:
            name: Sample Estates
            secondary_name: Tendai Ncube
            role_label: Real Estate Agency
            logo: { url: "/v1/directory/agencies/sample-estates/logo?v=3f2a9c0d1b7e", width: 256, height: 256 }
            verified: true
            profile: { kind: agencies, slug: sample-estates }
          agent_display:
            name: Tendai Ncube
            role_label: Estate Agent
            verified: true
            logo: null
            profile: { kind: agents, slug: tendai-ncube }
        verification:
          advertiser_verified: true
          advertiser_verified_at: "2026-11-01T00:00:00Z"
          listing_reviewed: true
          listing_reviewed_at: "2026-11-10T08:00:00Z"
        published_at: "2026-11-10T08:00:00Z"
        expires_at: "2027-02-08T08:00:00Z"
        updated_at: "2026-11-10T08:00:00Z"

    ListingAvailability:
      type: object
      description: What a short-stay listing says about its availability calendar. No reason, note or author.
      required: [updated_at, next_available]
      additionalProperties: false
      properties:
        updated_at:
          type: [string, "null"]
          format: date-time
          description: When the lister last changed the calendar; null when they never have (every night in the booking window is then available).
        next_available:
          type: [string, "null"]
          format: date
          description: "The first available night from today on, in the listing's time zone (`YYYY-MM-DD`); null when no night in the booking window is free."

    PublicAvailability:
      type: object
      description: The calendar as the public sees it.
      required: [listing, timezone, min_nights, max_guests, from, to, days, availability_updated_at]
      additionalProperties: false
      properties:
        listing:
          type: object
          required: [slug]
          additionalProperties: false
          properties:
            slug: { type: string }
        timezone: { type: string, description: "IANA zone of the listing's country: the zone the dates are in." }
        min_nights: { type: integer, minimum: 1, description: The shortest stay, in nights (1 when the listing does not say). }
        max_guests: { type: [integer, "null"], minimum: 1 }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          description: One entry per night from `from` to `to`, in order.
          items:
            type: object
            required: [date, available]
            additionalProperties: false
            properties:
              date: { type: string, format: date }
              available: { type: boolean, description: "False for a night the lister marked unavailable, a night in the past and a night beyond the booking window. Never says which." }
        availability_updated_at: { type: [string, "null"], format: date-time }

    AvailabilityReason:
      type: string
      enum: [BLOCKED, BOOKED]
      description: "Private to the lister. `BLOCKED`: the owner's choice. `BOOKED`: taken."

    ListerAvailability:
      type: object
      description: The calendar as the lister sees it, with the private reasons and notes.
      required: [listing, timezone, window, min_nights, max_guests, from, to, days, ranges, availability_updated_at]
      additionalProperties: false
      properties:
        listing:
          type: object
          required: [id, slug, title, reference]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            title: { type: string }
            reference: { type: string }
        timezone: { type: string, description: "IANA zone of the listing's country: the zone the dates are in." }
        window:
          type: object
          description: "The booking window: today .. today + 365 days in `timezone`. Changes must lie inside it."
          required: [from, to]
          additionalProperties: false
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        min_nights: { type: integer, minimum: 1 }
        max_guests: { type: [integer, "null"], minimum: 1 }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          description: One entry per night from `from` to `to`, in order.
          items:
            type: object
            required: [date, available, reason, note]
            additionalProperties: false
            properties:
              date: { type: string, format: date }
              available: { type: boolean }
              reason:
                oneOf:
                  - $ref: "#/components/schemas/AvailabilityReason"
                  - type: "null"
                description: Set for a night the lister marked; null for an available night and for one that is unavailable only because it is in the past or beyond the window.
              note: { type: [string, "null"], maxLength: 200 }
        ranges:
          type: array
          description: Every stored range of unavailable nights (not only those inside `from`..`to`), sorted by first night. They never overlap.
          items:
            type: object
            required: [id, first_night, last_night, reason, note, updated_at]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid, description: "Not stable across changes: a range that is merged or split gets a new shape, and the right half of a split a new id." }
              first_night: { type: string, format: date }
              last_night: { type: string, format: date, description: Inclusive. }
              reason: { $ref: "#/components/schemas/AvailabilityReason" }
              note: { type: [string, "null"], maxLength: 200 }
              updated_at: { type: string, format: date-time }
        availability_updated_at: { type: [string, "null"], format: date-time }

    AvailabilityChanges:
      type: object
      required: [changes]
      additionalProperties: false
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 50
          description: Applied in order.
          items:
            type: object
            required: [from, to, status]
            additionalProperties: false
            properties:
              from: { type: string, format: date, description: First night, not in the past. }
              to: { type: string, format: date, description: "Last night, inclusive; not before `from`, at most 366 nights, inside the booking window." }
              status: { type: string, enum: [AVAILABLE, BLOCKED, BOOKED] }
              note: { type: [string, "null"], maxLength: 200, description: "Private. Plain text on one line. Only with `BLOCKED` or `BOOKED`." }

    MyListing:
      type: object
      description: One of the caller's listings, as a summary.
      required: [id, slug, reference, title, category, property_type, status, price, price_period, city, country, max_guests, min_nights, availability_updated_at, photo]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        reference: { type: string }
        title: { type: string }
        category: { $ref: "#/components/schemas/Coded" }
        property_type: { $ref: "#/components/schemas/Coded" }
        status: { type: string, description: "The listing's status, whatever it is: `PUBLISHED`, `EXPIRED`, `DRAFT`, `PAUSED`, `SOLD`, `LET`, `CLOSED`." }
        price: { $ref: "#/components/schemas/Money" }
        price_period: { type: [string, "null"], enum: [month, night, null] }
        city: { $ref: "#/components/schemas/Place" }
        country: { $ref: "#/components/schemas/Country" }
        max_guests: { type: [integer, "null"], description: Short stays only. }
        min_nights: { type: [integer, "null"], description: Short stays only (1 when the listing does not say). }
        availability_updated_at: { type: [string, "null"], format: date-time, description: Short stays only; null when the calendar was never changed. }
        photo:
          oneOf:
            - $ref: "#/components/schemas/Photo"
            - type: "null"
          description: The first photo, or null.

    MyListingPage:
      type: object
      required: [items, page, page_size, total, total_pages]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MyListing" } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    StayDetails:
      type: object
      description: The dates and guests of a request to stay.
      required: [check_in, check_out, nights, guests]
      additionalProperties: false
      properties:
        check_in: { type: string, format: date, description: The first night. }
        check_out: { type: string, format: date, description: The day of leaving (not a night of the stay). }
        nights: { type: integer, minimum: 1 }
        guests: { type: integer, minimum: 1 }

    Country:
      type: object
      description: The country of a listing or a profile (its own; every listing and profile has one).
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[A-Z]{2}$", description: "ISO 3166-1 alpha-2 code; use it as the `country` filter." }
        name: { type: string, examples: [Zimbabwe] }

    Place:
      type: object
      description: |
        A city, a suburb or a region of a listing or a profile.

        - A **reference place**: `code` is the reference-data code (use it as the filter of the
          same name) and `label` its current label. If the row has been retired the label
          repeats the code.
        - A **free-text place**: `code` is `null` and `label` is the text as it was entered
          (plain text, at most 80 characters). This is how a city or region is written in a
          country that has no reference places yet. It cannot be used as a filter; `q` finds it.

        **Changed in 0.15.0:** `code` used to be a non-null string (this used to be `Coded`).
        Clients must treat `code` as optional and must not build a filter from a null code.
      required: [code, label]
      additionalProperties: false
      properties:
        code: { type: [string, "null"], description: "Reference code, or null for a free-text place." }
        label: { type: string, maxLength: 120 }
      examples:
        - { code: harare, label: Harare }
        - { code: null, label: Grand Baie }

    FacetCount:
      type: object
      required: [code, label, count]
      additionalProperties: false
      properties:
        code: { type: string }
        label: { type: string }
        count: { type: integer, minimum: 1 }
        city:
          type: string
          description: "Present on the values of the `suburb` facet only: the `cities` code of the suburb's city, so a client can group suburbs by city. Absent everywhere else."

    ListingFacets:
      type: object
      description: "All keys are always present; a facet with no values is an empty array. `price` can be null (see it)."
      required: [deal, category, property_type, city, suburb, bedrooms, features, price, currencies, country, region]
      additionalProperties: false
      properties:
        country:
          type: array
          description: "By country: `code` is the country code, `label` the country name. Only countries that have results are listed. Ignores the `country` filter, like every facet ignores its own. Ordered by label."
          items: { $ref: "#/components/schemas/FacetCount" }
        region:
          type: array
          description: "By the region of the listing's city: `code` is a `regions` code. Ignores the `region` filter. Listings whose city has no region, or whose city and region are free text, are not counted. Ordered by label."
          items: { $ref: "#/components/schemas/FacetCount" }
        deal: { type: array, items: { $ref: "#/components/schemas/FacetCount" }, description: Ordered by label. }
        category: { type: array, items: { $ref: "#/components/schemas/FacetCount" } }
        property_type: { type: array, items: { $ref: "#/components/schemas/FacetCount" } }
        city: { type: array, items: { $ref: "#/components/schemas/FacetCount" }, description: "Reference cities only: a listing whose city is free text is not counted here." }
        suburb: { type: array, items: { $ref: "#/components/schemas/FacetCount" }, description: "Each value carries `city`, the code of its city." }
        bedrooms:
          type: array
          description: "Exact bedroom counts in ascending order; `code` is the number as a string (`\"3\"`), `label` is e.g. `3 bedrooms`."
          items: { $ref: "#/components/schemas/FacetCount" }
        features:
          type: array
          description: Ordered by count (highest first), then label.
          items: { $ref: "#/components/schemas/FacetCount" }
        price:
          type: [object, "null"]
          description: |
            Lowest and highest price, in `currency`, among the listings matching every filter
            except the price filter; `min` and `max` are null when there are none in that
            currency. `currency` is the search's one currency: the `currency` parameter, else
            the selected country's, else the only currency the results are priced in (`USD`
            when nothing matches).

            **Null (changed in 0.15.0)** when neither `currency` nor `country` was given and the
            results span more than one currency: there is no single range. Show `currencies`
            and ask the user to pick one, then repeat the search with `currency=`.
          required: [currency, min, max]
          additionalProperties: false
          properties:
            currency: { type: string, pattern: "^[A-Z]{3}$" }
            min: { type: [string, "null"], examples: ["600.00"] }
            max: { type: [string, "null"], examples: ["640000.00"] }
        currencies:
          type: array
          description: "New in 0.15.0. The currencies the results are priced in, with the number of listings in each, most listings first (then by code). Counted like `price`: every filter applies except the price filter. Empty when nothing matches."
          items:
            type: object
            required: [code, count]
            additionalProperties: false
            properties:
              code: { type: string, pattern: "^[A-Z]{3}$" }
              count: { type: integer, minimum: 1 }
          examples:
            - [{ code: USD, count: 20 }, { code: GBP, count: 3 }, { code: MUR, count: 1 }]

    ListingPage:
      type: object
      required: [items, page, page_size, total, total_pages, facets]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 48 }
        total: { type: integer, minimum: 0, description: Number of listings matching the filters. }
        total_pages: { type: integer, minimum: 0 }
        facets:
          $ref: "#/components/schemas/ListingFacets"

    ListingSuggestion:
      type: object
      required: [type, label, value]
      additionalProperties: false
      properties:
        type: { type: string, enum: [suburb, city, region, country, listing] }
        label: { type: string, description: "Text to show. For a suburb it includes the city (`Borrowdale, Harare`), for a region the country (`Matabeleland North, Zimbabwe`)." }
        value:
          type: string
          description: "For `suburb`, `city`, `region` and `country`: the code, to use as the filter of the same name. For `listing`: the listing's slug."

    DirectoryKindInfo:
      type: object
      required: [code, label, singular_label, description]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/DirectoryKind"
        label: { type: string, examples: [Estate agencies] }
        singular_label: { type: string, examples: [Estate agency] }
        description: { type: string }

    DirectoryKindCount:
      type: object
      required: [code, label, singular_label, description, count]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/DirectoryKind"
        label: { type: string }
        singular_label: { type: string }
        description: { type: string }
        count: { type: integer, minimum: 0, description: Public profiles of this kind. }

    DirectoryProfile:
      type: object
      description: |
        A public profile. It has no phone number, email address or street address, and never
        will: use `POST /v1/business-enquiries` with its `kind` and `slug` to contact it.
      required: [kind, slug, name, role, tagline, description, city, region, country, areas, services, offerings, trade, specialism, verified, sponsored,
                 since, logo, agency, listing_count, updated_at]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/DirectoryKind"
        slug: { type: string }
        name: { type: string }
        role: { type: string, description: Job title for a person, speciality for a business. }
        tagline: { type: string }
        description: { type: string, description: Plain text "about" paragraph. }
        city:
          allOf: [{ $ref: "#/components/schemas/Place" }]
          description: "A `cities` code and label, or — in a country without reference places — `code: null` and the city as free text in `label`. Changed in 0.15.0: `code` is nullable. (A profile without any city, which onboarding does not allow, has `code: null` and an empty label.)"
        region:
          oneOf:
            - $ref: "#/components/schemas/Place"
            - type: "null"
          description: "`regions` code and label of the city's region, or `code: null` with a free-text region; null when there is none."
        country:
          oneOf:
            - $ref: "#/components/schemas/Country"
            - type: "null"
          description: "The profile's own country. Every profile has one; the type stays nullable for compatibility. Changed in 0.15.0: it is the profile's country, no longer derived from its city."
        areas: { type: array, items: { type: string }, description: Free-text names of the areas served. Not reference codes. }
        services: { type: array, items: { type: string }, description: "Names of the services offered; any of them can be sent as `service` in a business enquiry." }
        offerings:
          type: array
          description: Services described in detail. Empty for most kinds.
          items:
            type: object
            required: [name, description]
            additionalProperties: false
            properties:
              name: { type: string }
              description: { type: string }
        trade:
          oneOf:
            - $ref: "#/components/schemas/Coded"
            - type: "null"
          description: "`service_trades` code and label. Service providers only; null otherwise."
        specialism:
          oneOf:
            - $ref: "#/components/schemas/Coded"
            - type: "null"
          description: |
            Agent profiles only: `{code: SALES, label: "Sales Agent"}` or
            `{code: LETTINGS, label: "Lettings Agent"}` for an agent who specialises; null for a
            general estate agent and for every other kind.
        verified: { type: boolean }
        sponsored: { type: boolean, description: Paid placement. Must be labelled "Sponsored" wherever it is shown. }
        since: { type: [integer, "null"], description: Year the business started, when known. }
        logo:
          oneOf:
            - $ref: "#/components/schemas/Logo"
            - type: "null"
          description: |
            **Changed in 0.17.0** (it was always null, and documented as a `Photo`). The
            profile's logo, or an agent's photo; null when it has none. Uploaded at onboarding
            (the `LOGO` document) or with `PUT /v1/me/profiles/{kind}/{slug}/logo`. In the sample
            data every business has a generated logo except `agencies/sample-realty`, and no
            agent has a photo, so both fallbacks can be tried.
        agency:
          oneOf:
            - $ref: "#/components/schemas/ProfileRef"
            - type: "null"
          description: "Agent profiles only: the agency they work for."
        listing_count: { type: integer, minimum: 0, description: Number of public listings of an agency or agent; 0 for other kinds. }
        updated_at: { type: string, format: date-time }

    DirectoryProfileDetail:
      description: A profile with its agents and listings.
      allOf:
        - $ref: "#/components/schemas/DirectoryProfile"
        - type: object
          required: [agents, listings]
          properties:
            agents:
              type: array
              description: An agency's agent profiles, by name. Empty for every other kind.
              items:
                $ref: "#/components/schemas/ProfileRef"
            listings:
              type: array
              description: The profile's public listings, newest first. Empty for kinds that own no listings.
              items:
                $ref: "#/components/schemas/Listing"

    DirectoryPage:
      type: object
      required: [kind, items, page, page_size, total, total_pages]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/DirectoryKindInfo"
        items:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryProfile"
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 48 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }

    ReferenceSetCode:
      type: string
      enum:
        - deal_types
        - property_categories
        - property_types
        - request_types
        - contact_methods
        - account_roles
        - directory_kinds
        - service_trades
        - regions
        - cities
        - suburbs
        - listing_features
        - onboarding_documents
        - organisation_kinds
        - price_periods

    ReferenceGroup:
      type: object
      description: The heading an account role is listed under.
      required: [code, label, sort_order]
      additionalProperties: false
      properties:
        code:
          type: string
          examples: [looking, listing, agency]
        label:
          type: string
          examples: [Looking for property]
        sort_order:
          type: integer

    ReferenceItem:
      type: object
      description: |
        One row of a reference set. **Every key is always present**; a key that does not apply
        to the set is `null`.
      required: [code, label, singular_label, description, sort_order, market_code, parent_code, group, requires_verification]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
          description: Stable identifier. This is what a client sends back to the API. Its case is significant.
        label:
          type: string
          description: Text shown to people. It can change at any time; do not branch on it.
        singular_label:
          type: [string, "null"]
          description: "`directory_kinds` only: the singular form, e.g. `Estate agency` for `Estate agencies`."
        description:
          type: [string, "null"]
          description: "`directory_kinds` only: one sentence describing the section."
        sort_order:
          type: integer
          description: Display position within the set (within its group for account roles). Items already arrive in order.
        market_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
          description: The market the row belongs to (`cities`, `suburbs`), or null when it applies to every market.
        parent_code:
          type: [string, "null"]
          description: "`property_types`: the `property_categories` code. `cities`: the `regions` code. `suburbs`: the `cities` code. Null elsewhere."
        group:
          oneOf:
            - $ref: "#/components/schemas/ReferenceGroup"
            - type: "null"
          description: "`account_roles` only."
        requires_verification:
          type: [boolean, "null"]
          description: |
            `account_roles` only. `true`: choosing the role at registration only records a
            request (`PENDING_VERIFICATION`). `false`: the role is `ACTIVE` once the email is verified.

    ReferenceData:
      type: object
      required: [market, sets]
      additionalProperties: false
      properties:
        market:
          type: [string, "null"]
          description: The `market` filter that was applied, upper-cased, or null.
        sets:
          type: object
          description: Every set, keyed by its code. All thirteen keys are always present.
          additionalProperties: false
          required: [deal_types, property_categories, property_types, request_types, contact_methods, account_roles, directory_kinds, service_trades, cities, suburbs, listing_features, onboarding_documents, organisation_kinds]
          properties:
            deal_types: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            property_categories: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            property_types: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            request_types: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            contact_methods: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            account_roles: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            directory_kinds: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            service_trades: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            cities: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            suburbs: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            listing_features: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            onboarding_documents: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            organisation_kinds: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }

    ReferenceSet:
      type: object
      required: [set, market, items]
      additionalProperties: false
      properties:
        set:
          $ref: "#/components/schemas/ReferenceSetCode"
        market:
          type: [string, "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceItem"

    User:
      type: object
      description: |
        The signed-in user. Capabilities come only from `memberships` (organisation-scoped) and
        `platform_roles`. `account_roles` are self-declared at registration and grant nothing.
        All three arrays are always present (empty, never null).
      required: [id, name, email, email_verified, platform_roles, memberships, account_roles]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
          description: Lower-cased.
        email_verified:
          type: boolean
          description: Always true for a signed-in user (sessions are only issued after verification).
        platform_roles:
          type: array
          items:
            $ref: "#/components/schemas/PlatformRoleAssignment"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        account_roles:
          type: array
          description: Self-declared account roles, in allowlist order. Informational only.
          items:
            $ref: "#/components/schemas/AccountRole"

    SelectableAccountRole:
      type: string
      description: |
        A role a person may choose for themselves at registration: a code from the
        `account_roles` reference set. The values below are the baseline; the set that is
        accepted is whatever `GET /v1/reference/account_roles` returns. Platform administrator
        roles are never in it and can never be chosen.
      enum:
        - CONSUMER
        - TENANT
        - AGENT
        - SALES_AGENT
        - LETTINGS_AGENT
        - PROPERTY_MANAGER
        - SOLICITOR
        - AGENCY_OWNER
        - AGENCY_ADMIN
        - AGENCY_STAFF
        - LANDLORD
        - PRIVATE_SELLER
        - HOST
        - DEVELOPER
        - SERVICE_PROVIDER
      x-labels:
        CONSUMER: Prospective Buyer
        TENANT: Prospective Tenant
        AGENT: Estate Agent
        SALES_AGENT: Sales Agent
        LETTINGS_AGENT: Lettings Agent
        PROPERTY_MANAGER: Property Manager
        SOLICITOR: Solicitor
        AGENCY_OWNER: Agency Principal
        AGENCY_ADMIN: Agency Administrator
        AGENCY_STAFF: Agency Staff
        LANDLORD: Landlord
        PRIVATE_SELLER: Property Seller (Vendor)
        HOST: Host
        DEVELOPER: Property Developer
        SERVICE_PROVIDER: Property Service Provider

    AccountRole:
      type: object
      description: |
        A role the user chose at registration, with its status. It is **not** an authorisation:
        it creates no organisation or membership and gives no access to organisation data
        (see `memberships`) or to platform administration (see `platform_roles`).
      required: [role, status, onboarding_status]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/SelectableAccountRole"
        status:
          type: string
          enum: [ACTIVE, PENDING_VERIFICATION, REJECTED]
          description: |
            `ACTIVE` for CONSUMER and TENANT. A professional role is `PENDING_VERIFICATION` until
            a platform administrator decides its onboarding application, then `ACTIVE` (approved)
            or `REJECTED`.
        onboarding_status:
          oneOf:
            - $ref: "#/components/schemas/OnboardingStatus"
            - type: "null"
          description: |
            Status of the role's current onboarding application. Null for a role that has no
            onboarding (CONSUMER, TENANT) and for a role that was granted without one.

    OnboardingStatus:
      type: string
      enum: [DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED, REJECTED]

    OnboardingProfileRef:
      type: object
      description: "The address of a public profile: `GET /v1/directory/{kind}/{slug}`."
      required: [kind, slug]
      additionalProperties: false
      properties:
        kind: { type: string, examples: [service-providers] }
        slug: { type: string, examples: [kopje-plumbing] }

    OnboardingRoleRequirements:
      type: object
      required: [role, label, outcome, organisation_kind, directory_kind, fields, documents]
      additionalProperties: false
      properties:
        role: { type: string, description: "Account role code.", examples: [SERVICE_PROVIDER] }
        label: { type: string, description: "The role's label from the `account_roles` reference set." }
        outcome:
          type: string
          enum: [ORGANISATION, AGENCY_MEMBER, NONE]
          description: |
            What an approval creates. `ORGANISATION`: a new organisation owned by the applicant.
            `AGENCY_MEMBER`: a membership in an existing verified agency. `NONE`: nothing; the role
            just becomes ACTIVE.
        organisation_kind:
          type: [string, "null"]
          enum: [AGENCY, LAW_FIRM, PROPERTY_MANAGER, HOST, DEVELOPER, SERVICE_PROVIDER, null]
          description: Set for `ORGANISATION`.
        directory_kind:
          type: [string, "null"]
          description: The public directory the approved applicant appears in (a `directory_kinds` code); null when the role gets no public profile.
        fields:
          type: array
          description: |
            The details that apply to this role, in form order. Names are the keys of
            `OnboardingDetails`.

            **Changed in 0.15.0 for the `ORGANISATION` outcome:** `country` is new and required;
            `city` is no longer flagged `required` and `city_name` is new, because **exactly one
            of the two is needed**, which a per-field flag cannot say: `city` (a code) when the
            chosen country has cities in the reference data, `city_name` (free text) when it has
            none. A form should ask for the country first, load
            `GET /v1/reference/cities?market=<country>` and show a drop-down when it is not
            empty, a text box when it is. An application's `missing.fields` names the one that
            is missing (`city` or `city_name`).
          items:
            type: object
            required: [name, required]
            additionalProperties: false
            properties:
              name: { type: string, enum: [business_name, tagline, description, country, city, city_name, areas, services, trade, registration_number, contact_phone, agency_slug, job_title, bio] }
              required: { type: boolean, description: "Must be set before the application can be submitted. See the note above for `city` and `city_name`." }
        documents:
          type: array
          description: "The documents this role must (`required` true) or may attach, in display order."
          items:
            type: object
            required: [code, label, description, required]
            additionalProperties: false
            properties:
              code: { type: string, description: "A code of the `onboarding_documents` reference set; the `type` of an upload.", examples: [PROOF_OF_IDENTITY] }
              label: { type: string }
              description: { type: string }
              required: { type: boolean }

    OnboardingDetails:
      type: object
      description: |
        Every key is always present. A text field that is not set is null; `areas` and
        `services` are always arrays. Which keys apply to a role is in
        `GET /v1/onboarding/requirements`; the others stay null/empty.
      required: [business_name, tagline, description, city, country, city_name, areas, services, trade, registration_number, contact_phone, agency_slug, job_title, bio]
      additionalProperties: false
      properties:
        business_name: { type: [string, "null"], minLength: 2, maxLength: 120, description: "Organisation outcomes. Becomes the organisation's and the profile's name." }
        tagline: { type: [string, "null"], maxLength: 140, description: "Organisation outcomes. Public." }
        description: { type: [string, "null"], maxLength: 2000, description: "Organisation outcomes. Plain text, line breaks allowed, no HTML. Public." }
        country: { type: [string, "null"], pattern: "^[A-Z]{2}$", description: "New in 0.15.0. Organisation outcomes, **required**. The code of any enabled country (`GET /v1/countries`). It is the application's market (`market_code`), which is what a Market Administrator is scoped by, and becomes the country of the organisation and its profile. Null for the other outcomes." }
        city: { type: [string, "null"], description: "Organisation outcomes. A code of the `cities` reference set, **where the country has cities in the reference data** (`GET /v1/reference/cities?market=GB` is not empty); it must be a city of `country`. Required there. Null when `city_name` is used." }
        city_name: { type: [string, "null"], maxLength: 80, description: "New in 0.15.0. Organisation outcomes. The city as free text (plain text, no HTML), **where the country has no cities in the reference data**; required there. Null when `city` is used. Public: it becomes the profile's `city.label` with `city.code: null`." }
        areas: { type: array, maxItems: 12, items: { type: string, maxLength: 60 }, description: "Areas served. Public. Always an array (empty when unset)." }
        services: { type: array, maxItems: 12, items: { type: string, maxLength: 60 }, description: "Organisation outcomes. Services offered. Public. Always an array." }
        trade: { type: [string, "null"], description: "SERVICE_PROVIDER only (required there). A code of the `service_trades` reference set." }
        registration_number: { type: [string, "null"], maxLength: 60, description: "Organisation outcomes. **Private**: for the verification team only, never public." }
        contact_phone: { type: [string, "null"], pattern: '^\+[1-9][0-9]{7,14}$', description: "Every role. E.164. **Private**: for the verification team only, never public." }
        agency_slug: { type: [string, "null"], description: "AGENT, AGENCY_STAFF, AGENCY_ADMIN. The slug of an existing, verified agency (`GET /v1/directory/agencies`)." }
        job_title: { type: [string, "null"], maxLength: 80, description: "Agency members. Shown on an agent's profile." }
        bio: { type: [string, "null"], maxLength: 1000, description: "AGENT only. Plain text. Public (the agent profile's description)." }

    OnboardingDetailsPatch:
      type: object
      description: Any subset of the detail fields that apply to the role. Absent = unchanged; null or "" = cleared.
      additionalProperties: false
      properties:
        business_name: { type: [string, "null"], minLength: 2, maxLength: 120, description: "Organisation outcomes. Becomes the organisation's and the profile's name." }
        tagline: { type: [string, "null"], maxLength: 140, description: "Organisation outcomes. Public." }
        description: { type: [string, "null"], maxLength: 2000, description: "Organisation outcomes. Plain text, line breaks allowed, no HTML. Public." }
        country: { type: [string, "null"], description: "Organisation outcomes. The code of any enabled country, in any case. `400` when unknown. Changing it clears a stored `city` of another country, and a stored `city_name` when the new country has reference cities." }
        city: { type: [string, "null"], description: "Organisation outcomes. A `cities` code. `400` when unknown, or when it is not a city of the `country` sent in the same request. **Sent without `country`, it sets the country to the city's own** (so a client that only knows `city` keeps working). Clears `city_name`." }
        city_name: { type: [string, "null"], maxLength: 80, description: "Organisation outcomes. Free-text city, plain text without HTML. `400` when the country has cities in the reference data (send `city` instead), or when sent together with a non-null `city`. Clears `city`." }
        areas: { type: [array, "null"], maxItems: 12, items: { type: string, maxLength: 60 }, description: "Areas served. Public. Always an array (empty when unset)." }
        services: { type: [array, "null"], maxItems: 12, items: { type: string, maxLength: 60 }, description: "Organisation outcomes. Services offered. Public. Always an array." }
        trade: { type: [string, "null"], description: "SERVICE_PROVIDER only (required there). A code of the `service_trades` reference set." }
        registration_number: { type: [string, "null"], maxLength: 60, description: "Organisation outcomes. **Private**: for the verification team only, never public." }
        contact_phone: { type: [string, "null"], pattern: '^\+[1-9][0-9]{7,14}$', description: "Every role. E.164. **Private**: for the verification team only, never public." }
        agency_slug: { type: [string, "null"], description: "AGENT, AGENCY_STAFF, AGENCY_ADMIN. The slug of an existing, verified agency (`GET /v1/directory/agencies`)." }
        job_title: { type: [string, "null"], maxLength: 80, description: "Agency members. Shown on an agent's profile." }
        bio: { type: [string, "null"], maxLength: 1000, description: "AGENT only. Plain text. Public (the agent profile's description)." }

    OnboardingDocument:
      type: object
      description: An attached document. Where the file is stored and its checksum are never exposed.
      required: [id, type, file_name, content_type, size_bytes, uploaded_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        type:
          type: object
          required: [code, label]
          additionalProperties: false
          properties:
            code: { type: string, examples: [PROOF_OF_IDENTITY] }
            label: { type: string, examples: [Proof of identity] }
        file_name: { type: string, maxLength: 100, description: "Sanitised display name, with the extension of the detected type." }
        content_type: { type: string, enum: [application/pdf, image/jpeg, image/png], description: "Detected from the content." }
        size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
        uploaded_at: { type: string, format: date-time }

    OnboardingDecision:
      type: object
      description: The administrator's last decision. Both null until there is one, and again after the application is resubmitted.
      required: [reason, decided_at]
      additionalProperties: false
      properties:
        reason: { type: [string, "null"], description: "Why changes were requested or the application was rejected (an optional note for an approval)." }
        decided_at: { type: [string, "null"], format: date-time }

    OnboardingApplication:
      type: object
      description: An application as its owner sees it.
      required: [id, role, role_label, status, status_label, details, documents, missing, can_submit, can_edit, can_reapply, decision, profile, submitted_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        role: { type: string, examples: [SERVICE_PROVIDER] }
        role_label: { type: string, examples: [Service provider] }
        status: { $ref: "#/components/schemas/OnboardingStatus" }
        status_label: { type: string, enum: [Pending Verification, Under Review, Changes Requested, Approved, Rejected], description: "The wording to show for `status`: DRAFT = Pending Verification (not yet submitted), SUBMITTED = Under Review, CHANGES_REQUESTED = Changes Requested, APPROVED = Approved, REJECTED = Rejected." }
        details: { $ref: "#/components/schemas/OnboardingDetails" }
        documents:
          type: array
          description: Newest first.
          items: { $ref: "#/components/schemas/OnboardingDocument" }
        missing:
          type: object
          description: What still has to be provided before the application can be submitted.
          required: [fields, documents]
          additionalProperties: false
          properties:
            fields: { type: array, items: { type: string }, description: "Names of required details that are not set." }
            documents: { type: array, items: { type: string }, description: "Codes of required documents that are not attached." }
        can_submit: { type: boolean, description: "Editable and nothing is missing." }
        can_edit: { type: boolean, description: "`DRAFT` or `CHANGES_REQUESTED`: details and documents can be changed." }
        can_reapply: { type: boolean, description: "`REJECTED`: saving details (PUT) starts a new application for the role." }
        decision: { $ref: "#/components/schemas/OnboardingDecision" }
        profile:
          description: The public profile an approval created; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/OnboardingProfileRef"
            - type: "null"
        submitted_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }

    OnboardingApplicationEnvelope:
      type: object
      required: [application]
      additionalProperties: false
      properties:
        application: { $ref: "#/components/schemas/OnboardingApplication" }

    OnboardingReason:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 5, maxLength: 500, description: "Plain text. Emailed to the applicant and kept in the history." }

    OnboardingAgencyRef:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        slug: { type: string }
        name: { type: string }

    OnboardingAdminItem:
      type: object
      required: [id, role, role_label, status, status_label, applicant, business_name, agency, submitted_at, updated_at, document_count]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        role: { type: string }
        role_label: { type: string }
        status: { $ref: "#/components/schemas/OnboardingStatus" }
        status_label: { type: string, enum: [Pending Verification, Under Review, Changes Requested, Approved, Rejected], description: "The wording to show for `status`: DRAFT = Pending Verification (not yet submitted), SUBMITTED = Under Review, CHANGES_REQUESTED = Changes Requested, APPROVED = Approved, REJECTED = Rejected." }
        applicant:
          type: object
          required: [name, email]
          additionalProperties: false
          properties:
            name: { type: string }
            email: { type: string, format: email }
        business_name: { type: [string, "null"] }
        agency:
          description: The agency the applicant wants to join (agency-member roles); null otherwise.
          oneOf:
            - $ref: "#/components/schemas/OnboardingAgencyRef"
            - type: "null"
        submitted_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }
        document_count: { type: integer, minimum: 0 }

    OnboardingAdminPage:
      type: object
      required: [items, page, page_size, total, total_pages, counts]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/OnboardingAdminItem" } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Applications in the requested status." }
        total_pages: { type: integer }
        counts:
          type: object
          description: Applications per status, within the same `role`, `q` and market scope. All five keys are always present.
          required: [SUBMITTED, CHANGES_REQUESTED, APPROVED, REJECTED, DRAFT]
          additionalProperties: false
          properties:
            SUBMITTED: { type: integer }
            CHANGES_REQUESTED: { type: integer }
            APPROVED: { type: integer }
            REJECTED: { type: integer }
            DRAFT: { type: integer }

    OnboardingAdminApplication:
      type: object
      description: The full application for an administrator, including the private details.
      required: [id, role, role_label, status, status_label, outcome, market_code, applicant, details, agency, documents, requirements, history, decision, profile, submitted_at, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        role: { type: string }
        role_label: { type: string }
        status: { $ref: "#/components/schemas/OnboardingStatus" }
        status_label: { type: string, enum: [Pending Verification, Under Review, Changes Requested, Approved, Rejected], description: "The wording to show for `status`: DRAFT = Pending Verification (not yet submitted), SUBMITTED = Under Review, CHANGES_REQUESTED = Changes Requested, APPROVED = Approved, REJECTED = Rejected." }
        outcome: { type: string, enum: [ORGANISATION, AGENCY_MEMBER, NONE] }
        market_code: { type: [string, "null"], description: "The market the application belongs to; null when it has none (yet)." }
        applicant:
          type: object
          required: [id, name, email, email_verified, created_at]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            email_verified: { type: boolean }
            created_at: { type: string, format: date-time, description: "When the account was created." }
        details: { $ref: "#/components/schemas/OnboardingDetails" }
        agency:
          oneOf:
            - $ref: "#/components/schemas/OnboardingAgencyRef"
            - type: "null"
        documents: { type: array, items: { $ref: "#/components/schemas/OnboardingDocument" } }
        requirements:
          type: object
          description: The requirement checklist, as the tables stand now.
          required: [fields, documents]
          additionalProperties: false
          properties:
            fields:
              type: array
              items:
                type: object
                required: [name, required, provided]
                additionalProperties: false
                properties:
                  name: { type: string }
                  required: { type: boolean }
                  provided: { type: boolean }
            documents:
              type: array
              items:
                type: object
                required: [code, label, description, required, provided]
                additionalProperties: false
                properties:
                  code: { type: string }
                  label: { type: string }
                  description: { type: string }
                  required: { type: boolean }
                  provided: { type: boolean }
        history:
          type: array
          description: Every transition, oldest first. Rows are never changed.
          items:
            type: object
            required: [from, from_label, to, to_label, actor_name, reason, at]
            additionalProperties: false
            properties:
              from: { $ref: "#/components/schemas/OnboardingStatus" }
              to: { $ref: "#/components/schemas/OnboardingStatus" }
              from_label: { type: string, description: "Display wording of `from`." }
              to_label: { type: string, description: "Display wording of `to`." }
              actor_name: { type: string, description: "Who did it: the applicant (submit) or the administrator. Empty if that account no longer exists." }
              reason: { type: [string, "null"] }
              at: { type: string, format: date-time }
        decision: { $ref: "#/components/schemas/OnboardingDecision" }
        profile:
          oneOf:
            - $ref: "#/components/schemas/OnboardingProfileRef"
            - type: "null"
        submitted_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OnboardingAdminApplicationEnvelope:
      type: object
      required: [application]
      additionalProperties: false
      properties:
        application: { $ref: "#/components/schemas/OnboardingAdminApplication" }

    PlatformRoleAssignment:
      type: object
      required: [role, market_code]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [SUPER_ADMIN, PLATFORM_ADMIN, MARKET_ADMIN, FINANCE_ADMIN, CONTENT_ADMIN, MODERATOR, SUPPORT]
        market_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
          description: Set only for the market-scoped role MARKET_ADMIN; null for global roles.

    Membership:
      type: object
      description: The user's role in one organisation and market.
      required: [organisation_id, organisation_name, organisation_kind, market_code, role, role_label]
      additionalProperties: false
      properties:
        organisation_id:
          type: string
          format: uuid
        organisation_name:
          type: string
        organisation_kind:
          type: string
          enum: [AGENCY, LAW_FIRM, PROPERTY_MANAGER, HOST, DEVELOPER, SERVICE_PROVIDER, LANDLORD]
          description: "A code of the `organisation_kinds` reference set, which has the labels (Real Estate Agency, Law Firm, Property Manager, Host, Property Developer, Property Service Provider). A solicitor's firm is `LAW_FIRM`. `LANDLORD` is a legacy value that nothing creates any more."
        market_code:
          type: string
          pattern: "^[A-Z]{2}$"
        role:
          type: string
          enum: [OWNER, MANAGER, AGENT, STAFF]
        role_label:
          type: string
          description: |
            How `role` is shown. In an agency: OWNER "Agency Principal", MANAGER "Agency
            Administrator", AGENT "Estate Agent", STAFF "Agency Staff". In any other
            organisation: OWNER "Principal", MANAGER "Manager", AGENT "Estate Agent", STAFF "Staff".
          examples: [Agency Principal]

    Session:
      type: object
      required: [scope, expires_at]
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [customer, admin]
          description: |
            `customer` for the public login; `admin` for the administrator login. Platform-role
            routes require `admin`.
        expires_at:
          type: string
          format: date-time
          description: |
            Absolute expiry: 30 days after sign-in for `customer` (which also ends after 14 days
            without use), 12 hours for `admin` (which also ends after 30 minutes without use).

    Me:
      type: object
      required: [user, session]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"

    AuthResult:
      type: object
      required: [user]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          allOf:
            - $ref: "#/components/schemas/Session"
          description: |
            Always present for login. Absent only when `verify-email` verified an account that
            holds a platform role (no session is started for those).
        access_token:
          type: string
          description: Opaque session token. Present only when `token_delivery` is `bearer`.

    TokenDelivery:
      type: string
      enum: [cookie, bearer]
      default: cookie

    NewPassword:
      type: string
      minLength: 10
      maxLength: 128
      description: 10 to 128 characters.

    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, consent, roles]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          $ref: "#/components/schemas/NewPassword"
        consent:
          type: object
          additionalProperties: false
          required: [privacy_version, accepted]
          properties:
            privacy_version:
              type: string
              minLength: 1
              maxLength: 32
            accepted:
              type: boolean
              const: true
        marketing_opt_in:
          type: boolean
          default: false
        roles:
          type: array
          minItems: 1
          maxItems: 11
          uniqueItems: true
          description: Account roles chosen by the person. Duplicates are rejected.
          items:
            $ref: "#/components/schemas/SelectableAccountRole"

    DirectoryKind:
      type: string
      description: |
        The directory a profile is listed in; the first segment of its public address. A code
        from the `directory_kinds` reference set (active rows only). Baseline values: agencies,
        agents, developers, property-managers, solicitors, hosts, service-providers (labels: Real
        Estate Agencies, Estate Agents, Property Developers, Property Managers, Solicitors, Hosts
        and Venues, Property Services).
      examples: [service-providers]

    BusinessEnquiryCreate:
      type: object
      additionalProperties: false
      required:
        - recipient
        - message
        - preferred_contact_method
        - consent
      properties:
        recipient:
          type: object
          additionalProperties: false
          required: [kind, slug]
          properties:
            kind:
              $ref: "#/components/schemas/DirectoryKind"
            slug:
              type: string
              maxLength: 80
              pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        service:
          type: string
          maxLength: 120
          description: Optional. One of the recipient's listed services. Plain text; HTML and control characters are rejected. An empty string is treated as absent.
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain text. Anything containing HTML tags or control characters is rejected. Leading/trailing whitespace is trimmed.
        preferred_contact_method:
          type: string
          description: |
            A code from the `contact_methods` reference set (active rows only). Baseline values:
            EMAIL, PHONE, WHATSAPP. PHONE and WHATSAPP require `guest_contact.phone`.
          examples: [EMAIL]
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
        guest_contact:
          type: object
          additionalProperties: false
          description: |
            Required for guests, with `name` and `email`. Optional for a signed-in customer, for
            whom only `phone` is read (name and email come from the account).
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            email:
              type: string
              format: email
              maxLength: 254
            phone:
              type: string
              pattern: "^\\+[1-9][0-9]{6,14}$"
              description: E.164. Optional unless the preferred contact method is PHONE or WHATSAPP.
        consent:
          type: object
          additionalProperties: false
          required: [privacy_version, accepted]
          properties:
            privacy_version:
              type: string
              minLength: 1
              maxLength: 32
            accepted:
              type: boolean
              const: true

    BusinessEnquiryReceipt:
      type: object
      required: [enquiry_id, reference, status, created_at]
      additionalProperties: false
      properties:
        enquiry_id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^BE-[2-9A-HJKMNP-TV-Z]{8}$"
          description: Human-friendly reference to quote to support.
          examples: [BE-7K3M9QXD]
        status:
          type: string
          const: RECEIVED
          description: The enquiry has been stored. It does not indicate that anyone has been notified.
        created_at:
          type: string
          format: date-time

    ReceivedBusinessEnquiry:
      type: object
      required:
        - enquiry_id
        - reference
        - recipient
        - service
        - message
        - preferred_contact_method
        - contact
        - status
        - created_at
      additionalProperties: false
      properties:
        enquiry_id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^BE-[2-9A-HJKMNP-TV-Z]{8}$"
        recipient:
          type: object
          description: The profile the enquiry was addressed to.
          required: [kind, slug, name]
          additionalProperties: false
          properties:
            kind:
              $ref: "#/components/schemas/DirectoryKind"
            slug:
              type: string
            name:
              type: string
        service:
          type: [string, "null"]
          description: The service the customer picked, or null.
        message:
          type: string
        preferred_contact_method:
          type: string
          enum: [EMAIL, PHONE, WHATSAPP]
        contact:
          type: object
          description: The customer's contact details. Returned only here, to the authorised recipient.
          required: [name, email, phone]
          additionalProperties: false
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            phone:
              type: [string, "null"]
              description: E.164, or null when the customer gave no phone number.
        status:
          type: string
          enum: [RECEIVED]
          description: Internal status. Only RECEIVED can appear in an inbox today.
        created_at:
          type: string
          format: date-time

    ListingSummary:
      type: object
      description: The public name of a listing.
      required: [slug, title, reference]
      additionalProperties: false
      properties:
        slug: { type: string, description: "Use with `GET /v1/listings/{slug}`.", examples: [four-bedroom-family-home-borrowdale] }
        title: { type: string, examples: [Four-bedroom family home with garden] }
        reference: { type: string, examples: [RP-ZW-10001] }

    OrganisationPropertyRequest:
      type: object
      required:
        - stay
        - request_id
        - reference
        - listing_id
        - listing
        - request_type
        - status
        - message
        - preferred_contact_method
        - contact
        - created_at
      additionalProperties: false
      properties:
        stay:
          oneOf:
            - $ref: "#/components/schemas/StayDetails"
            - type: "null"
          description: "New in 0.16.0. The dates, nights and guests of a `STAY_REQUEST`; null for every other request type."
        request_id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^RP-[2-9A-HJKMNP-TV-Z]{8}$"
        listing_id:
          type: string
          format: uuid
        listing:
          oneOf:
            - $ref: "#/components/schemas/ListingSummary"
            - type: "null"
          description: |
            The listing the request is about, as a public summary, so the inbox can show its
            title. It is present whatever the listing's status (an expired listing is still
            named to its own advertiser) and null only when the listing has no public page.
        request_type:
          type: string
          enum: [ENQUIRY, PROPERTY_INFORMATION, VIEWING_REQUEST, CONSULTATION_REQUEST]
        status:
          type: string
          enum: [RECEIVED]
          description: Internal status. Only RECEIVED can appear in an organisation inbox today.
        message:
          type: string
        preferred_contact_method:
          type: string
          enum: [EMAIL, PHONE, WHATSAPP]
        contact:
          type: object
          description: The customer's contact details (the guest's, or the account's name and email for a signed-in customer).
          required: [name, email, phone]
          additionalProperties: false
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            phone:
              type: [string, "null"]
              description: E.164, or null when the customer gave no phone number.
        created_at:
          type: string
          format: date-time

    Market:
      type: object
      description: A country. ("Market" is the older name of the same thing.)
      required: [id, code, name, currency_code, timezone, status, listing_count, has_listings]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Stable. The five countries that existed before 0.15.0 (ZW, GB, AE, BW, ZA) keep the IDs they had.
        code:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          pattern: "^[A-Z]{2}$"
        name:
          type: string
          description: "English short name as people say it (`Russia`, `South Korea`), not ISO's inverted form."
        currency_code:
          type: string
          description: ISO 4217 currency code of the country (one per country). Zimbabwe is `USD`.
          pattern: "^[A-Z]{3}$"
        timezone:
          type: string
          description: "IANA time zone name: the country's default zone, its capital's. One per country, also for countries with several zones."
        status:
          type: string
          enum: [ACTIVE]
          description: "**Always `ACTIVE` since 0.15.0.** Kept so existing clients do not break; it no longer gates anything and `PLANNED` no longer exists. A country that has been switched off is not returned at all (and is refused as a `country`)."
        listing_count:
          type: integer
          minimum: 0
          description: New in 0.15.0. Published, unexpired listings in the country right now.
        has_listings:
          type: boolean
          description: "New in 0.15.0. `listing_count > 0`: whether the public should be shown this country."

    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 128
      pattern: "^[\\x21-\\x7E]+$"
      description: Client-generated unique key (a UUID is recommended). Printable ASCII, no spaces.

    PropertyRequestCreate:
      type: object
      additionalProperties: false
      required:
        - listing_id
        - request_type
        - message
        - preferred_contact_method
        - consent
      properties:
        listing_id:
          type: string
          format: uuid
        request_type:
          type: string
          description: |
            A code from the `request_types` reference set (active rows only). Baseline values:
            ENQUIRY, PROPERTY_INFORMATION, VIEWING_REQUEST, CONSULTATION_REQUEST, STAY_REQUEST.

            `STAY_REQUEST` ("Request to stay", new in 0.16.0) is valid only for a listing in
            the `short-stay` category and requires `check_in`, `check_out` and `guests`. It is
            still an enquiry: it does **not** block the dates and creates no appointment or
            booking.
          examples: [VIEWING_REQUEST]
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain text. Anything containing HTML tags or control characters is rejected. Leading/trailing whitespace is trimmed.
        preferred_contact_method:
          type: string
          description: |
            A code from the `contact_methods` reference set (active rows only). Baseline values:
            EMAIL, PHONE, WHATSAPP. PHONE and WHATSAPP require `guest_contact.phone`.
          examples: [EMAIL]
        preferred_slot_utc:
          type: [string, "null"]
          format: date-time
          description: Optional. Only allowed for VIEWING_REQUEST and CONSULTATION_REQUEST and must be in the future.
        check_in:
          type: [string, "null"]
          format: date
          description: "**Required for STAY_REQUEST, not allowed for any other type.** The first night (`YYYY-MM-DD`, in the listing's time zone). Not in the past."
        check_out:
          type: [string, "null"]
          format: date
          description: "**Required for STAY_REQUEST, not allowed otherwise.** The day of leaving: after `check_in`, at least the listing's `min_nights` and at most 90 nights later, inside the booking window."
        guests:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: "**Required for STAY_REQUEST, not allowed otherwise.** At most the listing's `max_guests`."
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
        guest_contact:
          type: object
          additionalProperties: false
          description: |
            Required for guests, with `name` and `email`. Optional for a signed-in customer, for
            whom only `phone` is read (name and email come from the account).
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            email:
              type: string
              format: email
              maxLength: 254
            phone:
              type: string
              pattern: "^\\+[1-9][0-9]{6,14}$"
              description: E.164. Optional unless the preferred contact method is PHONE or WHATSAPP.
        consent:
          type: object
          additionalProperties: false
          required: [privacy_version, accepted]
          properties:
            privacy_version:
              type: string
              minLength: 1
              maxLength: 32
              description: Version of the privacy notice the customer accepted.
            accepted:
              type: boolean
              const: true

    PropertyRequestReceipt:
      type: object
      required: [request_id, reference, status, created_at, appointment]
      additionalProperties: false
      properties:
        request_id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^RP-[2-9A-HJKMNP-TV-Z]{8}$"
          description: Human-friendly reference to quote to support.
          examples: [RP-7K3M9QXD]
        status:
          type: string
          const: RECEIVED
          description: The request has been stored. It does not indicate that anyone has been notified.
        created_at:
          type: string
          format: date-time
        appointment:
          type: [object, "null"]
          additionalProperties: false
          required: [id, reference]
          description: |
            The appointment (status `REQUESTED`) created in the same transaction when the request
            is a `VIEWING_REQUEST` or `CONSULTATION_REQUEST` with a `preferred_slot_utc`. Null
            when there is no slot, for other request types, and when the request could not be
            routed to anyone. A signed-in customer finds it under `/v1/me/appointments`.
          properties:
            id:
              type: string
              format: uuid
            reference:
              type: string
              pattern: "^AP-[2-9A-HJKMNP-TV-Z]{8}$"

    AppointmentType:
      type: string
      enum: [VIEWING, CONSULTATION]
      description: "`VIEWING`: a property viewing (always tied to a listing). `CONSULTATION`: a meeting with a listing's advertiser or with a directory profile."

    AppointmentStatus:
      type: string
      enum: [REQUESTED, CONFIRMED, RESCHEDULE_REQUESTED, COMPLETED, NO_SHOW, CANCELLED]
      description: |
        `REQUESTED` -> `CONFIRMED` -> `COMPLETED` | `NO_SHOW`; `REQUESTED` | `CONFIRMED` ->
        `RESCHEDULE_REQUESTED` -> `CONFIRMED` (the other party accepts the proposed time);
        `REQUESTED` | `CONFIRMED` | `RESCHEDULE_REQUESTED` -> `CANCELLED`. `COMPLETED`,
        `NO_SHOW` and `CANCELLED` are final. Show `status_label` to people.

    AppointmentParty:
      type: string
      enum: [CUSTOMER, PROFESSIONAL]

    AppointmentTimelineEntry:
      type: object
      additionalProperties: false
      required: [event, from, to, to_label, actor, note, start_utc, at]
      properties:
        event:
          type: string
          enum: [REQUESTED, CONFIRMED, RESCHEDULE_REQUESTED, CANCELLED, COMPLETED, NO_SHOW, ASSIGNED]
          description: "`ASSIGNED` (an internal assignment; `from` equals `to`) is returned to the professional only."
        from:
          type: [string, "null"]
          description: The status before; null for the first entry.
        to:
          $ref: "#/components/schemas/AppointmentStatus"
        to_label:
          type: string
          examples: [Reschedule Requested]
        actor:
          type: string
          enum: [CUSTOMER, PROFESSIONAL, SYSTEM]
          description: Who did it. Never a name or an account.
        note:
          type: [string, "null"]
          description: The note sent with a proposal, or the reason of a cancellation.
        start_utc:
          type: [string, "null"]
          format: date-time
          description: The time the entry is about (requested, confirmed or proposed); null when it is not about a time.
        at:
          type: string
          format: date-time

    Appointment:
      type: object
      description: What both parties see. Never contains the professional's phone number or email address.
      required:
        - id
        - reference
        - type
        - status
        - status_label
        - start_utc
        - end_utc
        - timezone
        - duration_minutes
        - proposed_start_utc
        - proposed_by
        - listing
        - with
        - location_note
        - note
        - property_request_reference
        - business_enquiry_reference
        - cancelled_by
        - cancel_reason
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^AP-[2-9A-HJKMNP-TV-Z]{8}$"
          examples: [AP-7K3M9QXD]
        type:
          $ref: "#/components/schemas/AppointmentType"
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        status_label:
          type: string
          enum: [Requested, Confirmed, Reschedule Requested, Completed, No Show, Cancelled]
        start_utc:
          type: string
          format: date-time
          description: The requested or confirmed start. It does not change while a proposal is waiting.
        end_utc:
          type: string
          format: date-time
          description: "`start_utc` plus `duration_minutes`."
        timezone:
          type: string
          description: The market's IANA time zone; show times to people in it, and name it.
          examples: [Africa/Harare]
        duration_minutes:
          type: integer
          minimum: 15
          maximum: 240
          default: 30
        proposed_start_utc:
          type: [string, "null"]
          format: date-time
          description: Set exactly while `status` is `RESCHEDULE_REQUESTED`.
        proposed_by:
          oneOf:
            - $ref: "#/components/schemas/AppointmentParty"
            - type: "null"
          description: Who proposed `proposed_start_utc`; the OTHER party accepts it.
        listing:
          oneOf:
            - $ref: "#/components/schemas/ListingSummary"
            - type: "null"
          description: |
            The listing as it was named when the appointment was made (kept after the listing
            expires). Null for an appointment addressed to a directory profile.
        with:
          type: [object, "null"]
          additionalProperties: false
          required: [kind, slug, name]
          description: |
            The public profile of the professional or business: the addressed profile, or the
            listing's agent, else its agency. Null for a private owner (landlord or property
            seller), who has no public profile.
          properties:
            kind:
              type: string
              description: A code from the `directory_kinds` reference set.
            slug:
              type: string
            name:
              type: string
        location_note:
          type: [string, "null"]
          maxLength: 200
          description: Where to meet, set by the professional.
        note:
          type: [string, "null"]
          description: The customer's note (for an appointment made from a property request, the request's message).
        property_request_reference:
          type: [string, "null"]
          description: The reference (`RP-...`) of the property request that created the appointment.
        business_enquiry_reference:
          type: [string, "null"]
          description: Always null today; nothing creates an appointment from a business enquiry yet.
        cancelled_by:
          type: [string, "null"]
          enum: [CUSTOMER, PROFESSIONAL, SYSTEM, null]
        cancel_reason:
          type: [string, "null"]
        timeline:
          type: array
          description: Oldest first. Present on a single appointment (read and action responses); **absent from list items**.
          items:
            $ref: "#/components/schemas/AppointmentTimelineEntry"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CustomerAppointment:
      allOf:
        - $ref: "#/components/schemas/Appointment"
        - type: object
          required: [can_cancel, can_reschedule, can_accept]
          properties:
            can_cancel:
              type: boolean
              description: The appointment is still open.
            can_reschedule:
              type: boolean
              description: "`REQUESTED`, `CONFIRMED`, or a professional's proposal is waiting (a counter-proposal)."
            can_accept:
              type: boolean
              description: A professional's proposal is waiting and its time has not passed.

    ReceivedAppointment:
      allOf:
        - $ref: "#/components/schemas/Appointment"
        - type: object
          required:
            - listing_id
            - organisation_id
            - assigned_to
            - contact
            - preferred_contact_method
            - can_confirm
            - can_reschedule
            - can_cancel
            - can_complete
            - can_no_show
            - can_assign
          properties:
            listing_id:
              type: [string, "null"]
              format: uuid
            organisation_id:
              type: [string, "null"]
              format: uuid
              description: Null for a direct owner's appointment.
            assigned_to:
              type: [object, "null"]
              additionalProperties: false
              required: [user_id, name]
              description: The member (or direct owner) it is assigned to; null means the organisation, unassigned.
              properties:
                user_id:
                  type: string
                  format: uuid
                name:
                  type: string
            contact:
              type: object
              additionalProperties: false
              required: [name, email, phone]
              description: The customer's contact details. Returned only to the professional.
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: [string, "null"]
            preferred_contact_method:
              type: string
              description: A code from the `contact_methods` reference set.
            can_confirm:
              type: boolean
              description: A confirm without `start_utc` would confirm (the requested time, or the customer's proposal, is still ahead).
            can_reschedule:
              type: boolean
            can_cancel:
              type: boolean
            can_complete:
              type: boolean
              description: "`CONFIRMED` and the start time has passed."
            can_no_show:
              type: boolean
            can_assign:
              type: boolean
              description: The caller is OWNER or MANAGER of the appointment's organisation and it is open.

    CustomerAppointmentEnvelope:
      type: object
      additionalProperties: false
      required: [appointment]
      properties:
        appointment:
          $ref: "#/components/schemas/CustomerAppointment"

    ReceivedAppointmentEnvelope:
      type: object
      additionalProperties: false
      required: [appointment]
      properties:
        appointment:
          $ref: "#/components/schemas/ReceivedAppointment"

    CustomerAppointmentPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerAppointment"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    ReceivedAppointmentPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReceivedAppointment"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    AppointmentCreate:
      type: object
      additionalProperties: false
      required: [type, start_utc, preferred_contact_method, consent]
      properties:
        type:
          $ref: "#/components/schemas/AppointmentType"
        listing_id:
          type: string
          format: uuid
          description: Exactly one of `listing_id` and `recipient`. Required for a `VIEWING`.
        recipient:
          type: object
          additionalProperties: false
          required: [kind, slug]
          description: A directory profile; `CONSULTATION` only.
          properties:
            kind:
              type: string
              description: A code from the `directory_kinds` reference set.
            slug:
              type: string
        start_utc:
          type: string
          format: date-time
          description: In the future and at most 12 months ahead. Seconds are kept, fractions dropped.
        duration_minutes:
          type: integer
          minimum: 15
          maximum: 240
          default: 30
        note:
          type: string
          maxLength: 1000
          description: Plain text, no HTML.
        preferred_contact_method:
          type: string
          description: A code from the `contact_methods` reference set.
        phone:
          type: string
          pattern: "^\\+[1-9][0-9]{6,14}$"
          description: E.164. Required for `PHONE` and `WHATSAPP`.
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
        consent:
          type: object
          additionalProperties: false
          required: [privacy_version, accepted]
          properties:
            privacy_version:
              type: string
              maxLength: 32
            accepted:
              type: boolean
              const: true

    AppointmentReschedule:
      type: object
      additionalProperties: false
      required: [start_utc]
      properties:
        start_utc:
          type: string
          format: date-time
          description: "The proposed start: in the future, at most 12 months ahead, and different from the current start."
        note:
          type: string
          maxLength: 500
          description: Plain text, shown to the other party in the timeline.

    AppointmentConfirm:
      type: object
      additionalProperties: false
      properties:
        start_utc:
          type: string
          format: date-time
          description: |
            Omit to confirm the time on the table. A different time does **not** confirm: it
            proposes that time to the customer (see the operation).
        duration_minutes:
          type: integer
          minimum: 15
          maximum: 240
        location_note:
          type: string
          maxLength: 200
          description: Where to meet. Plain text, one line.

    InboxSummary:
      type: object
      additionalProperties: false
      required: [property_requests, business_enquiries, appointments]
      properties:
        property_requests:
          type: object
          additionalProperties: false
          required: [new]
          properties:
            new:
              type: integer
        business_enquiries:
          type: object
          additionalProperties: false
          required: [new]
          properties:
            new:
              type: integer
        appointments:
          type: object
          additionalProperties: false
          required: [requested, reschedule_requested, upcoming_confirmed]
          properties:
            requested:
              type: integer
            reschedule_requested:
              type: integer
            upcoming_confirmed:
              type: integer
