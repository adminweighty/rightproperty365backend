openapi: 3.1.0
info:
  title: RightProperty365 API
  version: 0.26.1
  summary: Global property marketplace API (every country; Zimbabwe and the United Kingdom first).
  description: |
    Versioned REST API for RightProperty365.

    Conventions
    - Every error response uses the `ErrorEnvelope` shape. Branch on `error.code`, not on `error.message`.
    - Every response carries an `X-Request-Id` header. Clients may supply their own
      (1-128 characters of `A-Z a-z 0-9 . _ -`); otherwise one is generated. The same value is
      returned as `trace_id` in error bodies.
    - Timestamps are RFC 3339 in UTC.
    - Request bodies must be `application/json`, at most 64 KB, and must not contain unknown fields.

    Contacting a business or an agent
    - Directory profiles (agencies, agents, developers, property managers, hosts, service
      providers) have **no public contact details**: this API never returns a profile's phone
      number, email address or street address. The only way to reach a profile is
      `POST /v1/business-enquiries`.
    - The customer's own contact details are stored with the enquiry and returned **only** by
      `GET /v1/inbox/business-enquiries` to the authorised recipient.
    - The public catalogue (`/v1/listings`, `/v1/directory`, `/v1/sitemap`, `/v1/reference`)
      never returns a phone number, an email address or a street address for anyone. A test
      walks every public response to enforce it.

    Verified advertisers, logos and who advertises a listing (new in 0.17.0)
    - **Only listings of a verified advertiser are public.** A listing is returned by any public
      endpoint only while it is PUBLISHED, not expired, **and** its advertiser is verified: the
      organisation that owns it is active and has a published, verified profile of its own, or -
      for a direct owner - the owner's `PRIVATE_SELLER` or `LANDLORD` role is approved (`ACTIVE`).
      The rule is applied when the listing is read (search with every search engine, the detail,
      suggestions, the sitemap, profile pages, the country counts, availability), so it takes
      effect the moment the verification changes. A listing hidden for this reason answers
      `404 LISTING_NOT_FOUND` everywhere - never `410` - and takes no property request,
      appointment or request to stay (`404 LISTING_NOT_FOUND`). An assigned agent's own
      verification does not hide a listing; the agent is then simply not shown as verified.
      `GET /v1/trust/summary` gives the numbers.
    - **What "verified" does and does not mean.** It means the ADVERTISER was verified. It does
      not mean the listing itself was checked: `Listing.verification.listing_reviewed` says
      whether it was, and today only the sample data sets it (there are no endpoints to submit,
      review or publish a listing yet).
    - **Changed response shapes** (additive unless marked):
      - `Listing.advertiser` gains `display` and `agent_display`; `Listing` gains `verification`.
      - `ProfileRef` (in `Listing.advertiser.agency` / `.agent`, `DirectoryProfile.agency`,
        `DirectoryProfileDetail.agents`) gains `logo`.
      - **Changed:** `DirectoryProfile.logo` was always null and documented as a `Photo`
        (`url`, `alt`, `width`, `height`); it is now a `Logo` (`url`, `width`, `height`) or null.
      - **Changed value:** for a direct owner, `Listing.advertiser.name` used to be the fixed
        text `Private seller`; it is now the owner's name (for example `Grace Mhlanga`), the same
        as `advertiser.display.name`. Only the name is public: never an email address, a phone
        number or an address.
      - **Changed status:** `GET /v1/listings/{slug}` and the routes that take a `listing_id`
        answer `404` for a listing whose advertiser is not verified.
    - **Logo URLs are relative to the API.** `Logo.url` is a path such as
      `/v1/directory/agencies/sample-estates/logo?v=3f2a9c0d1b7e`. It is relative to the **API
      origin**, not to the web site: prefix it with the API base URL the client already uses
      (the same value it puts in front of `/v1/listings`). The API does not return an absolute
      URL because it does not know the public address it is reached at behind a proxy, and
      because the same cached JSON must be right for every client. The `v` value changes
      whenever the image changes, so the image can be cached and a new logo is never stale.
    - **Changed in 0.18.0: logos are made small and cached for a year.**
      - A logo larger than 512 pixels on its longer side is **scaled down when it is uploaded**
        to fit 512x512 (same proportions, never cropped, never enlarged; PNG stays PNG with its
        transparency, JPEG stays JPEG) and is stored and served at that size. Smaller logos are
        stored and served exactly as uploaded. No side is taken under 128 pixels, so an image
        more than four times as wide as it is high keeps a longer side above 512 (1200x200
        becomes 768x128). `Logo.width` / `Logo.height` are the size of the image that is
        **served**, which can be smaller than the file that was uploaded. Logos stored before
        0.18.0 are not touched until they are uploaded again.
      - `GET /v1/directory/{kind}/{slug}/logo` answers `Cache-Control: public,
        max-age=31536000, immutable` when the request's `v` is the version of the current
        logo, which is the case for every `Logo.url` the API returns. Use `Logo.url`
        unchanged, query string included: without `v`, or with the `v` of an earlier logo,
        the image is still served but with the short policy (`max-age=300`).
    - **Changed in 0.19.0: registration. Both changes break existing clients of
      `POST /v1/auth/register`; the web app and the mobile app must be updated together with
      this release.**
      - **A property seeker account is only that.** The Property Seekers roles are `CONSUMER`
        (Prospective Buyer) and `TENANT` (Prospective Tenant). `roles` may now hold seeker roles
        only (one or both), **or** roles from the other groups only; never a mix. A mix such as
        `[CONSUMER, AGENT]`, which was accepted before, is now `400 VALIDATION_FAILED` with
        `error.fields.roles` set to `A property seeker account cannot also have a professional,
        business or owner role. Choose one or the other.` Roles are still only chosen at
        registration: there is no endpoint that adds a role to an existing account. Accounts
        created before this release keep the roles they have.
      - **Registration must answer a captcha.** New `GET /v1/auth/captcha` returns a small
        arithmetic question (`captcha_id`, `question`, `expires_at`). `RegisterRequest` gains
        the **required** object `captcha` (`captcha_id`, `answer`). A registration without it,
        with a wrong answer, or with a captcha that has expired, is unknown or was already
        presented is `400 VALIDATION_FAILED` with a plain-language message in
        `error.fields.captcha`. A captcha can be presented once: after **any** refused
        registration, ask for a new question. See the two operations for the details. No
        third-party service is involved and there is nothing to configure.

    Lease templates and stamps (new in 0.26.0)
    - **Lease templates are owned by organisations.** Agencies and landlords design their own:
      `/v1/me/organisations/{orgId}/lease-templates` (list, create or copy, edit, publish, retire,
      audit trail). The organisation's OWNER and MANAGER (of a kind that manages listings; an
      independent landlord owns their own organisation) manage them; its other members who may
      create leases (AGENT) read them; other members get `403`, non-members `404
      ORGANISATION_NOT_FOUND`. Publishing (`APPROVED`, shown as "Published") needs no review.
    - **The platform library becomes sample templates** (`source: SAMPLE`, `organisation_id:
      null`): anyone may use or copy them. Administrators still keep them under
      `/v1/admin/lease-templates`; `legal_review` is now **optional** on approval.
    - **Changed response shapes (additive).** Every template gains `organisation_id`, `source`
      (`SAMPLE` | `ORGANISATION`) and `can_edit`. `GET /v1/me/lease-templates` offers every
      approved sample plus the published templates of the caller's organisations (only one with
      `organisation_id`). `POST /v1/me/leases` accepts an approved template that is a sample or
      belongs to the lease's organisation (`400` on `template_id` for another organisation's).
      Leases gain `landlord_stamp`.
    - **Generated digital stamps.** A user types the text of their company stamp and the server
      draws it (round, oval or rectangle; blue, red, black, green or purple ink) as a transparent
      PNG: `POST /v1/stamp-preview` (public). The stamp is saved with the saved signature
      (`/v1/me/signature`). Agreements gain a `STAMP` field (SIGNER only, default 113 x 113 pt,
      at least 57 pt); `POST /v1/signing/{token}/submit` takes `stamp`, required when the
      recipient has a required STAMP field; the completed PDF draws the stamp (dated the signing
      day) in each of the signer's STAMP fields, and the audit report records "Stamp applied:
      <top text>". A lease with `landlord_stamp: true` places a STAMP field next to each
      landlord's signature block. It is a picture of a stamp, not a certificate seal.
    - Migration 0025 (additive: `lease_templates.organisation_id`, `agreement_recipients.stamp`,
      `user_signatures.stamp`, the STAMP field type; approval no longer requires a legal review).

    The administrators' area (new in 0.25.0)
    - **Accounts** (`/v1/admin/users`): list and search (SUPER_ADMIN, PLATFORM_ADMIN, SUPPORT), an
      account's detail (roles and onboarding state, memberships, listing counts, last sign-in,
      subscriptions, audit), and - SUPER_ADMIN and PLATFORM_ADMIN only - suspend (with a reason),
      reactivate and delete. Nobody acts on their own account and only a SUPER_ADMIN acts on an
      account that holds a platform role. **Suspension** ends every session at once and refuses
      sign-in; it unpublishes nothing: the listings the person owns directly stay `PUBLISHED` but
      leave the public catalogue while the account is suspended (the verified-advertiser rule
      already requires the direct owner's account to be `ACTIVE`), and come back on reactivation;
      an organisation's listings are the organisation's and stay public. **Deletion** anonymises
      the account in place (see `AccountDeleted`) and is refused for the only owner of an
      organisation that still has members (`409 SOLE_OWNER`). `DELETE /v1/me` (password again)
      is the same deletion for the person themselves; an administrator account cannot use it.
      The person is emailed (suspended, reactivated, deleted).
    - **Subscriptions** (`/v1/me/subscription-plans`, `/v1/me/subscriptions`,
      `/v1/admin/subscription-plans`, `/v1/admin/subscriptions`). **There is no online
      payment**: asking for a plan creates a `PENDING_PAYMENT` subscription with an invoice number
      and the amount (emailed); it is paid outside the platform, and a FINANCE_ADMIN (or
      SUPER_ADMIN) records the payment, which makes it `ACTIVE` for 3 months (`QUARTERLY`) or a
      year (`YEARLY`). Requests can be withdrawn while pending, rejected with a reason, and an
      active subscription cancelled by an administrator, who records whether a pro-rata refund is
      due (`refund_due`, a flag and a note: no money moves). Nothing renews by itself: from 30
      days before the end the subscriber asks for the next period, a new invoice that starts when
      the current period ends. Past its end a subscription is `EXPIRED` at once in every answer,
      and the worker records it (and emails) within minutes. A plan's limits
      (`MAX_ACTIVE_LISTINGS`, ...) are shown with the current usage but **not enforced yet**
      (`usage.limit_enforced: false`).
    - **Reference data** (`/v1/admin/reference`): relabel, reorder, deactivate and reactivate the
      rows of every set; add rows to property types, listing features, service trades, regions,
      cities and suburbs. Nothing is deleted (SUPER_ADMIN, PLATFORM_ADMIN, CONTENT_ADMIN;
      MARKET_ADMIN for its own market's rows).
    - **Reports** (`/v1/admin/reports/summary` for SUPER_ADMIN, PLATFORM_ADMIN, FINANCE_ADMIN):
      counts over a date range per market and the payments recorded per currency; CSV exports of
      users and listings (SUPER_ADMIN, PLATFORM_ADMIN) and subscriptions (also FINANCE_ADMIN).
    - **Audit**: every administrator action above is recorded, immutably, in the same transaction
      (`GET /v1/admin/audit`, SUPER_ADMIN and PLATFORM_ADMIN).
    - Migration 0024 (additive). No existing response shape changes.

    Leases (new in 0.24.0)
    - **New: a lease template library and lease drafting.** Content administrators (SUPER_ADMIN,
      CONTENT_ADMIN) keep templates per country under `/v1/admin/lease-templates`: ordered
      sections with `{{variable}}` placeholders from a fixed list (`variables` in every template
      list; an unknown placeholder is `400`), optional clauses, `DRAFT` -> `APPROVED` (with a
      recorded legal review) -> `RETIRED`. Editing an approved template creates its next draft
      version; approving a version retires the previous one. Only approved templates of the
      property's country are offered (`GET /v1/me/lease-templates`) or accepted.
    - Whoever may manage listings (`can_manage_listings`; never STAFF) drafts leases with
      `/v1/me/leases`; an organisation's OWNER and MANAGER see every lease of it, an agent their
      own. Every save renders a private PDF (DRAFT watermark, footer with reference, template
      version and page x of y, room for every party's initials and signature);
      `GET /v1/me/leases/{id}/pdf` streams it. Every lease has an immutable audit trail and a
      reference `RPL-<year>-<6 digits>`. `GET /v1/admin/leases` lists every lease (SUPER_ADMIN,
      SUPPORT, read-only).
    - **Changed response shapes (additive).** `GET /v1/me/dashboard`: `organisations[]` gains
      `can_create_leases`, `capabilities` gains `creates_leases`, and the counters
      `leases.awaiting_signatures` and `leases.drafts` (group `leases`) appear for those who may
      create leases.

    Agreements: electronic signing (new in 0.24.0)
    - **New: an Adobe-Sign-style signing workflow** for generated leases and any uploaded PDF
      (`/v1/me/agreements`). Recipients are SIGNER, APPROVER or CC with an order: the same order
      acts in parallel, order n is emailed only when the earlier orders have finished, a CC only
      gets the completed copy. Fields (SIGNATURE, INITIALS, DATE_SIGNED, NAME, TEXT, CHECKBOX; STAMP since 0.26.0) are
      placed per recipient in PDF points from the page's top-left (`document.pages` gives every
      page's size for pdf.js). A lease is sent with `POST /v1/me/leases/{id}/send`, its fields
      placed automatically, and the lease follows its agreement.
    - **Signing by link** (`/sign/{token}`; `/v1/signing/{token}`, `/pdf`, `/code`, `/submit`,
      `/decline`): one link per recipient (only its SHA-256 is stored), valid until the agreement
      expires and read-only for 90 days after completion; a six-digit emailed code proves the
      address before each submit (`AUTH_DEMO_CODE` in development and staging only). Signatures
      are typed (three embedded styles), drawn or uploaded, and can be saved to the account
      (`/v1/me/signature`). Signed-in recipients list their documents with
      `GET /v1/me/signing-requests`.
    - **Completion**: every value is drawn onto the original pages, an audit report page is
      appended (dates, SHA-256 of the original, the history with IP addresses and devices), the
      final SHA-256 is recorded, and everybody is emailed. `GET /v1/verify/{reference}` and
      `POST /v1/verify` check a copy. No digital seal (PDF signature) is applied, and the audit
      report says so. Wording: "Signed electronically on RightProperty365"; enforceability,
      witnessing, stamping and registration depend on the jurisdiction.
    - **Changed response shapes (additive).** `GET /v1/me/dashboard`: counters
      `agreements.waiting_for_you` (group `my_activity`, next action `SIGN_DOCUMENTS`) and
      `agreements.waiting_for_others` (group `leases`).

    Agency teams (new in 0.23.0)
    - **New: an organisation's OWNER and MANAGER run their own team.** New routes under
      `/v1/agent/organisations/{id}`: `GET|POST /invitations`, `DELETE /invitations/{invitationId}`,
      `PATCH|DELETE /members/{userId}`, `GET /join-requests`, `POST
      /join-requests/{requestId}/approve|decline`, `GET /audit`; the public `GET
      /v1/invitations/{token}` and `POST /v1/invitations/{token}/accept`; and `POST
      /v1/agent/property-requests/{id}/assign`.
    - **The rules.** An OWNER invites, changes, suspends and removes MANAGER, AGENT and STAFF
      members; a MANAGER only AGENT and STAFF (only an owner makes someone a manager). Nobody is
      made an OWNER, nobody changes or removes an OWNER (the last owner can never go), nobody acts
      on themselves. AGENT and STAFF manage nothing of the team (`403`); a non-member gets `404
      ORGANISATION_NOT_FOUND`.
    - **Immediate effect.** Access is read from the ACTIVE memberships on every request: a member
      who is suspended or removed gets `403`/`404` on their very next request with the same
      session. Their open requests and appointments go back to the organisation inbox.
    - **Invitations** are single-use links `PUBLIC_WEB_URL/invitations/{token}` valid for 7 days,
      emailed from the request (only the token's SHA-256 is stored). The invited person signs in
      (or signs up first) with the invited address and accepts. A property seeker account cannot
      join (`409 SEEKER_ACCOUNT_CANNOT_JOIN`).
    - **Join requests**: a professional who registered to join an agency (AGENT, SALES_AGENT,
      LETTINGS_AGENT, AGENCY_STAFF, AGENCY_ADMIN) can now be approved or declined by that agency's
      OWNER (and MANAGER, for those who become AGENT or STAFF) as well as by the verification team;
      whoever decides first wins and the other gets `409`.
    - **Assignment**: OWNER and MANAGER give a received request to an ACTIVE OWNER, MANAGER or
      AGENT of the organisation (STAFF hold no leads); a `NEW_ENQUIRY` moves to `ASSIGNED` and
      the assignee is emailed.
    - **Audit trail**: every invitation, acceptance, join decision, role or status change,
      removal and assignment is kept in the database and listed by `GET .../audit`.
    - **Changed response shapes (additive).** `OrganisationMembers.items[]` (now `TeamMember`)
      gains `job_title`, `joined_at`, `open_leads`, `can_change`, `allowed_roles`,
      `can_hold_leads`; received requests gain `assigned_to` (and the detail `can_assign`, timeline
      events `ASSIGNED` / `UNASSIGNED` with `assignee_name`); the dashboard's `organisations[]`
      gains `can_manage_team`; appointment timelines can show `UNASSIGNED`.
    - **Listing review:** a reviewer who is a member of the listing's organisation, or who sells,
      is the agent of, created or submitted the listing, gets `403 SELF_REVIEW_FORBIDDEN` when
      approving, requesting changes or rejecting it.

    Listings by advertisers (changed in 0.22.0)
    - **New: advertisers create and edit their own listings, with photos, and platform
      reviewers approve them before they are public.** The owner's rule is "a maximum of 20
      photos per property". New routes: `POST /v1/me/listings`, `GET|PATCH|DELETE
      /v1/me/listings/{id}`, `POST /v1/me/listings/{id}/submit|archive|relist`,
      `POST /v1/me/listings/{id}/photos`, `PUT /v1/me/listings/{id}/photos/order`,
      `PATCH|DELETE /v1/me/listings/{id}/photos/{photoId}`,
      `GET /v1/listing-photos/{photoId}/{size}`, `GET /v1/admin/listings`,
      `GET /v1/admin/listings/{id}` and `POST /v1/admin/listings/{id}/approve|request-changes|reject`.
    - **Who.** Creating: an `OWNER`, `MANAGER` or `AGENT` of an organisation whose kind manages
      listings (agency, law firm, property manager, developer, host: the dashboard's
      `can_manage_listings`), and an approved landlord or property seller for themselves.
      Changing one listing: the organisation's `OWNER` and `MANAGER` (every listing of it), an
      `AGENT` (only the listings they are the agent of; the others are read-only,
      `can_edit: false`), the direct owner (their own). `STAFF`, seekers and accounts whose
      verification is pending manage none. Reviewing: `MODERATOR`, `PLATFORM_ADMIN`,
      `SUPER_ADMIN` everywhere, `MARKET_ADMIN` in its own countries (as the listings section
      of `GET /v1/admin/overview`).
    - **Lifecycle.** `DRAFT` -> `PENDING_REVIEW` (submit) -> `PUBLISHED` (approve, for 90 days)
      | `CHANGES_REQUESTED` (with a reason; edit and submit again) | `REJECTED` (with a reason;
      final, the listing can only be deleted). `ARCHIVED` (withdrawn by the advertiser) and
      `EXPIRED` (a published listing past its period) can be relisted: back to review (a new
      90-day period starts on approval) when it was published before, to `DRAFT` when it never
      was. `DELETE` is only for a listing that was never published.
    - **Editing a published listing** does not take it offline: the changes (and new photos)
      are kept as `pending_changes` and the public keeps seeing the approved version until a
      reviewer approves them. A rejection drops them. Reordering photos and deleting a photo
      apply at once.
    - **Changed response shapes (additive).** `Photo` gains `variants: [{width, height, url}]`
      (empty for the bundled sample images, whose `url` is unchanged); `url`, `alt`, `width`
      and `height` keep their meaning. An uploaded photo's `url` is an API path
      (`/v1/listing-photos/{id}/large?v=...`, relative to the API origin like a logo URL).
      Listing statuses gain `CHANGES_REQUESTED`, `REJECTED` and `ARCHIVED`; an archived
      listing that was public answers `410 LISTING_UNAVAILABLE`, and so does one waiting for
      review after a relist. `GET /v1/me/dashboard` always has the counters
      `listings.status.DRAFT`, `.PENDING_REVIEW` and `.CHANGES_REQUESTED` (and the next action
      `UPDATE_LISTINGS_FOR_REVIEW`); the admin overview counts the new statuses.

    Signing in is two steps (changed in 0.21.0). **BREAKING for every client that signs in:
    the web app, the mobile app and the administrator console must be updated together with
    this release.**
    - **The password alone no longer signs anyone in.** `POST /v1/auth/login` and
      `POST /v1/admin/auth/login` keep their request bodies, but when the password is right
      they now answer `200` with `SignInChallenge`
      (`{"status":"CODE_REQUIRED","challenge_id":"...","sent_to":"u•••@example.com","expires_at":"...","code_length":6}`),
      set **no** cookie and return **no** `access_token` or `user`. A six-digit code is
      emailed to the account's address.
    - **New:** `POST /v1/auth/login/verify` and `POST /v1/admin/auth/login/verify` with
      `{challenge_id, code}` answer exactly what the login endpoints answered before 0.21.0
      (the session: cookie, or `access_token` when the customer login asked for
      `token_delivery: bearer`). `POST /v1/auth/login/resend` and
      `POST /v1/admin/auth/login/resend` with `{challenge_id}` email a fresh code.
    - **Rules.** The code is valid for 10 minutes and works once. Five wrong codes end the
      challenge. A new code can be asked for every 30 seconds, five times per challenge; the
      earlier code then stops working. A challenge belongs to one account and one scope: a
      customer challenge is refused by the administrator verify endpoint and the reverse.
      Failures: `400 VALIDATION_FAILED` with `error.fields.code` = `Enter the code we sent
      you.` (missing, blank or not digits) or `That code is not right.` (wrong, attempts left);
      `400 CODE_EXPIRED` (`That code has expired or was used too many times. Sign in again.`)
      when the challenge is expired, unknown, used, ended by wrong codes or of the other scope;
      `429 RATE_LIMITED` with `Retry-After` for a resend that comes too soon.
    - **Unchanged:** a wrong email or password is still `401 INVALID_CREDENTIALS` with the same
      body, and an unverified address still `403 EMAIL_NOT_VERIFIED` (both before any code).
    - **Demo code (development and staging only).** When the server sets `AUTH_DEMO_CODE`
      (for example a four-digit value), that code is also accepted for any challenge; it is
      refused at startup in production. Clients must therefore accept a code of 4 to 6 digits in
      their input; `code_length` is the length of the emailed code.

    Dashboards and working a request (changed in 0.20.0)
    - **New:** `GET /v1/me/dashboard` (one role-aware summary for the signed-in account),
      `GET /v1/me/property-requests` and `GET /v1/me/property-requests/{id}` (the requests the
      account sent, in the customer's own terms), `GET /v1/agent/property-requests/{id}`,
      `PATCH /v1/agent/property-requests/{id}` (move the lead stage),
      `POST /v1/agent/property-requests/{id}/notes` (internal notes),
      `GET /v1/agent/organisations/{id}/members` (read-only team list),
      `GET /v1/admin/overview`, `GET /v1/admin/routing-exceptions` and
      `POST /v1/admin/routing-exceptions/{id}/resolve`.
    - **Lead stages.** Every property request now has a `stage`, one of `NEW_ENQUIRY` (New
      enquiry), `ASSIGNED` (Assigned), `CONTACTED` (Contacted), `VIEWING_REQUESTED` (Viewing
      requested), `VIEWING_SCHEDULED` (Viewing scheduled), `FOLLOW_UP_REQUIRED` (Follow-up
      required), `CONVERTED` (Converted), `CLOSED` (Closed). Requests stored before 0.20.0 are
      `NEW_ENQUIRY`. The allowed moves are listed under `PATCH /v1/agent/property-requests/{id}`
      and returned with every request as `allowed_stages`. `status` keeps its meaning.
    - **Breaking for clients of `GET /v1/agent/property-requests`.** The body was
      `{items}` with at most 100 items and no paging; it is now one page:
      `{items, page, page_size, total, total_pages, stage_counts}`, 20 items by default, at
      most 100 (`page`, `page_size`). New filters: `stage`, `type`, `listing_id`, `from`, `to`,
      `q`. `OrganisationPropertyRequest` gains `stage`, `stage_label` and `stage_changed_at`
      (additive); `request_type` now documents `STAY_REQUEST`, which was already returned.
    - **Changed meaning:** `GET /v1/inbox/summary` `property_requests.new` is now the number of
      visible requests at stage `NEW_ENQUIRY` (it was every visible request, capped at 100).
    - **Customers never see the working side.** The customer endpoints return a customer
      status (`RECEIVED`, `IN_PROGRESS`, `RESPONDED`, `VIEWING_SCHEDULED`, `CLOSED`) derived from
      the stage, never the stage itself, an internal note, who handles the request, or whether
      routing failed.

    Countries and places (changed in 0.15.0)
    - The platform is global: every ISO 3166-1 country can be used (`GET /v1/countries`). Public
      country lists show only the countries that have listings (`?has_listings=true`).
    - **Breaking for clients that read places.** A city, suburb or region is now a `Place`:
      `{code: string | null, label: string}`. `code` used to be always a string; it is **null**
      for a place written as free text (a city in a country without reference places). A
      listing's `suburb` used to be always an object and is now **null** when the listing has
      none. Affected: `Listing.city`, `Listing.suburb`, `Listing.region`,
      `DirectoryProfile.city`, `DirectoryProfile.region`.
    - **Breaking for clients that read the price facet.** `facets.price` is now **null** when no
      `country` or `currency` was chosen and the results span more than one currency (it used
      to be a USD range, silently), and `min_price` / `max_price` are then refused with `400` on
      `currency`. `facets.currencies` is new. See `GET /v1/listings`.

    Reference data
    - Every drop-down, filter and list value comes from `GET /v1/reference` (or
      `GET /v1/reference/{set}`), not from this document. Where a field below is described as
      "a code from the `X` reference set", the accepted values are the active rows of that set
      **at the time of the request**; the values listed in this file are the baseline shipped
      with the API and may be renamed, reordered, extended or retired by an administrator.

    Authentication
    - Sessions are opaque random tokens. The web app receives the token in the HttpOnly cookie
      `rp_session` (SameSite=Lax, Path=/, Secure outside development); mobile clients log in with
      `"token_delivery": "bearer"`, receive `access_token` in the body and send
      `Authorization: Bearer <token>`. When an `Authorization` header is present the cookie is ignored.
    - Sessions have a **scope**. `customer` sessions come from `POST /v1/auth/login` (and
      `verify-email`). `admin` sessions come only from `POST /v1/admin/auth/login`, only for
      accounts holding a platform role, only as a cookie, and last 12 hours at most with a
      30-minute inactivity timeout (both configurable on the server). Platform-role checks require
      an `admin` session; accounts holding a platform role cannot sign in at the customer login.
    - A customer session lasts at most 30 days and ends after 14 days without use. An invalid, expired or
      revoked token is treated as "not signed in" (routes that need a user answer `401 UNAUTHENTICATED`).
    - CORS: allowlisted origins may send credentials (`Access-Control-Allow-Credentials: true`,
      never with `*`). Browser clients must use `credentials: "include"`.
    - CSRF: a request authenticated by the **cookie** with a method other than GET/HEAD/OPTIONS must
      carry an allowlisted `Origin` header, otherwise it is rejected with `403 CSRF_ORIGIN`. Bearer
      requests are exempt.
    - Authorisation is decided on the server from the session's organisation memberships and
      platform roles. Nothing in a request body, query string or header can widen it.
    - Every `POST /v1/auth/*` route shares one per-IP rate limit (bursts of 20, refilled at 20 per
      minute), separate from the property-request limit. `GET /v1/auth/captcha` has its own
      per-IP bucket (bursts of 30, refilled at 30 per minute).
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
  - name: markets
  - name: reference
  - name: listings
  - name: directory
  - name: trust
    description: |
      The numbers behind the statement that every listing comes from a verified advertiser.
      The statement itself is enforced where listings are read (see "Verified advertisers" in
      the introduction); this endpoint only counts.
  - name: availability
    description: |
      The availability calendar of short-stay listings (category `short-stay`). Whoever lists
      the property marks nights unavailable (`BLOCKED` by their choice, or `BOOKED`); the
      public sees which nights are free.

      **It is not a booking engine.** There are no payments, no instant booking and no holds.
      A guest asks to stay with `POST /v1/property-requests` (`request_type: STAY_REQUEST`),
      which is an enquiry: it does not block the dates. The lister then marks the nights
      `BOOKED` themselves.

      Dates are calendar nights in the time zone of the listing's country (`YYYY-MM-DD`). A
      stay from `check_in` to `check_out` occupies the nights `check_in` .. `check_out - 1`.
      Every night is available unless marked otherwise, inside a booking window from today to
      365 days ahead.

      Not built: payments, instant booking, holds and their expiry, iCal import / export and
      calendar sync, seasonal pricing, per-night price overrides, and an endpoint for the
      audit trail.
  - name: property-requests
  - name: business-enquiries
  - name: appointments
    description: |
      Appointments for property **viewings** (tied to a listing) and **consultations** (with a
      listing's advertiser or a directory profile). An appointment is created by
      `POST /v1/property-requests` with a `preferred_slot_utc` (guests included) or by
      `POST /v1/appointments` (signed-in customers), and is not confirmed until the
      professional confirms it.

      Status flow: `REQUESTED` -> `CONFIRMED` -> `COMPLETED` | `NO_SHOW`; `REQUESTED` |
      `CONFIRMED` -> `RESCHEDULE_REQUESTED` -> `CONFIRMED` (the other party accepts the
      proposed time); any open status -> `CANCELLED`. One professional cannot have two
      `CONFIRMED` appointments that overlap (`409 SLOT_TAKEN`).

      A guest's appointment has no customer account, so the guest cannot act through the API:
      the professional confirms, proposes or cancels, and the guest is told by email.

      Not built: venue and showroom hourly bookings, short-stay bookings, availability
      calendars and slot configuration, ICS invites, calendar sync, reminders and push
      notifications.
  - name: auth
  - name: account
  - name: organisation-workspace
  - name: onboarding
    description: |
      Verification of professional accounts. Choosing a professional role at sign-up only
      records a request; the role's **onboarding application** (details and documents) has to
      be submitted and approved by a platform administrator before the role is ACTIVE.
      CONSUMER and TENANT have no onboarding.

      Status flow: `DRAFT` -> `SUBMITTED` -> `APPROVED` | `REJECTED` | `CHANGES_REQUESTED`;
      `CHANGES_REQUESTED` -> `SUBMITTED`. `REJECTED` is final for that application; saving
      details again starts a new one.
  - name: leases
    description: |
      Lease templates (content administrators) and lease drafting (whoever manages listings).
      A lease is rendered to a private PDF on every save; sending it for signing creates an
      agreement (see `agreements`), whose status the lease then follows.

      Lease status flow: `DRAFT` -> `SENT_FOR_SIGNING` -> `SIGNED` | `DECLINED` | `CANCELLED` |
      `EXPIRED`; `DRAFT` -> `CANCELLED`. Template status flow: `DRAFT` -> `APPROVED` ->
      `RETIRED`.

      Not built: deleting templates, importing templates from Word, per-country variable sets,
      clause libraries shared between templates, renewals and rent reviews.
  - name: agreements
    description: |
      Electronic signing of generated leases and uploaded PDFs.

      Agreement status flow: `DRAFT` -> `OUT_FOR_SIGNATURE` -> `COMPLETED` | `DECLINED` |
      `CANCELLED` | `EXPIRED`; `DRAFT` -> `CANCELLED`. Recipient status: `WAITING` -> `ACTIVE`
      (emailed) -> `SIGNED` | `APPROVED` | `DECLINED`; a CC is `CC`.

      Typed signatures are drawn in one of three script fonts (Great Vibes, Kaushan Script,
      Allura; OFL-1.1); a name with letters the font lacks is drawn in Go Italic instead.

      Not built: a PDF digital seal with a platform certificate; SMS or ID verification; delegation to another signer; in-person
      signing; bulk sending; templates of field layouts; form fields of the uploaded PDF itself
      (AcroForm) are not read.
  - name: admin
    description: |
      Platform administration. Every route needs an admin-scope session (POST /v1/admin/auth/login);
      each names the platform roles it accepts (SUPER_ADMIN always qualifies).
  - name: subscriptions
    description: |
      Paid plans for professionals and organisations, invoiced and paid outside the platform (no
      online payment, nothing charged automatically). New in 0.25.0.
  - name: reports
    description: Administrators' counts and CSV exports. New in 0.25.0.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      description: Always 200 while the process is running. Does not check dependencies.
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ok

  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Pings the database when one is configured. In development without `DATABASE_URL`
        the API runs on in-memory stores and reports `"store": "memory"`.
      responses:
        "200":
          description: Ready to serve traffic.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                required: [status, store]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ready
                  store:
                    type: string
                    enum: [memory, postgres]
        "503":
          description: The database is not reachable (`NOT_READY`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/countries:
    get:
      tags: [markets]
      operationId: listCountries
      summary: List countries
      description: |
        **The platform is global.** This returns every enabled country: the full ISO 3166-1
        list (249 countries and territories), each with its ISO 4217 currency and a default
        IANA time zone (the capital's). Any of them may be used by a lister, on a listing, a
        directory profile or an onboarding application. There is no short list of countries
        that are "switched on", and no country is "planned".

        **What the public is shown.** A country list on a public page (a search filter, a
        footer, a home page) should show only the countries that have listings:
        `?has_listings=true` returns the countries with at least one **published, unexpired**
        listing, ordered by `listing_count` (highest first), then name. Use the unfiltered list
        (with `?q=` for a searchable drop-down) only where a person chooses the country of
        something they are creating.

        A country's `code` is the `country` filter of listings and directories and the `market`
        filter of the reference data; its `currency_code` is the currency of price filters when
        that country is selected; its `timezone` is the zone appointment times are shown in.
        Countries with several time zones (the United States, Canada, Russia, Australia,
        Brazil, ...) have **one** default zone here; a per-city time zone is not built.

        Regions, cities and suburbs are reference data per country
        (`GET /v1/reference/cities?market=GB`) and **most countries have none yet**: there, a
        city is written as free text (see the `Place` schema).

        Order without `has_listings`: Zimbabwe, the United Kingdom, then every other country by
        name (accents ignored). `GET /v1/markets` is the older name of this endpoint and
        returns exactly the same response.

        Cacheable like the reference data: `Cache-Control: public, max-age=60,
        stale-while-revalidate=300`, a strong `ETag`, `304` on `If-None-Match`. Counts can
        therefore lag a newly published listing by up to a minute.
      parameters:
        - name: has_listings
          in: query
          description: "`true`: only countries with at least one published, unexpired listing, ordered by listing count (highest first), then name. `false` is accepted and filters nothing."
          schema: { type: boolean }
        - name: q
          in: query
          description: "Keeps countries whose name contains the text, or whose code equals it. Case and diacritics are ignored (`reunion` finds `Réunion`, `king` finds `United Kingdom`, `gb` finds `GB`). At most 100 characters."
          schema: { type: string, maxLength: 100 }
          example: king
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The countries.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              description: "`public, max-age=60, stale-while-revalidate=300`."
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Market"
              example:
                data:
                  - id: 0195c0de-0000-7000-8000-00000000a001
                    code: ZW
                    name: Zimbabwe
                    currency_code: USD
                    timezone: Africa/Harare
                    status: ACTIVE
                    listing_count: 20
                    has_listings: true
                  - id: 0195c0de-0000-7000-8000-00000000a005
                    code: GB
                    name: United Kingdom
                    currency_code: GBP
                    timezone: Europe/London
                    status: ACTIVE
                    listing_count: 3
                    has_listings: true
                  - id: 0195c0de-0000-7000-8000-0000c0de4d55
                    code: MU
                    name: Mauritius
                    currency_code: MUR
                    timezone: Indian/Mauritius
                    status: ACTIVE
                    listing_count: 1
                    has_listings: true
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: "`VALIDATION_FAILED`. `error.fields` is keyed by the parameter: `has_listings` (not `true` or `false`) or `q` (longer than 100 characters)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/markets:
    get:
      tags: [markets]
      operationId: listMarkets
      summary: List countries (older name of GET /v1/countries)
      description: |
        **Kept for compatibility.** Exactly the same parameters, response, caching and errors
        as `GET /v1/countries`; new clients should call that.

        **Changed in 0.15.0 — read this if you already call it.** It used to return five
        markets, two `ACTIVE` and three `PLANNED`. It now returns **every country (249)**, all
        with `status: ACTIVE`, and each item gained `listing_count` and `has_listings`. A
        client that printed this list as "where we operate" must switch to
        `?has_listings=true`. The response is now cacheable (it was not).
      parameters:
        - name: has_listings
          in: query
          description: See `GET /v1/countries`.
          schema: { type: boolean }
        - name: q
          in: query
          description: See `GET /v1/countries`.
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The countries, as `GET /v1/countries`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Market"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: "`VALIDATION_FAILED` on `has_listings` or `q`, as `GET /v1/countries`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/reference:
    get:
      tags: [reference]
      operationId: getReferenceData
      summary: All reference data (every drop-down, filter and list)
      description: |
        Returns the **active** rows of every reference set in one response. These are the
        values behind every drop-down, filter and list in the clients; nothing of the kind
        should be hard-coded.

        The rows live in the database and can be changed by a market administrator without a
        release. The API validates input against the same rows, so what this endpoint offers
        and what the API accepts cannot disagree: a row that is deactivated disappears from
        here and is refused (`400 VALIDATION_FAILED`) at the same moment.

        | Set | Used for | Extra attributes |
        | --- | --- | --- |
        | `deal_types` | listing deal (`sale`, `rent`) | — |
        | `property_categories` | `residential`, `commercial`, `land` | — |
        | `property_types` | house, apartment, office, stand, … | `parent_code` = its category |
        | `request_types` | `request_type` of a property request | — |
        | `contact_methods` | `preferred_contact_method` | — |
        | `account_roles` | `roles` at registration | `group`, `requires_verification` |
        | `directory_kinds` | directory sections and `recipient.kind` | `singular_label`, `description` |
        | `service_trades` | service-provider trades | — |
        | `regions` | regions (provinces, states, nations) of a market; Zimbabwe has its ten provinces, the United Kingdom its four nations, most other countries none yet | `market_code` |
        | `cities` | cities of a market | `market_code`, `parent_code` = its region |
        | `suburbs` | suburbs of a city | `market_code`, `parent_code` = its city |
        | `listing_features` | listing features and amenities | — |
        | `onboarding_documents` | document types for professional onboarding (`description` is set) | — |
        | `organisation_kinds` | organisation kinds and their labels (AGENCY "Real Estate Agency", LAW_FIRM "Law Firm", ...) | — |
        | `price_periods` | what a listing's price is charged per: `month` "per month", `night` "per night" (a listing's `price_period`; null there means a sale price) | — |

        `property_categories` has `residential`, `commercial`, `land` and `short-stay` ("Short
        stays", with a `description`); the short-stay `property_types` are `holiday-home`,
        `serviced-apartment`, `guest-house`, `private-room` and `lodge`. `regions`, `cities` and
        `suburbs` exist for Zimbabwe (`market_code` `ZW`) and the United Kingdom (`GB`: regions
        `england`, `scotland`, `wales`, `northern-ireland`; ten cities; a few areas of London and
        one of Manchester).

        Countries are not a set: use `GET /v1/countries`. Platform administrator roles are never in
        `account_roles` and can never be chosen at registration, whatever this endpoint returns.

        **Order.** Each set is ordered by `sort_order`, then `label` (account roles by their
        group's `sort_order` first). Render in the order given.

        **Caching.** The response is public and identical for every caller (it never depends on
        a session). It carries `Cache-Control: public, max-age=60, stale-while-revalidate=300`
        and a strong `ETag`; send it back in `If-None-Match` to get `304 Not Modified`.
      parameters:
        - $ref: "#/components/parameters/ReferenceMarket"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Every set, keyed by set code. Every set is always present (possibly empty).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceData"
              example:
                market: null
                sets:
                  deal_types:
                    - { code: sale, label: For sale, singular_label: null, description: null, sort_order: 10, market_code: null, parent_code: null, group: null, requires_verification: null }
                    - { code: rent, label: To rent, singular_label: null, description: null, sort_order: 20, market_code: null, parent_code: null, group: null, requires_verification: null }
                  property_categories: []
                  property_types:
                    - { code: house, label: House, singular_label: null, description: null, sort_order: 10, market_code: null, parent_code: residential, group: null, requires_verification: null }
                  request_types: []
                  contact_methods: []
                  account_roles:
                    - code: PRIVATE_SELLER
                      label: Property Seller (Vendor)
                      singular_label: null
                      description: null
                      sort_order: 30
                      market_code: null
                      parent_code: null
                      group: { code: listing, label: Listing or managing property, sort_order: 2 }
                      requires_verification: true
                  directory_kinds:
                    - { code: agencies, label: Estate agencies, singular_label: Estate agency, description: Registered agencies selling and letting property across Zimbabwe., sort_order: 10, market_code: null, parent_code: null, group: null, requires_verification: null }
                  service_trades: []
                  regions:
                    - { code: matabeleland-north, label: Matabeleland North, singular_label: null, description: null, sort_order: 80, market_code: ZW, parent_code: null, group: null, requires_verification: null }
                  cities:
                    - { code: harare, label: Harare, singular_label: null, description: null, sort_order: 10, market_code: ZW, parent_code: harare, group: null, requires_verification: null }
                  suburbs:
                    - { code: borrowdale, label: Borrowdale, singular_label: null, description: null, sort_order: 10, market_code: ZW, parent_code: harare, group: null, requires_verification: null }
                  listing_features: []
                  onboarding_documents: []
                  organisation_kinds: []
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: "`VALIDATION_FAILED` with field `market`: the market code is not a known market."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/reference/{set}:
    get:
      tags: [reference]
      operationId: getReferenceSet
      summary: One reference set
      description: |
        The active rows of one set, in display order. Same rows, order, caching and validation
        rules as `GET /v1/reference`.
      parameters:
        - name: set
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ReferenceSetCode"
        - $ref: "#/components/parameters/ReferenceMarket"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The rows of the set (possibly an empty array).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceSet"
              example:
                set: contact_methods
                market: null
                items:
                  - { code: EMAIL, label: Email, singular_label: null, description: null, sort_order: 10, market_code: null, parent_code: null, group: null, requires_verification: null }
                  - { code: PHONE, label: Phone call, singular_label: null, description: null, sort_order: 20, market_code: null, parent_code: null, group: null, requires_verification: null }
                  - { code: WHATSAPP, label: WhatsApp, singular_label: null, description: null, sort_order: 30, market_code: null, parent_code: null, group: null, requires_verification: null }
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: "`VALIDATION_FAILED` with field `market`: the market code is not a known market."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No set has this code (`REFERENCE_SET_NOT_FOUND`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/listings:
    get:
      tags: [listings]
      operationId: searchListings
      summary: Search listings
      description: |
        Public search over listings. **Only listings that are PUBLISHED, not yet expired and
        advertised by a verified advertiser are ever returned** (status, `expires_at > now` and
        the advertiser's verification are enforced in the query, and every search hit is
        re-read from the database before it is returned, so a search index that is behind
        cannot bring back a listing whose advertiser is no longer verified).

        Every filter is optional and filters combine with AND. Code filters take codes from the
        reference data; a code that is unknown or inactive is `400 VALIDATION_FAILED` on that
        parameter.

        **Location.** Listings can be narrowed at four levels, which form one hierarchy in the
        reference data: `country` (any country: `GET /v1/countries`) > `region` (the `regions` set,
        for example Zimbabwe's provinces) > `city` (`cities`; `parent_code` is its region) >
        `suburb` (`suburbs`; `parent_code` is its city). A listing stores its market, city and
        suburb; its region is the region of its city. The levels combine, and they must agree:
        a suburb must belong to the city, a city to the region, a region to the country (also
        when a level in between is left out). A mismatch is `400 VALIDATION_FAILED` on the
        **narrower** parameter (`region=bulawayo&city=harare` -> field `city`).

        **Any country, and free-text places.** `country` accepts the code of any enabled
        country. One that has no listings is a valid search: `200`, no items, and a price facet
        in that country's currency. An unknown code is `400` on `country`. Most countries have
        no regions, cities or suburbs in the reference data yet; a listing there carries its
        city (and optionally its region) as **free text**: `city: {code: null, label: "Grand
        Baie"}`. Free-text places are matched by `q` and returned on the item, but they are
        **not filterable** (`city=`, `region=` and `suburb=` take reference codes only) and do
        not appear in the `city`, `suburb` or `region` facets or in suggestions. The hierarchy
        check applies only to codes.

        **Price and currency: one currency per search (changed in 0.15.0).** Prices are never
        converted, so a price range only means something within one currency. The currency
        of a search is, in this order: `currency` when given; the currency of the selected
        `country`; otherwise the **only** currency the results are priced in.

        When no `currency` or `country` is given and the results span **more than one**
        currency there is no currency to use:
        - `facets.price` is `null`, and `facets.currencies` lists the currencies of the
          results (`[{code, count}]`, most listings first) so the client can ask the user to
          pick one;
        - `min_price` / `max_price` are refused: `400 VALIDATION_FAILED`, field `currency`,
          message "Choose a currency or a country to filter by price.".

        When the results share one currency, or `currency` or `country` is given, the price
        filter and facet work as before. **This replaces the old behaviour**, where a search
        without a country silently used `USD`: a price filter then dropped every listing
        priced in another currency without saying so. `facets.currencies` is always present.
        When nothing matches, `facets.price` is `{currency: "USD", min: null, max: null}` unless
        a currency or country was chosen.

        **Sorting.** `newest` (default without `q`), `relevance` (default with `q`; title matches
        rank above suburb/city, then property type, then the rest; without `q` featured listings
        come first), `price_asc`, `price_desc`, `oldest`, `area_desc` (largest floor area first;
        listings without a floor area last). Ties are broken by newest, then id.

        **Paging.** `page` starts at 1; `page_size` is 1–48, default 12. A page past the end is
        `200` with an empty `items` array.

        **Facets.** Each facet counts the listings that match every *other* filter (and `q`),
        so selecting a value does not hide its alternatives (`bedrooms` leaves out both
        `bedrooms_min` and `bedrooms_max`). `features` counts within the full result. `country`
        and `region` are facets too, and each `suburb` value names its `city`. Only values with at least one listing appear:
        the `country` facet lists the countries that have results, never all 249.

        **Sitemaps** should use `GET /v1/sitemap`, not this endpoint.

        **Search engine.** The server answers this endpoint from Elasticsearch when it is
        configured and from the database otherwise; if Elasticsearch fails, the same request is
        answered from the database. The request and response are identical either way. What can
        differ is which listings match a free-text `q` and in what order under `relevance`:
        Elasticsearch tolerates typos (`borowdale` finds Borrowdale) and ranks by its own score,
        the database matches substrings exactly. Filters, facets, paging and the other sort
        orders mean the same thing in both.

        Public, the same for every caller, and cacheable (`Cache-Control`, `ETag`, `304`).
      parameters:
        - name: q
          in: query
          description: |
            Free text, at most 100 characters. Every word must match the title, suburb, city,
            property type, summary, description or reference, or the label or description of the
            listing's category (case-insensitive). The category description is what makes
            `q=airbnb` find the short stays: no category, type or code is named after that brand.
          schema: { type: string, maxLength: 100 }
          example: borrowdale house
        - name: deal
          in: query
          description: A `deal_types` code.
          schema: { type: string }
          example: sale
        - name: category
          in: query
          description: |
            A `property_categories` code: `residential`, `commercial`, `land` or `short-stay`
            (holiday homes, serviced apartments, guest houses and rooms let by the night). A
            short stay is always deal `rent` with `price_period` `night`.
          schema: { type: string }
          example: residential
        - name: check_in
          in: query
          description: |
            First night of a stay (`YYYY-MM-DD`). **With `check_out`** (both or neither). The
            results are then limited to short stays that are available for **every** night of
            the stay (`check_in` .. `check_out - 1`) and whose `min_nights` the stay satisfies;
            combine with `guests_min` for the number of guests. They imply
            `category=short-stay`; any other `category` is `400` on `category`.

            The stay must be 1 to 90 nights, must not start in the past and must end inside
            the booking window (365 days from today). "Today" is each listing's own (its
            country's time zone), so a stay starting today is no longer offered in countries
            where that day has already ended.

            Which listings are not free is read from the database on every search and passed
            to the search engine as an exclusion, so the answer is the same whichever engine
            answers and a calendar change needs no reindex. **Every facet count is computed
            with the exclusion applied**; as always, the `category` facet leaves out its own
            filter, so it still lists the other categories.
          schema: { type: string, format: date }
          example: "2026-12-24"
        - name: check_out
          in: query
          description: "The day of leaving (`YYYY-MM-DD`): after `check_in`, at most 90 nights later. See `check_in`."
          schema: { type: string, format: date }
          example: "2026-12-27"
        - name: guests_min
          in: query
          description: Short stays that sleep at least this many guests (`max_guests` >= n). Listings without `max_guests` (everything that is not a short stay) never match.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: property_type
          in: query
          description: A `property_types` code.
          schema: { type: string }
          example: house
        - name: city
          in: query
          description: A `cities` code.
          schema: { type: string }
          example: harare
        - name: suburb
          in: query
          description: A `suburbs` code. Must belong to `city`, `region` and `country` when those are given.
          schema: { type: string }
          example: borrowdale
        - name: country
          in: query
          description: "The code of any enabled country (`GET /v1/countries`; ISO 3166-1 alpha-2), in any case. Also sets the `currency` of the search unless `currency` is given. A country without listings is valid: `200`, no items, price facet in that country's currency. Unknown code: `400` on `country`."
          schema: { type: string, pattern: "^[A-Za-z]{2}$" }
          example: ZW
        - name: market
          in: query
          description: Alias of `country`. If both are sent they must be equal (`400` on `market` otherwise).
          schema: { type: string, pattern: "^[A-Za-z]{2}$" }
        - name: region
          in: query
          description: A `regions` code (`GET /v1/reference/regions`). Matches listings whose city is in that region. Must belong to `country` when given.
          schema: { type: string }
          example: matabeleland-north
        - name: bedrooms_max
          in: query
          description: At most this many bedrooms (0–50). Must not be lower than `bedrooms_min`. Listings without a bedroom count never match.
          schema: { type: integer, minimum: 0, maximum: 50 }
        - name: bathrooms_max
          in: query
          description: At most this many bathrooms (0–50). Must not be lower than `bathrooms_min`.
          schema: { type: integer, minimum: 0, maximum: 50 }
        - name: floor_area_min
          in: query
          description: Floor area of at least this many square metres. Listings without a floor area never match a floor-area filter.
          schema: { type: integer, minimum: 0, maximum: 100000000 }
        - name: floor_area_max
          in: query
          description: Floor area of at most this many square metres. Must not be lower than `floor_area_min`.
          schema: { type: integer, minimum: 0, maximum: 100000000 }
        - name: land_area_min
          in: query
          description: Land area of at least this many square metres. Listings without a land area never match a land-area filter.
          schema: { type: integer, minimum: 0, maximum: 100000000 }
        - name: land_area_max
          in: query
          description: Land area of at most this many square metres. Must not be lower than `land_area_min`.
          schema: { type: integer, minimum: 0, maximum: 100000000 }
        - name: listed_within_days
          in: query
          description: Only listings published in the last N days (`published_at` not older than N x 24 hours).
          schema: { type: integer, minimum: 1, maximum: 365 }
        - name: advertiser_type
          in: query
          description: "`agency`: advertised by an organisation (`advertiser.type` `agency`). `private`: advertised by its owner (`advertiser.type` `private_seller`)."
          schema: { type: string, enum: [agency, private] }
        - name: reference
          in: query
          description: An exact listing reference, compared without regard to case. Letters, digits and hyphens, at most 40.
          schema: { type: string, pattern: "^[A-Za-z0-9-]{1,40}$" }
          example: RP-ZW-10001
        - name: has_photos
          in: query
          description: "`true`: only listings with at least one photo. `false` is accepted and filters nothing."
          schema: { type: boolean }
        - name: min_price
          in: query
          description: "Lowest price, as a decimal amount. With a price filter only listings priced in the search's one currency match. `400` on `currency` when neither `currency` nor `country` is given and the results span more than one currency."
          schema: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
          example: "100000"
        - name: max_price
          in: query
          description: Highest price, as a decimal amount. Must not be lower than `min_price`.
          schema: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
          example: "300000"
        - name: currency
          in: query
          description: "ISO 4217 code for `min_price` / `max_price` and for the price facet. Without it: the currency of the selected `country`, else the only currency the results are priced in. There is no default any more (it used to be `USD`): with results in several currencies and neither `currency` nor `country`, `facets.price` is null and a price filter is `400` on this parameter. Prices are never converted."
          schema: { type: string, pattern: "^[A-Za-z]{3}$" }
        - name: bedrooms_min
          in: query
          description: At least this many bedrooms (0–50). Listings without a bedroom count never match.
          schema: { type: integer, minimum: 0, maximum: 50 }
        - name: bathrooms_min
          in: query
          description: At least this many bathrooms (0–50).
          schema: { type: integer, minimum: 0, maximum: 50 }
        - name: features
          in: query
          description: "`listing_features` codes; the listing must have ALL of them. Repeat the parameter (`features=a&features=b`) or separate with commas. At most 20."
          schema: { type: array, items: { type: string }, maxItems: 20 }
          style: form
          explode: true
          example: [borehole, solar-backup]
        - name: featured
          in: query
          description: "`true` for featured listings only, `false` for the rest."
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, oldest, price_asc, price_desc, area_desc, relevance] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: One page of listings with facets.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CatalogueCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingPage"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: |
            `VALIDATION_FAILED`. `error.fields` is keyed by the parameter: `q`, `deal`,
            `category`, `property_type`, `city`, `suburb`, `min_price`, `max_price`, `currency`,
            `bedrooms_min`, `bathrooms_min`, `features`, `featured`, `sort`, `page`, `page_size`,
            `country`, `market`, `region`, `bedrooms_max`, `bathrooms_max`, `floor_area_min`,
            `floor_area_max`, `land_area_min`, `land_area_max`, `listed_within_days`,
            `advertiser_type`, `reference`, `has_photos`, `guests_min`, `check_in`, `check_out`. A maximum lower than its minimum is
            reported on the `_max` parameter; a location that does not belong to the wider one
            on the narrower parameter (`suburb`, `city` or `region`). `currency` is also where a
            price filter without a single currency is reported: `min_price` or `max_price`
            with neither `currency` nor `country`, when the results span more than one currency
            ("Choose a currency or a country to filter by price.").
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/listings/suggest:
    get:
      tags: [listings]
      operationId: suggestListings
      summary: Search suggestions
      description: |
        Up to 8 suggestions for a search box: suburbs first, then cities, then regions, then
        countries, then listing titles; within each, names that start with the term come first.
        Only suburbs, cities, regions and countries that have at least one public listing, and
        only public listings, are suggested: a `country` suggestion is never one of the 249
        countries without listings. Free-text cities and regions are not suggested (a
        suggestion's `value` is a filter code, and they have none). A term shorter than 2 characters returns an empty
        list.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          example: bor
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The suggestions (possibly empty).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CatalogueCacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                additionalProperties: false
                properties:
                  suggestions:
                    type: array
                    maxItems: 8
                    items:
                      $ref: "#/components/schemas/ListingSuggestion"
              example:
                suggestions:
                  - { type: suburb, label: "Borrowdale, Harare", value: borrowdale }
                  - { type: listing, label: Four-bedroom family home with garden, value: four-bedroom-family-home-borrowdale }
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: "`VALIDATION_FAILED` with field `q` (longer than 100 characters)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/listings/{slug}:
    get:
      tags: [listings]
      operationId: getListing
      summary: One listing
      description: |
        The listing, if it is PUBLISHED, not expired and advertised by a verified advertiser.

        - `410 LISTING_UNAVAILABLE`: the listing was public once and no longer is (expired, sold,
          let, paused or closed). The page can say "This listing is no longer available".
        - `404 LISTING_NOT_FOUND`: no such slug, **or** a listing that has never been public
          (draft, pending review), **or** (new in 0.17.0) a listing whose advertiser is not
          verified right now, whatever its status. Drafts and listings of unverified advertisers
          are deliberately indistinguishable from unknown slugs: `410` would reveal that an
          advertiser lost its verification.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 200 }
          example: four-bedroom-family-home-borrowdale
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The listing.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CatalogueCacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [listing]
                additionalProperties: false
                properties:
                  listing:
                    $ref: "#/components/schemas/Listing"
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          description: "`LISTING_NOT_FOUND`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: "`LISTING_UNAVAILABLE`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/listings/{slug}/availability:
    get:
      tags: [availability]
      operationId: getListingAvailability
      summary: Availability calendar of a short stay (public)
      description: |
        Which nights of a short-stay listing are available. **Available or unavailable per
        night, and nothing else**: why a night is unavailable (blocked by the owner, or
        booked), the lister's notes and who changed the calendar are private and are never in
        this response.

        - Dates are calendar **nights** in the time zone of the listing's country
          (`timezone`), written `YYYY-MM-DD`, with no time of day. A stay from `check_in` to
          `check_out` occupies the nights `check_in` .. `check_out - 1`: the day of leaving is
          not a night of the stay.
        - Every night is available unless the lister marked it otherwise, inside a **booking
          window** from today (in that time zone) to 365 days ahead. Nights in the past or
          beyond the window are never available.
        - **This is not a booking.** Nothing can be reserved, held or paid for through the
          API. To ask to stay, send `POST /v1/property-requests` with `request_type:
          STAY_REQUEST`; the lister answers and marks the nights themselves.

        Public, the same for every caller (it never reads the session) and cacheable like the
        listing (`Cache-Control: public, max-age=30, stale-while-revalidate=120`, an `ETag`),
        so a change by the lister can take up to 30 seconds to show.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          description: "First night to return (`YYYY-MM-DD`). Default: today in the listing's time zone."
          schema: { type: string, format: date }
        - name: to
          in: query
          description: "Last night to return, inclusive. Default: `from` + 90 days. The span `from`..`to` is at most 366 nights."
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The calendar.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicAvailability" }
              example:
                listing: { slug: safari-lodge-victoria-falls }
                timezone: Africa/Harare
                min_nights: 2
                max_guests: 8
                from: "2026-12-23"
                to: "2026-12-25"
                days:
                  - { date: "2026-12-23", available: true }
                  - { date: "2026-12-24", available: false }
                  - { date: "2026-12-25", available: false }
                availability_updated_at: "2026-11-14T08:00:00Z"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: "`VALIDATION_FAILED` on `from` or `to`: not a `YYYY-MM-DD` date, `to` before `from`, or a span of more than 366 nights."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: "`LISTING_NOT_FOUND`: no such slug, or a listing that has never been public (as `GET /v1/listings/{slug}`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`NOT_SHORT_STAY`: the listing is public but is not in the `short-stay` category, so it has no calendar."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "410":
          description: "`LISTING_UNAVAILABLE`: the listing was public once and no longer is."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/listings:
    get:
      tags: [availability]
      operationId: listMyListings
      summary: The listings the caller may manage
      description: |
        The lister's list of listings. Since 0.22.0 listings are created with
        `POST /v1/me/listings` and managed under `/v1/me/listings/{id}`; this list is the
        same as before (an agent sees every listing of their organisation here; which of them
        they may change is `can_edit` of `GET /v1/me/listings/{id}`).

        Returns the listings, **whatever their status**, that the caller may manage (newest
        first):
        - every listing of an organisation in which the caller is `OWNER`, `MANAGER` or
          `AGENT`, when the organisation's kind manages listings (`AGENCY`, `LAW_FIRM`,
          `PROPERTY_MANAGER`, `DEVELOPER`, `HOST`) — all of the organisation's listings, not
          only those assigned to the caller;
        - the caller's own listings as an **approved** (ACTIVE) Landlord or Property Seller.

        `STAFF`, members of a `SERVICE_PROVIDER` and people without either get `403`.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: category
          in: query
          description: "A `property_categories` code, for example `short-stay`."
          schema: { type: string }
        - name: status
          in: query
          description: "A listing status as stored: `DRAFT`, `PENDING_REVIEW`, `CHANGES_REQUESTED`, `REJECTED`, `PUBLISHED`, `EXPIRED`, `ARCHIVED`, `PAUSED`, `SOLD`, `LET`, `CLOSED`."
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
      responses:
        "200":
          description: One page of the caller's listings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyListingPage" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN`: the caller manages no listings at all."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

    post:
      tags: [listings]
      operationId: createMyListing
      summary: Create a listing (a DRAFT)
      description: |
        New in 0.22.0. Creates a `DRAFT` that only its managers see. The body may carry any
        field of `ListingContentPatch` (all optional) plus who the listing is for:
        `organisation_id` (required when the caller manages listings for several
        organisations, or is also a direct owner) or `as_direct_owner: true`. An `AGENT` becomes
        the listing's agent; an `OWNER` or `MANAGER` creates a listing without one. `country`
        defaults to the market of the caller's membership; the price currency defaults to the
        country's. The `slug` and `reference` (`RP-<country>-<6 digits>`) are generated; the
        slug follows the title until the listing is first published, then never changes.
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ListingContentPatch"
                - type: object
                  properties:
                    organisation_id: { type: [string, "null"], format: uuid }
                    as_direct_owner: { type: boolean }
            example: { title: "Three-bedroom house in Borrowdale", country: ZW }
      responses:
        "201":
          description: The new draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedListingEnvelope" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN`: the caller manages no listings, or not for that organisation."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/me/listings/{id}:
    parameters:
      - $ref: "#/components/parameters/ManagedListingId"
    get:
      tags: [listings]
      operationId: getMyListing
      summary: One listing as its managers see it
      description: |
        New in 0.22.0. The full editable record: status, the reviewer's reason, the pending
        changes of a published listing, the working copy of the content, every photo (approved
        or waiting), `completeness` (what is missing before it can be submitted), `can_edit`,
        the `actions` the caller may take now and the timeline. `404 LISTING_NOT_FOUND` for a
        listing that does not exist or belongs to another organisation (the same answer);
        `403 FORBIDDEN` for a member of the listing's organisation who does not manage
        listings (`STAFF`). An agent may read a colleague's listing (`can_edit: false`).
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedListingEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ListingNotFound"
    patch:
      tags: [listings]
      operationId: updateMyListing
      summary: Change some fields of a listing
      description: |
        New in 0.22.0. A partial update: only the keys sent change; `null` clears a field. Every
        save is validated against the reference data and must be consistent (missing fields are
        not errors here; `completeness` lists them). Unknown keys are `400`.

        To keep a listing consistent while it is edited one field at a time, a field the patch
        does not set itself follows: choosing `category: short-stay` makes it `deal: rent`,
        `price_period: night`; leaving a short stay clears `max_guests` and `min_nights` (and a
        nightly period becomes monthly for a rental); choosing `deal: sale` clears
        `price_period`, `rent` sets `month`; a new `country` clears the city, suburb and
        free-text places (and sets the country's currency while no amount is entered); a `city`
        code clears free text and a suburb of another city; a `city_name` clears the codes.
        Rules: `country` is required; where the country has reference cities
        (`GET /v1/reference/cities?market=..`) the city is a `city` code, elsewhere free text
        `city_name` (with an optional `region_name`; plain text, at most 80 characters); a
        `suburb` needs a `city` of which it is a suburb.

        `DRAFT`, `CHANGES_REQUESTED`, `ARCHIVED` and `EXPIRED` listings change at once. A
        `PUBLISHED` listing's changes go into `pending_changes` (status `EDITING`) and the
        public keeps the approved version; its `country` cannot change. `409 LISTING_IN_REVIEW`
        while the listing or its changes wait for review; `409 LISTING_STATE_CONFLICT` for a
        `REJECTED` (or paused, sold, let, closed) listing; `409 LISTING_CHANGED` when someone
        else changed it at the same moment (reload and retry).
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingContentPatch" }
            example: { deal: sale, category: residential, property_type: house, price: { amount: "250000", currency: USD }, city: harare, suburb: borrowdale, bedrooms: 3 }
      responses:
        "200":
          description: The listing after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedListingEnvelope" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN`: the caller may see the listing but not change it."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          $ref: "#/components/responses/ListingNotFound"
        "409":
          $ref: "#/components/responses/ListingStateConflict"
    delete:
      tags: [listings]
      operationId: deleteMyListing
      summary: Delete a listing that was never published
      description: |
        New in 0.22.0. Removes the listing, its photos and their stored files. A listing that
        has been published is `409 LISTING_STATE_CONFLICT`: archive it instead.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ListingNotFound"
        "409":
          $ref: "#/components/responses/ListingStateConflict"

  /v1/me/listings/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/ManagedListingId"
    post:
      tags: [listings]
      operationId: submitMyListing
      summary: Send a listing, or the changes of a published one, for review
      description: |
        New in 0.22.0. No body. `DRAFT` or `CHANGES_REQUESTED` -> `PENDING_REVIEW`; for a
        `PUBLISHED` listing, its `pending_changes` (`EDITING` or `CHANGES_REQUESTED`) ->
        `PENDING_REVIEW`. Requires a complete listing: title (at least 5 characters),
        description (at least 30), deal, category, property type, a price above 0 with its
        currency, the price period of a rental, the country and the city, `max_guests` for a
        short stay, at least **one** photo and a description (`alt`) for every photo; otherwise
        `422 LISTING_INCOMPLETE` with one message per missing field in `error.fields`.
        `409 LISTING_STATE_CONFLICT` when there is nothing to submit (a published listing
        without changes) or the status does not allow it; `409 LISTING_IN_REVIEW` when it
        already waits.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The listing, waiting for review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedListingEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ListingNotFound"
        "409":
          $ref: "#/components/responses/ListingStateConflict"
        "422":
          description: "`LISTING_INCOMPLETE`: `error.fields` names each missing field (`title`, `description`, `deal`, `category`, `property_type`, `price`, `price_period`, `country`, `city`, `city_name`, `max_guests`, `photos`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/me/listings/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/ManagedListingId"
    post:
      tags: [listings]
      operationId: archiveMyListing
      summary: Withdraw a listing
      description: |
        New in 0.22.0. No body. From `DRAFT`, `PENDING_REVIEW` (withdraws the submission),
        `CHANGES_REQUESTED`, `PUBLISHED`, `EXPIRED` or `PAUSED` to `ARCHIVED`. A public listing
        leaves the catalogue at once (`410` by slug); its pending changes are kept on it for a
        relist. `409 LISTING_STATE_CONFLICT` otherwise (a `REJECTED` listing cannot be archived).
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The archived listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedListingEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ListingNotFound"
        "409":
          $ref: "#/components/responses/ListingStateConflict"

  /v1/me/listings/{id}/relist:
    parameters:
      - $ref: "#/components/parameters/ManagedListingId"
    post:
      tags: [listings]
      operationId: relistMyListing
      summary: Bring back an archived or expired listing (renew)
      description: |
        New in 0.22.0. No body. `ARCHIVED` or `EXPIRED` -> `PENDING_REVIEW` when the listing was
        published before (it must be complete, else `422 LISTING_INCOMPLETE`; approval starts a
        new 90-day period), or `DRAFT` when it never was. `409 LISTING_STATE_CONFLICT` for any
        other status.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The relisted listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedListingEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ListingNotFound"
        "409":
          $ref: "#/components/responses/ListingStateConflict"
        "422":
          description: "`LISTING_INCOMPLETE`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/me/listings/{id}/photos:
    parameters:
      - $ref: "#/components/parameters/ManagedListingId"
    post:
      tags: [listings]
      operationId: addMyListingPhoto
      summary: Upload one photo
      description: |
        New in 0.22.0. `multipart/form-data` with exactly one part `file`. **At most 20 photos per
        listing**: the 21st is `409 PHOTO_LIMIT_REACHED`, "A property can have up to 20
        photos." (checked before and, atomically, while storing).

        - JPEG, PNG or WebP, decided by the bytes (never the file name or the part's type);
          SVG, GIF, animated PNG and anything that does not decode are `415
          UNSUPPORTED_FILE_TYPE`.
        - At most 15 MB (`413 FILE_TOO_LARGE`).
        - At least 800 pixels on the longer side, at most 10000x10000 and 40 megapixels (`400
          VALIDATION_FAILED`, `error.fields.file`).
        - The photo is turned upright by its EXIF orientation, transparency is flattened onto
          white, and it is stored as three new JPEG files (quality 82): `large` (longer side at
          most 2048), `medium` (at most 1280 wide) and `small` (at most 640 wide), never
          enlarged. Nothing of the upload's metadata (EXIF, GPS, colour profile) is kept.
        - It is added at the end, `PENDING_REVIEW` until the listing (or its changes) is
          approved, with an empty `alt` to fill in. On a `PUBLISHED` listing it is part of the
          pending changes. Stored in the private object storage; served only by
          `GET /v1/listing-photos/{photoId}/{size}`.

        Shares the upload rate limit (20 per minute per IP).
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: The listing with its new photo last.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedListingEnvelope" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ListingNotFound"
        "409":
          description: "`PHOTO_LIMIT_REACHED` (\"A property can have up to 20 photos.\"), `LISTING_IN_REVIEW`, `LISTING_STATE_CONFLICT` or `LISTING_CHANGED`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "413":
          description: "`FILE_TOO_LARGE`: more than 15 MB."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415":
          description: "`UNSUPPORTED_FILE_TYPE`: not a JPEG, PNG or WebP image that decodes."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/me/listings/{id}/photos/order:
    parameters:
      - $ref: "#/components/parameters/ManagedListingId"
    put:
      tags: [listings]
      operationId: orderMyListingPhotos
      summary: Put the photos in order
      description: |
        New in 0.22.0. `photo_ids` lists every photo of the listing exactly once, first photo
        first (otherwise `400`, `error.fields.photo_ids`). The order applies at once, also on a
        published listing.
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photo_ids]
              additionalProperties: false
              properties:
                photo_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: The listing with its photos in the new order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedListingEnvelope" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ListingNotFound"
        "409":
          $ref: "#/components/responses/ListingStateConflict"

  /v1/me/listings/{id}/photos/{photoId}:
    parameters:
      - $ref: "#/components/parameters/ManagedListingId"
      - name: photoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [listings]
      operationId: updateMyListingPhoto
      summary: Change a photo's description (alt text)
      description: |
        New in 0.22.0. `{"alt": "..."}`: plain text, one line, at most 250 characters (may be
        empty; a submission needs it). The description of a public photo of a published
        listing changes with its pending changes. `404 PHOTO_NOT_FOUND`.
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alt]
              additionalProperties: false
              properties:
                alt: { type: string, maxLength: 250 }
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedListingEnvelope" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`LISTING_NOT_FOUND` or `PHOTO_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          $ref: "#/components/responses/ListingStateConflict"
    delete:
      tags: [listings]
      operationId: deleteMyListingPhoto
      summary: Delete a photo
      description: |
        New in 0.22.0. Removes the photo and its stored files at once (also a public photo of a
        published listing). The last public photo of a published listing cannot be deleted:
        `409 PHOTO_REQUIRED`.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The listing without the photo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedListingEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`LISTING_NOT_FOUND` or `PHOTO_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`PHOTO_REQUIRED`, `LISTING_IN_REVIEW` or `LISTING_STATE_CONFLICT`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/me/listings/{id}/availability:
    parameters:
      - name: id
        in: path
        required: true
        description: The listing's `id` (not its slug).
        schema: { type: string, format: uuid }
    get:
      tags: [availability]
      operationId: getMyListingAvailability
      summary: The lister's calendar of a short stay
      description: |
        The calendar with the **private** parts: for each night whether it is available and,
        when the lister marked it, the reason (`BLOCKED`: the owner's choice; `BOOKED`: taken)
        and the note; and the stored ranges. A night that is unavailable only because it is in
        the past or beyond the booking window has `available: false` and `reason: null`.

        Who may call it: someone who may manage the listing (see `GET /v1/me/listings`). A
        listing the caller may not manage, and one that does not exist, are both `404`.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: from
          in: query
          description: "First night to return (`YYYY-MM-DD`). Default: today in the listing's time zone."
          schema: { type: string, format: date }
        - name: to
          in: query
          description: "Last night to return, inclusive. Default: `from` + 90 days. At most 366 nights."
          schema: { type: string, format: date }
      responses:
        "200":
          description: The calendar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListerAvailability" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "`LISTING_NOT_FOUND`: no such listing, or one the caller may not manage."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`NOT_SHORT_STAY`: the listing is not in the `short-stay` category."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"
    put:
      tags: [availability]
      operationId: changeMyListingAvailability
      summary: Mark nights available, blocked or booked
      description: |
        Applies 1 to 50 changes **in order and atomically**: either all are applied or none
        is. Each change marks an inclusive run of nights (`from`..`to`, at most 366 nights)
        `AVAILABLE`, `BLOCKED` or `BOOKED`:

        - `BLOCKED` / `BOOKED` replace whatever those nights were, with the optional private
          `note`;
        - `AVAILABLE` re-opens them: a stored range inside them disappears, one that sticks
          out is trimmed, one that contains them is split in two;
        - neighbouring ranges with the same reason and note are merged.

        Nights must not be in the past and must be inside the booking window (today .. 365
        days ahead, in the listing's time zone). Every change is written to an audit trail
        (who, which nights, what, when), which no endpoint returns yet.

        The response is the calendar for the default span (today .. +90 days), in the same
        shape as the GET. Rate limited per IP (bursts of 30, 30 per minute, shared with the
        stay rules). A cookie session needs the web app's `Origin` (CSRF rule).
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvailabilityChanges" }
            example:
              changes:
                - { from: "2026-12-24", to: "2026-12-30", status: BOOKED, note: "The Moyo family" }
                - { from: "2027-01-10", to: "2027-01-11", status: BLOCKED }
                - { from: "2026-12-27", to: "2026-12-27", status: AVAILABLE }
      responses:
        "200":
          description: The calendar after the changes, for today .. +90 days.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListerAvailability" }
        "400":
          description: |
            `VALIDATION_FAILED`. `error.fields` names the change: `changes` (not 1 to 50 items),
            `changes[i].from` (not a date, or in the past), `changes[i].to` (not a date, before
            `from`, more than 366 nights, or beyond the booking window), `changes[i].status`
            (not `AVAILABLE`, `BLOCKED` or `BOOKED`), `changes[i].note` (longer than 200
            characters, not plain text, or sent with `AVAILABLE`). Also malformed JSON or an
            unknown field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: VALIDATION_FAILED
                  message: Some fields need your attention.
                  fields:
                    "changes[1].to": must not be before from
                trace_id: 4b0b8f0e-5d0c-4e0e-9a39-0a5a4f1f6c55
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "404":
          description: "`LISTING_NOT_FOUND`: no such listing, or one the caller may not manage."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`NOT_SHORT_STAY`: the listing is not in the `short-stay` category."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/listings/{id}/stay-rules:
    patch:
      tags: [availability]
      operationId: setMyListingStayRules
      summary: Change a short stay's shortest stay and number of guests
      description: |
        Sets `min_nights` (1–365) and / or `max_guests` (1–50) of a short stay the caller may
        manage; a key that is absent is left unchanged, and at least one must be sent. These
        are the only listing fields that can be edited through the API today.

        Same authorisation, rate limit and CSRF rule as the calendar. With Elasticsearch, the
        search index follows after the worker has processed the listing's update event
        (`guests_min` and the stay search read these values).
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                min_nights: { type: integer, minimum: 1, maximum: 365 }
                max_guests: { type: integer, minimum: 1, maximum: 50 }
            example: { min_nights: 3 }
      responses:
        "200":
          description: The listing's summary after the change.
          content:
            application/json:
              schema:
                type: object
                required: [listing]
                additionalProperties: false
                properties:
                  listing: { $ref: "#/components/schemas/MyListing" }
        "400":
          description: "`VALIDATION_FAILED` on `min_nights` or `max_guests` (out of range, or neither sent), malformed JSON or an unknown field."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "404":
          description: "`LISTING_NOT_FOUND`: no such listing, or one the caller may not manage."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`NOT_SHORT_STAY`: the listing is not in the `short-stay` category."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/directory:
    get:
      tags: [directory]
      operationId: listDirectoryKinds
      summary: The directories, with profile counts
      description: The active `directory_kinds` in display order, each with the number of public profiles in it.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The directories.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CatalogueCacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [kinds]
                additionalProperties: false
                properties:
                  kinds:
                    type: array
                    items:
                      $ref: "#/components/schemas/DirectoryKindCount"
              example:
                kinds:
                  - { code: agencies, label: Estate agencies, singular_label: Estate agency, description: Registered agencies selling and letting property across Zimbabwe., count: 5 }
        "304":
          $ref: "#/components/responses/NotModified"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/directory/{kind}:
    get:
      tags: [directory]
      operationId: listDirectoryProfiles
      summary: Profiles in one directory
      x-visibility-rule: Only profiles that are published and verified are ever returned by the directory endpoints and the sitemap.
      description: |
        Public profiles of one kind: sponsored profiles first, then by name. Only ACTIVE
        profiles are returned. **No phone number, email address or street address is ever
        returned**; a profile is contacted with `POST /v1/business-enquiries`.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DirectoryKind"
        - name: q
          in: query
          description: Free text, at most 100 characters. Every word must match the name, role, tagline, description, services or areas.
          schema: { type: string, maxLength: 100 }
        - name: city
          in: query
          description: A `cities` code.
          schema: { type: string }
          example: harare
        - name: country
          in: query
          description: "The code of any enabled country (`GET /v1/countries`), in any case (`market` is an alias). Keeps the profiles of that country — the profile's own country, whether its city is a reference city or free text. A country without profiles is valid and returns nothing. `400` on `country` when unknown."
          schema: { type: string, pattern: "^[A-Za-z]{2}$" }
          example: ZW
        - name: market
          in: query
          description: Alias of `country`. If both are sent they must be equal (`400` on `market` otherwise).
          schema: { type: string, pattern: "^[A-Za-z]{2}$" }
        - name: region
          in: query
          description: |
            A `regions` code. Keeps profiles whose city is in that region. `400` on `region` when
            unknown or not a region of `country`; `400` on `city` when `city` is not in the
            region or country asked for.
          schema: { type: string }
          example: harare
        - name: trade
          in: query
          description: A `service_trades` code. Only service providers have a trade; for other kinds it matches nothing.
          schema: { type: string }
          example: plumbing
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: One page of profiles.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CatalogueCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryPage"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: "`VALIDATION_FAILED` with fields `q`, `city`, `trade`, `page` or `page_size`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: "`DIRECTORY_KIND_NOT_FOUND`: no active directory kind has this code."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/directory/{kind}/{slug}:
    get:
      tags: [directory]
      operationId: getDirectoryProfile
      summary: One profile
      description: |
        The profile with, for an agency, its agents (as profile references) and, for agencies
        and agents, their public listings (newest first; an agency's listings are all those of
        the organisation, an agent's are the ones assigned to them). Other kinds have no
        listings. No contact details are returned.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DirectoryKind"
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 80 }
          example: sample-estates
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The profile.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CatalogueCacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                additionalProperties: false
                properties:
                  profile:
                    $ref: "#/components/schemas/DirectoryProfileDetail"
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          description: "`DIRECTORY_KIND_NOT_FOUND`, or `PROFILE_NOT_FOUND` (no such profile, or it is not ACTIVE)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/directory/{kind}/{slug}/logo:
    get:
      tags: [directory]
      operationId: getDirectoryProfileLogo
      summary: A profile's logo (the image itself)
      description: |
        New in 0.17.0. The logo of a **public** profile (an agent's photo), streamed as it is
        stored: a PNG or a JPEG. Since 0.18.0 an upload larger than 512 pixels on its longer
        side is scaled down to fit 512x512 when it is stored (see
        `PUT /v1/me/profiles/{kind}/{slug}/logo`), so the image is normally at most 512 pixels
        each way; a logo stored before 0.18.0 can be as large as it was uploaded (at most 2 MB,
        4096x4096). It is never cropped.

        No authentication, no cookie is read or set, and the response is the same for everyone.
        Use the `url` of a `Logo` object (prefixed with the API base URL) rather than building
        this path: it carries `?v=<version>`, which changes when the logo changes. The query
        string is only a cache key; the route always serves the current logo.

        - `Cache-Control` (changed in 0.18.0; the same on a `200` and on a `304`):
          - `public, max-age=31536000, immutable` when `v` is exactly the version of the
            **current** logo (the first 12 characters of its checksum), as in every `Logo.url`;
          - `public, max-age=300, stale-while-revalidate=86400` when `v` is missing, empty or
            the version of another image (an old URL still serves the current logo, and must
            not be kept for a year).
        - `ETag` is the image's checksum; `If-None-Match` answers `304`.
        - `X-Content-Type-Options: nosniff`, `Cross-Origin-Resource-Policy: cross-origin` (other
          origins may show it in an `<img>`).
        - `404 LOGO_NOT_FOUND` when the profile has no logo; `404 PROFILE_NOT_FOUND` when the
          profile is not public (unknown, unverified or suspended) - its logo then stops being
          served even though it is still stored.
      security: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DirectoryKind"
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 80 }
          example: sample-estates
        - name: v
          in: query
          required: false
          description: Version of the image (the first 12 characters of its checksum). It never changes which image is served (always the current one); it decides only how long the response may be cached - a year when it is the current logo's version, minutes otherwise.
          schema: { type: string }
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The image.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              description: The SHA-256 of the image, quoted.
              schema: { type: string }
            Cache-Control:
              description: "`public, max-age=31536000, immutable` when `v` is the current logo's version; otherwise `public, max-age=300, stale-while-revalidate=86400`."
              schema: { type: string }
            X-Content-Type-Options:
              description: "`nosniff`."
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          description: "`DIRECTORY_KIND_NOT_FOUND`, `PROFILE_NOT_FOUND` (no such profile, or it is not public) or `LOGO_NOT_FOUND` (the profile has no logo)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/listing-photos/{photoId}/{size}:
    get:
      tags: [listings]
      operationId: getListingPhoto
      summary: One stored size of an uploaded listing photo (the image itself)
      description: |
        New in 0.22.0. A JPEG. Use the `url` of a `Photo` (or `variants[].url`, or a
        `ManagedPhoto`'s) prefixed with the API base URL; it carries `?v=<version>` (the first
        12 characters of the photo's checksum).

        - **Public** while the listing is public and the photo is approved: no session needed,
          the same for everyone, `Cache-Control: public, max-age=31536000, immutable` when `v`
          is the photo's version, `public, max-age=300, stale-while-revalidate=86400` otherwise.
        - **Otherwise** only for a signed-in manager of the listing or a reviewer of its
          country (admin session), with `Cache-Control: private, no-store`; everyone else gets
          `404 PHOTO_NOT_FOUND`. An `<img>` on another origin does not send the session: the
          editor fetches such a photo with credentials (or a bearer token) and shows the blob.
        - `ETag`, `If-None-Match` -> `304`; `X-Content-Type-Options: nosniff`,
          `Cross-Origin-Resource-Policy: cross-origin`. Bundled sample photos
          (`/assets/images/...`) are not served here.
      security: []
      parameters:
        - name: photoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: size
          in: path
          required: true
          schema: { type: string, enum: [large, medium, small] }
        - name: v
          in: query
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The image.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          description: "`PHOTO_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/me/profiles:
    get:
      tags: [directory]
      operationId: listMyProfiles
      summary: The directory profiles the caller may manage
      description: |
        New in 0.17.0. The profiles whose public presentation (today: the logo) the caller may
        change, so a client knows what to offer:

        - the business profiles (an agency's, a law firm's, a property manager's, a
          developer's, a host's, a service provider's) of the organisations in which the caller
          is `OWNER` or `MANAGER`;
        - the caller's own agent profile.

        Profiles are returned whatever their status: `verified` is false for one that is not
        public (yet, or any more). An empty list for a caller who manages none. Sorted by kind,
        then name. `Cache-Control: private, no-store`.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The profiles.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                additionalProperties: false
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagedProfile"
              example:
                profiles:
                  - kind: agencies
                    slug: sample-estates
                    name: Sample Estates
                    verified: true
                    logo: { url: "/v1/directory/agencies/sample-estates/logo?v=3f2a9c0d1b7e", width: 256, height: 256 }
                  - { kind: agents, slug: rudo-moyo, name: Rudo Moyo, verified: true, logo: null }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/profiles/{kind}/{slug}/logo:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/DirectoryKind"
      - name: slug
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 80 }
        example: sample-estates
    put:
      tags: [directory]
      operationId: putMyProfileLogo
      summary: Set or replace a profile's logo (multipart upload)
      description: |
        New in 0.17.0. `multipart/form-data` with one field, `file`. The image replaces the
        profile's logo at once and is **public**: it is shown on the profile and on the
        listings.

        Who may: an `OWNER` or `MANAGER` of the organisation that owns a business profile; for
        an agent profile, the agent themselves (not the agency's owner). `404
        PROFILE_NOT_FOUND` for a profile of an organisation the caller does not belong to (its
        existence is not confirmed); `403 FORBIDDEN` for a member of the organisation whose
        role may not (an `AGENT` cannot change the agency's logo).

        The image:
        - **PNG or JPEG only**, decided by **inspecting the content** (the part's
          `Content-Type` and the file name are ignored). SVG is refused because it can carry
          scripts; GIF, WebP and animated PNG are refused.
        - at most **2 MB**;
        - between **128x128** and **4096x4096** pixels (each side).

        Changed in 0.18.0: an image whose longer side is more than **512** pixels is scaled
        down to fit 512x512 before it is stored (same proportions; never cropped or enlarged;
        PNG stays PNG and keeps its transparency, JPEG stays JPEG and is turned upright when its
        EXIF data says the photo was taken sideways). No side is taken under 128 pixels, so an
        image more than four times as wide as it is high keeps a longer side above 512 (1200x200
        becomes 768x128). An image of 512 pixels or less is stored exactly as uploaded. The
        `logo` in the response (`url`, `width`, `height`) describes the **stored** image, so
        its size can be smaller than the file that was sent. An image whose data cannot be
        decoded is `415`. There is no moderation before it is shown. Rate limited per IP together with the other uploads:
        bursts of 20, 20 per minute. A cookie session needs the web app's `Origin` (CSRF).
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: The profile with its new logo. `logo.url` has a new `v`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                additionalProperties: false
                properties:
                  profile:
                    $ref: "#/components/schemas/ManagedProfile"
        "400":
          description: "`VALIDATION_FAILED` with `fields.file`: missing, empty, not a multipart upload, or an image smaller than 128x128 or larger than 4096x4096 pixels."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN` (a member of the organisation whose role may not change this profile) or `CSRF_ORIGIN` (cookie session without the web app's `Origin`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: "`PROFILE_NOT_FOUND`: no such profile, or one of an organisation the caller does not belong to."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "413":
          description: "`FILE_TOO_LARGE`: the image is larger than 2 MB."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415":
          description: "`UNSUPPORTED_FILE_TYPE`: the content is not a still PNG or JPEG image."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"
    delete:
      tags: [directory]
      operationId: deleteMyProfileLogo
      summary: Remove a profile's logo
      description: |
        New in 0.17.0. Removes the logo: the profile and its listings then say `logo: null` and
        `GET /v1/directory/{kind}/{slug}/logo` answers `404 LOGO_NOT_FOUND`. Removing a logo
        that is not there is still `204`. Same authorisation, rate limit and CSRF rule as `PUT`.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "204":
          description: Removed (or there was none).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN` or `CSRF_ORIGIN`, as for `PUT`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: "`PROFILE_NOT_FOUND`, as for `PUT`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/trust/summary:
    get:
      tags: [trust]
      operationId: getTrustSummary
      summary: How many advertisers are verified and how many listings are public
      description: |
        New in 0.17.0. Real numbers for a statement such as "every listing is from a verified
        advertiser". Public and cacheable (`public, max-age=60, stale-while-revalidate=300`).

        `listings_from_verified_advertisers` is counted on its own (PUBLISHED, unexpired
        listings whose advertiser is verified) and **equals `public_listings`**: a listing of
        an unverified advertiser is never public. `listings_reviewed` is how many of the
        public listings were themselves reviewed by a platform administrator or moderator;
        until a review workflow exists only the sample data is marked, so do not present it as
        "all listings are checked".
      security: []
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The numbers.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustSummary"
              example:
                verified_advertisers: { organisations: 27, direct_owners: 1 }
                public_listings: 24
                listings_from_verified_advertisers: 24
                listings_reviewed: 24
                generated_at: "2026-11-14T09:00:00Z"
        "304":
          $ref: "#/components/responses/NotModified"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/sitemap:
    get:
      tags: [directory]
      operationId: getSitemap
      summary: Everything a sitemap needs
      description: |
        The slug and `updated_at` of every public listing (newest first) and the kind, slug and
        `updated_at` of every public profile. Not paginated. A listing whose advertiser is not
        verified is not public and is not listed.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The entries.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CatalogueCacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [listings, profiles]
                additionalProperties: false
                properties:
                  listings:
                    type: array
                    items:
                      type: object
                      required: [slug, updated_at]
                      additionalProperties: false
                      properties:
                        slug: { type: string }
                        updated_at: { type: string, format: date-time }
                  profiles:
                    type: array
                    items:
                      type: object
                      required: [kind, slug, updated_at]
                      additionalProperties: false
                      properties:
                        kind:
                          $ref: "#/components/schemas/DirectoryKind"
                        slug: { type: string }
                        updated_at: { type: string, format: date-time }
              example:
                listings:
                  - { slug: four-bedroom-house-highlands, updated_at: "2026-11-12T00:00:00Z" }
                profiles:
                  - { kind: agencies, slug: sample-estates, updated_at: "2026-11-14T00:00:00Z" }
        "304":
          $ref: "#/components/responses/NotModified"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/property-requests:
    post:
      tags: [property-requests]
      operationId: createPropertyRequest
      summary: Submit a property request (enquiry)
      description: |
        The single entry point for every customer enquiry about a listing.

        The request, its timeline entry, the customer activity record and the notification
        outbox event are committed in one database transaction; `201` is returned only after
        that commit. The response status is always `RECEIVED` — acceptance does not mean the
        recipient has been notified.

        **Idempotency.** An idempotency key is required, either as `idempotency_key` in the
        body or in the `Idempotency-Key` header (the body wins when both are present).
        Repeating a key with identical content returns `200` with the original response.
        Repeating a key with different content returns `409`. Content is compared after
        normalisation (trimmed strings, lower-cased email, slot converted to UTC).

        **Rate limit.** Per client IP: bursts of 10 requests, refilled at 10 per minute.

        **Guests and signed-in customers.** Authentication is optional. For a guest,
        `guest_contact` (name and email) is required. For a signed-in customer `guest_contact`
        may be omitted: name and email are taken from the account (any name/email sent in
        `guest_contact` is ignored), the customer's user ID is stored on the request, and only
        `guest_contact.phone` is read. In both cases the phone is required when the preferred
        contact method is PHONE or WHATSAPP (reported as field `guest_contact.phone`) and
        `consent` is required. The same idempotency key used by a different customer is a `409`.

        **Appointments.** A `VIEWING_REQUEST` or `CONSULTATION_REQUEST` sent with a
        `preferred_slot_utc` also creates an appointment (`VIEWING` or `CONSULTATION`, status
        `REQUESTED`, 30 minutes) in the same transaction, routed to the same recipient; the
        response names it in `appointment`. Without a slot `appointment` is null. A guest's
        appointment has no customer account: the professional confirms or cancels it and the
        guest is told by email.
      security:
        - {}
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Alternative to `idempotency_key` in the body. Required if the body omits it.
          schema:
            $ref: "#/components/schemas/IdempotencyKey"
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyRequestCreate"
            example:
              listing_id: 0195c0de-0000-7000-8000-000000000001
              request_type: VIEWING_REQUEST
              message: I would like to view this property next week.
              preferred_contact_method: WHATSAPP
              preferred_slot_utc: "2027-01-15T08:00:00Z"
              idempotency_key: 6f1c2f0a-8f0e-4f43-9a55-2f6f3f1f9c11
              guest_contact:
                name: Tariro Moyo
                email: tariro@example.com
                phone: "+263771234567"
              consent:
                privacy_version: "2026-01"
                accepted: true
      responses:
        "201":
          description: The request was stored.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyRequestReceipt"
        "200":
          description: Idempotent replay. The key was already used with identical content; the original receipt is returned.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyRequestReceipt"
        "400":
          description: |
            `VALIDATION_FAILED` (with per-field messages in `error.fields`) or `INVALID_JSON`
            (malformed JSON, wrong types, unknown fields).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: VALIDATION_FAILED
                  message: Some fields need your attention.
                  fields:
                    message: must be plain text without HTML
                    consent.accepted: must be true
                trace_id: 4b0b8f0e-5d0c-4e0e-9a39-0a5a4f1f6c55
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "404":
          description: "The listing does not exist (`LISTING_NOT_FOUND`) - or, since 0.17.0, its advertiser is not verified right now, so it is not public and takes no request."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: |
            `IDEMPOTENCY_CONFLICT`: the idempotency key was already used with different content.

            `DATES_UNAVAILABLE` (STAY_REQUEST only, new in 0.16.0): at least one night of the
            stay is not available. `error.fields.check_in` names the first night that is taken
            (for example "is not available for every night: the first night that is taken is
            2026-12-24"). The other stay rules are `400 VALIDATION_FAILED`: `request_type`
            (the listing is not a short stay), `check_in` (not a date, or in the past),
            `check_out` (not a date, not after `check_in`, fewer nights than the listing's
            `min_nights`, more than 90 nights, or beyond the booking window), `guests` (missing,
            below 1, or above the listing's `max_guests`); and `check_in`, `check_out` or
            `guests` sent with another request type.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: The listing is not published or has expired (`LISTING_UNAVAILABLE`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: The body exceeds 64 KB (`PAYLOAD_TOO_LARGE`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: The Content-Type is not `application/json` (`UNSUPPORTED_MEDIA_TYPE`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many requests from this IP (`RATE_LIMITED`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/business-enquiries:
    post:
      tags: [business-enquiries]
      operationId: createBusinessEnquiry
      summary: Send an enquiry to a directory profile
      description: |
        The **only** way to contact a directory profile (an agency, agent, developer, property
        manager, host or service provider). Profiles never expose a phone number or an email
        address.

        The enquiry, its timeline entry, the customer activity record and the outbox event
        `BUSINESS_ENQUIRY_CREATED` (identifiers only, no personal data) are committed in one
        database transaction; `201` is returned only after that commit. The response status is
        always `RECEIVED` — acceptance does not mean the recipient has been notified.

        **Recipient.** `recipient.kind` + `recipient.slug` are the profile's public address, for
        example `service-providers` / `sample-plumbers`.

        **Routing.** The enquiry goes to the inbox of the organisation that owns the profile.
        For kind `agents` it goes to the named agent, and their agency's OWNER and MANAGER see
        it too. If nobody can receive it the enquiry is still stored and the customer still gets
        `201 RECEIVED`; internally it is a `ROUTING_EXCEPTION` for operations to resolve.

        **Idempotency.** As for property requests: a key is required, as `idempotency_key` in
        the body or the `Idempotency-Key` header (the body wins). Same key and same content →
        `200` with the original receipt; same key and different content → `409`. The key space
        is separate from property requests.

        **Guests and signed-in customers.** For a guest, `guest_contact.name` and
        `guest_contact.email` are required. For a signed-in customer `guest_contact` may be
        omitted: name and email come from the account (anything sent for them is ignored), the
        user ID is stored on the enquiry and only `guest_contact.phone` is read. The phone is
        required when the preferred contact method is PHONE or WHATSAPP. `consent` is always
        required.

        **Rate limit.** Its own per-IP bucket: bursts of 10 requests, refilled at 10 per minute.
      security:
        - {}
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Alternative to `idempotency_key` in the body. Required if the body omits it.
          schema:
            $ref: "#/components/schemas/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessEnquiryCreate"
            example:
              recipient:
                kind: service-providers
                slug: sample-plumbers
              service: Burst pipes and leaks
              message: The geyser is leaking. Can someone come this week?
              preferred_contact_method: WHATSAPP
              idempotency_key: 6f1c2f0a-8f0e-4f43-9a55-2f6f3f1f9c11
              guest_contact:
                name: Tariro Moyo
                email: tariro@example.com
                phone: "+263771234567"
              consent:
                privacy_version: "2026-01"
                accepted: true
      responses:
        "201":
          description: The enquiry was stored.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessEnquiryReceipt"
        "200":
          description: Idempotent replay. The key was already used with identical content; the original receipt is returned.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessEnquiryReceipt"
        "400":
          description: |
            `VALIDATION_FAILED` with `error.fields` keyed by `recipient.kind`, `recipient.slug`,
            `service`, `message`, `preferred_contact_method`, `guest_contact.name`,
            `guest_contact.email`, `guest_contact.phone`, `consent.accepted`,
            `consent.privacy_version` or `idempotency_key`; or `INVALID_JSON` (malformed JSON,
            wrong types, unknown fields).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: VALIDATION_FAILED
                  message: Some fields need your attention.
                  fields:
                    message: must be plain text without HTML
                    guest_contact.phone: is required when the preferred contact method is PHONE or WHATSAPP
                trace_id: 4b0b8f0e-5d0c-4e0e-9a39-0a5a4f1f6c55
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "404":
          description: No profile has this kind and slug (`RECIPIENT_NOT_FOUND`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The idempotency key was already used with different content (`IDEMPOTENCY_CONFLICT`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: The profile exists but is not accepting enquiries, because it is suspended or not yet verified (`RECIPIENT_UNAVAILABLE`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/inbox/business-enquiries:
    get:
      tags: [business-enquiries]
      operationId: listReceivedBusinessEnquiries
      summary: Business enquiries received by the caller's organisation(s)
      description: |
        Requires at least one organisation membership (any role): `403 FORBIDDEN` otherwise,
        `401` when not signed in. Self-declared account roles do not open this route.

        **What is returned** (decided on the server from the caller's memberships; there are no
        filter parameters):
        - OWNER and MANAGER see every enquiry routed to their organisation, including those
          addressed to the profiles of the organisation's agents.
        - AGENT and STAFF see only the enquiries addressed to their own agent profile.

        Another organisation's enquiries are never returned. `status` is the internal status;
        because unroutable enquiries have no recipient, `ROUTING_EXCEPTION` never appears here.

        **This is the only place the customer's contact details are returned.**

        Newest first, capped at 100 items. **There is no pagination yet.**
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The enquiries visible to the caller (possibly an empty array).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/ReceivedBusinessEnquiry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/captcha:
    get:
      tags: [auth]
      operationId: getRegistrationCaptcha
      summary: Ask for the question a registration must answer
      description: |
        **New in 0.19.0.** Returns a plain-language arithmetic question with small numbers: an
        addition (`What is 7 + 5?`) or a subtraction whose result is never negative
        (`What is 9 - 4?`). Show `question` next to an input and send what the person types as
        `captcha.answer` of `POST /v1/auth/register`, together with `captcha_id`.

        - Public: no session, no `Origin` needed. Never cached (`Cache-Control: no-store`);
          every call returns a different question.
        - A captcha is valid for **10 minutes** (`expires_at`) and can be **presented once**.
          It is used up by the first registration that presents it and passes the checks on the
          other fields, whether the answer is right or wrong. After any refused registration,
          call this again and show the new question.
        - Built in: no third-party service, nothing loaded from another origin, no cookie. It
          is a speed bump for scripts, not a strong bot defence; the rate limits stay in place.

        **Rate limit.** Its own per-IP bucket: bursts of 30, refilled at 30 per minute.
      security: []
      responses:
        "200":
          description: A new question.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Captcha"
              example:
                captcha_id: Qm9iJ3MgeW91ciB1bmNsZS4gVGhpcyBpcyBvcGFxdWU
                question: What is 7 + 5?
                expires_at: "2026-11-14T09:10:00Z"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account
      description: |
        Creates an unverified account and sends a verification email. **Does not sign in.**

        Enumeration-safe: for valid input the answer is always `202 VERIFICATION_SENT`, whether
        or not the email already has an account.
        - New email: the account is created and a verification link is sent.
        - Existing unverified account: its name, password and role selection are replaced by this
          registration, earlier verification links stop working and a new link is sent.
        - Existing verified account: nothing changes; the owner is told by email that they
          already have an account.

        The verification link is `{PUBLIC_WEB_URL}/verify-email?token=...` and is valid for 24 hours.

        **Captcha (new in 0.19.0).** `captcha` is required: the `captcha_id` of a question from
        `GET /v1/auth/captcha` and the person's `answer` as a string. Spaces around the answer
        are ignored and only digits are an answer (`12`, not `twelve`). Refusals are
        `400 VALIDATION_FAILED` with `error.fields.captcha` set to:
        - `Answer the question to show you are a person.` when `captcha`, its `captcha_id` or
          its `answer` is missing or blank;
        - `That answer is not right. Try the new question.` when the answer is wrong, or is
          not made of digits;
        - `That question has expired. Try the new question.` when the captcha is older than 10
          minutes, is unknown, or was already presented.

        The captcha is judged **after** the other fields: while another field is refused the
        captcha is not used up, and its message appears next to the other fields' only when it
        is missing or not made of digits. Once the other fields are acceptable, the first
        registration that presents a captcha uses it up, right or wrong, so the same captcha
        can never be presented twice: **after any refused registration, ask for a new question**
        and show it. The captcha is judged before the account is looked up, so the answer never
        depends on whether the email already has an account, and a refused captcha writes
        nothing and sends no email.

        **Account roles.** `roles` is required: 1 to 13 codes from the active rows of the
        `account_roles` reference set (`GET /v1/reference/account_roles`), enforced on the server.
        A role that has been deactivated there is refused like an unknown one. A missing or empty array, a platform
        administrator role (`SUPER_ADMIN`, `PLATFORM_ADMIN`, `MARKET_ADMIN`, `FINANCE_ADMIN`,
        `CONTENT_ADMIN`, `MODERATOR`, `SUPPORT`), any other unknown value, a non-string entry or a
        **duplicate** is rejected with `400 VALIDATION_FAILED` and a plain-language message in
        `error.fields.roles`. `CONSUMER` and `TENANT` become `ACTIVE`; every other role is recorded
        as `PENDING_VERIFICATION` (decided by the row's `requires_verification`). Platform roles
        are refused by a fixed deny-list before the reference data is consulted, so they cannot
        be chosen even if such a row existed.

        **A property seeker account is only that (changed in 0.19.0).** The Property Seekers
        roles are `CONSUMER` (Prospective Buyer) and `TENANT` (Prospective Tenant). A
        registration chooses seeker roles only (`[CONSUMER]`, `[TENANT]` or both), **or** roles
        from the other groups only (for example `[AGENT, LANDLORD]`); never a mix. A mix is
        rejected with `error.fields.roles` set to `A property seeker account cannot also have a
        professional, business or owner role. Choose one or the other.` Roles are chosen only
        here: no endpoint adds a role to an existing account.

        Selecting a professional role only records a request. It does **not** create an
        organisation or a membership and grants no access to any organisation's data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              name: Rudo Ncube
              email: rudo@example.com
              password: correct-horse-battery
              consent:
                privacy_version: "2026-01"
                accepted: true
              marketing_opt_in: false
              roles: [CONSUMER, TENANT]
              captcha:
                captcha_id: Qm9iJ3MgeW91ciB1bmNsZS4gVGhpcyBpcyBvcGFxdWU
                answer: "12"
      responses:
        "202":
          $ref: "#/components/responses/VerificationSent"
        "400":
          description: |
            `VALIDATION_FAILED` with `error.fields` keyed by `name`, `email`, `password`,
            `consent.accepted`, `consent.privacy_version`, `roles` or `captcha`; or `INVALID_JSON`
            (also when `captcha.answer` is sent as a number instead of a string).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: VALIDATION_FAILED
                  message: Some fields need your attention.
                  fields:
                    password: must be at least 10 characters
                    consent.accepted: must be true
                    roles: That role cannot be chosen at sign-up.
                    captcha: Answer the question to show you are a person.
                trace_id: 4b0b8f0e-5d0c-4e0e-9a39-0a5a4f1f6c55
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Verify an email address and sign in
      description: |
        Consumes the single-use token from the verification email (valid for 24 hours), marks the
        email verified and starts a session. By default the session is delivered in the
        `rp_session` cookie; `"token_delivery": "bearer"` returns `access_token` instead.

        Exception: if the account holds a platform role, the email is verified but **no session
        is started** — the response is `200` with `user` only (no `session`, no cookie, no
        `access_token`). Administrators sign in only at `POST /v1/admin/auth/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                token_delivery:
                  $ref: "#/components/schemas/TokenDelivery"
      responses:
        "200":
          $ref: "#/components/responses/Authenticated"
        "400":
          description: |
            `INVALID_TOKEN` (unknown, expired or already used), `VALIDATION_FAILED` (missing
            `token`, bad `token_delivery`) or `INVALID_JSON`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Send the verification email again
      description: |
        Always `202` for a well-formed email. A new link is sent only when the address belongs to
        an account that is not verified yet; otherwise nothing happens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          $ref: "#/components/responses/VerificationSent"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in, step 1 of 2 (password)
      description: |
        **Changed in 0.21.0 (breaking): this no longer signs the caller in.** When the email
        and password are right, the answer is `200` with a `SignInChallenge` and a six-digit
        code is emailed to the account's address; no session exists yet, no cookie is set and
        no token is returned. Send the code to `POST /v1/auth/login/verify` to get the session.

        `token_delivery` selects how the session token will be returned by the verify step:
        - `cookie` (default): sets the HttpOnly `rp_session` cookie; no token in the body.
        - `bearer`: returns `access_token` in the body and sets **no** cookie.

        An unknown email and a wrong password are indistinguishable (`401 INVALID_CREDENTIALS`,
        same body, comparable timing). `403 EMAIL_NOT_VERIFIED` is returned only when the
        password is correct.

        **Platform administrators cannot sign in here.** An account holding a platform role gets
        the same `401 INVALID_CREDENTIALS` whatever the password; it must use
        `POST /v1/admin/auth/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                token_delivery:
                  $ref: "#/components/schemas/TokenDelivery"
      responses:
        "200":
          $ref: "#/components/responses/CodeRequired"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: Unknown email, wrong password, or an account holding a platform role (`INVALID_CREDENTIALS`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: |
            `EMAIL_NOT_VERIFIED` (correct password, email not verified yet), or `CSRF_ORIGIN`
            when a valid session cookie was sent without an allowlisted `Origin`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/login/verify:
    post:
      tags: [auth]
      operationId: loginVerify
      summary: Sign in, step 2 of 2 (the emailed code)
      description: |
        New in 0.21.0. Exchanges the code emailed by `/v1/auth/login` for the session. On success
        the answer is exactly what `/v1/auth/login` answered before 0.21.0.
        That is: the session in the HttpOnly `rp_session` cookie, or `access_token` in the body
        when the password step asked for `token_delivery: bearer`.

        - The code is valid for 10 minutes after it was sent and works **once**.
        - `code` is a string of digits (a JSON number is accepted too). Missing, blank or not
          digits: `400 VALIDATION_FAILED`, `error.fields.code` = `Enter the code we sent you.`
          A wrong code: `400 VALIDATION_FAILED`, `error.fields.code` = `That code is not
          right.` A code of another length than `code_length` is only ever the demo code
          (development and staging, `AUTH_DEMO_CODE`) and otherwise gets the first message
          without using up an attempt.
        - The fifth wrong code, and any code for a challenge that has expired, is unknown, was
          already used or belongs to the other sign-in (`POST /v1/admin/auth/login`), is
          `400 CODE_EXPIRED`: sign in again.
        - **Rate limit.** Its own per-IP bucket (shared with the resend endpoint): bursts of 20,
          refilled at 20 per minute; and five wrong codes per challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifySignInCodeRequest"
      responses:
        "200":
          $ref: "#/components/responses/Authenticated"
        "400":
          description: |
            `VALIDATION_FAILED` with `error.fields.code`, or `CODE_EXPIRED` (`That code has
            expired or was used too many times. Sign in again.`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                wrong:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: Some fields need your attention.
                      fields:
                        code: That code is not right.
                    trace_id: 01HZX5K3Q4TQ7J2W8Y4V6N9B1C
                expired:
                  value:
                    error:
                      code: CODE_EXPIRED
                      message: That code has expired or was used too many times. Sign in again.
                    trace_id: 01HZX5K3Q4TQ7J2W8Y4V6N9B1C
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/login/resend:
    post:
      tags: [auth]
      operationId: loginResend
      summary: Email a new sign-in code
      description: |
        New in 0.21.0. Emails a fresh code for a live challenge to the same address and answers
        the same `SignInChallenge` as `/v1/auth/login` (same `challenge_id`, new `expires_at`).
        The earlier code stops working; wrong codes already entered still count.

        At most one code every 30 seconds and five new codes per challenge: otherwise
        `429 RATE_LIMITED` with `Retry-After` (seconds until a new code may be asked for; when
        all five were used, until the challenge expires). An expired, unknown, used or ended
        challenge, or one of the other sign-in, is `400 CODE_EXPIRED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id]
              properties:
                challenge_id:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/CodeRequired"
        "400":
          description: "`CODE_EXPIRED`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out
      description: |
        Revokes the current session (cookie or bearer) and clears the cookie. Answers `204` even
        when nobody is signed in. No request body.
      security:
        - {}
        - cookieSession: []
        - bearerToken: []
      responses:
        "204":
          description: Signed out. The `rp_session` cookie is cleared.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              description: Expires the `rp_session` cookie.
              schema:
                type: string
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/password-reset/request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Ask for a password-reset email
      description: |
        Always `202` for a well-formed email, whether or not an account exists. The link is
        `{PUBLIC_WEB_URL}/reset-password?token=...`, single-use and valid for 1 hour.

        No email is sent for an account holding a platform role (still `202`): administrator
        passwords are changed with the `adminctl` command, not by email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: RESET_SENT
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password with a reset token
      description: |
        Sets the new password and revokes **all** of that user's sessions (every device must
        sign in again). The `rp_session` cookie of the calling browser is cleared. Because the
        token was delivered to the mailbox, a successful reset also marks the email verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  $ref: "#/components/schemas/NewPassword"
      responses:
        "204":
          description: Password changed; all sessions revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          description: |
            `INVALID_TOKEN` (unknown, expired or already used), `VALIDATION_FAILED` (field
            `password` or `token`) or `INVALID_JSON`. A rejected password does not consume the token.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me:
    delete:
      tags: [account]
      operationId: deleteMe
      summary: Delete one's own account (new in 0.25.0)
      description: |
        The signed-in person deletes their account after typing their password again. Exactly
        what an administrator's deletion does (see `AccountDeleted`): the account is anonymised and
        can never sign in again, the session cookie is cleared, and the address it had is sent a
        last email. Refused for the only owner of an organisation that still has members (`409
        SOLE_OWNER`) and for an account holding a platform role (`403
        ADMIN_ACCOUNT_CANNOT_SELF_DELETE`). Shares the per-IP limit of `POST /v1/auth/*`.
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountRequest" }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeleted" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: "`UNAUTHENTICATED`, or `INVALID_PASSWORD` (the password is wrong)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: "`ADMIN_ACCOUNT_CANNOT_SELF_DELETE` (`CSRF_ORIGIN` for a cookie request without the web app's `Origin`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`SOLE_OWNER`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      tags: [account]
      operationId: getMe
      summary: The signed-in user
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The current user with their roles, and the session that authenticated the request.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              example:
                session:
                  scope: customer
                  expires_at: "2026-12-13T21:25:22.210025Z"
                user:
                  id: 0195c0de-0000-7000-8000-00000000d002
                  name: Alex Agent
                  email: agent@example.test
                  email_verified: true
                  platform_roles: []
                  memberships:
                    - organisation_id: 0195c0de-0000-7000-8000-00000000b001
                      organisation_name: Sample Estates
                      organisation_kind: AGENCY
                      market_code: ZW
                      role: AGENT
                  account_roles:
                    - role: AGENT
                      status: ACTIVE
                      onboarding_status: APPROVED
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/admin/auth/login:
    post:
      tags: [admin]
      operationId: adminLogin
      summary: Sign in as a platform administrator, step 1 of 2 (password)
      description: |
        **Changed in 0.21.0 (breaking): this no longer signs the administrator in.** When the
        password is right the answer is `200` with a `SignInChallenge` and a six-digit code is
        emailed; `POST /v1/admin/auth/login/verify` with that code issues the session.

        Succeeds only for a verified account that holds at least one platform role
        (`SUPER_ADMIN`, `PLATFORM_ADMIN`, `MARKET_ADMIN`, `FINANCE_ADMIN`, `CONTENT_ADMIN`,
        `MODERATOR`, `SUPPORT`). The verify step issues an **admin-scope** session in the same
        `rp_session` cookie (12 hours absolute, 30 minutes idle by default).

        Every other outcome — unknown email, wrong password, an ordinary customer, a
        self-registered professional, an unverified account — is the same
        `401 INVALID_CREDENTIALS` with an identical body and comparable timing (one Argon2
        verification always runs), so the endpoint does not reveal which accounts are
        administrators.

        **Cookie only.** There is no `token_delivery` here: sending it is rejected with
        `400 INVALID_JSON` (unknown field) and `access_token` is never returned. An admin session
        token presented as `Authorization: Bearer` does not authenticate.

        **Rate limit.** Its own per-IP bucket: bursts of 5, refilled at 5 per minute.

        Sign out with `POST /v1/auth/logout`. Sign-in attempts are written to the server log as
        audit lines (log-only; not a durable audit record). The emailed code is the second
        factor (it proves control of the mailbox); there is no authenticator app yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/CodeRequired"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: |
            `INVALID_CREDENTIALS`: unknown email, wrong password, or an account that is not a
            verified platform administrator. The body is the same in every case.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/admin/auth/login/verify:
    post:
      tags: [admin]
      operationId: adminLoginVerify
      summary: Sign in, step 2 of 2 (the emailed code)
      description: |
        New in 0.21.0. Exchanges the code emailed by `/v1/admin/auth/login` for the session. On success
        the answer is exactly what `/v1/admin/auth/login` answered before 0.21.0.
        That is: an admin-scope session in the `rp_session` cookie; never `access_token`.

        - The code is valid for 10 minutes after it was sent and works **once**.
        - `code` is a string of digits (a JSON number is accepted too). Missing, blank or not
          digits: `400 VALIDATION_FAILED`, `error.fields.code` = `Enter the code we sent you.`
          A wrong code: `400 VALIDATION_FAILED`, `error.fields.code` = `That code is not
          right.` A code of another length than `code_length` is only ever the demo code
          (development and staging, `AUTH_DEMO_CODE`) and otherwise gets the first message
          without using up an attempt.
        - The fifth wrong code, and any code for a challenge that has expired, is unknown, was
          already used or belongs to the other sign-in (`POST /v1/auth/login`), is
          `400 CODE_EXPIRED`: sign in again.
        - **Rate limit.** Its own per-IP bucket (shared with the resend endpoint): bursts of 20,
          refilled at 20 per minute; and five wrong codes per challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifySignInCodeRequest"
      responses:
        "200":
          description: Signed in. Sets the `rp_session` cookie (admin scope). Never contains `access_token`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              description: "`rp_session=<token>; Path=/; HttpOnly; SameSite=Lax` (plus `Secure` outside development), Max-Age = the admin session lifetime."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              example:
                user:
                  id: 0195c0de-0000-7000-8000-00000000d003
                  name: Sam Admin
                  email: admin@example.test
                  email_verified: true
                  platform_roles:
                    - role: SUPER_ADMIN
                      market_code: null
                  memberships: []
                  account_roles: []
                session:
                  scope: admin
                  expires_at: "2026-11-14T21:00:00Z"
        "400":
          description: |
            `VALIDATION_FAILED` with `error.fields.code`, or `CODE_EXPIRED` (`That code has
            expired or was used too many times. Sign in again.`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                wrong:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: Some fields need your attention.
                      fields:
                        code: That code is not right.
                    trace_id: 01HZX5K3Q4TQ7J2W8Y4V6N9B1C
                expired:
                  value:
                    error:
                      code: CODE_EXPIRED
                      message: That code has expired or was used too many times. Sign in again.
                    trace_id: 01HZX5K3Q4TQ7J2W8Y4V6N9B1C
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/admin/auth/login/resend:
    post:
      tags: [admin]
      operationId: adminLoginResend
      summary: Email a new sign-in code
      description: |
        New in 0.21.0. Emails a fresh code for a live challenge to the same address and answers
        the same `SignInChallenge` as `/v1/admin/auth/login` (same `challenge_id`, new `expires_at`).
        The earlier code stops working; wrong codes already entered still count.

        At most one code every 30 seconds and five new codes per challenge: otherwise
        `429 RATE_LIMITED` with `Retry-After` (seconds until a new code may be asked for; when
        all five were used, until the challenge expires). An expired, unknown, used or ended
        challenge, or one of the other sign-in, is `400 CODE_EXPIRED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id]
              properties:
                challenge_id:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/CodeRequired"
        "400":
          description: "`CODE_EXPIRED`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/admin/me:
    get:
      tags: [admin]
      operationId: getAdminMe
      summary: The signed-in platform administrator
      description: |
        Same body as `GET /v1/me`, but only for an **admin-scope** session whose user holds a
        platform role. A customer-scope session is `403 FORBIDDEN` even if its user holds a
        platform role.
      security:
        - cookieSession: []
      responses:
        "200":
          description: The administrator and their admin session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/onboarding/requirements:
    get:
      tags: [onboarding]
      operationId: getOnboardingRequirements
      summary: What each professional role has to provide
      description: |
        Public and cacheable (like the reference data). One entry per role that has onboarding,
        in sign-up order: the details to fill in and the documents to attach. Everything here
        comes from database tables, so it can change without a release; do not hard-code it.

        The seeded document requirements are **placeholders** awaiting business and legal
        confirmation per market.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The requirements.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CatalogueCacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                additionalProperties: false
                properties:
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/OnboardingRoleRequirements" }
              example:
                roles:
                  - role: SERVICE_PROVIDER
                    label: Service provider
                    outcome: ORGANISATION
                    organisation_kind: SERVICE_PROVIDER
                    directory_kind: service-providers
                    fields:
                      - { name: business_name, required: true }
                      - { name: tagline, required: false }
                      - { name: description, required: true }
                      - { name: city, required: true }
                      - { name: areas, required: false }
                      - { name: services, required: false }
                      - { name: trade, required: true }
                      - { name: registration_number, required: false }
                      - { name: contact_phone, required: true }
                    documents:
                      - { code: PROOF_OF_IDENTITY, label: Proof of identity, description: "National ID, passport or driver's licence of the person applying.", required: true }
                      - { code: TRADE_LICENCE, label: Trade licence, description: "Licence or certification for your trade, if your trade has one.", required: false }
        "304":
          $ref: "#/components/responses/NotModified"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/onboarding:
    get:
      tags: [onboarding]
      operationId: listMyOnboarding
      summary: The caller's onboarding applications
      description: |
        The caller's **current** application for every onboarding role they hold (the newest
        one per role), in sign-up order. Empty for an account with no professional role. Only
        ever the caller's own. `Cache-Control: private, no-store`.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The applications.
          content:
            application/json:
              schema:
                type: object
                required: [applications]
                additionalProperties: false
                properties:
                  applications:
                    type: array
                    items: { $ref: "#/components/schemas/OnboardingApplication" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/onboarding/{role}:
    put:
      tags: [onboarding]
      operationId: saveMyOnboardingDetails
      summary: Save the details of an application (partial)
      description: |
        A **partial** save: a key that is absent is left unchanged; `null` (or `""`) clears a
        text field; a list replaces the stored list. Allowed while the application is `DRAFT`
        or `CHANGES_REQUESTED`. Values are validated as they are saved; whether everything
        required is there is only checked on submit.

        After a rejection (`REJECTED`, `can_reapply: true`) this call **starts a new
        application** for the same role with the details sent, and the account role goes back
        to `PENDING_VERIFICATION`. The rejected application is kept as history.

        Field errors are keyed by the field name. A field that does not apply to the role (see
        `GET /v1/onboarding/requirements`) is refused with "does not apply to this role".
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: role
          in: path
          required: true
          description: |
            An account role code, exactly as in `GET /v1/onboarding/requirements` (upper case).
            `403 FORBIDDEN` for a role that has no onboarding (CONSUMER, TENANT) and for any
            platform role; `404 ONBOARDING_NOT_FOUND` for a role the caller does not hold, an
            unknown role, or a role the caller holds without an application.
          schema: { type: string, examples: [SERVICE_PROVIDER] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingDetailsPatch" }
            example:
              business_name: Kopje Plumbing
              country: ZW
              city: harare
              trade: plumbing
              contact_phone: "+263771234567"
      responses:
        "200":
          description: The application after the save.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingApplicationEnvelope" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "409":
          $ref: "#/components/responses/OnboardingInvalidState"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN` (the role has no onboarding or is a platform role) or `CSRF_ORIGIN` (cookie session without the web app's `Origin`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          $ref: "#/components/responses/OnboardingNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/onboarding/{role}/documents:
    post:
      tags: [onboarding]
      operationId: uploadMyOnboardingDocument
      summary: Attach a document (multipart upload through the API)
      description: |
        `multipart/form-data` with two fields: `type` (a document code the role can attach,
        from `GET /v1/onboarding/requirements`) and `file`. Allowed while the application is
        `DRAFT` or `CHANGES_REQUESTED`.

        - At most **10 MB** per file and **10 documents** per application.
        - Only **PDF, JPEG and PNG**. The type is decided by **inspecting the content**; the
          part's `Content-Type` and the file extension are ignored. A PNG named `bill.pdf` is
          accepted as `image/png` and shown as `bill.png`; text named `x.pdf` is refused.
        - Uploading a type that is already attached **replaces** it.
        - The display name is sanitised (no path, letters, digits, spaces and `._-()` only, at
          most 100 characters).
        - Rate limited per IP: bursts of 20, 20 per minute.

        **The `LOGO` document is different (new in 0.17.0).** It is optional, offered to every
        role whose approval creates a public profile (see `GET /v1/onboarding/requirements`),
        and it is the **one upload that becomes public**: when the application is approved it
        becomes the logo of the profile (for an agent, their photo) and is shown on the profile
        and on the listings. Tell the applicant before they choose a file. The other documents
        stay private. Its rules are a logo's, not a document's: **PNG or JPEG only** (no PDF, no
        SVG, no GIF, no WebP, no animated PNG), at most **2 MB**, between **128x128** and
        **4096x4096** pixels. The document is kept as uploaded; the public copy made on approval
        is scaled down to fit 512x512 when it is larger (since 0.18.0). The owner can replace or remove it after approval with
        `PUT` / `DELETE /v1/me/profiles/{kind}/{slug}/logo`.

        There is no presigned upload and no malware scan yet (see the README).
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: role
          in: path
          required: true
          description: |
            An account role code, exactly as in `GET /v1/onboarding/requirements` (upper case).
            `403 FORBIDDEN` for a role that has no onboarding (CONSUMER, TENANT) and for any
            platform role; `404 ONBOARDING_NOT_FOUND` for a role the caller does not hold, an
            unknown role, or a role the caller holds without an application.
          schema: { type: string, examples: [SERVICE_PROVIDER] }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type: { type: string, description: "Document type code.", examples: [PROOF_OF_IDENTITY] }
                file: { type: string, format: binary }
      responses:
        "201":
          description: The stored document.
          content:
            application/json:
              schema:
                type: object
                required: [document]
                additionalProperties: false
                properties:
                  document: { $ref: "#/components/schemas/OnboardingDocument" }
        "400":
          description: "`VALIDATION_FAILED` with `fields.type` (missing, unknown, or not for this role) and/or `fields.file` (missing, empty, not a multipart upload, or - for `LOGO` - an image smaller than 128x128 or larger than 4096x4096 pixels)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`INVALID_STATE` (the application is not editable) or `TOO_MANY_DOCUMENTS` (it already holds 10)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "413":
          description: "`FILE_TOO_LARGE`: the file is larger than 10 MB (2 MB for `LOGO`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415":
          description: "`UNSUPPORTED_FILE_TYPE`: the content is not a PDF, a JPEG or a PNG (for `LOGO`: not a still PNG or JPEG image)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN` (the role has no onboarding or is a platform role) or `CSRF_ORIGIN` (cookie session without the web app's `Origin`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          $ref: "#/components/responses/OnboardingNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

