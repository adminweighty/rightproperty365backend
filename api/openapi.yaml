  /v1/agent/property-requests:
    get:
      tags: [organisation-workspace]
      operationId: listOrganisationPropertyRequests
      summary: Property requests received by the caller (organisation member or direct seller)
      description: |
        **Who may call it.** `200` when the signed-in user
        - has at least one organisation membership (any role), **or**
        - is the direct seller of at least one listing, **or**
        - holds the `PRIVATE_SELLER` account role (in any status, including
          `PENDING_VERIFICATION`).

        Otherwise `403 FORBIDDEN`; `401` when not signed in. Any other self-declared account role
        (for example `AGENT` without a membership) does not open this route.

        **What is returned** (decided on the server from the caller's user ID and memberships;
        there are no filter parameters). The union of:
        - for OWNER and MANAGER: every request whose recipient organisation is one of theirs;
        - for AGENT and STAFF: the requests of their organisation that are assigned to them
          personally or to the organisation inbox (no assigned agent) — not those assigned to a
          colleague;
        - for a direct seller: the requests routed to them for their own listings.

        The `PRIVATE_SELLER` / `LANDLORD` account role only opens the route. It never adds data:
        a user who declared it but sells nothing gets an empty `items` array. Requests of other
        organisations and of other sellers are never returned. `status` is the internal status;
        because unroutable requests have no recipient, `ROUTING_EXCEPTION` never appears here.

        **Changed in 0.20.0: paged and filtered.** Newest first (`created_at`, then id), one
        page at a time. The filters only narrow what the rules above allow; nothing a client
        sends can widen it. `total` counts the whole filter; `stage_counts` lists **every**
        stage in pipeline order with its count under the filters **other than** `stage` (so a
        stage tab bar can show all numbers while one stage is selected).
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: stage
          in: query
          description: One lead stage, or several separated by commas (or repeated).
          schema:
            type: string
          examples:
            several:
              value: NEW_ENQUIRY,FOLLOW_UP_REQUIRED
        - name: type
          in: query
          description: One request type.
          schema:
            type: string
            enum: [ENQUIRY, PROPERTY_INFORMATION, VIEWING_REQUEST, CONSULTATION_REQUEST, STAY_REQUEST]
        - name: listing_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Only requests created at or after this instant (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only requests created before this instant. Must be after `from`.
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          description: |
            Free text, at most 100 characters, matched case-insensitively (substring) against
            the reference, the customer's name, the customer's email and the message.
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/RequestPage"
        - $ref: "#/components/parameters/RequestPageSize"
      responses:
        "200":
          description: One page of the requests visible to the caller (possibly empty).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedPropertyRequestPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/agent/property-requests/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyRequestId"
    get:
      tags: [organisation-workspace]
      operationId: getReceivedPropertyRequest
      summary: One received property request, with its timeline and internal notes (new in 0.20.0)
      description: |
        The same rules as `GET /v1/agent/property-requests`: `401` when not signed in, `403`
        when the caller may not open the request inbox at all, and `404
        PROPERTY_REQUEST_NOT_FOUND` for a request the caller cannot see in their inbox (another
        organisation's, a colleague's, another seller's, a routing exception) exactly as for one
        that does not exist. `Cache-Control: private, no-store`.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedPropertyRequestEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/PropertyRequestNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"
    patch:
      tags: [organisation-workspace]
      operationId: movePropertyRequestStage
      summary: Move a received request to another lead stage (new in 0.20.0)
      description: |
        Who may call it and which requests: as `GET /v1/agent/property-requests/{id}` (any
        member who can see the request, OWNER and MANAGER for the whole organisation, the
        direct seller for their own). The stage, its `STAGE_CHANGED` timeline entry (who and
        when) and an outbox event `PROPERTY_REQUEST_STAGE_CHANGED` (identifiers and stages only)
        are written together. No email is sent.

        Allowed moves (anything else, including the current stage itself, is `409
        INVALID_STAGE_TRANSITION` and changes nothing):

        | From | To |
        | --- | --- |
        | NEW_ENQUIRY | ASSIGNED, CONTACTED, VIEWING_REQUESTED, VIEWING_SCHEDULED, FOLLOW_UP_REQUIRED, CLOSED |
        | ASSIGNED | CONTACTED, VIEWING_REQUESTED, VIEWING_SCHEDULED, FOLLOW_UP_REQUIRED, CLOSED |
        | CONTACTED | VIEWING_REQUESTED, VIEWING_SCHEDULED, FOLLOW_UP_REQUIRED, CONVERTED, CLOSED |
        | VIEWING_REQUESTED | CONTACTED, VIEWING_SCHEDULED, FOLLOW_UP_REQUIRED, CLOSED |
        | VIEWING_SCHEDULED | CONTACTED, VIEWING_REQUESTED, FOLLOW_UP_REQUIRED, CONVERTED, CLOSED |
        | FOLLOW_UP_REQUIRED | CONTACTED, VIEWING_REQUESTED, VIEWING_SCHEDULED, CONVERTED, CLOSED |
        | CONVERTED | CLOSED |
        | CLOSED | FOLLOW_UP_REQUIRED |

        Nothing ever returns to `NEW_ENQUIRY`. Moving to `ASSIGNED` only records the stage; to
        give the request to a person use `POST /v1/agent/property-requests/{id}/assign` (new in
        0.23.0), which also moves a `NEW_ENQUIRY` to `ASSIGNED`. An unknown stage is `400 VALIDATION_FAILED`
        (`error.fields.stage`). Per-IP rate limit: bursts of 60, refilled at 60 per minute,
        shared with the notes endpoint and resolving routing exceptions.
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stage]
              properties:
                stage:
                  $ref: "#/components/schemas/LeadStage"
      responses:
        "200":
          description: The request after the move (same shape as the GET).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedPropertyRequestEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN` (the caller may not open the inbox) or `CSRF_ORIGIN`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/PropertyRequestNotFound"
        "409":
          description: "`INVALID_STAGE_TRANSITION`: the stage cannot be reached from the current one. Nothing was changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/agent/property-requests/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/PropertyRequestId"
    post:
      tags: [organisation-workspace]
      operationId: addPropertyRequestNote
      summary: Add an internal note to a received request (new in 0.20.0)
      description: |
        Who may call it and which requests: as `PATCH /v1/agent/property-requests/{id}`. A note
        is internal to the receiving side: everyone who can see the request in their inbox
        reads it, and it is **never** returned by any customer endpoint. The timeline records
        `NOTE_ADDED` (who and when, never the text). Notes cannot be edited or deleted.
        `body` is trimmed, 1 to 2000 characters, no control characters other than line breaks
        and tabs. Same rate limit as the PATCH.
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "201":
          description: The note was stored. The body is the whole request, notes included (same shape as the GET).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedPropertyRequestEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN` (the caller may not open the inbox) or `CSRF_ORIGIN`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/PropertyRequestNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/agent/property-requests/{id}/assign:
    parameters:
      - $ref: "#/components/parameters/PropertyRequestId"
    post:
      tags: [organisation-workspace]
      operationId: assignPropertyRequest
      summary: Give a received request to a member, or back to the organisation inbox (new in 0.23.0)
      description: |
        `{"user_id": "<uuid>"}` assigns the request to that member; `{"user_id": null}` returns it
        to the organisation inbox. The key is required.

        **Who.** The OWNER and MANAGER of the organisation that received the request (`403
        FORBIDDEN` for its AGENT and STAFF, and for a direct seller's own request); a request the
        caller cannot see is `404 PROPERTY_REQUEST_NOT_FOUND`. **To whom.** An ACTIVE member of
        that organisation whose role holds leads: AGENT, MANAGER or OWNER (STAFF hold no leads);
        anyone else is `400 VALIDATION_FAILED` on `user_id`.

        **What happens**, in one transaction: the request's `assigned_to` changes (the assignee,
        and the organisation's OWNER and MANAGER, see it; the other agents and staff no longer
        do, until it is returned to the inbox); an `ASSIGNED` timeline entry (who, to whom) or an
        `UNASSIGNED` one; a request at `NEW_ENQUIRY` moves to `ASSIGNED` (with its
        `STAGE_CHANGED` entry); the outbox event `PROPERTY_REQUEST_ASSIGNED`, which emails the
        assignee (reference, listing and a message preview without contact details; nothing is
        sent for an unassignment); the audit record `REQUEST_ASSIGNED` or `REQUEST_UNASSIGNED`.
        Assigning to the current assignee changes nothing. The answer is the request as the GET
        returns it. Same rate limit as the PATCH.
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id]
              properties:
                user_id:
                  type: [string, "null"]
                  format: uuid
      responses:
        "200":
          description: The request after the assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedPropertyRequestEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN` (not the organisation's owner or manager) or `CSRF_ORIGIN`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/PropertyRequestNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/agent/organisations/{id}/members:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
    get:
      tags: [organisation-workspace]
      operationId: listOrganisationMembers
      summary: The members of an organisation, with what the caller may do to each (changed in 0.23.0)
      description: |
        For the OWNER and MANAGER of that organisation (the dashboard's
        `organisations[].can_manage_team`). Another member of the organisation gets `403
        FORBIDDEN`; anyone who is not an ACTIVE member gets `404 ORGANISATION_NOT_FOUND`, the same
        as for an organisation that does not exist (a suspended or removed member included, from
        their next request on). `401` when not signed in. `Cache-Control: private, no-store`.

        Removed members are not listed; suspended ones are (`status: SUSPENDED`). No email
        address or phone number is returned. Ordered by role (OWNER, MANAGER, AGENT, STAFF) then
        name. **Changed in 0.23.0 (additive):** each item gains `job_title`, `joined_at`,
        `open_leads` (open requests assigned to the member), `can_change` and `allowed_roles`
        (whether and to which roles the caller may change this member) and `can_hold_leads`.
        Inviting, changing, suspending and removing members are built (see the operations below).
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationMembers"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OrganisationNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/agent/organisations/{id}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [organisation-workspace]
      operationId: changeOrganisationMember
      summary: Change a member's role, status or job title (new in 0.23.0)
      description: |
        OWNER and MANAGER of the organisation only (`403 FORBIDDEN` for AGENT and STAFF, `404
        ORGANISATION_NOT_FOUND` for anyone else). Send at least one of the keys; the others stay.

        **The rules.** An OWNER may act on MANAGER, AGENT and STAFF members and give them any of
        those roles; a MANAGER only on AGENT and STAFF members, and only those roles (`403
        ROLE_NOT_ALLOWED` otherwise: only an owner makes someone a manager, and nobody makes
        someone an owner). Nobody changes an OWNER (`403 OWNER_PROTECTED`; `409 LAST_OWNER` when
        that owner is the organisation's only active owner) and nobody changes their own
        membership (`403 SELF_CHANGE_FORBIDDEN`). `404 MEMBER_NOT_FOUND` for someone who is not a
        member (or was removed).

        **Effect is immediate.** `status: SUSPENDED` takes every access to the organisation away
        from the member's next request on (same session); `ACTIVE` gives it back. When a member
        is suspended, their open requests (not `CONVERTED` or `CLOSED`) and open appointments go
        back to the organisation inbox (nobody assigned), each with an `UNASSIGNED` timeline
        entry. A member who becomes `STAFF` gives back their open requests (STAFF hold no leads).
        Every change is written to the team's audit trail (`MEMBER_ROLE_CHANGED`,
        `MEMBER_SUSPENDED`, `MEMBER_REACTIVATED`, `MEMBER_JOB_TITLE_CHANGED`, with the released
        counts). Rate limit: bursts of 30, refilled at 30 per minute, shared by every team change.
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role:
                  type: string
                  enum: [MANAGER, AGENT, STAFF]
                status:
                  type: string
                  enum: [ACTIVE, SUSPENDED]
                job_title:
                  type: string
                  maxLength: 80
                  description: Plain text, one line; an empty string clears it.
      responses:
        "200":
          description: The member after the change.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [member]
                properties:
                  member:
                    $ref: "#/components/schemas/TeamMember"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/TeamForbidden"
        "404":
          $ref: "#/components/responses/TeamNotFound"
        "409":
          $ref: "#/components/responses/TeamConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [organisation-workspace]
      operationId: removeOrganisationMember
      summary: Remove a member (new in 0.23.0)
      description: |
        The same rules as the PATCH. The membership becomes `REMOVED`: the person is no longer
        listed and has no access to the organisation from their next request on. Their open
        requests and open appointments go back to the organisation inbox (`UNASSIGNED` timeline
        entries). Their public agent profile, if they have one, is not changed. A removed person
        can be invited again. Audit: `MEMBER_REMOVED` (with the released counts).
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/TeamForbidden"
        "404":
          $ref: "#/components/responses/TeamNotFound"
        "409":
          $ref: "#/components/responses/TeamConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/agent/organisations/{id}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
    get:
      tags: [organisation-workspace]
      operationId: listOrganisationInvitations
      summary: The organisation's pending invitations (new in 0.23.0)
      description: |
        OWNER and MANAGER only. The `PENDING` invitations, newest first; an expired one is still
        listed with `expired: true` (invite the address again to send a new link).
        `Cache-Control: private, no-store`.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The pending invitations.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamInvitation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OrganisationNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [organisation-workspace]
      operationId: inviteOrganisationMember
      summary: Invite someone to the team with a role (new in 0.23.0)
      description: |
        An OWNER invites a MANAGER, AGENT or STAFF; a MANAGER an AGENT or STAFF (`403
        ROLE_NOT_ALLOWED` otherwise; nobody is invited as OWNER). `email` is trimmed and
        lower-cased. Someone who already belongs to the organisation (active or suspended) is
        `409 ALREADY_A_MEMBER`.

        The invitation is a single-use link `PUBLIC_WEB_URL/invitations/{token}`, valid for 7
        days. Only the SHA-256 of the token is stored; the token is in the email and nowhere
        else (it is not returned here). The email is sent at once from this request (a link that
        is a credential never goes through the outbox); an address on a reserved test domain
        (`@example.test` and the like) is not emailed by the real mail provider. Inviting an
        address that already has a pending invitation **replaces** it: only the newest link
        works. Audit: `INVITATION_CREATED`. Rate limit: the team bucket (30 per minute).
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                role:
                  type: string
                  enum: [MANAGER, AGENT, STAFF]
                job_title:
                  type: string
                  maxLength: 80
      responses:
        "201":
          description: The invitation (without its token).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invitation]
                properties:
                  invitation:
                    $ref: "#/components/schemas/TeamInvitation"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/TeamForbidden"
        "404":
          $ref: "#/components/responses/OrganisationNotFound"
        "409":
          $ref: "#/components/responses/TeamConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/agent/organisations/{id}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [organisation-workspace]
      operationId: cancelOrganisationInvitation
      summary: Cancel a pending invitation (new in 0.23.0)
      description: |
        OWNER and MANAGER, for the roles they may give (`403 ROLE_NOT_ALLOWED`: a manager cannot
        cancel a MANAGER invitation). The link stops working at once. `404 INVITATION_NOT_FOUND`
        for another organisation's invitation; `410 INVITATION_NO_LONGER_VALID` when it was
        already accepted, cancelled or replaced. Audit: `INVITATION_CANCELLED`.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/TeamForbidden"
        "404":
          $ref: "#/components/responses/TeamNotFound"
        "410":
          $ref: "#/components/responses/InvitationGone"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/agent/organisations/{id}/join-requests:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
    get:
      tags: [organisation-workspace]
      operationId: listJoinRequests
      summary: People who asked to join the agency (new in 0.23.0)
      description: |
        OWNER and MANAGER only. A **join request** is a submitted onboarding application for a
        role whose approval makes the applicant a member of an agency (`AGENT`, `SALES_AGENT`,
        `LETTINGS_AGENT` become AGENT, `AGENCY_STAFF` becomes STAFF, `AGENCY_ADMIN` becomes
        MANAGER) and that names this organisation's verified agency profile. Oldest first, at
        most 100. `can_decide` is true when the caller may approve or decline it (an OWNER any, a
        MANAGER only those that become AGENT or STAFF). The applicant's email address is masked
        and the documents are not shown (they are for the verification team). An organisation
        without a verified agency profile has none. `Cache-Control: private, no-store`.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The pending join requests.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/JoinRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OrganisationNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/agent/organisations/{id}/join-requests/{requestId}/approve:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
      - $ref: "#/components/parameters/JoinRequestId"
    post:
      tags: [organisation-workspace]
      operationId: approveJoinRequest
      summary: Approve a join request on behalf of the agency (new in 0.23.0)
      description: |
        No body. Exactly what a platform reviewer's approval does
        (`POST /v1/admin/onboarding/{id}/approve`): the membership (with the applicant's job
        title), the public agent profile for an agent, the `ACTIVE` account role, and the
        `ONBOARDING_APPROVED` email to the applicant. **Whoever decides first wins**: when the
        verification team (or another manager) decided it already, `409
        JOIN_REQUEST_ALREADY_DECIDED`; the reviewer coming second gets `409 INVALID_STATE`.
        `403 ROLE_NOT_ALLOWED` when the caller's role may not grant the membership it asks for;
        `404 JOIN_REQUEST_NOT_FOUND` for one that is not a join request of this agency. A
        requirement added since it was submitted is `400 VALIDATION_FAILED`. Audit:
        `JOIN_REQUEST_APPROVED`.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          $ref: "#/components/responses/JoinRequestDecided"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/TeamForbidden"
        "404":
          $ref: "#/components/responses/TeamNotFound"
        "409":
          $ref: "#/components/responses/TeamConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/agent/organisations/{id}/join-requests/{requestId}/decline:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
      - $ref: "#/components/parameters/JoinRequestId"
    post:
      tags: [organisation-workspace]
      operationId: declineJoinRequest
      summary: Decline a join request on behalf of the agency (new in 0.23.0)
      description: |
        `reason` (5 to 500 characters, plain text) is emailed to the applicant
        (`ONBOARDING_REJECTED`). Like a reviewer's rejection, the account role becomes
        `REJECTED` and the applicant may apply again. Same rules and answers as the approval.
        Audit: `JOIN_REQUEST_DECLINED`.
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 5
                  maxLength: 500
      responses:
        "200":
          $ref: "#/components/responses/JoinRequestDecided"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/TeamForbidden"
        "404":
          $ref: "#/components/responses/TeamNotFound"
        "409":
          $ref: "#/components/responses/TeamConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/agent/organisations/{id}/audit:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
    get:
      tags: [organisation-workspace]
      operationId: listOrganisationAudit
      summary: The team's audit trail (new in 0.23.0)
      description: |
        OWNER and MANAGER only. Newest first, paged. One record per invitation sent, cancelled
        or accepted, join request decided (by the agency or by the verification team: `after.decided_by`
        is `ORGANISATION` or `PLATFORM`), role, status or job title changed, member removed, and
        request assigned or returned to the organisation inbox: who, on what, the values before
        and after, and when. Records are kept in the database and cannot be changed. They never
        carry a token, a document or a customer's contact details. `Cache-Control: private,
        no-store`.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/RequestPage"
        - $ref: "#/components/parameters/RequestPageSize"
      responses:
        "200":
          description: One page of the audit trail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamAuditPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OrganisationNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    get:
      tags: [organisation-workspace]
      operationId: getInvitation
      summary: What an invitation link is for (public, new in 0.23.0)
      description: |
        No session needed: anyone holding the link sees the organisation, the role, the inviter's
        name, the invited address **masked** and the expiry, so the web can show the invitation
        page before the person signs in or signs up. `404 INVITATION_NOT_FOUND` for an unknown
        token, `410 INVITATION_EXPIRED` after 7 days, `410 INVITATION_NO_LONGER_VALID` once it
        was accepted, cancelled or replaced by a newer invitation. Per-IP rate limit: bursts of
        20, refilled at 20 per minute (shared with the accept). `Cache-Control: private,
        no-store`.
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invitation]
                properties:
                  invitation:
                    $ref: "#/components/schemas/PublicInvitation"
        "404":
          $ref: "#/components/responses/TeamNotFound"
        "410":
          $ref: "#/components/responses/InvitationGone"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/invitations/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    post:
      tags: [organisation-workspace]
      operationId: acceptInvitation
      summary: Accept an invitation (signed in, new in 0.23.0)
      description: |
        No body. Signed in with a customer session (`401` otherwise; an administrator session
        is `403 FORBIDDEN`). The signed-in account's email address must be the invited one (`403
        INVITATION_EMAIL_MISMATCH`); a person without an account signs up first with the invited
        address (the normal registration), then accepts. A property seeker account (`CONSUMER`,
        `TENANT`) cannot hold a professional role: `409 SEEKER_ACCOUNT_CANNOT_JOIN`. Someone who
        already belongs to the organisation: `409 ALREADY_A_MEMBER`. Unknown, expired, used:
        as the GET.

        Creates an ACTIVE membership with the invited role and job title (a removed member's
        membership is reinstated), from the next request on. In an agency the matching account
        role becomes `ACTIVE` (`AGENCY_ADMIN` for MANAGER, `AGENT`, `AGENCY_STAFF` for STAFF), and
        an AGENT gets a verified public agent profile linked to the agency (`profile`), as an
        approved onboarding application gives. The invitation becomes `ACCEPTED` (single use).
        Audit: `INVITATION_ACCEPTED`.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedInvitation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/TeamForbidden"
        "404":
          $ref: "#/components/responses/TeamNotFound"
        "409":
          $ref: "#/components/responses/TeamConflict"
        "410":
          $ref: "#/components/responses/InvitationGone"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/dashboard:
    get:
      tags: [account]
      operationId: getMyDashboard
      summary: One role-aware summary for the signed-in account (new in 0.20.0)
      description: |
        Everything a client needs to draw the home page after sign-in without knowing role
        rules. Any signed-in caller (`401` otherwise); never `403`. Every number and list is
        scoped exactly as the endpoint it summarises (`GET /v1/agent/property-requests`,
        `GET /v1/inbox/summary`, `GET /v1/inbox/appointments`, `GET /v1/me/listings`,
        `GET /v1/me/property-requests`, `GET /v1/me/appointments`, `GET /v1/me/onboarding`), so
        a dashboard never shows more than those. `Cache-Control: private, no-store`.

        **`kind`** says which dashboard applies:
        - `SEEKER`: only seeker roles (`CONSUMER`, `TENANT`) or none.
        - `PROFESSIONAL_PENDING`: holds a professional, business or owner role and nothing is
          approved yet (no membership, not an approved direct owner). `onboarding` and
          `next_actions` say what to do.
        - `PROFESSIONAL`: a verified member of at least one organisation (`organisations` lists
          each, with the caller's role there). May also be a direct owner (`direct_owner`).
        - `DIRECT_OWNER`: an approved `LANDLORD` or `PRIVATE_SELLER` with no organisation.
        - `ADMIN`: an administrator's session. Everything else is empty and the only next
          action is `OPEN_ADMIN_OVERVIEW` (use `GET /v1/admin/overview`).

        **Counters** (`counters[]`, each `{key, label, value, group, target}`; a counter is
        present only when its section applies; keys are stable, labels may change):

        | key | group | present when |
        | --- | --- | --- |
        | `requests.new` (stage NEW_ENQUIRY), `requests.open` (not CONVERTED or CLOSED) | `requests` | `capabilities.receives_requests` |
        | `requests.stage.<STAGE>` for each of the 8 stages, in pipeline order | `requests_by_stage` | `capabilities.receives_requests` |
        | `business_enquiries.new` | `business_enquiries` | `capabilities.receives_business_enquiries` |
        | `appointments.requested`, `appointments.reschedule_requested`, `appointments.upcoming_confirmed` | `appointments` | `capabilities.manages_appointments` |
        | `listings.total`, `listings.status.PUBLISHED`, then `listings.status.<STATUS>` for every other status the caller has, alphabetically | `listings` | `capabilities.manages_listings` |
        | `short_stays.calendar_stale` (PUBLISHED short stays whose calendar was never set or not changed for 30 days) | `listings` | the caller manages at least one short stay |
        | `my_requests.total`, `my_requests.open` (not CLOSED), `my_requests.status.<STATUS>` for each customer status | `my_activity` | `SEEKER`, or anyone who sent a request while signed in |
        | `my_appointments.upcoming`, `my_appointments.needs_reply` | `my_activity` | `SEEKER`, or anyone with an upcoming appointment of their own |

        **Next actions** (`next_actions[]`, each `{code, text, target, count, role}`):
        `RESPOND_TO_NEW_REQUESTS`, `FOLLOW_UP_REQUESTS`, `RESPOND_TO_BUSINESS_ENQUIRIES`,
        `CONFIRM_APPOINTMENTS`, `REVIEW_RESCHEDULES`, `UPDATE_SHORT_STAY_CALENDARS`,
        `REPLY_TO_APPOINTMENT` (each only when its count is above zero, with `count`),
        `COMPLETE_ONBOARDING`, `UPDATE_ONBOARDING`, `AWAIT_VERIFICATION`, `REAPPLY_ONBOARDING`
        (one per application in `DRAFT`, `CHANGES_REQUESTED`, `SUBMITTED`, `REJECTED`, with
        `role`), `FIND_A_PROPERTY` (seekers), `OPEN_ADMIN_OVERVIEW` (admin sessions).
        `needs_attention` is the sum of the `count`s.

        **Targets** (`counters[].target`, `next_actions[].target`), each mapped by the client to
        one of its own pages: `search`, `my_requests`, `my_appointments`, `onboarding`,
        `requests`, `business_enquiries`, `appointments`, `listings`, `team`,
        `admin_overview`.

        **Recent items**: `recent.received_requests` (the 5 newest in the caller's inbox),
        `recent.my_requests` (the 5 newest the caller sent), `recent.appointments` (the next 5
        upcoming, soonest first, from both sides; `side` says which).
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/property-requests:
    get:
      tags: [account]
      operationId: listMyPropertyRequests
      summary: The property requests this account sent (new in 0.20.0)
      description: |
        The requests sent **while signed in** as this account (linked by account id). A request
        sent as a guest is never linked, even when its email address is the account's. Newest
        first. Any signed-in caller (`401` otherwise). `status_counts` lists every customer
        status with the account's count, whatever the filter. Never returns the lead stage, an
        internal note, the recipient or whether routing failed. `Cache-Control: private,
        no-store`.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: status
          in: query
          description: One customer status, or several separated by commas (or repeated).
          schema:
            type: string
          examples:
            several:
              value: RECEIVED,IN_PROGRESS
        - $ref: "#/components/parameters/RequestPage"
        - $ref: "#/components/parameters/RequestPageSize"
      responses:
        "200":
          description: One page (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPropertyRequestPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/property-requests/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyRequestId"
    get:
      tags: [account]
      operationId: getMyPropertyRequest
      summary: One property request this account sent, with its customer timeline (new in 0.20.0)
      description: |
        `404 PROPERTY_REQUEST_NOT_FOUND` for a request this account did not send (including
        for its recipient: the receiving side uses `GET /v1/agent/property-requests/{id}`).
        `timeline` holds `RECEIVED` and one `STATUS_CHANGED` entry each time the customer
        status changed; stage moves that do not change it, notes and people are left out.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request]
                properties:
                  request:
                    $ref: "#/components/schemas/CustomerPropertyRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PropertyRequestNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/admin/listings:
    get:
      tags: [admin, listings]
      operationId: adminListListings
      summary: The listing review queue
      description: |
        New in 0.22.0. Requires an **admin-scope** session and one of SUPER_ADMIN,
        PLATFORM_ADMIN, MODERATOR or MARKET_ADMIN (only its own countries). One page, **oldest
        submission first**, of the listings whose status **or** whose pending changes' status is
        `status` (default `PENDING_REVIEW`, so new listings and edits of published ones are one
        queue; `kind` narrows to `NEW` or `EDIT`). `q` matches the title (also the proposed one)
        or the exact reference.
      security:
        - cookieSession: []
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ListingStatus" }
        - name: kind
          in: query
          schema: { type: string, enum: [NEW, EDIT] }
        - name: country
          in: query
          schema: { type: string, pattern: "^[A-Za-z]{2}$" }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
      responses:
        "200":
          description: One page of the queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingQueuePage" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/listings/{id}:
    parameters:
      - $ref: "#/components/parameters/ManagedListingId"
    get:
      tags: [admin, listings]
      operationId: adminGetListing
      summary: A listing as its reviewer sees it
      description: |
        New in 0.22.0. `ManagedListing` (photos included: their URLs work with the reviewer's
        session) plus `review_kind`, `live` (the public content while an edit waits), `changes`
        (the fields an edit changes, before and after), `photo_changes`, `decisions` and the
        timeline with `actor_user_id`. A listing of another country for a MARKET_ADMIN is `404`.
      security:
        - cookieSession: []
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminListingEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ListingNotFound"

  /v1/admin/listings/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ManagedListingId"
    post:
      tags: [admin, listings]
      operationId: adminApproveListing
      summary: Approve a listing, or the changes of a published one
      description: |
        New in 0.22.0. No body (or `{}`). A new listing (`review_kind: NEW`) becomes `PUBLISHED`
        for 90 days from now (a new publication cycle); pending changes (`EDIT`) are written
        onto the published listing, whose dates stay. Every photo of the listing becomes
        approved. Records the reviewer and the time (`review.reviewed_at`,
        `verification.listing_reviewed`), a timeline entry and the outbox events
        `LISTING_PUBLISHED` / `LISTING_UPDATED` (search index) and `LISTING_APPROVED` (email to
        the advertiser). `409 LISTING_STATE_CONFLICT` when nothing waits for review.
      security:
        - cookieSession: []
      responses:
        "200":
          description: The listing after the decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminListingEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ReviewForbidden"
        "404":
          $ref: "#/components/responses/ListingNotFound"
        "409":
          $ref: "#/components/responses/ListingStateConflict"

  /v1/admin/listings/{id}/request-changes:
    parameters:
      - $ref: "#/components/parameters/ManagedListingId"
    post:
      tags: [admin, listings]
      operationId: adminRequestListingChanges
      summary: Ask the advertiser for changes
      description: |
        New in 0.22.0. `{"reason": "..."}` (required, plain text, at most 1000 characters). A new
        listing becomes `CHANGES_REQUESTED`; pending changes become `CHANGES_REQUESTED` (the
        published version stays public). The advertiser is emailed the reason
        (`LISTING_CHANGES_REQUESTED`).
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewReason" }
      responses:
        "200":
          description: The listing after the decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminListingEnvelope" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/ReviewForbidden"
        "404":
          $ref: "#/components/responses/ListingNotFound"
        "409":
          $ref: "#/components/responses/ListingStateConflict"

  /v1/admin/listings/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/ManagedListingId"
    post:
      tags: [admin, listings]
      operationId: adminRejectListing
      summary: Reject a listing, or the changes of a published one
      description: |
        New in 0.22.0. `{"reason": "..."}` (required). A new listing becomes `REJECTED` (final;
        its advertiser may only delete it). Rejected pending changes are dropped with their new
        photos (and the photos' files); the published version stays and `pending_changes` shows
        `REJECTED` with the reason until the next edit. The advertiser is emailed the reason
        (`LISTING_REJECTED`).
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewReason" }
      responses:
        "200":
          description: The listing after the decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminListingEnvelope" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/ReviewForbidden"
        "404":
          $ref: "#/components/responses/ListingNotFound"
        "409":
          $ref: "#/components/responses/ListingStateConflict"

  /v1/admin/overview:
    get:
      tags: [admin]
      operationId: getAdminOverview
      summary: The counts an administrator starts from (new in 0.20.0)
      description: |
        Requires an `admin` session holding any platform role (`401` / `403` otherwise). Each
        role gets only the sections it covers; a section it may not see is **null** and is left
        out of `sections`:
        - `accounts` (names and email addresses of recent sign-ups): SUPER_ADMIN,
          PLATFORM_ADMIN, SUPPORT. Administrator accounts are counted in `administrators`
          only.
        - `verifications`: whoever may open `GET /v1/admin/onboarding` (SUPER_ADMIN,
          PLATFORM_ADMIN, MODERATOR, and MARKET_ADMIN for its own markets).
        - `listings`: SUPER_ADMIN, PLATFORM_ADMIN, MODERATOR, and MARKET_ADMIN for its own
          markets. A PUBLISHED listing whose period is over counts as EXPIRED.
        - `requests` (with routing exceptions, which are not in `by_stage`): SUPER_ADMIN,
          PLATFORM_ADMIN, SUPPORT, and MARKET_ADMIN for its own markets.

        FINANCE_ADMIN and CONTENT_ADMIN get no section (nothing they work on is built).
        `market_codes` is null when every country is counted. `Cache-Control: private,
        no-store`.
      security:
        - cookieSession: []
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/admin/routing-exceptions:
    get:
      tags: [admin]
      operationId: listRoutingExceptions
      summary: Property requests nobody could receive (new in 0.20.0)
      description: |
        SUPER_ADMIN, PLATFORM_ADMIN, SUPPORT, and MARKET_ADMIN for its own markets, on an
        `admin` session (`401` / `403` otherwise). The longest-waiting first. Items carry the
        customer's `contact` so the request can be passed on by hand; reassigning a request to
        a recipient is not built. `Cache-Control: private, no-store`.
      security:
        - cookieSession: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [OPEN, RESOLVED, ALL]
            default: OPEN
        - $ref: "#/components/parameters/RequestPage"
        - $ref: "#/components/parameters/RequestPageSize"
      responses:
        "200":
          description: One page (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingExceptionPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/admin/routing-exceptions/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/PropertyRequestId"
    post:
      tags: [admin]
      operationId: resolveRoutingException
      summary: Mark a routing exception as dealt with (new in 0.20.0)
      description: |
        Who may: as `GET /v1/admin/routing-exceptions`. A request that is not a routing
        exception, or is in another market than a MARKET_ADMIN's, is `404
        PROPERTY_REQUEST_NOT_FOUND`; one already resolved is `409 ALREADY_RESOLVED`. The request
        stays a routing exception with no recipient; this only records that someone dealt with
        it (timeline `ROUTING_EXCEPTION_RESOLVED`, outbox `PROPERTY_REQUEST_EXCEPTION_RESOLVED`,
        an audit log line). The body is optional. Same rate limit as the request PATCH.
      security:
        - cookieSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type: string
                  maxLength: 2000
                  description: What was done, for other administrators. Optional.
      responses:
        "200":
          description: The resolved exception.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request]
                properties:
                  request:
                    $ref: "#/components/schemas/RoutingException"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN` or `CSRF_ORIGIN`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/PropertyRequestNotFound"
        "409":
          description: "`ALREADY_RESOLVED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/appointments:
    post:
      tags: [appointments]
      operationId: createAppointment
      summary: Ask for an appointment (signed-in customer)
      description: |
        Creates an appointment in status `REQUESTED` for the signed-in customer: a property
        `VIEWING` of a listing, or a `CONSULTATION` with a listing's advertiser (`listing_id`) or
        with a directory profile (`recipient`, for example a solicitor or an estate agent).
        Send **exactly one** of `listing_id` and `recipient`; a `VIEWING` needs `listing_id`.

        The appointment is routed with the same rules as property requests (the listing's
        assigned agent, else the organisation, else the direct owner) and business enquiries
        (the profile's organisation; for an agent profile the named agent). It is **not
        confirmed** until the professional confirms it.

        The customer's name and email come from the account. `phone` is required when
        `preferred_contact_method` is `PHONE` or `WHATSAPP`. These contact details are returned
        only to the professional, by `/v1/inbox/appointments`.

        Idempotent exactly like property requests: `idempotency_key` in the body or the
        `Idempotency-Key` header (the body wins); the same key with the same content answers
        `200` with the original appointment, the same key with different content `409
        IDEMPOTENCY_CONFLICT`. The key space is separate from requests and enquiries.

        Own per-IP rate limit: bursts of 10, refilled at 10 per minute.

        The other way an appointment is created is `POST /v1/property-requests` with a
        `preferred_slot_utc` (guests included).
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreate"
            examples:
              viewing:
                value:
                  type: VIEWING
                  listing_id: 0195c0de-0000-7000-8000-000000000001
                  start_utc: "2026-11-17T08:00:00Z"
                  note: I would like to see the garden as well.
                  preferred_contact_method: EMAIL
                  idempotency_key: 6f1c2f0a-8f0e-4f43-9a55-2f6f3f1f9c11
                  consent: { privacy_version: "2026-01", accepted: true }
              consultation:
                value:
                  type: CONSULTATION
                  recipient: { kind: solicitors, slug: sample-law-chambers }
                  start_utc: "2026-11-18T12:00:00Z"
                  duration_minutes: 60
                  preferred_contact_method: PHONE
                  phone: "+263771234567"
                  idempotency_key: 0b0f5d0e-3a53-4f1e-9a0e-7b1f0f3f2a10
                  consent: { privacy_version: "2026-01", accepted: true }
      responses:
        "201":
          description: Created and committed, in status `REQUESTED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAppointmentEnvelope"
        "200":
          description: Idempotent replay; the original appointment (in its current state).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAppointmentEnvelope"
        "400":
          description: |
            `VALIDATION_FAILED` or `INVALID_JSON`. Fields: `type`, `listing_id` (missing, not a
            UUID, neither target given, or a VIEWING without a listing), `recipient` (both targets
            given), `recipient.kind`, `recipient.slug`, `start_utc` (not RFC 3339, not in the
            future, or more than 12 months ahead), `duration_minutes` (15 to 240), `note`,
            `preferred_contact_method`, `phone`, `idempotency_key`, `consent`,
            `consent.privacy_version`, `consent.accepted`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "404":
          description: "`LISTING_NOT_FOUND` (also, since 0.17.0, for a listing whose advertiser is not verified right now) or `RECIPIENT_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`: the key was already used for different content."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: |
            `LISTING_UNAVAILABLE` (not published, expired, or nobody can receive appointments for
            it) or `RECIPIENT_UNAVAILABLE` (the profile is suspended, unverified, or has nobody to
            receive appointments).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/appointments:
