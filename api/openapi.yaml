        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/agreements:
    get:
      tags: [agreements]
      operationId: listMyAgreements
      summary: The agreements the caller sent or sees (Adobe's Manage page)
      description: |
        Who may (`403` otherwise): whoever may manage listings, as for leases; OWNER and MANAGER see
        every agreement of their organisation. `view`: `WAITING_FOR_YOU` (out for signature and an
        ACTIVE recipient has the caller's address), `WAITING_FOR_OTHERS`, `COMPLETED`, `DRAFTS`.
        An agreement whose expiry passed is `EXPIRED` from the first read on.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: view
          in: query
          schema: {type: string, enum: [WAITING_FOR_YOU, WAITING_FOR_OTHERS, COMPLETED, DRAFTS]}
        - $ref: "#/components/parameters/AgreementStatusFilter"
        - $ref: "#/components/parameters/RequestPage"
        - $ref: "#/components/parameters/RequestPageSize"
      responses:
        "200":
          description: One page, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [agreements]
      operationId: createAgreement
      summary: Prepare an agreement for a PDF to upload (DRAFT)
      description: |
        `name` is required; `recipients` (at most 20): `name`, `email` (each a different address),
        `role` (`SIGNER` | `APPROVER` | `CC`) and `order` (1-20; the same order acts in parallel,
        order n is emailed once every earlier order finished; a CC is never asked to act and gets
        the completed copy). The sender may add themselves. `expires_at` defaults to 30 days;
        `reminder_frequency` to `NONE`. Then upload the PDF (`PUT .../document`), place the fields
        (`PUT .../fields`) and send.
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgreementInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

