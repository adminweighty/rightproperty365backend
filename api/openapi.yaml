      description: |
        Requires an **admin-scope** session and one of SUPER_ADMIN, PLATFORM_ADMIN, MODERATOR
        or MARKET_ADMIN. A MARKET_ADMIN only sees applications of its own market (the market
        of the application's city, or of the agency being joined); applications that belong to
        no market yet (a draft without a city, a private seller) are for the global roles only.

        One page of the applications in `status` (default `SUBMITTED`), **oldest submission
