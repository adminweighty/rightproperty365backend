      operationId: cancelMyAppointment
      summary: Cancel (customer)
      description: |
        `REQUESTED`, `CONFIRMED` or `RESCHEDULE_REQUESTED` -> `CANCELLED` with `cancelled_by`
        `CUSTOMER`. The body is optional. The professional is told by email.
      security:
        - cookieSession: []
