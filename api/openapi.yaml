openapi: 3.1.0
info:
  title: RightProperty365 API
  version: 0.3.0
  summary: Multi-country property marketplace API (Zimbabwe first).
  description: |
    Versioned REST API for RightProperty365.

    Conventions
    - Every error response uses the `ErrorEnvelope` shape. Branch on `error.code`, not on `error.message`.
    - Every response carries an `X-Request-Id` header. Clients may supply their own
      (1-128 characters of `A-Z a-z 0-9 . _ -`); otherwise one is generated. The same value is
      returned as `trace_id` in error bodies.
    - Timestamps are RFC 3339 in UTC.
    - Request bodies must be `application/json`, at most 64 KB, and must not contain unknown fields.

    Authentication
    - Sessions are opaque random tokens. The web app receives the token in the HttpOnly cookie
      `rp_session` (SameSite=Lax, Path=/, Secure outside development); mobile clients log in with
      `"token_delivery": "bearer"`, receive `access_token` in the body and send
      `Authorization: Bearer <token>`. When an `Authorization` header is present the cookie is ignored.
    - A session lasts at most 30 days and ends after 14 days without use. An invalid, expired or
      revoked token is treated as "not signed in" (routes that need a user answer `401 UNAUTHENTICATED`).
    - CORS: allowlisted origins may send credentials (`Access-Control-Allow-Credentials: true`,
      never with `*`). Browser clients must use `credentials: "include"`.
    - CSRF: a request authenticated by the **cookie** with a method other than GET/HEAD/OPTIONS must
      carry an allowlisted `Origin` header, otherwise it is rejected with `403 CSRF_ORIGIN`. Bearer
      requests are exempt.
    - Authorisation is decided on the server from the session's organisation memberships and
      platform roles. Nothing in a request body, query string or header can widen it.
    - Every `POST /v1/auth/*` route shares one per-IP rate limit (bursts of 20, refilled at 20 per
      minute), separate from the property-request limit.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
  - name: markets
  - name: property-requests
  - name: auth
  - name: account
  - name: organisation-workspace

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      description: Always 200 while the process is running. Does not check dependencies.
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ok

  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Pings the database when one is configured. In development without `DATABASE_URL`
        the API runs on in-memory stores and reports `"store": "memory"`.
      responses:
        "200":
          description: Ready to serve traffic.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                required: [status, store]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ready
                  store:
                    type: string
                    enum: [memory, postgres]
        "503":
          description: The database is not reachable (`NOT_READY`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/markets:
    get:
      tags: [markets]
      operationId: listMarkets
      summary: List markets
      description: Returns all markets, active markets first, then by country code.
      responses:
        "200":
          description: The markets.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Market"
              example:
                data:
                  - id: 0195c0de-0000-7000-8000-00000000a001
                    code: ZW
                    name: Zimbabwe
                    currency_code: USD
                    timezone: Africa/Harare
                    status: ACTIVE
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/property-requests:
    post:
      tags: [property-requests]
      operationId: createPropertyRequest
      summary: Submit a property request (enquiry)
      description: |
        The single entry point for every customer enquiry about a listing.

        The request, its timeline entry, the customer activity record and the notification
        outbox event are committed in one database transaction; `201` is returned only after
        that commit. The response status is always `RECEIVED` — acceptance does not mean the
        recipient has been notified.

        **Idempotency.** An idempotency key is required, either as `idempotency_key` in the
        body or in the `Idempotency-Key` header (the body wins when both are present).
        Repeating a key with identical content returns `200` with the original response.
        Repeating a key with different content returns `409`. Content is compared after
        normalisation (trimmed strings, lower-cased email, slot converted to UTC).

        **Rate limit.** Per client IP: bursts of 10 requests, refilled at 10 per minute.

        **Guests and signed-in customers.** Authentication is optional. For a guest,
        `guest_contact` (name and email) is required. For a signed-in customer `guest_contact`
        may be omitted: name and email are taken from the account (any name/email sent in
        `guest_contact` is ignored), the customer's user ID is stored on the request, and only
        `guest_contact.phone` is read. In both cases the phone is required when the preferred
        contact method is PHONE or WHATSAPP (reported as field `guest_contact.phone`) and
        `consent` is required. The same idempotency key used by a different customer is a `409`.
      security:
        - {}
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Alternative to `idempotency_key` in the body. Required if the body omits it.
          schema:
            $ref: "#/components/schemas/IdempotencyKey"
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyRequestCreate"
            example:
              listing_id: 0195c0de-0000-7000-8000-000000000001
              request_type: VIEWING_REQUEST
              message: I would like to view this property next week.
              preferred_contact_method: WHATSAPP
              preferred_slot_utc: "2027-01-15T08:00:00Z"
              idempotency_key: 6f1c2f0a-8f0e-4f43-9a55-2f6f3f1f9c11
              guest_contact:
                name: Tariro Moyo
                email: tariro@example.com
                phone: "+263771234567"
              consent:
                privacy_version: "2026-01"
                accepted: true
      responses:
        "201":
          description: The request was stored.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyRequestReceipt"
        "200":
          description: Idempotent replay. The key was already used with identical content; the original receipt is returned.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyRequestReceipt"
        "400":
          description: |
            `VALIDATION_FAILED` (with per-field messages in `error.fields`) or `INVALID_JSON`
            (malformed JSON, wrong types, unknown fields).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: VALIDATION_FAILED
                  message: Some fields need your attention.
                  fields:
                    message: must be plain text without HTML
                    consent.accepted: must be true
                trace_id: 4b0b8f0e-5d0c-4e0e-9a39-0a5a4f1f6c55
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "404":
          description: The listing does not exist (`LISTING_NOT_FOUND`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The idempotency key was already used with different content (`IDEMPOTENCY_CONFLICT`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: The listing is not published or has expired (`LISTING_UNAVAILABLE`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: The body exceeds 64 KB (`PAYLOAD_TOO_LARGE`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: The Content-Type is not `application/json` (`UNSUPPORTED_MEDIA_TYPE`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many requests from this IP (`RATE_LIMITED`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account
      description: |
        Creates an unverified account and sends a verification email. **Does not sign in.**

        Enumeration-safe: for valid input the answer is always `202 VERIFICATION_SENT`, whether
        or not the email already has an account.
        - New email: the account is created and a verification link is sent.
        - Existing unverified account: its name, password and role selection are replaced by this
          registration, earlier verification links stop working and a new link is sent.
        - Existing verified account: nothing changes; the owner is told by email that they
          already have an account.

        The verification link is `{WEB_BASE_URL}/verify-email?token=...` and is valid for 24 hours.

        **Account roles.** `roles` is required: 1 to 11 values from the allowlist in
        `SelectableAccountRole`, enforced on the server. A missing or empty array, a platform
        administrator role (`SUPER_ADMIN`, `PLATFORM_ADMIN`, `MARKET_ADMIN`, `FINANCE_ADMIN`,
        `CONTENT_ADMIN`, `MODERATOR`, `SUPPORT`), any other unknown value, a non-string entry or a
        **duplicate** is rejected with `400 VALIDATION_FAILED` and a plain-language message in
        `error.fields.roles`. `CONSUMER` and `TENANT` become `ACTIVE`; every other role is recorded
        as `PENDING_VERIFICATION`.

        Selecting a professional role only records a request. It does **not** create an
        organisation or a membership and grants no access to any organisation's data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              name: Rudo Ncube
              email: rudo@example.com
              password: correct-horse-battery
              consent:
                privacy_version: "2026-01"
                accepted: true
              marketing_opt_in: false
              roles: [CONSUMER, LANDLORD, AGENT]
      responses:
        "202":
          $ref: "#/components/responses/VerificationSent"
        "400":
          description: |
            `VALIDATION_FAILED` with `error.fields` keyed by `name`, `email`, `password`,
            `consent.accepted`, `consent.privacy_version` or `roles`; or `INVALID_JSON`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: VALIDATION_FAILED
                  message: Some fields need your attention.
                  fields:
                    password: must be at least 10 characters
                    consent.accepted: must be true
                    roles: That role cannot be chosen at sign-up.
                trace_id: 4b0b8f0e-5d0c-4e0e-9a39-0a5a4f1f6c55
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Verify an email address and sign in
      description: |
        Consumes the single-use token from the verification email (valid for 24 hours), marks the
        email verified and starts a session. By default the session is delivered in the
        `rp_session` cookie; `"token_delivery": "bearer"` returns `access_token` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                token_delivery:
                  $ref: "#/components/schemas/TokenDelivery"
      responses:
        "200":
          $ref: "#/components/responses/Authenticated"
        "400":
          description: |
            `INVALID_TOKEN` (unknown, expired or already used), `VALIDATION_FAILED` (missing
            `token`, bad `token_delivery`) or `INVALID_JSON`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Send the verification email again
      description: |
        Always `202` for a well-formed email. A new link is sent only when the address belongs to
        an account that is not verified yet; otherwise nothing happens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          $ref: "#/components/responses/VerificationSent"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in
      description: |
        `token_delivery` selects how the session token is returned:
        - `cookie` (default): sets the HttpOnly `rp_session` cookie; no token in the body.
        - `bearer`: returns `access_token` in the body and sets **no** cookie.

        An unknown email and a wrong password are indistinguishable (`401 INVALID_CREDENTIALS`,
        same body, comparable timing). `403 EMAIL_NOT_VERIFIED` is returned only when the
        password is correct.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                token_delivery:
                  $ref: "#/components/schemas/TokenDelivery"
      responses:
        "200":
          $ref: "#/components/responses/Authenticated"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: Unknown email or wrong password (`INVALID_CREDENTIALS`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: |
            `EMAIL_NOT_VERIFIED` (correct password, email not verified yet), or `CSRF_ORIGIN`
            when a valid session cookie was sent without an allowlisted `Origin`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out
      description: |
        Revokes the current session (cookie or bearer) and clears the cookie. Answers `204` even
        when nobody is signed in. No request body.
      security:
        - {}
        - cookieSession: []
        - bearerToken: []
      responses:
        "204":
          description: Signed out. The `rp_session` cookie is cleared.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              description: Expires the `rp_session` cookie.
              schema:
                type: string
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/password-reset/request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Ask for a password-reset email
      description: |
        Always `202` for a well-formed email, whether or not an account exists. The link is
        `{WEB_BASE_URL}/reset-password?token=...`, single-use and valid for 1 hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: RESET_SENT
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password with a reset token
      description: |
        Sets the new password and revokes **all** of that user's sessions (every device must
        sign in again). The `rp_session` cookie of the calling browser is cleared. Because the
        token was delivered to the mailbox, a successful reset also marks the email verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  $ref: "#/components/schemas/NewPassword"
      responses:
        "204":
          description: Password changed; all sessions revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          description: |
            `INVALID_TOKEN` (unknown, expired or already used), `VALIDATION_FAILED` (field
            `password` or `token`) or `INVALID_JSON`. A rejected password does not consume the token.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me:
    get:
      tags: [account]
      operationId: getMe
      summary: The signed-in user
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The current user with their platform roles and organisation memberships.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
              example:
                user:
                  id: 0195c0de-0000-7000-8000-00000000d002
                  name: Alex Agent
                  email: agent@example.test
                  email_verified: true
                  platform_roles: []
                  memberships:
                    - organisation_id: 0195c0de-0000-7000-8000-00000000b001
                      organisation_name: Sample Estates
                      organisation_kind: AGENCY
                      market_code: ZW
                      role: AGENT
                  account_roles:
                    - role: CONSUMER
                      status: ACTIVE
                    - role: AGENT
                      status: ACTIVE
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/agent/property-requests:
    get:
      tags: [organisation-workspace]
      operationId: listOrganisationPropertyRequests
      summary: Property requests received by the caller's organisation(s)
      description: |
        Requires at least one organisation membership (any role).

        **Scope** (decided on the server from the caller's memberships; there are no filter
        parameters):
        - OWNER and MANAGER see every request whose recipient organisation is one of theirs.
        - AGENT and STAFF see the requests of their organisation that are assigned to them
          personally or to the organisation inbox (no assigned agent).

        Requests of other organisations and requests routed to a direct seller are never
        returned. `status` is the internal status; because unroutable requests have no
        recipient organisation, `ROUTING_EXCEPTION` never appears here.

        Newest first, capped at 100 items. **There is no pagination yet.**
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The requests visible to the caller (possibly an empty array).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/OrganisationPropertyRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: rp_session
      description: |
        Web session. Set by `POST /v1/auth/login` and `POST /v1/auth/verify-email`; HttpOnly,
        SameSite=Lax, Path=/, Secure outside development. State-changing requests authenticated
        this way must carry an allowlisted `Origin` header (`403 CSRF_ORIGIN` otherwise).
    bearerToken:
      type: http
      scheme: bearer
      description: |
        Mobile/API session: the opaque `access_token` returned by login with
        `"token_delivery": "bearer"`. Not a JWT. Exempt from the CSRF origin check.

  headers:
    X-Request-Id:
      description: Request identifier (echoed from the request or generated). Equals `trace_id` in error bodies.
      schema:
        type: string

  responses:
    VerificationSent:
      description: Accepted. The same answer is given whether or not the email has an account.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [status]
            properties:
              status:
                type: string
                const: VERIFICATION_SENT
    Authenticated:
      description: |
        Signed in. With cookie delivery the response sets `rp_session` and has no
        `access_token`; with bearer delivery it has `access_token` and sets no cookie.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        Set-Cookie:
          description: "`rp_session=<token>; Path=/; HttpOnly; SameSite=Lax` (plus `Secure` outside development). Cookie delivery only."
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResult"
    ValidationFailed:
      description: "`VALIDATION_FAILED` (per-field messages in `error.fields`) or `INVALID_JSON`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: "Not signed in, or the session is invalid, expired or revoked (`UNAUTHENTICATED`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Signed in but not allowed to use this route (`FORBIDDEN`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CsrfOrigin:
      description: |
        `CSRF_ORIGIN`: the request was authenticated by the session cookie but its `Origin`
        header is missing or not allowlisted. Never returned for bearer or anonymous requests.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLarge:
      description: The body exceeds 64 KB (`PAYLOAD_TOO_LARGE`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnsupportedMediaType:
      description: The Content-Type is not `application/json` (`UNSUPPORTED_MEDIA_TYPE`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Too many requests from this IP (`RATE_LIMITED`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected server error (`INTERNAL`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Timeout:
      description: The request exceeded the server-side time limit (`TIMEOUT`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      required: [error, trace_id]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              enum:
                - VALIDATION_FAILED
                - INVALID_JSON
                - UNSUPPORTED_MEDIA_TYPE
                - PAYLOAD_TOO_LARGE
                - LISTING_NOT_FOUND
                - LISTING_UNAVAILABLE
                - IDEMPOTENCY_CONFLICT
                - UNAUTHENTICATED
                - FORBIDDEN
                - CSRF_ORIGIN
                - INVALID_CREDENTIALS
                - EMAIL_NOT_VERIFIED
                - INVALID_TOKEN
                - RATE_LIMITED
                - ORIGIN_NOT_ALLOWED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - NOT_READY
                - TIMEOUT
                - INTERNAL
            message:
              type: string
              description: Human-readable summary. Not stable; do not parse.
            fields:
              type: object
              description: Per-field messages, present for `VALIDATION_FAILED`. Keys are JSON paths such as `guest_contact.email`.
              additionalProperties:
                type: string
        trace_id:
          type: string
          description: Same value as the `X-Request-Id` response header.

    User:
      type: object
      description: |
        The signed-in user. Capabilities come only from `memberships` (organisation-scoped) and
        `platform_roles`. `account_roles` are self-declared at registration and grant nothing.
        All three arrays are always present (empty, never null).
      required: [id, name, email, email_verified, platform_roles, memberships, account_roles]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
          description: Lower-cased.
        email_verified:
          type: boolean
          description: Always true for a signed-in user (sessions are only issued after verification).
        platform_roles:
          type: array
          items:
            $ref: "#/components/schemas/PlatformRoleAssignment"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        account_roles:
          type: array
          description: Self-declared account roles, in allowlist order. Informational only.
          items:
            $ref: "#/components/schemas/AccountRole"

    SelectableAccountRole:
      type: string
      description: |
        The roles a person may choose for themselves at registration. Platform administrator
        roles are not in this list and can never be chosen.
      enum:
        - CONSUMER
        - TENANT
        - PRIVATE_SELLER
        - LANDLORD
        - HOST
        - DEVELOPER
        - SERVICE_PROVIDER
        - AGENT
        - AGENCY_STAFF
        - AGENCY_ADMIN
        - AGENCY_OWNER

    AccountRole:
      type: object
      description: |
        A role the user chose at registration, with its status. It is **not** an authorisation:
        it creates no organisation or membership and gives no access to organisation data
        (see `memberships`) or to platform administration (see `platform_roles`).
      required: [role, status]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/SelectableAccountRole"
        status:
          type: string
          enum: [ACTIVE, PENDING_VERIFICATION]
          description: |
            `ACTIVE` for CONSUMER and TENANT. `PENDING_VERIFICATION` for every professional role
            until an approval workflow exists.

    PlatformRoleAssignment:
      type: object
      required: [role, market_code]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [SUPER_ADMIN, PLATFORM_ADMIN, MARKET_ADMIN, FINANCE_ADMIN, CONTENT_ADMIN, MODERATOR, SUPPORT]
        market_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
          description: Set only for the market-scoped role MARKET_ADMIN; null for global roles.

    Membership:
      type: object
      description: The user's role in one organisation and market.
      required: [organisation_id, organisation_name, organisation_kind, market_code, role]
      additionalProperties: false
      properties:
        organisation_id:
          type: string
          format: uuid
        organisation_name:
          type: string
        organisation_kind:
          type: string
          enum: [AGENCY, LANDLORD, HOST, DEVELOPER, SERVICE_PROVIDER]
        market_code:
          type: string
          pattern: "^[A-Z]{2}$"
        role:
          type: string
          enum: [OWNER, MANAGER, AGENT, STAFF]

    AuthResult:
      type: object
      required: [user, session]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          type: object
          required: [expires_at]
          additionalProperties: false
          properties:
            expires_at:
              type: string
              format: date-time
              description: Absolute expiry (30 days after sign-in). The session also ends after 14 days without use.
        access_token:
          type: string
          description: Opaque session token. Present only when `token_delivery` is `bearer`.

    TokenDelivery:
      type: string
      enum: [cookie, bearer]
      default: cookie

    NewPassword:
      type: string
      minLength: 10
      maxLength: 128
      description: 10 to 128 characters.

    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, consent, roles]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          $ref: "#/components/schemas/NewPassword"
        consent:
          type: object
          additionalProperties: false
          required: [privacy_version, accepted]
          properties:
            privacy_version:
              type: string
              minLength: 1
              maxLength: 32
            accepted:
              type: boolean
              const: true
        marketing_opt_in:
          type: boolean
          default: false
        roles:
          type: array
          minItems: 1
          maxItems: 11
          uniqueItems: true
          description: Account roles chosen by the person. Duplicates are rejected.
          items:
            $ref: "#/components/schemas/SelectableAccountRole"

    OrganisationPropertyRequest:
      type: object
      required:
        - request_id
        - reference
        - listing_id
        - request_type
        - status
        - message
        - preferred_contact_method
        - contact
        - created_at
      additionalProperties: false
      properties:
        request_id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^RP-[2-9A-HJKMNP-TV-Z]{8}$"
        listing_id:
          type: string
          format: uuid
        request_type:
          type: string
          enum: [ENQUIRY, PROPERTY_INFORMATION, VIEWING_REQUEST, CONSULTATION_REQUEST]
        status:
          type: string
          enum: [RECEIVED]
          description: Internal status. Only RECEIVED can appear in an organisation inbox today.
        message:
          type: string
        preferred_contact_method:
          type: string
          enum: [EMAIL, PHONE, WHATSAPP]
        contact:
          type: object
          description: The customer's contact details (the guest's, or the account's name and email for a signed-in customer).
          required: [name, email, phone]
          additionalProperties: false
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            phone:
              type: [string, "null"]
              description: E.164, or null when the customer gave no phone number.
        created_at:
          type: string
          format: date-time

    Market:
      type: object
      required: [id, code, name, currency_code, timezone, status]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          pattern: "^[A-Z]{2}$"
        name:
          type: string
        currency_code:
          type: string
          description: ISO 4217 currency code.
          pattern: "^[A-Z]{3}$"
        timezone:
          type: string
          description: IANA time zone name.
        status:
          type: string
          enum: [ACTIVE, PLANNED, SUSPENDED]

    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 128
      pattern: "^[\\x21-\\x7E]+$"
      description: Client-generated unique key (a UUID is recommended). Printable ASCII, no spaces.

    PropertyRequestCreate:
      type: object
      additionalProperties: false
      required:
        - listing_id
        - request_type
        - message
        - preferred_contact_method
        - consent
      properties:
        listing_id:
          type: string
          format: uuid
        request_type:
          type: string
          enum: [ENQUIRY, PROPERTY_INFORMATION, VIEWING_REQUEST, CONSULTATION_REQUEST]
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain text. Anything containing HTML tags or control characters is rejected. Leading/trailing whitespace is trimmed.
        preferred_contact_method:
          type: string
          enum: [EMAIL, PHONE, WHATSAPP]
          description: PHONE and WHATSAPP require `guest_contact.phone`.
        preferred_slot_utc:
          type: [string, "null"]
          format: date-time
          description: Optional. Only allowed for VIEWING_REQUEST and CONSULTATION_REQUEST and must be in the future.
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
        guest_contact:
          type: object
          additionalProperties: false
          description: |
            Required for guests, with `name` and `email`. Optional for a signed-in customer, for
            whom only `phone` is read (name and email come from the account).
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            email:
              type: string
              format: email
              maxLength: 254
            phone:
              type: string
              pattern: "^\\+[1-9][0-9]{6,14}$"
              description: E.164. Optional unless the preferred contact method is PHONE or WHATSAPP.
        consent:
          type: object
          additionalProperties: false
          required: [privacy_version, accepted]
          properties:
            privacy_version:
              type: string
              minLength: 1
              maxLength: 32
              description: Version of the privacy notice the customer accepted.
            accepted:
              type: boolean
              const: true

    PropertyRequestReceipt:
      type: object
      required: [request_id, reference, status, created_at]
      additionalProperties: false
      properties:
        request_id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^RP-[2-9A-HJKMNP-TV-Z]{8}$"
          description: Human-friendly reference to quote to support.
          examples: [RP-7K3M9QXD]
        status:
          type: string
          const: RECEIVED
          description: The request has been stored. It does not indicate that anyone has been notified.
        created_at:
          type: string
          format: date-time
