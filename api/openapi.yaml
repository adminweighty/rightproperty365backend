    get:
      tags: [leases]
      operationId: listMyLeases
      summary: The leases the caller sees
      description: |
        Who may (`403 FORBIDDEN` otherwise): whoever may manage listings (`can_manage_listings`:
        OWNER, MANAGER or AGENT of an agency, law firm, property manager, developer or host, and
        approved landlords and property sellers); never STAFF, seekers or pending professionals.
        An organisation's OWNER and MANAGER see (and act on) every lease of the organisation;
        an AGENT the leases they created; a direct owner their own. Newest first.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/LeaseStatusFilter"
        - $ref: "#/components/parameters/RequestPage"
        - $ref: "#/components/parameters/RequestPageSize"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeasePage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [leases]
      operationId: createLease
      summary: Draft a lease from an approved template
      description: |
        `template_id` must be an `APPROVED` template (`422 LEASE_TEMPLATE_NOT_AVAILABLE`).
        `listing_id` (optional) must be a listing the caller may edit (`404 LISTING_NOT_FOUND`
        otherwise, as for an unknown one); it gives the organisation, the country (which must be
        the template's: `422 LEASE_MARKET_MISMATCH`) and, unless one is sent, the address (the
        listing's suburb, city, region and country: listings have no street address). Without a
        listing `property_address` is required, and `organisation_id` when the caller manages
        listings for more than one organisation.

        Every mandatory field is checked on every save: 1 to 5 landlords and 1 to 5 tenants
        (name, email, optional phone; each party a different email address), `start_date`,
        `end_date` after it unless `periodic: true` (then no `end_date`), `rent_amount` (a
        decimal string above 0, at most two decimals), `rent_currency` (ISO 4217), `rent_period`,
        `payment_day` (1-31, or 1-7 = Monday-Sunday for `WEEKLY`), `deposit_amount` (optional),
        `notice_period_days` (1-365), `optional_clauses` (codes of the template's clauses).

        The lease gets a reference `RPL-<year>-<6 digits>` and its draft PDF is rendered (a
        diagonal DRAFT watermark on every page; a footer with the reference, the template name
        and version, and page x of y; a row for every party's initials above it; a signature
        block per party at the end) into private storage. Audited (`CREATED`, `PDF_GENERATED`).
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/LeaseNotFound"
        "422":
          $ref: "#/components/responses/LeaseUnprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

