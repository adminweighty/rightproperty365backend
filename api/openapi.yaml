      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSignature"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/signing/{token}:
    parameters:
      - $ref: "#/components/parameters/SigningToken"
    get:
      tags: [agreements]
      operationId: getSigning
      summary: What a signing link shows (public)
      description: |
        No session. The agreement (name, reference, status, sender, expiry, page sizes, the
        original's SHA-256), the recipient (masked address), their fields with the values filled so
        far, the other recipients (name, role, order and status only), `can_act` and the consent
        text. STAMP fields are listed like the others; when the caller is signed in with the
        recipient's email address and has a STAMP field, `saved_stamp` is their saved stamp (new in
        0.26.0). The first view is audited with IP and user agent. Unknown: `404
        SIGNING_LINK_NOT_FOUND`; replaced or cancelled: `410 SIGNING_LINK_NO_LONGER_VALID`; expired:
        `410 SIGNING_LINK_EXPIRED`. Rate limit: 20 / 20 per minute per IP. The token is never
        written to the access log.
      responses:
        "200":
          description: The signing page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [signing]
                properties:
                  signing:
                    $ref: "#/components/schemas/SigningView"
        "404":
          $ref: "#/components/responses/AgreementNotFound"
        "410":
          $ref: "#/components/responses/SigningGone"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/signing/{token}/pdf:
    parameters:
      - $ref: "#/components/parameters/SigningToken"
    get:
      tags: [agreements]
      operationId: getSigningPdf
      summary: The document behind a link (the completed one once everybody finished)
      responses:
        "200":
          description: The PDF (private, no-store).
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/AgreementNotFound"
        "410":
          $ref: "#/components/responses/SigningGone"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/signing/{token}/code:
    parameters:
      - $ref: "#/components/parameters/SigningToken"
    post:
      tags: [agreements]
      operationId: sendSigningCode
      summary: Email the recipient a six-digit code
      description: |
        No body. Valid 10 minutes, 5 tries, bound to this link; a new code replaces the last. At
        most one every 30 seconds and 10 per recipient (`429` with `Retry-After`), and 5 / 5 per
        minute per IP. Not the recipient's turn: `409 NOT_OPEN_FOR_SIGNING`; finished: `409
        ALREADY_SIGNED`.
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sent_to, expires_at, code_length]
                properties:
                  sent_to:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  code_length:
                    type: integer
        "404":
          $ref: "#/components/responses/AgreementNotFound"
        "409":
          $ref: "#/components/responses/AgreementConflict"
        "410":
          $ref: "#/components/responses/SigningGone"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/signing/{token}/submit:
    parameters:
      - $ref: "#/components/parameters/SigningToken"
    post:
      tags: [agreements]
      operationId: submitSigning
      summary: Sign (a SIGNER) or approve (an APPROVER)
      description: |
        Requires `consent: true`, the code from `POST .../code` (or, in development and staging
        only, `AUTH_DEMO_CODE`, recorded as `DEMO_CODE`; a wrong code is `400 VALIDATION_FAILED`,
        a dead or missing one `400 CODE_EXPIRED`), every required TEXT (non-empty) and CHECKBOX
        (`"true"`) value in `field_values`, and for a SIGNER the adopted `signature` (and
        `initials` when they have INITIALS fields; typed initials default to the initials of a
        typed signature), and `stamp` when they have a required STAMP field (new in 0.26.0; the
        stamp is drawn, dated the signing day, in each of their STAMP fields, and the audit report
        records "Stamp applied: <top text>"). NAME and DATE_SIGNED are filled in. Records IP, user agent, time and the
        verification. The next order is then emailed, or after the last recipient the agreement is
        completed: every value is drawn onto the pages, an audit report page is appended, its
        SHA-256 recorded, and everybody (CCs and the sender too) is emailed. Body limit 2 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitInput"
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recipient_status, agreement_status, completed_at]
                properties:
                  recipient_status:
                    type: string
                    enum: [SIGNED, APPROVED]
                  agreement_status:
                    type: string
                  completed_at:
                    type: [string, "null"]
                    format: date-time
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/AgreementNotFound"
        "409":
          $ref: "#/components/responses/AgreementConflict"
        "410":
          $ref: "#/components/responses/SigningGone"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/signing/{token}/decline:
    parameters:
      - $ref: "#/components/parameters/SigningToken"
    post:
      tags: [agreements]
      operationId: declineSigning
      summary: Decline (with a reason); the agreement becomes DECLINED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          description: Declined; the sender is emailed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [signing]
                properties:
                  signing:
                    $ref: "#/components/schemas/SigningView"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/AgreementNotFound"
        "409":
          $ref: "#/components/responses/AgreementConflict"
        "410":
          $ref: "#/components/responses/SigningGone"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/stamp-preview:
    post:
      tags: [agreements]
      operationId: previewStamp
      summary: Draw a generated stamp (public; new in 0.26.0)
      description: |
        No session (signers by link use it too). Body `{stamp, date?}`: a `Stamp` and the date
        printed when `include_date` is true (`YYYY-MM-DD`, today when left out). Returns the stamp
        as a PNG with a transparent background, 600 pixels on its long side (ROUND 600 x 600, OVAL
        600 x 400, RECTANGLE 600 wide). The text is shown in upper case; a text with a letter the
        stamp font lacks is set in a fallback font. Deterministic: the same body gives the same
        image. `400 VALIDATION_FAILED` with field errors (`stamp.top_text`, `date`, ...). Rate
        limit: the signing links' bucket (20 / 20 per minute per IP). `Cache-Control: private,
        no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stamp]
              properties:
                stamp:
                  $ref: "#/components/schemas/Stamp"
                date:
                  type: string
                  format: date
      responses:
        "200":
          description: The stamp image.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/verify/{reference}:
    parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
          pattern: "^RPA-\\d{4}-\\d{6,}$"
    get:
      tags: [agreements]
      operationId: verifyAgreementReference
      summary: The fingerprints of a completed agreement (public)
      description: |
        Only a `COMPLETED` agreement (`404 AGREEMENT_NOT_FOUND` otherwise). Never a name, an email
        address or the document: the status, completion time, the original's and the final
        document's SHA-256 and the number of signatures. Rate limit: 10 / 10 per minute per IP.
      responses:
        "200":
          description: The fingerprints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
        "404":
          $ref: "#/components/responses/AgreementNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/verify:
    post:
      tags: [agreements]
      operationId: verifyAgreementFile
      summary: Is this PDF, byte for byte, a completed agreement's document? (public)
      description: |
        `multipart/form-data` part `file` (at most 20 MB). `match: true` with `document` `FINAL`
        or `ORIGINAL` when its SHA-256 is a completed agreement's; `match: false` otherwise. The file
        is not stored.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "413":
          $ref: "#/components/responses/AgreementFile"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/subscription-plans:
    get:
      tags: [subscriptions]
      operationId: listMySubscriptionPlans
      summary: The plans the caller may take (new in 0.25.0)
      description: |
        The `ACTIVE` plans offered to an approved (`ACTIVE`) account role of the caller; an
        `ORGANISATION` plan only when the caller is the `OWNER` of an organisation. With `market`,
        only the prices in that country's currency are returned and a plan without one is left
        out. There is no online payment: taking a plan creates an invoice (see
        `POST /v1/me/subscriptions`).
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: market
          in: query
          description: A country code; prices in its currency only.
          schema: { type: string, pattern: "^[A-Za-z]{2}$" }
      responses:
        "200":
          description: The plans on offer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailablePlans" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/me/subscriptions:
    get:
      tags: [subscriptions]
      operationId: listMySubscriptions
      summary: The caller's subscriptions and those of the organisations they own (new in 0.25.0)
      description: |
        One entry per subscriber: the caller (always) and every organisation they are the `OWNER`
        of. `current` is the subscription in force now, `upcoming` a paid renewal that starts
        when it ends, `pending` the one waiting for payment, `history` every subscription,
        newest first. `can_renew` is true from 30 days before the end of `current` when nothing
        else is pending or upcoming. `usage` shows the published listings against the plan's
        `MAX_ACTIVE_LISTINGS` limit; **the limit is not enforced yet** (`limit_enforced: false`).
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The caller's subscribers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MySubscriptions" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [subscriptions]
      operationId: requestSubscription
      summary: Ask for a plan, which creates an invoice (new in 0.25.0)
      description: |
        Creates a `PENDING_PAYMENT` subscription with an invoice number (`RPS-<year>-<6 digits>`)
        and the plan's price in the market's currency for the period. The requester is emailed
        the invoice. Pay it outside the platform (bank transfer or the method on the invoice),
        quoting the invoice number; a finance administrator records the payment, which
        activates the subscription. Nothing is ever charged automatically.

        - An `INDIVIDUAL` plan is for the caller: `market_code` is required unless the caller
          belongs to an organisation (its country is used); `organisation_id` must be empty.
        - An `ORGANISATION` plan needs `organisation_id`, an organisation the caller is the
          `OWNER` of (`403 NOT_ORGANISATION_OWNER` otherwise); its country is the market.
        - The caller must hold an approved role the plan is offered to (`403 PLAN_NOT_ELIGIBLE`).
        - At most one subscription per subscriber waits for payment (`409
          SUBSCRIPTION_PENDING_EXISTS`); with a subscription in force, renew it instead (`409
          SUBSCRIPTION_ACTIVE_EXISTS`).
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionRequest" }
      responses:
        "201":
          description: The subscription, `PENDING_PAYMENT`, with `payment_instructions`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionEnvelope" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`PLAN_NOT_ELIGIBLE` or `NOT_ORGANISATION_OWNER` (`CSRF_ORIGIN` for a cookie write without the web app's `Origin`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: "`PLAN_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`SUBSCRIPTION_PENDING_EXISTS` or `SUBSCRIPTION_ACTIVE_EXISTS`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: "`PLAN_NOT_AVAILABLE` (retired) or `PRICE_NOT_AVAILABLE` (no price in that currency for that period)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/me/subscriptions/{id}:
    get:
      tags: [subscriptions]
      operationId: getMySubscription
      summary: One of the caller's subscriptions, with its history (new in 0.25.0)
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200":
          description: The subscription and its history, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [subscription, events]
                properties:
                  subscription: { $ref: "#/components/schemas/Subscription" }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/SubscriptionEvent" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "`SUBSCRIPTION_NOT_FOUND`: no such subscription, or not the caller's (or their organisation's)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/me/subscriptions/{id}/cancel:
    post:
      tags: [subscriptions]
      operationId: cancelMySubscription
      summary: Withdraw a request while it waits for payment (new in 0.25.0)
      description: Only `PENDING_PAYMENT` (`409 SUBSCRIPTION_STATE_CONFLICT` otherwise). No body.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200":
          description: The subscription, `CANCELLED` (`cancelled_by` `SUBSCRIBER`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "`SUBSCRIPTION_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`SUBSCRIPTION_STATE_CONFLICT`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/me/subscriptions/{id}/renew:
    post:
      tags: [subscriptions]
      operationId: renewMySubscription
      summary: Ask for the next period (new in 0.25.0)
      description: |
        From 30 days before the end of a subscription in force (`409 RENEWAL_NOT_OPEN` before):
        a new `PENDING_PAYMENT` subscription of the same plan (`renewal_of` set), invoiced at the
        plan's current price for `period` (default: the current period), that starts when the
        current one ends once its payment is recorded. Refused while another subscription of the
        subscriber is pending or already paid for later (`409`), or when the plan was retired
        (`422 PLAN_NOT_AVAILABLE`).
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                period: { type: string, enum: [QUARTERLY, YEARLY] }
      responses:
        "201":
          description: The renewal, `PENDING_PAYMENT`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionEnvelope" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "`SUBSCRIPTION_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`RENEWAL_NOT_OPEN`, `SUBSCRIPTION_STATE_CONFLICT` (not in force), `SUBSCRIPTION_PENDING_EXISTS` or `SUBSCRIPTION_ACTIVE_EXISTS` (a paid renewal exists)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: "`PLAN_NOT_AVAILABLE` or `PRICE_NOT_AVAILABLE`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: Every account, searchable (SUPER_ADMIN, PLATFORM_ADMIN, SUPPORT; new in 0.25.0)
      description: |
        Newest first. `q` matches the name or email address; `role` an account role in any
        status (`AGENT`, `LANDLORD`, ...) or a platform role (`SUPER_ADMIN`, ...); `status`
        `ACTIVE`, `SUSPENDED` or `DELETED`; `market` a country where the account has a membership
        that was not removed. Administrators are listed too.
      security:
        - cookieSession: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: role, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED, DELETED] } }
        - { name: market, in: query, schema: { type: string, pattern: "^[A-Za-z]{2}$" } }
        - $ref: "#/components/parameters/RequestPage"
        - $ref: "#/components/parameters/RequestPageSize"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/users/{id}:
    get:
      tags: [admin]
      operationId: adminGetUser
      summary: An account's detail (SUPER_ADMIN, PLATFORM_ADMIN, SUPPORT; new in 0.25.0)
      description: |
        Roles with their onboarding state, platform roles, every membership (any status), the
        listings the person owns directly or is the assigned agent of (by status), the last
        sign-in (the newest session), the suspension, the subscriptions of the person and of the
        organisations they own, and the newest 20 records of the administrators' audit trail
        about the account.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /v1/admin/users/{id}/suspend:
    post:
      tags: [admin]
      operationId: adminSuspendUser
      summary: Suspend an account (SUPER_ADMIN, PLATFORM_ADMIN; new in 0.25.0)
      description: |
        Only an `ACTIVE` account. At once: every session is revoked, sign-in codes and reset
        links stop working, and sign-in is refused (`INVALID_CREDENTIALS`, as for any account that
        is not active). **Nothing is unpublished**: the listings the person owns directly stay
        `PUBLISHED` but are not public while the account is suspended, because a direct owner's
        listing is public only while the owner's account is `ACTIVE` (the verified-advertiser
        rule; the search index is refreshed). Listings of an organisation stay public: they are
        the organisation's. The person is emailed the reason; an audit record is written.
        Nobody suspends their own account (`403 SELF_ACTION_FORBIDDEN`), and only a SUPER_ADMIN
        suspends an account that holds a platform role (`403 ADMIN_ACCOUNT_PROTECTED`).
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReason" }
      responses:
        "200":
          description: The account, `SUSPENDED`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminUserForbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          $ref: "#/components/responses/UserStateConflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/admin/users/{id}/reactivate:
    post:
      tags: [admin]
      operationId: adminReactivateUser
      summary: Reactivate a suspended account (SUPER_ADMIN, PLATFORM_ADMIN; new in 0.25.0)
      description: |
        Only a `SUSPENDED` account; the person may sign in again and their own listings are
        public again while published. The body (an optional `note`) may be omitted. The person
        is emailed; an audit record is written.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: The account, `ACTIVE`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminUserForbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          $ref: "#/components/responses/UserStateConflict"

  /v1/admin/users/{id}/delete:
    post:
      tags: [admin]
      operationId: adminDeleteUser
      summary: Delete (anonymise) an account (SUPER_ADMIN, PLATFORM_ADMIN; new in 0.25.0)
      description: |
        See `AccountDeleted` for what deletion does. The account row is kept, anonymised, so
        audit records, signed agreements and leases keep their references; it is `DELETED` and
        can never sign in again. Refused, with nothing changed, while the person is the only
        active owner of an organisation that still has other members (`409 SOLE_OWNER`, the
        message names the organisations): make another member an owner or remove the members
        first. The address the account had is sent a last email. Same rules on whose account as
        suspension.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReason" }
      responses:
        "200":
          description: What the deletion did.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeleted" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminUserForbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          description: "`SOLE_OWNER`, or `USER_STATE_CONFLICT` (already deleted)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/admin/audit:
    get:
      tags: [admin]
      operationId: adminAudit
      summary: The administrators' audit trail (SUPER_ADMIN, PLATFORM_ADMIN; new in 0.25.0)
      description: |
        Newest first. Every administrator action of the administrators' area is recorded in the
        same transaction as the change and never altered: account suspension, reactivation and
        deletion (also self-service deletion), plans, subscription decisions and reference data.
      security:
        - cookieSession: []
      parameters:
        - { name: target_type, in: query, schema: { type: string, enum: [USER, SUBSCRIPTION_PLAN, SUBSCRIPTION, REFERENCE_ITEM] } }
        - { name: target_id, in: query, description: "A UUID, or `<set>/<code>` for a reference item.", schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: actor_user_id, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/RequestPage"
        - $ref: "#/components/parameters/RequestPageSize"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, page_size, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminAuditEvent" }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/subscription-plans:
    get:
      tags: [admin, subscriptions]
      operationId: adminListPlans
      summary: Every plan (SUPER_ADMIN, FINANCE_ADMIN, PLATFORM_ADMIN, SUPPORT; new in 0.25.0)
      description: Retired plans included unless `include_retired=false`; with the feature codes and the roles a plan may be offered to.
      security:
        - cookieSession: []
      parameters:
        - { name: include_retired, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: The plans.
          content:
            application/json:
              schema:
                type: object
                required: [plans, feature_codes, professional_roles]
                properties:
                  plans:
                    type: array
                    items: { $ref: "#/components/schemas/SubscriptionPlan" }
                  feature_codes:
                    type: array
                    items: { type: string, enum: [MAX_ACTIVE_LISTINGS, MAX_FEATURED_LISTINGS, MAX_TEAM_MEMBERS] }
                  professional_roles:
                    type: array
                    items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin, subscriptions]
      operationId: adminCreatePlan
      summary: Create a plan (SUPER_ADMIN, FINANCE_ADMIN; new in 0.25.0)
      description: |
        Required: `name`, `subscriber_kind`, `eligible_roles` (professional account roles only:
        never `CONSUMER` or `TENANT`), and at least one price (one per currency and period;
        `amount` a positive decimal string with at most two decimals). `features` are
        `{code, limit}` with `limit` null for unlimited; `benefits` free text (at most 20).
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionPlanInput" }
      responses:
        "201":
          description: The plan, `ACTIVE`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionPlanEnvelope" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/subscription-plans/{id}:
    get:
      tags: [admin, subscriptions]
      operationId: adminGetPlan
      summary: One plan (new in 0.25.0)
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionPlanEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/PlanNotFound"
    patch:
      tags: [admin, subscriptions]
      operationId: adminUpdatePlan
      summary: Change a plan (SUPER_ADMIN, FINANCE_ADMIN; new in 0.25.0)
      description: |
        Every field is optional; `prices`, `features`, `benefits` and `eligible_roles` replace the
        whole list. Subscriptions already requested keep the name, period and amount they were
        invoiced with. A retired plan cannot be changed (`409 PLAN_RETIRED`).
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionPlanInput" }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionPlanEnvelope" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/PlanNotFound"
        "409":
          description: "`PLAN_RETIRED`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/admin/subscription-plans/{id}/retire:
    post:
      tags: [admin, subscriptions]
      operationId: adminRetirePlan
      summary: Retire a plan (SUPER_ADMIN, FINANCE_ADMIN; new in 0.25.0)
      description: It is no longer offered, requested or renewed; subscriptions already taken run to their end. Plans are never deleted.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: The plan, `RETIRED`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionPlanEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/PlanNotFound"
        "409":
          description: "`PLAN_RETIRED`: already retired."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/admin/subscriptions:
    get:
      tags: [admin, subscriptions]
      operationId: adminListSubscriptions
      summary: Every subscription (SUPER_ADMIN, FINANCE_ADMIN, PLATFORM_ADMIN, SUPPORT; new in 0.25.0)
      description: Newest first. `status` is the stored status (an `ACTIVE` one past its end is shown `EXPIRED` in the item).
      security:
        - cookieSession: []
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING_PAYMENT, ACTIVE, EXPIRED, REJECTED, CANCELLED] } }
        - { name: plan_id, in: query, schema: { type: string, format: uuid } }
        - { name: market, in: query, schema: { type: string, pattern: "^[A-Za-z]{2}$" } }
        - { name: period, in: query, schema: { type: string, enum: [QUARTERLY, YEARLY] } }
        - { name: subscriber_kind, in: query, schema: { type: string, enum: [INDIVIDUAL, ORGANISATION] } }
        - { name: q, in: query, description: The invoice number or the subscriber's name., schema: { type: string } }
        - $ref: "#/components/parameters/RequestPage"
        - $ref: "#/components/parameters/RequestPageSize"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, page_size, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Subscription" }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/subscriptions/{id}:
    get:
      tags: [admin, subscriptions]
      operationId: adminGetSubscription
      summary: A subscription with its history and the subscriber's usage (new in 0.25.0)
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionDetail" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SubscriptionNotFound"

  /v1/admin/subscriptions/{id}/approve:
    post:
      tags: [admin, subscriptions]
      operationId: adminApproveSubscription
      summary: Record the payment and activate (SUPER_ADMIN, FINANCE_ADMIN; new in 0.25.0)
      description: |
        Only `PENDING_PAYMENT`. Records the payment received outside the platform (reference,
        amount in the invoice currency, the day it was received, a note) and activates the
        subscription: it starts now, or when the subscriber's paid period ends for a renewal,
        and ends 3 months (`QUARTERLY`) or 1 year (`YEARLY`) later. The amount must cover the
        invoice (`422 PAYMENT_AMOUNT_TOO_LOW`); an overpayment is recorded as received (refund
        it as the Refund Policy says). The requester is emailed; an audit record is written.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionPayment" }
      responses:
        "200":
          description: The subscription, `ACTIVE`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionDetail" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SubscriptionNotFound"
        "409":
          $ref: "#/components/responses/SubscriptionStateConflict"
        "422":
          description: "`PAYMENT_AMOUNT_TOO_LOW`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/admin/subscriptions/{id}/reject:
    post:
      tags: [admin, subscriptions]
      operationId: adminRejectSubscription
      summary: Refuse a request (SUPER_ADMIN, FINANCE_ADMIN; new in 0.25.0)
      description: |
        Only `PENDING_PAYMENT`; `REJECTED` with the reason (emailed). When a payment had been
        received all the same, set `refund_due` (Refund Policy: service not activated, or
        application not approved); no money moves here.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionDecision" }
      responses:
        "200":
          description: The subscription, `REJECTED`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionDetail" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SubscriptionNotFound"
        "409":
          $ref: "#/components/responses/SubscriptionStateConflict"

  /v1/admin/subscriptions/{id}/cancel:
    post:
      tags: [admin, subscriptions]
      operationId: adminCancelSubscription
      summary: Cancel a subscription (SUPER_ADMIN, FINANCE_ADMIN; new in 0.25.0)
      description: |
        An `ACTIVE` (in force or upcoming) or `PENDING_PAYMENT` subscription becomes `CANCELLED`
        (`cancelled_by` `ADMIN`) with the reason. `refund_due` and `refund_note` record whether a
        pro-rata refund of the unused period is due under the Refund Policy (for example a
        withdrawal that is not for the subscriber's breach of the Terms); no money moves here.
        The requester is emailed.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionDecision" }
      responses:
        "200":
          description: The subscription, `CANCELLED`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionDetail" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SubscriptionNotFound"
        "409":
          $ref: "#/components/responses/SubscriptionStateConflict"

  /v1/admin/reference:
    get:
      tags: [admin, reference]
      operationId: adminReferenceSets
      summary: The reference sets and what may be done to each (new in 0.25.0)
      description: |
        SUPER_ADMIN, PLATFORM_ADMIN, CONTENT_ADMIN and MARKET_ADMIN (who changes only the rows of
        its own market). `creatable`: rows may be added (property types, listing features,
        service trades, regions, cities, suburbs); every other set's codes drive behaviour and can
        only be relabelled, reordered, deactivated and reactivated. Nothing is ever deleted.
      security:
        - cookieSession: []
      responses:
        "200":
          description: The sets.
          content:
            application/json:
              schema:
                type: object
                required: [sets]
                properties:
                  sets:
                    type: array
                    items:
                      type: object
                      required: [set, creatable, market_bound, parent_set]
                      properties:
                        set: { type: string }
                        creatable: { type: boolean }
                        market_bound: { type: boolean, description: Rows belong to one market (market_code required). }
                        parent_set: { type: [string, "null"], description: The set parent_code points into. }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/reference/{set}:
    get:
      tags: [admin, reference]
      operationId: adminReferenceList
      summary: Every row of a set, inactive ones too (new in 0.25.0)
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/ReferenceSet"
        - { name: market, in: query, schema: { type: string, pattern: "^[A-Za-z]{2}$" } }
      responses:
        "200":
          description: The rows, with `active`.
          content:
            application/json:
              schema:
                type: object
                required: [set, items]
                properties:
                  set: { type: string }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminReferenceItem" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`REFERENCE_SET_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    post:
      tags: [admin, reference]
      operationId: adminReferenceCreate
      summary: Add a row to a creatable set (new in 0.25.0)
      description: |
        `code` is lower-case letters and digits separated by single hyphens and never changes.
        `parent_code` must be an active code of the parent set (a property category for a property
        type, a region for a city, a city for a suburb); `market_code` is required for regions,
        cities and suburbs. The row is offered (and accepted in input) at once.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/ReferenceSet"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReferenceInput" }
      responses:
        "201":
          description: The row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReferenceEnvelope" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN`, or `REFERENCE_MARKET_FORBIDDEN` (a MARKET_ADMIN outside its market)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: "`REFERENCE_SET_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`REFERENCE_ITEM_EXISTS` (also when the existing row is inactive: reactivate it)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: "`REFERENCE_SET_NOT_EXTENSIBLE`: rows cannot be added to this set."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/admin/reference/{set}/{code}:
    patch:
      tags: [admin, reference]
      operationId: adminReferenceUpdate
      summary: Relabel or reorder a row (new in 0.25.0)
      description: "`label`, `singular_label`, `description`, `sort_order` and `parent_code` may change; `code` and `market_code` never do (`400`)."
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/ReferenceSet"
        - $ref: "#/components/parameters/ReferenceCode"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReferenceInput" }
      responses:
        "200":
          description: The row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReferenceEnvelope" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN` or `REFERENCE_MARKET_FORBIDDEN`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: "`REFERENCE_SET_NOT_FOUND` or `REFERENCE_ITEM_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/admin/reference/{set}/{code}/deactivate:
    post:
      tags: [admin, reference]
      operationId: adminReferenceDeactivate
      summary: Deactivate a row (new in 0.25.0)
      description: |
        The row is no longer offered or accepted in new input, at once. It is never deleted: the
        listings, profiles and requests that use the code keep it, and it can be reactivated.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/ReferenceSet"
        - $ref: "#/components/parameters/ReferenceCode"
      responses:
        "200":
          description: The row, `active` false.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReferenceEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN` or `REFERENCE_MARKET_FORBIDDEN`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: "`REFERENCE_SET_NOT_FOUND` or `REFERENCE_ITEM_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/admin/reference/{set}/{code}/reactivate:
    post:
      tags: [admin, reference]
      operationId: adminReferenceReactivate
      summary: Reactivate a row (new in 0.25.0)
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/ReferenceSet"
        - $ref: "#/components/parameters/ReferenceCode"
      responses:
        "200":
          description: The row, `active` true.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReferenceEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN` or `REFERENCE_MARKET_FORBIDDEN`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: "`REFERENCE_SET_NOT_FOUND` or `REFERENCE_ITEM_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/admin/reports/summary:
    get:
      tags: [admin, reports]
      operationId: adminReportSummary
      summary: Counts over a date range, per market (SUPER_ADMIN, PLATFORM_ADMIN, FINANCE_ADMIN; new in 0.25.0)
      description: |
        Everything CREATED in `[from, to]` (UTC days, both included; default the last 30 days, at
        most three years), grouped by its status now (new users by account role; property
        requests by lead stage, `ROUTING_EXCEPTION` apart) and market. An account has no market:
        it is counted in the country of its first membership (`market_code` null when none), and
        administrators are not counted; a person with several roles counts once per role, `NONE`
        for none. An agreement has no market (`market_code` null; none with a market filter).
        `revenue` sums the payments administrators recorded, by the day they were received, per
        currency and market: there is no online payment.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
        - $ref: "#/components/parameters/ReportMarket"
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSummary" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/reports/users.csv:
    get:
      tags: [admin, reports]
      operationId: adminExportUsers
      summary: Accounts created in the range, as CSV (SUPER_ADMIN, PLATFORM_ADMIN; new in 0.25.0)
      description: |
        Streamed, newest first, at most `limit` rows (default 10000, at most 50000).
        `X-Total-Count` is the number of matching rows and `X-Export-Truncated` says whether
        some were left out (narrow the range). Columns: id, name, email, status, email_verified,
        account_roles, platform_roles, market_codes (space-separated), created_at,
        last_sign_in_at. A cell that starts with `=`, `+`, `-`, `@`, a tab or a carriage return is
        prefixed with `'` so that a spreadsheet does not run it as a formula. Personal data:
        handle the file accordingly.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
        - $ref: "#/components/parameters/ReportMarket"
        - $ref: "#/components/parameters/ExportLimit"
      responses:
        "200":
          $ref: "#/components/responses/CSVExport"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/reports/listings.csv:
    get:
      tags: [admin, reports]
      operationId: adminExportListings
      summary: Listings created in the range, as CSV (SUPER_ADMIN, PLATFORM_ADMIN; new in 0.25.0)
      description: |
        As `users.csv`. Columns: id, reference, title, status (a published listing past its
        expiry is `EXPIRED`), market_code, deal, category, property_type, price, currency_code,
        organisation_id, agent_user_id, seller_user_id, created_at, published_at, expires_at.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
        - $ref: "#/components/parameters/ReportMarket"
        - $ref: "#/components/parameters/ExportLimit"
      responses:
        "200":
          $ref: "#/components/responses/CSVExport"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/reports/subscriptions.csv:
    get:
      tags: [admin, reports]
      operationId: adminExportSubscriptions
      summary: Subscriptions created in the range, as CSV (SUPER_ADMIN, FINANCE_ADMIN, PLATFORM_ADMIN; new in 0.25.0)
      description: |
        As `users.csv`. Columns: id, invoice_number, status, plan_name, period, subscriber_kind,
        subscriber_name, market_code, currency_code, amount, payment_amount, payment_reference,
        payment_received_on, starts_at, ends_at, created_at, refund_due.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
        - $ref: "#/components/parameters/ReportMarket"
        - $ref: "#/components/parameters/ExportLimit"
      responses:
        "200":
          $ref: "#/components/responses/CSVExport"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: The account's ID.
      schema: { type: string, format: uuid }
    PlanId:
      name: id
      in: path
      required: true
      description: The plan's ID.
      schema: { type: string, format: uuid }
    SubscriptionId:
      name: id
      in: path
      required: true
      description: The subscription's ID.
      schema: { type: string, format: uuid }
    ReferenceSet:
      name: set
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ReferenceSetCode" }
    ReferenceCode:
      name: code
      in: path
      required: true
      schema: { type: string, maxLength: 80 }
    ReportFrom:
      name: from
      in: query
      description: First day of the range (UTC, YYYY-MM-DD). Default 29 days before `to`.
      schema: { type: string, format: date }
    ReportTo:
      name: to
      in: query
      description: Last day of the range, included (UTC, YYYY-MM-DD). Default today.
      schema: { type: string, format: date }
    ReportMarket:
      name: market
      in: query
      description: Country codes separated by commas; every market when absent.
      schema: { type: string, examples: ["ZW,GB"] }
    ExportLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50000, default: 10000 }
    AgreementId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecipientId:
      name: recipientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SigningToken:
      name: token
      in: path
      required: true
      description: The token of a signing link (43 URL-safe characters).
      schema:
        type: string
    AgreementStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum: [DRAFT, OUT_FOR_SIGNATURE, COMPLETED, DECLINED, CANCELLED, EXPIRED]
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LeaseTemplateId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LeaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LeaseStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum: [DRAFT, SENT_FOR_SIGNING, SIGNED, DECLINED, CANCELLED, EXPIRED]
    OrganisationId:
      name: id
      in: path
      required: true
      description: The organisation's ID (`memberships[].organisation_id` of `GET /v1/me`).
      schema:
        type: string
        format: uuid
    JoinRequestId:
      name: requestId
      in: path
      required: true
      description: The join request's ID (the onboarding application's ID).
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: token
      in: path
      required: true
      description: The token from the invitation link (43 URL-safe characters).
      schema:
        type: string
    AppointmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppointmentStatusFilter:
      name: status
      in: query
      description: One status, or several separated by commas.
      schema:
        type: string
      examples:
        one:
          value: REQUESTED
        several:
          value: REQUESTED,RESCHEDULE_REQUESTED
    AppointmentPage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    AppointmentPageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RequestPage:
      name: page
      in: query
      description: Page number from 1. A page past the end is an empty `items` array.
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1
    RequestPageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PropertyRequestId:
      name: id
      in: path
      required: true
      description: The `request_id`. A value that is not a UUID is `404 PROPERTY_REQUEST_NOT_FOUND`.
      schema:
        type: string
        format: uuid
    ReferenceMarket:
      name: market
      in: query
      required: false
      description: |
        Market code (case-insensitive). Keeps the rows of that market plus the rows that apply
        to every market. Without it, rows of all markets are returned.
      schema:
        type: string
        pattern: "^[A-Za-z]{2}$"
      example: ZW
    ManagedListingId:
      name: id
      in: path
      required: true
      description: The listing's `id` (not its slug). A value that is not a UUID is `404 LISTING_NOT_FOUND`.
      schema: { type: string, format: uuid }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The `ETag` of a previous response. A match answers `304` with no body.
      schema:
        type: string

  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: rp_session
      description: |
        Web session. Set by `POST /v1/auth/login` and `POST /v1/auth/verify-email`; HttpOnly,
        SameSite=Lax, Path=/, Secure outside development. State-changing requests authenticated
        this way must carry an allowlisted `Origin` header (`403 CSRF_ORIGIN` otherwise).
    bearerToken:
      type: http
      scheme: bearer
      description: |
        Mobile/API session: the opaque `access_token` returned by login with
        `"token_delivery": "bearer"`. Not a JWT. Exempt from the CSRF origin check. Customer
        scope only: admin sessions are never issued or accepted as bearer tokens.

  headers:
    ETag:
      description: Strong validator of the response body. Changes whenever the content changes.
      schema:
        type: string
      example: '"8884076b694c80c9a86962905377343a"'
    Cache-Control:
      description: "`public, max-age=60, stale-while-revalidate=300`. The response is the same for every caller."
      schema:
        type: string
    CatalogueCacheControl:
      description: "`public, max-age=30, stale-while-revalidate=120`. The response is the same for every caller and never depends on a session."
      schema:
        type: string
    X-Request-Id:
      description: Request identifier (echoed from the request or generated). Equals `trace_id` in error bodies.
      schema:
        type: string

  responses:
    UserNotFound:
      description: "`USER_NOT_FOUND`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    UserStateConflict:
      description: "`USER_STATE_CONFLICT`: the account's status does not allow this (suspend: not `ACTIVE`; reactivate: not `SUSPENDED`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    AdminUserForbidden:
      description: |
        `FORBIDDEN` (not SUPER_ADMIN or PLATFORM_ADMIN on an admin session),
        `SELF_ACTION_FORBIDDEN` (one's own account) or `ADMIN_ACCOUNT_PROTECTED` (an account
        holding a platform role, by anybody but a SUPER_ADMIN).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PlanNotFound:
      description: "`PLAN_NOT_FOUND`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    SubscriptionNotFound:
      description: "`SUBSCRIPTION_NOT_FOUND`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    SubscriptionStateConflict:
      description: "`SUBSCRIPTION_STATE_CONFLICT`: the subscription's status does not allow this."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    CSVExport:
      description: A CSV file (header row first), streamed.
      headers:
        Content-Disposition:
          schema: { type: string, examples: ['attachment; filename="users-2026-10-18-to-2026-11-16.csv"'] }
        X-Total-Count:
          description: The number of rows that match.
          schema: { type: integer }
        X-Export-Limit:
          schema: { type: integer }
        X-Export-Truncated:
          description: true when rows were left out (narrow the range).
          schema: { type: boolean }
      content:
        text/csv:
          schema: { type: string }
    CustomerAppointment:
      description: The appointment as its customer sees it, with its timeline.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CustomerAppointmentEnvelope"
    ReceivedAppointment:
      description: The appointment as the professional sees it, with the customer's contact details and the timeline.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReceivedAppointmentEnvelope"
    PropertyRequestNotFound:
      description: "`PROPERTY_REQUEST_NOT_FOUND`: no such request, or it is not the caller's to see (the same answer)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AppointmentNotFound:
      description: "`APPOINTMENT_NOT_FOUND`: no such appointment, or it is not the caller's to see."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AppointmentConflict:
      description: |
        `INVALID_STATE`: the appointment's status does not allow this (or the time concerned has
        passed). `SLOT_TAKEN`: the professional already has a confirmed appointment that
        overlaps. Nothing was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotModified:
      description: The `If-None-Match` validator still matches. No body.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/Cache-Control"
    VerificationSent:
      description: Accepted. The same answer is given whether or not the email has an account.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [status]
            properties:
              status:
                type: string
                const: VERIFICATION_SENT
    Authenticated:
      description: |
        Signed in. With cookie delivery the response sets `rp_session` and has no
        `access_token`; with bearer delivery it has `access_token` and sets no cookie.
        (`verify-email` for an account holding a platform role returns `user` only.)
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        Set-Cookie:
          description: "`rp_session=<token>; Path=/; HttpOnly; SameSite=Lax` (plus `Secure` outside development). Cookie delivery only."
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResult"
    ValidationFailed:
      description: "`VALIDATION_FAILED` (per-field messages in `error.fields`) or `INVALID_JSON`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OnboardingNotFound:
      description: "`ONBOARDING_NOT_FOUND`: the caller does not hold that role, the role does not exist, or there is no application."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OnboardingInvalidState:
      description: "`INVALID_STATE`: the application's status does not allow this (for example editing after it was submitted, or deciding one that is not `SUBMITTED`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: "Not signed in, or the session is invalid, expired or revoked (`UNAUTHENTICATED`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ListingNotFound:
      description: "`LISTING_NOT_FOUND`: no such listing, or it belongs to someone else (the same answer)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ListingStateConflict:
      description: |
        `LISTING_STATE_CONFLICT` (the status does not allow this), `LISTING_IN_REVIEW` (the
        listing or its changes wait for review) or `LISTING_CHANGED` (changed by someone else
        at the same time: reload and retry).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OrganisationNotFound:
      description: "`ORGANISATION_NOT_FOUND`: no such organisation, or the caller is not an active member of it."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TeamForbidden:
      description: |
        `FORBIDDEN` (the caller is a member but may not manage the team: AGENT, STAFF; or an
        administrator session accepting an invitation), `ROLE_NOT_ALLOWED` (the caller's role may
        not give that role or act on that member), `OWNER_PROTECTED`, `SELF_CHANGE_FORBIDDEN`,
        `INVITATION_EMAIL_MISMATCH`, or `CSRF_ORIGIN`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TeamNotFound:
      description: "`ORGANISATION_NOT_FOUND`, `MEMBER_NOT_FOUND`, `INVITATION_NOT_FOUND` or `JOIN_REQUEST_NOT_FOUND`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TeamConflict:
      description: |
        `LAST_OWNER` (the organisation's only active owner can never be changed or removed),
        `ALREADY_A_MEMBER`, `SEEKER_ACCOUNT_CANNOT_JOIN`, `JOIN_REQUEST_ALREADY_DECIDED` or
        `AGENCY_NOT_VERIFIED`. Nothing was changed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvitationGone:
      description: "`INVITATION_EXPIRED` (after 7 days) or `INVITATION_NO_LONGER_VALID` (accepted, cancelled or replaced)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    JoinRequestDecided:
      description: The join request after the decision.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [join_request]
            properties:
              join_request:
                $ref: "#/components/schemas/JoinRequest"
    ReviewForbidden:
      description: |
        `FORBIDDEN`, or `SELF_REVIEW_FORBIDDEN` (new in 0.23.0): the reviewer is a member of the
        listing's organisation, or sells, is the agent of, created or submitted the listing.
        Another reviewer must decide it.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: "Signed in but not allowed to use this route (`FORBIDDEN`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CsrfOrigin:
      description: |
        `CSRF_ORIGIN`: the request was authenticated by the session cookie but its `Origin`
        header is missing or not allowlisted. Never returned for bearer or anonymous requests.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLarge:
      description: The body exceeds 64 KB (`PAYLOAD_TOO_LARGE`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnsupportedMediaType:
      description: The Content-Type is not `application/json` (`UNSUPPORTED_MEDIA_TYPE`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CodeRequired:
      description: |
        The password was right (or a new code was asked for): a six-digit code was emailed to
        the account's address. No session exists yet, no cookie is set and no token is returned.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SignInChallenge"
          example:
            status: CODE_REQUIRED
            challenge_id: 8Qm3m3e0vT2b6dW0qZ2kq0c9yJx3n1rS5pLw4uYh7aE
            sent_to: "c•••@example.test"
            expires_at: "2026-11-14T09:15:00Z"
            code_length: 6
    LeaseNotFound:
      description: "`LEASE_NOT_FOUND`, `LEASE_TEMPLATE_NOT_FOUND`, `LISTING_NOT_FOUND` (unknown, or not one the caller may edit), `LEASE_DOCUMENT_UNAVAILABLE` or `ORGANISATION_NOT_FOUND` (the caller is not a member)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LeaseConflict:
      description: "`LEASE_NOT_EDITABLE`, `LEASE_STATE_CONFLICT`, `LEASE_TEMPLATE_DRAFT_EXISTS`, `LEASE_TEMPLATE_NOT_EDITABLE` or `LEASE_TEMPLATE_STATE_CONFLICT`. Nothing was changed."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LeaseUnprocessable:
      description: "`LEASE_TEMPLATE_NOT_AVAILABLE` (not approved, retired or unknown) or `LEASE_MARKET_MISMATCH` (the template's country is not the property's)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AgreementNotFound:
      description: "`AGREEMENT_NOT_FOUND`, `RECIPIENT_NOT_FOUND` or `SIGNING_LINK_NOT_FOUND`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AgreementConflict:
      description: "`AGREEMENT_STATE_CONFLICT`, `AGREEMENT_DOCUMENT_REQUIRED`, `NOT_OPEN_FOR_SIGNING` (not this recipient's turn, or the agreement is no longer out for signature) or `ALREADY_SIGNED`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AgreementFile:
      description: "`FILE_TOO_LARGE` (413), `UNSUPPORTED_FILE_TYPE` (415: not a readable PDF; 422: too many pages) or `AGREEMENT_FIELDS_INCOMPLETE` (422, per-field messages)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SigningGone:
      description: "`SIGNING_LINK_EXPIRED` or `SIGNING_LINK_NO_LONGER_VALID` (a newer link was sent to the recipient, their address was replaced, or the agreement was cancelled)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Too many requests from this IP (`RATE_LIMITED`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected server error (`INTERNAL`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Timeout:
      description: The request exceeded the server-side time limit (`TIMEOUT`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      required: [error, trace_id]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              enum:
                - VALIDATION_FAILED
                - INVALID_JSON
                - UNSUPPORTED_MEDIA_TYPE
                - PAYLOAD_TOO_LARGE
                - LISTING_NOT_FOUND
                - LISTING_UNAVAILABLE
                - IDEMPOTENCY_CONFLICT
                - REFERENCE_SET_NOT_FOUND
                - DIRECTORY_KIND_NOT_FOUND
                - PROFILE_NOT_FOUND
                - RECIPIENT_NOT_FOUND
                - RECIPIENT_UNAVAILABLE
                - UNAUTHENTICATED
                - FORBIDDEN
                - CSRF_ORIGIN
                - INVALID_CREDENTIALS
                - EMAIL_NOT_VERIFIED
                - INVALID_TOKEN
                - RATE_LIMITED
                - ORIGIN_NOT_ALLOWED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - NOT_READY
                - TIMEOUT
                - INTERNAL
            message:
              type: string
              description: Human-readable summary. Not stable; do not parse.
            fields:
              type: object
              description: Per-field messages, present for `VALIDATION_FAILED`. Keys are JSON paths such as `guest_contact.email`.
              additionalProperties:
                type: string
        trace_id:
          type: string
          description: Same value as the `X-Request-Id` response header.

    Coded:
      type: object
      description: A reference-data code with its current label. If the row has been retired the label repeats the code.
      required: [code, label]
      additionalProperties: false
      properties:
        code: { type: string }
        label: { type: string }

    Money:
      type: object
      description: An exact amount. `amount` is a decimal string with two decimal places; never parse it as a float for arithmetic.
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$", examples: ["385000.00"] }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: ISO 4217, examples: [USD] }

    Photo:
      type: object
      required: [url, alt, width, height, variants]
      additionalProperties: false
      properties:
        url:
          type: string
          description: |
            The largest size. A bundled sample image is a site-relative path served by the web
            app (`/assets/images/<file>.jpg`), returned exactly as stored. **Since 0.22.0** an
            uploaded photo is an API path, `/v1/listing-photos/{id}/large?v=<version>`, relative
            to the API origin like `Logo.url` (prefix the API base URL); it may be cached for a
            year. Only approved photos of public listings appear here.
          examples: [/assets/images/listing-house-borrowdale.jpg, "/v1/listing-photos/0b7c2f4e-1d5a-4c1e-9f0e-2a6d3c4b5e6f/large?v=3f2a9c0d1b7e"]
        alt: { type: string }
        width: { type: integer, minimum: 1, description: Pixel width of the image (the largest size). }
        height: { type: integer, minimum: 1 }
        variants:
          type: array
          description: New in 0.22.0. Every stored size of an uploaded photo, widest first (at most 2048, 1280 and 640 wide); empty for a bundled sample image.
          items: { $ref: "#/components/schemas/PhotoVariant" }

    PhotoVariant:
      type: object
      description: New in 0.22.0. One stored size of an uploaded photo, for a `srcset`.
      required: [width, height, url]
      additionalProperties: false
      properties:
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        url: { type: string, examples: ["/v1/listing-photos/0b7c.../small?v=3f2a9c0d1b7e"] }

    ListingStatus:
      type: string
      description: |
        A listing's status. `CHANGES_REQUESTED`, `REJECTED` and `ARCHIVED` are new in 0.22.0.
        To its managers a `PUBLISHED` listing past its publication period is `EXPIRED`.
      enum: [DRAFT, PENDING_REVIEW, CHANGES_REQUESTED, REJECTED, PUBLISHED, EXPIRED, ARCHIVED, PAUSED, SOLD, LET, CLOSED]

    ListingContentPatch:
      type: object
      description: |
        New in 0.22.0. The editable fields of a listing; every key is optional and `null`
        clears it. Codes are reference-data codes (`GET /v1/reference/{set}`): `deal`
        (`deal_types`), `category` (`property_categories`), `property_type` (`property_types`),
        `city` / `suburb` (`cities` / `suburbs`), `features` (`listing_features`). `featured`
        is not editable by an advertiser.
      additionalProperties: false
      properties:
        title: { type: [string, "null"], maxLength: 120, description: "Plain text, one line. A submission needs at least 5 characters." }
        summary: { type: [string, "null"], maxLength: 300, description: Plain text, one line. }
        description: { type: [string, "null"], maxLength: 8000, description: "Plain text (line breaks allowed, no HTML). A submission needs at least 30 characters." }
        deal: { type: [string, "null"], examples: [sale] }
        category: { type: [string, "null"], examples: [residential] }
        property_type: { type: [string, "null"], examples: [house] }
        price:
          type: [object, "null"]
          additionalProperties: false
          properties:
            amount: { type: [string, "null"], description: "A decimal amount with at most two decimal places, such as 385000 or 950.50.", examples: ["385000"] }
            currency: { type: string, pattern: "^[A-Z]{3}$", description: "ISO 4217; the currency of a country (`GET /v1/countries`)." }
        price_period: { type: [string, "null"], enum: [month, night, null], description: "`month` or `night` for a rental (night only for a short stay); null for a sale." }
        country: { type: string, pattern: "^[A-Za-z]{2}$", description: "Required. Cannot change once the listing has been published." }
        city: { type: [string, "null"], description: "A `cities` code of the country, where it has any." }
        suburb: { type: [string, "null"], description: "A `suburbs` code of the city." }
        city_name: { type: [string, "null"], maxLength: 80, description: "Free text, only in a country without reference cities." }
        region_name: { type: [string, "null"], maxLength: 80, description: "Free text, with `city_name` only." }
        bedrooms: { type: [integer, "null"], minimum: 0, maximum: 50 }
        bathrooms: { type: [integer, "null"], minimum: 0, maximum: 50 }
        floor_area: { type: [integer, "null"], minimum: 0, description: Square metres. }
        land_area: { type: [integer, "null"], minimum: 0, description: Square metres. }
        features: { type: [array, "null"], maxItems: 30, items: { type: string } }
        max_guests: { type: [integer, "null"], minimum: 1, maximum: 100, description: Short stays only; required to submit one. }
        min_nights: { type: [integer, "null"], minimum: 1, maximum: 365, description: Short stays only. }

    ListingContent:
      type: object
      description: New in 0.22.0. The content in the shape a PATCH sends it back (codes, not labels).
      required: [title, summary, description, deal, category, property_type, price, price_period, country, city, suburb,
                 city_name, region_name, bedrooms, bathrooms, floor_area, land_area, features, max_guests, min_nights]
      properties:
        title: { type: string }
        summary: { type: string }
        description: { type: string }
        deal: { type: [string, "null"] }
        category: { type: [string, "null"] }
        property_type: { type: [string, "null"] }
        price:
          type: object
          required: [amount, currency]
          properties:
            amount: { type: [string, "null"] }
            currency: { type: [string, "null"] }
        price_period: { type: [string, "null"] }
        country: { type: [string, "null"] }
        city: { type: [string, "null"] }
        suburb: { type: [string, "null"] }
        city_name: { type: [string, "null"] }
        region_name: { type: [string, "null"] }
        bedrooms: { type: [integer, "null"] }
        bathrooms: { type: [integer, "null"] }
        floor_area: { type: [integer, "null"] }
        land_area: { type: [integer, "null"] }
        features: { type: array, items: { type: string } }
        max_guests: { type: [integer, "null"] }
        min_nights: { type: [integer, "null"] }

    ManagedPhoto:
      type: object
      description: New in 0.22.0. A photo as its managers and reviewers see it.
      required: [id, position, alt, width, height, status, url, variants, created_at]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 0 }
        alt: { type: string, description: "The description; for a public photo of a published listing, the pending one if it changed." }
        width: { type: integer }
        height: { type: integer }
        status: { type: string, enum: [APPROVED, PENDING_REVIEW] }
        url: { type: string, description: "The large size: `/v1/listing-photos/{id}/large?v=...` for an upload, `/assets/images/...` for a bundled sample." }
        variants:
          type: array
          items:
            type: object
            required: [size, width, height, url]
            properties:
              size: { type: string, enum: [large, medium, small] }
              width: { type: integer }
              height: { type: integer }
              url: { type: string }
        created_at: { type: string, format: date-time }

    ListingTimelineEntry:
      type: object
      required: [action, from_status, to_status, review_kind, reason, actor, at]
      properties:
        action: { type: string, enum: [CREATED, SUBMITTED, APPROVED, CHANGES_REQUESTED, REJECTED, ARCHIVED, RELISTED] }
        from_status: { type: [string, "null"] }
        to_status: { type: [string, "null"] }
        review_kind: { type: [string, "null"], enum: [NEW, EDIT, null] }
        reason: { type: [string, "null"] }
        actor: { type: string, enum: [ADVERTISER, REVIEWER] }
        at: { type: string, format: date-time }
        actor_user_id: { type: string, format: uuid, description: Reviewers' view only. }

    ManagedListing:
      type: object
      description: New in 0.22.0. A listing as its managers see it (`GET /v1/me/listings/{id}`).
      required: [id, slug, reference, status, status_label, public, review, pending_changes, content, photos, photo_limit,
                 completeness, owner, advertiser, can_edit, actions, published_at, expires_at, created_at, updated_at, timeline]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        reference: { type: string, examples: [RP-ZW-482913] }
        status: { $ref: "#/components/schemas/ListingStatus" }
        status_label: { type: string, examples: ["Pending review"] }
        public: { type: boolean, description: True while the public sees the listing. }
        review:
          type: object
          required: [submitted_at, reviewed_at, reason]
          properties:
            submitted_at: { type: [string, "null"], format: date-time }
            reviewed_at: { type: [string, "null"], format: date-time, description: The last approval. }
            reason: { type: [string, "null"], description: The reviewer's reason of a request for changes or a rejection of the listing. }
        pending_changes:
          type: [object, "null"]
          description: The changes of a PUBLISHED listing that are not public yet; null when there are none.
          required: [status, status_label, reason, submitted_at, updated_at, new_photos]
          properties:
            status: { type: string, enum: [EDITING, PENDING_REVIEW, CHANGES_REQUESTED, REJECTED] }
            status_label: { type: string }
            reason: { type: [string, "null"] }
            submitted_at: { type: [string, "null"], format: date-time }
            updated_at: { type: string, format: date-time }
            new_photos: { type: integer }
        content: { $ref: "#/components/schemas/ListingContent" }
        photos: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/ManagedPhoto" } }
        photo_limit: { type: integer, const: 20 }
        completeness:
          type: object
          required: [ready, missing]
          properties:
            ready: { type: boolean, description: True when the listing can be submitted. }
            missing:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string, examples: [photos] }
                  message: { type: string, examples: ["Describe every photo (alternative text)."] }
        owner:
          type: object
          required: [type, organisation_id, agent_user_id]
          properties:
            type: { type: string, enum: [organisation, direct_owner] }
            organisation_id: { type: [string, "null"], format: uuid }
            agent_user_id: { type: [string, "null"], format: uuid }
        advertiser: { $ref: "#/components/schemas/ListingAdvertiser" }
        can_edit: { type: boolean }
        actions:
          type: array
          description: What the caller may do now.
          items: { type: string, enum: [edit, submit, archive, relist, delete] }
        published_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        timeline: { type: array, items: { $ref: "#/components/schemas/ListingTimelineEntry" } }

    ManagedListingEnvelope:
      type: object
      required: [listing]
      properties:
        listing: { $ref: "#/components/schemas/ManagedListing" }

    AdminListing:
      allOf:
        - $ref: "#/components/schemas/ManagedListing"
        - type: object
          required: [review_kind, live, changes, photo_changes, decisions]
          properties:
            review_kind: { type: [string, "null"], enum: [NEW, EDIT, null] }
            live:
              description: The public content while an edit waits (EDIT); null otherwise.
              oneOf:
                - $ref: "#/components/schemas/ListingContent"
                - type: "null"
            changes:
              type: array
              items:
                type: object
                required: [field, before, after]
                properties:
                  field: { type: string, examples: [title] }
                  before: {}
                  after: {}
            photo_changes:
              type: object
              required: [added, alt_changed]
              properties:
                added: { type: integer }
                alt_changed: { type: integer }
            decisions:
              type: array
              items: { type: string, enum: [approve, request_changes, reject] }

    AdminListingEnvelope:
      type: object
      required: [listing]
      properties:
        listing: { $ref: "#/components/schemas/AdminListing" }

    ReviewReason:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000, description: "Plain text, shown to the advertiser and emailed to them." }

    ListingQueuePage:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, reference, title, status, revision_status, review_kind, country, submitted_at, updated_at, advertiser, photo_count, pending_photo_count]
            properties:
              id: { type: string, format: uuid }
              reference: { type: string }
              title: { type: string, description: The proposed title. }
              status: { $ref: "#/components/schemas/ListingStatus" }
              revision_status: { type: [string, "null"] }
              review_kind: { type: [string, "null"], enum: [NEW, EDIT, null] }
              country:
                type: object
                required: [code, name]
                properties:
                  code: { type: string }
                  name: { type: string }
              submitted_at: { type: [string, "null"], format: date-time }
              updated_at: { type: string, format: date-time }
              advertiser:
                type: object
                required: [type, name, verified]
                properties:
                  type: { type: string, enum: [agency, private_seller] }
                  name: { type: string }
                  verified: { type: boolean }
              photo_count: { type: integer }
              pending_photo_count: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    Logo:
      type: object
      description: |
        New in 0.17.0. The logo of a directory profile (for an agent: their photo). The image
        is served by `GET /v1/directory/{kind}/{slug}/logo` as it is stored: a PNG or a JPEG,
        scaled down at upload to fit 512x512 when it was larger (since 0.18.0; a logo stored
        earlier can be up to 4096 pixels each way and 2 MB). Show it at whatever size the
        layout needs; `width` and `height` give its proportions.
      required: [url, width, height]
      additionalProperties: false
      properties:
        url:
          type: string
          description: |
            A path **relative to the API origin** (it starts with `/v1/`): prefix it with the
            API base URL. It is not relative to the web site. It ends in `?v=<version>`, the
            first 12 characters of the image's checksum, so it changes whenever the logo does.
          examples: ["/v1/directory/agencies/sample-estates/logo?v=3f2a9c0d1b7e"]
        width: { type: [integer, "null"], minimum: 1, description: "Pixel width of the image that is served; null when not recorded." }
        height: { type: [integer, "null"], minimum: 1, description: "Pixel height of the image that is served; null when not recorded." }

    ProfileLink:
      type: object
      description: New in 0.17.0. The address of a public profile page (`/v1/directory/{kind}/{slug}`).
      required: [kind, slug]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/DirectoryKind"
        slug: { type: string }

    ProfileRef:
      type: object
      description: A PUBLIC reference to a directory profile (`/v1/directory/{kind}/{slug}`). Never contact details.
      required: [kind, slug, name, verified, logo]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/DirectoryKind"
        slug: { type: string }
        name: { type: string }
        verified:
          type: boolean
          description: |
            True when the profile is public: published and verified. Inside
            `Listing.advertiser`, `agency.verified` equals `advertiser.verified`, and
            `agent.verified` is true only when the agent's own profile is verified **and** the
            business is. A reference with `verified: false` has no public page to link to.
        logo:
          oneOf:
            - $ref: "#/components/schemas/Logo"
            - type: "null"
          description: |
            New in 0.17.0. The profile's own logo; null when it has none, or when the profile is
            not public. For an agent it is the agent's own photo only: fall back to the
            agency's logo, then to initials (or use `advertiser.display.logo`, which already
            applies that order).

    AdvertiserDisplay:
      type: object
      description: |
        New in 0.17.0. Everything a listing card needs to show who advertises the listing,
        already resolved, so a client needs no further lookup. Precedence:

        | The listing belongs to | `name` | `secondary_name` | `role_label` | `logo` | `verified` | `profile` |
        |---|---|---|---|---|---|---|
        | a business with an assigned agent | the business | the agent | the business's kind | the business's logo, else the agent's photo, else null | the business is verified | the business's page |
        | a business, no agent profile | the business | null | the business's kind | the business's logo, else null | the business is verified | the business's page |
        | a direct owner, for sale | the owner's name | null | `Property Seller (Vendor)` | null | the owner's `PRIVATE_SELLER` / `LANDLORD` role is approved | null |
        | a direct owner, to rent | the owner's name | null | `Landlord` | null | as above | null |

        A "business" is any organisation: an agency, a law firm, a property manager, a
        developer or a host. `role_label` is the label of the organisation's kind in the
        `organisation_kinds` reference set (`Real Estate Agency`, `Law Firm`, `Property
        Manager`, `Property Developer`, `Host`), or of the owner's role in `account_roles`: read
        it, do not hard-code it. A direct owner's `name` falls back to `Private seller` when
        the account's name is not known.

        `verified` never comes from a copy: it is the stored verification, read with the
        listing. On a listing returned by a public endpoint it is always true (an unverified
        advertiser's listing is not public).
      required: [name, secondary_name, role_label, logo, verified, profile]
      additionalProperties: false
      properties:
        name: { type: string, examples: [Sample Estates] }
        secondary_name: { type: [string, "null"], description: "The assigned agent's name when the listing has both a business and an agent.", examples: [Tendai Ncube] }
        role_label: { type: string, examples: [Real Estate Agency] }
        logo:
          oneOf:
            - $ref: "#/components/schemas/Logo"
            - type: "null"
          description: The best logo there is; null means show initials.
        verified: { type: boolean }
        profile:
          oneOf:
            - $ref: "#/components/schemas/ProfileLink"
            - type: "null"
          description: The public page to link the name and the logo to; null for a direct owner (they have no public page).

    AgentDisplay:
      type: object
      description: |
        New in 0.17.0. The assigned agent as a person, for a detail page that shows the agent
        next to the business, each with their own Verified badge.
      required: [name, role_label, verified, logo, profile]
      additionalProperties: false
      properties:
        name: { type: string, examples: [Tendai Ncube] }
        role_label:
          type: string
          description: "The label of `AGENT` in `account_roles` (`Estate Agent`), or of `SALES_AGENT` / `LETTINGS_AGENT` for an agent with that specialism."
          examples: [Estate Agent]
        verified: { type: boolean, description: "True only when the agent's own profile is verified and the business is. It does not decide whether the listing is public." }
        logo:
          oneOf:
            - $ref: "#/components/schemas/Logo"
            - type: "null"
          description: The agent's own photo; null when they have none (no fallback here).
        profile:
          oneOf:
            - $ref: "#/components/schemas/ProfileLink"
            - type: "null"
          description: The agent's public page; null when their profile is not public.

    ListingVerification:
      type: object
      description: |
        New in 0.17.0. Which checks stand behind a listing.

        `advertiser_verified` is **always true** on a listing returned by a public endpoint:
        that is the guarantee. `listing_reviewed` is a separate, weaker fact: whether a platform
        administrator or moderator reviewed the listing itself. There is no review workflow
        yet, so today it is true only for the sample data; a real listing says `false`.
      required: [advertiser_verified, advertiser_verified_at, listing_reviewed, listing_reviewed_at]
      additionalProperties: false
      properties:
        advertiser_verified: { type: boolean }
        advertiser_verified_at:
          type: [string, "null"]
          format: date-time
          description: When the business's profile was verified, or the direct owner's role approved. Null when that time was not recorded.
        listing_reviewed: { type: boolean }
        listing_reviewed_at: { type: [string, "null"], format: date-time }

    ManagedProfile:
      type: object
      description: New in 0.17.0. A directory profile as the people who manage it see it (`GET /v1/me/profiles`).
      required: [kind, slug, name, verified, logo]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/DirectoryKind"
        slug: { type: string }
        name: { type: string }
        verified: { type: boolean, description: "True when the profile is public (published and verified)." }
        logo:
          oneOf:
            - $ref: "#/components/schemas/Logo"
            - type: "null"
          description: The profile's logo; null when it has none. The image is served only while the profile is public.

    TrustSummary:
      type: object
      description: New in 0.17.0. See `GET /v1/trust/summary`.
      required: [verified_advertisers, public_listings, listings_from_verified_advertisers, listings_reviewed, generated_at]
      additionalProperties: false
      properties:
        verified_advertisers:
          type: object
          required: [organisations, direct_owners]
          additionalProperties: false
          properties:
            organisations: { type: integer, minimum: 0, description: "Active organisations with a published, verified profile of their own (every kind, service providers included)." }
            direct_owners: { type: integer, minimum: 0, description: "Active accounts whose `PRIVATE_SELLER` or `LANDLORD` role is approved." }
        public_listings: { type: integer, minimum: 0, description: Listings the API shows right now. }
        listings_from_verified_advertisers: { type: integer, minimum: 0, description: "PUBLISHED, unexpired listings whose advertiser is verified. Equals `public_listings`." }
        listings_reviewed: { type: integer, minimum: 0, description: Public listings that were themselves reviewed. }
        generated_at: { type: string, format: date-time, description: To the minute. }

    ListingAdvertiser:
      type: object
      description: |
        Who advertises the listing: public profile references and, for a direct owner, the
        owner's name. There is no phone number, email address or street address here or
        anywhere else in a listing: a listing is answered with `POST /v1/property-requests`.

        For a card, read `display`; for a detail page that also shows the agent as a person,
        read `agent_display`. `name` and `verified` repeat `display.name` and
        `display.verified` for clients written before 0.17.0.
      required: [type, name, verified, agency, agent, display, agent_display]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [agency, private_seller]
          description: "`agency` for every business (an agency, a law firm, a property manager, a developer, a host); `private_seller` for a direct owner, whether they sell or let."
        name:
          type: string
          description: |
            Equals `display.name`: the business's name, or the direct owner's name.
            **Changed in 0.17.0** for a direct owner: it used to be the fixed text `Private
            seller` and is now the owner's account name (for example `Grace Mhlanga`).
        verified:
          type: boolean
          description: "Equals `display.verified`: the business is verified, or the direct owner's role is approved. Read from the stored verification every time, never from a copy on the listing."
        display:
          $ref: "#/components/schemas/AdvertiserDisplay"
        agent_display:
          oneOf:
            - $ref: "#/components/schemas/AgentDisplay"
            - type: "null"
          description: The assigned agent as a person. Null for a direct owner and when the listing has no assigned agent with a profile.
        agency:
          oneOf:
            - $ref: "#/components/schemas/ProfileRef"
            - type: "null"
          description: |
            The public profile of the organisation that advertises the listing. Usually an
            agency (`kind` `agencies`); for a listing owned by another kind of organisation it
            is that organisation's own profile, for example a host's (`kind` `hosts`) for a
            short stay. `type` is `agency` for every organisation. Null for a private seller.
        agent:
          oneOf:
            - $ref: "#/components/schemas/ProfileRef"
            - type: "null"
          description: The assigned agent's profile. Null for a private seller, or when no agent is assigned.

    Listing:
      type: object
      description: A public listing. The same object is used in search results, on the detail endpoint and on profiles.
      required: [id, slug, reference, title, deal, category, property_type, price, price_period, suburb, city, region, country, market_code,
                 bedrooms, bathrooms, floor_area, land_area, max_guests, min_nights, summary, description, features, featured, photos, advertiser,
                 verification, published_at, expires_at, updated_at, availability]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: "Use as `listing_id` in `POST /v1/property-requests`." }
        slug: { type: string, examples: [four-bedroom-family-home-borrowdale] }
        reference: { type: string, description: Human reference of the listing., examples: [RP-ZW-10001] }
        title: { type: string }
        deal:
          allOf: [{ $ref: "#/components/schemas/Coded" }]
          description: "`deal_types` code and label, e.g. `sale` / `For sale`."
        category:
          allOf: [{ $ref: "#/components/schemas/Coded" }]
          description: "`property_categories` code and label."
        property_type:
          allOf: [{ $ref: "#/components/schemas/Coded" }]
          description: "`property_types` code and label."
        price:
          $ref: "#/components/schemas/Money"
        price_period:
          type: [string, "null"]
          enum: [month, night, null]
          description: "A `price_periods` code: `month` for a monthly rent, `night` for a short stay (always, and only, category `short-stay`); null for a sale price. Labels (`per month`, `per night`) are in `GET /v1/reference/price_periods`."
        suburb:
          oneOf:
            - $ref: "#/components/schemas/Place"
            - type: "null"
          description: "`suburbs` code and label. **Null when the listing names no suburb** (always the case when its city is free text). Changed in 0.15.0: it used to be always an object."
        city:
          allOf: [{ $ref: "#/components/schemas/Place" }]
          description: "Always present. A `cities` code and label, or — in a country without reference places — `code: null` and the city as free text in `label`. Changed in 0.15.0: `code` is nullable."
        region:
          oneOf:
            - $ref: "#/components/schemas/Place"
            - type: "null"
          description: "The region (province) of the city: a `regions` code and label, or `code: null` with the free-text region that came with a free-text city. Null when there is none."
        country:
          $ref: "#/components/schemas/Country"
        market_code: { type: string, pattern: "^[A-Z]{2}$", description: "The same code as `country.code`." }
        bedrooms: { type: [integer, "null"], minimum: 0 }
        bathrooms: { type: [integer, "null"], minimum: 0 }
        floor_area: { type: [integer, "null"], minimum: 0, description: Square metres. }
        land_area: { type: [integer, "null"], minimum: 0, description: Square metres. }
        max_guests: { type: [integer, "null"], minimum: 1, description: "Short stays only: how many guests the place sleeps. Null for every other category (and for a short stay that does not say)." }
        min_nights: { type: [integer, "null"], minimum: 1, description: "Short stays only: the shortest stay, in nights (1 when the listing does not say). Null for every other category." }
        summary: { type: string, description: One sentence for cards. }
        description: { type: string, description: Plain text. }
        features:
          type: array
          description: "`listing_features` codes and labels, in the advertiser's order."
          items:
            $ref: "#/components/schemas/Coded"
        featured: { type: boolean }
        photos:
          type: array
          description: In display order; the first is the cover. May be empty.
          items:
            $ref: "#/components/schemas/Photo"
        advertiser:
          $ref: "#/components/schemas/ListingAdvertiser"
        verification:
          $ref: "#/components/schemas/ListingVerification"
        published_at: { type: string, format: date-time, description: Start of the current publication cycle (UTC). }
        expires_at: { type: string, format: date-time, description: End of the current publication cycle (90 days after `published_at`). Always in the future for a returned listing. }
        updated_at: { type: string, format: date-time }
        availability:
          oneOf:
            - $ref: "#/components/schemas/ListingAvailability"
            - type: "null"
          description: "New in 0.16.0. Set for short stays; **null for every other category**. The calendar itself is `GET /v1/listings/{slug}/availability`."
      example:
        id: 0195c0de-0000-7000-8000-000000000001
        slug: four-bedroom-family-home-borrowdale
        reference: RP-ZW-10001
        title: Four-bedroom family home with garden
        deal: { code: sale, label: For sale }
        category: { code: residential, label: Residential }
        property_type: { code: house, label: House }
        price: { amount: "385000.00", currency: USD }
        price_period: null
        suburb: { code: borrowdale, label: Borrowdale }
        city: { code: harare, label: Harare }
        market_code: ZW
        bedrooms: 4
        bathrooms: 3
        floor_area: 320
        land_area: 2000
        summary: Single-storey home on a walled half-acre with borehole and solar backup.
        description: A well-kept single-storey home set back from a quiet road.
        features:
          - { code: borehole, label: Borehole }
          - { code: solar-backup, label: Solar backup }
        featured: true
        photos:
          - { url: /assets/images/listing-house-borrowdale.jpg, alt: White two-storey house with a tiled roof under a blue sky, width: 1200, height: 800 }
        advertiser:
          type: agency
          name: Sample Estates
          verified: true
          agency:
            kind: agencies
            slug: sample-estates
            name: Sample Estates
            verified: true
            logo: { url: "/v1/directory/agencies/sample-estates/logo?v=3f2a9c0d1b7e", width: 256, height: 256 }
          agent: { kind: agents, slug: tendai-ncube, name: Tendai Ncube, verified: true, logo: null }
          display:
            name: Sample Estates
            secondary_name: Tendai Ncube
            role_label: Real Estate Agency
            logo: { url: "/v1/directory/agencies/sample-estates/logo?v=3f2a9c0d1b7e", width: 256, height: 256 }
            verified: true
            profile: { kind: agencies, slug: sample-estates }
          agent_display:
            name: Tendai Ncube
            role_label: Estate Agent
            verified: true
            logo: null
            profile: { kind: agents, slug: tendai-ncube }
        verification:
          advertiser_verified: true
          advertiser_verified_at: "2026-11-01T00:00:00Z"
          listing_reviewed: true
          listing_reviewed_at: "2026-11-10T08:00:00Z"
        published_at: "2026-11-10T08:00:00Z"
        expires_at: "2027-02-08T08:00:00Z"
        updated_at: "2026-11-10T08:00:00Z"

    ListingAvailability:
      type: object
      description: What a short-stay listing says about its availability calendar. No reason, note or author.
      required: [updated_at, next_available]
      additionalProperties: false
      properties:
        updated_at:
          type: [string, "null"]
          format: date-time
          description: When the lister last changed the calendar; null when they never have (every night in the booking window is then available).
        next_available:
          type: [string, "null"]
          format: date
          description: "The first available night from today on, in the listing's time zone (`YYYY-MM-DD`); null when no night in the booking window is free."

    PublicAvailability:
      type: object
      description: The calendar as the public sees it.
      required: [listing, timezone, min_nights, max_guests, from, to, days, availability_updated_at]
      additionalProperties: false
      properties:
        listing:
          type: object
          required: [slug]
          additionalProperties: false
          properties:
            slug: { type: string }
        timezone: { type: string, description: "IANA zone of the listing's country: the zone the dates are in." }
        min_nights: { type: integer, minimum: 1, description: The shortest stay, in nights (1 when the listing does not say). }
        max_guests: { type: [integer, "null"], minimum: 1 }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          description: One entry per night from `from` to `to`, in order.
          items:
            type: object
            required: [date, available]
            additionalProperties: false
            properties:
              date: { type: string, format: date }
              available: { type: boolean, description: "False for a night the lister marked unavailable, a night in the past and a night beyond the booking window. Never says which." }
        availability_updated_at: { type: [string, "null"], format: date-time }

    AvailabilityReason:
      type: string
      enum: [BLOCKED, BOOKED]
      description: "Private to the lister. `BLOCKED`: the owner's choice. `BOOKED`: taken."

    ListerAvailability:
      type: object
      description: The calendar as the lister sees it, with the private reasons and notes.
      required: [listing, timezone, window, min_nights, max_guests, from, to, days, ranges, availability_updated_at]
      additionalProperties: false
      properties:
        listing:
          type: object
          required: [id, slug, title, reference]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            title: { type: string }
            reference: { type: string }
        timezone: { type: string, description: "IANA zone of the listing's country: the zone the dates are in." }
        window:
          type: object
          description: "The booking window: today .. today + 365 days in `timezone`. Changes must lie inside it."
          required: [from, to]
          additionalProperties: false
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        min_nights: { type: integer, minimum: 1 }
        max_guests: { type: [integer, "null"], minimum: 1 }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          description: One entry per night from `from` to `to`, in order.
          items:
            type: object
            required: [date, available, reason, note]
            additionalProperties: false
            properties:
              date: { type: string, format: date }
              available: { type: boolean }
              reason:
                oneOf:
                  - $ref: "#/components/schemas/AvailabilityReason"
                  - type: "null"
                description: Set for a night the lister marked; null for an available night and for one that is unavailable only because it is in the past or beyond the window.
              note: { type: [string, "null"], maxLength: 200 }
        ranges:
          type: array
          description: Every stored range of unavailable nights (not only those inside `from`..`to`), sorted by first night. They never overlap.
          items:
            type: object
            required: [id, first_night, last_night, reason, note, updated_at]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid, description: "Not stable across changes: a range that is merged or split gets a new shape, and the right half of a split a new id." }
              first_night: { type: string, format: date }
              last_night: { type: string, format: date, description: Inclusive. }
              reason: { $ref: "#/components/schemas/AvailabilityReason" }
              note: { type: [string, "null"], maxLength: 200 }
              updated_at: { type: string, format: date-time }
        availability_updated_at: { type: [string, "null"], format: date-time }

    AvailabilityChanges:
      type: object
      required: [changes]
      additionalProperties: false
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 50
          description: Applied in order.
          items:
            type: object
            required: [from, to, status]
            additionalProperties: false
            properties:
              from: { type: string, format: date, description: First night, not in the past. }
              to: { type: string, format: date, description: "Last night, inclusive; not before `from`, at most 366 nights, inside the booking window." }
              status: { type: string, enum: [AVAILABLE, BLOCKED, BOOKED] }
              note: { type: [string, "null"], maxLength: 200, description: "Private. Plain text on one line. Only with `BLOCKED` or `BOOKED`." }

    MyListing:
      type: object
      description: One of the caller's listings, as a summary.
      required: [id, slug, reference, title, category, property_type, status, price, price_period, city, country, max_guests, min_nights, availability_updated_at, photo, can_edit]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        reference: { type: string }
        title: { type: string }
        category: { $ref: "#/components/schemas/Coded" }
        property_type: { $ref: "#/components/schemas/Coded" }
        status: { type: string, description: "The listing's status, whatever it is: `PUBLISHED`, `EXPIRED`, `DRAFT`, `PAUSED`, `SOLD`, `LET`, `CLOSED`." }
        price: { $ref: "#/components/schemas/Money" }
        price_period: { type: [string, "null"], enum: [month, night, null] }
        city: { $ref: "#/components/schemas/Place" }
        country: { $ref: "#/components/schemas/Country" }
        max_guests: { type: [integer, "null"], description: Short stays only. }
        min_nights: { type: [integer, "null"], description: Short stays only (1 when the listing does not say). }
        availability_updated_at: { type: [string, "null"], format: date-time, description: Short stays only; null when the calendar was never changed. }
        can_edit: { type: boolean, description: "Added in 0.26.1. Whether the caller may edit this listing (and draft a lease for it): an organisation's OWNER and MANAGER may edit all its listings, an AGENT only those assigned to them." }
        photo:
          oneOf:
            - $ref: "#/components/schemas/Photo"
            - type: "null"
          description: The first photo, or null.

    MyListingPage:
      type: object
      required: [items, page, page_size, total, total_pages]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MyListing" } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    StayDetails:
      type: object
      description: The dates and guests of a request to stay.
      required: [check_in, check_out, nights, guests]
      additionalProperties: false
      properties:
        check_in: { type: string, format: date, description: The first night. }
        check_out: { type: string, format: date, description: The day of leaving (not a night of the stay). }
        nights: { type: integer, minimum: 1 }
        guests: { type: integer, minimum: 1 }

    Country:
      type: object
      description: The country of a listing or a profile (its own; every listing and profile has one).
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[A-Z]{2}$", description: "ISO 3166-1 alpha-2 code; use it as the `country` filter." }
        name: { type: string, examples: [Zimbabwe] }

    Place:
      type: object
      description: |
        A city, a suburb or a region of a listing or a profile.

        - A **reference place**: `code` is the reference-data code (use it as the filter of the
          same name) and `label` its current label. If the row has been retired the label
          repeats the code.
        - A **free-text place**: `code` is `null` and `label` is the text as it was entered
          (plain text, at most 80 characters). This is how a city or region is written in a
          country that has no reference places yet. It cannot be used as a filter; `q` finds it.

        **Changed in 0.15.0:** `code` used to be a non-null string (this used to be `Coded`).
        Clients must treat `code` as optional and must not build a filter from a null code.
      required: [code, label]
      additionalProperties: false
      properties:
        code: { type: [string, "null"], description: "Reference code, or null for a free-text place." }
        label: { type: string, maxLength: 120 }
      examples:
        - { code: harare, label: Harare }
        - { code: null, label: Grand Baie }

    FacetCount:
      type: object
      required: [code, label, count]
      additionalProperties: false
      properties:
        code: { type: string }
        label: { type: string }
        count: { type: integer, minimum: 1 }
        city:
          type: string
          description: "Present on the values of the `suburb` facet only: the `cities` code of the suburb's city, so a client can group suburbs by city. Absent everywhere else."

    ListingFacets:
      type: object
      description: "All keys are always present; a facet with no values is an empty array. `price` can be null (see it)."
      required: [deal, category, property_type, city, suburb, bedrooms, features, price, currencies, country, region]
      additionalProperties: false
      properties:
        country:
          type: array
          description: "By country: `code` is the country code, `label` the country name. Only countries that have results are listed. Ignores the `country` filter, like every facet ignores its own. Ordered by label."
          items: { $ref: "#/components/schemas/FacetCount" }
        region:
          type: array
          description: "By the region of the listing's city: `code` is a `regions` code. Ignores the `region` filter. Listings whose city has no region, or whose city and region are free text, are not counted. Ordered by label."
          items: { $ref: "#/components/schemas/FacetCount" }
        deal: { type: array, items: { $ref: "#/components/schemas/FacetCount" }, description: Ordered by label. }
        category: { type: array, items: { $ref: "#/components/schemas/FacetCount" } }
        property_type: { type: array, items: { $ref: "#/components/schemas/FacetCount" } }
        city: { type: array, items: { $ref: "#/components/schemas/FacetCount" }, description: "Reference cities only: a listing whose city is free text is not counted here." }
        suburb: { type: array, items: { $ref: "#/components/schemas/FacetCount" }, description: "Each value carries `city`, the code of its city." }
        bedrooms:
          type: array
          description: "Exact bedroom counts in ascending order; `code` is the number as a string (`\"3\"`), `label` is e.g. `3 bedrooms`."
          items: { $ref: "#/components/schemas/FacetCount" }
        features:
          type: array
          description: Ordered by count (highest first), then label.
          items: { $ref: "#/components/schemas/FacetCount" }
        price:
          type: [object, "null"]
          description: |
            Lowest and highest price, in `currency`, among the listings matching every filter
            except the price filter; `min` and `max` are null when there are none in that
            currency. `currency` is the search's one currency: the `currency` parameter, else
            the selected country's, else the only currency the results are priced in (`USD`
            when nothing matches).

            **Null (changed in 0.15.0)** when neither `currency` nor `country` was given and the
            results span more than one currency: there is no single range. Show `currencies`
            and ask the user to pick one, then repeat the search with `currency=`.
          required: [currency, min, max]
          additionalProperties: false
          properties:
            currency: { type: string, pattern: "^[A-Z]{3}$" }
            min: { type: [string, "null"], examples: ["600.00"] }
            max: { type: [string, "null"], examples: ["640000.00"] }
        currencies:
          type: array
          description: "New in 0.15.0. The currencies the results are priced in, with the number of listings in each, most listings first (then by code). Counted like `price`: every filter applies except the price filter. Empty when nothing matches."
          items:
            type: object
            required: [code, count]
            additionalProperties: false
            properties:
              code: { type: string, pattern: "^[A-Z]{3}$" }
              count: { type: integer, minimum: 1 }
          examples:
            - [{ code: USD, count: 20 }, { code: GBP, count: 3 }, { code: MUR, count: 1 }]

    ListingPage:
      type: object
      required: [items, page, page_size, total, total_pages, facets]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 48 }
        total: { type: integer, minimum: 0, description: Number of listings matching the filters. }
        total_pages: { type: integer, minimum: 0 }
        facets:
          $ref: "#/components/schemas/ListingFacets"

    ListingSuggestion:
      type: object
      required: [type, label, value]
      additionalProperties: false
      properties:
        type: { type: string, enum: [suburb, city, region, country, listing] }
        label: { type: string, description: "Text to show. For a suburb it includes the city (`Borrowdale, Harare`), for a region the country (`Matabeleland North, Zimbabwe`)." }
        value:
          type: string
          description: "For `suburb`, `city`, `region` and `country`: the code, to use as the filter of the same name. For `listing`: the listing's slug."

    DirectoryKindInfo:
      type: object
      required: [code, label, singular_label, description]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/DirectoryKind"
        label: { type: string, examples: [Estate agencies] }
        singular_label: { type: string, examples: [Estate agency] }
        description: { type: string }

    DirectoryKindCount:
      type: object
      required: [code, label, singular_label, description, count]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/DirectoryKind"
        label: { type: string }
        singular_label: { type: string }
        description: { type: string }
        count: { type: integer, minimum: 0, description: Public profiles of this kind. }

    DirectoryProfile:
      type: object
      description: |
        A public profile. It has no phone number, email address or street address, and never
        will: use `POST /v1/business-enquiries` with its `kind` and `slug` to contact it.
      required: [kind, slug, name, role, tagline, description, city, region, country, areas, services, offerings, trade, specialism, verified, sponsored,
                 since, logo, agency, listing_count, updated_at]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/DirectoryKind"
        slug: { type: string }
        name: { type: string }
        role: { type: string, description: Job title for a person, speciality for a business. }
        tagline: { type: string }
        description: { type: string, description: Plain text "about" paragraph. }
        city:
          allOf: [{ $ref: "#/components/schemas/Place" }]
          description: "A `cities` code and label, or — in a country without reference places — `code: null` and the city as free text in `label`. Changed in 0.15.0: `code` is nullable. (A profile without any city, which onboarding does not allow, has `code: null` and an empty label.)"
        region:
          oneOf:
            - $ref: "#/components/schemas/Place"
            - type: "null"
          description: "`regions` code and label of the city's region, or `code: null` with a free-text region; null when there is none."
        country:
          oneOf:
            - $ref: "#/components/schemas/Country"
            - type: "null"
          description: "The profile's own country. Every profile has one; the type stays nullable for compatibility. Changed in 0.15.0: it is the profile's country, no longer derived from its city."
        areas: { type: array, items: { type: string }, description: Free-text names of the areas served. Not reference codes. }
        services: { type: array, items: { type: string }, description: "Names of the services offered; any of them can be sent as `service` in a business enquiry." }
        offerings:
          type: array
          description: Services described in detail. Empty for most kinds.
          items:
            type: object
            required: [name, description]
            additionalProperties: false
            properties:
              name: { type: string }
              description: { type: string }
        trade:
          oneOf:
            - $ref: "#/components/schemas/Coded"
            - type: "null"
          description: "`service_trades` code and label. Service providers only; null otherwise."
        specialism:
          oneOf:
            - $ref: "#/components/schemas/Coded"
            - type: "null"
          description: |
            Agent profiles only: `{code: SALES, label: "Sales Agent"}` or
            `{code: LETTINGS, label: "Lettings Agent"}` for an agent who specialises; null for a
            general estate agent and for every other kind.
        verified: { type: boolean }
        sponsored: { type: boolean, description: Paid placement. Must be labelled "Sponsored" wherever it is shown. }
        since: { type: [integer, "null"], description: Year the business started, when known. }
        logo:
          oneOf:
            - $ref: "#/components/schemas/Logo"
            - type: "null"
          description: |
            **Changed in 0.17.0** (it was always null, and documented as a `Photo`). The
            profile's logo, or an agent's photo; null when it has none. Uploaded at onboarding
            (the `LOGO` document) or with `PUT /v1/me/profiles/{kind}/{slug}/logo`. In the sample
            data every business has a generated logo except `agencies/sample-realty`, and no
            agent has a photo, so both fallbacks can be tried.
        agency:
          oneOf:
            - $ref: "#/components/schemas/ProfileRef"
            - type: "null"
          description: "Agent profiles only: the agency they work for."
        listing_count: { type: integer, minimum: 0, description: Number of public listings of an agency or agent; 0 for other kinds. }
        updated_at: { type: string, format: date-time }

    DirectoryProfileDetail:
      description: A profile with its agents and listings.
      allOf:
        - $ref: "#/components/schemas/DirectoryProfile"
        - type: object
          required: [agents, listings]
          properties:
            agents:
              type: array
              description: An agency's agent profiles, by name. Empty for every other kind.
              items:
                $ref: "#/components/schemas/ProfileRef"
            listings:
              type: array
              description: The profile's public listings, newest first. Empty for kinds that own no listings.
              items:
                $ref: "#/components/schemas/Listing"

    DirectoryPage:
      type: object
      required: [kind, items, page, page_size, total, total_pages]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/DirectoryKindInfo"
        items:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryProfile"
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 48 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }

    ReferenceSetCode:
      type: string
      enum:
        - deal_types
        - property_categories
        - property_types
        - request_types
        - contact_methods
        - account_roles
        - directory_kinds
        - service_trades
        - regions
        - cities
        - suburbs
        - listing_features
        - onboarding_documents
        - organisation_kinds
        - price_periods

    ReferenceGroup:
      type: object
      description: The heading an account role is listed under.
      required: [code, label, sort_order]
      additionalProperties: false
      properties:
        code:
          type: string
          examples: [looking, listing, agency]
        label:
          type: string
          examples: [Looking for property]
        sort_order:
          type: integer

    ReferenceItem:
      type: object
      description: |
        One row of a reference set. **Every key is always present**; a key that does not apply
        to the set is `null`.
      required: [code, label, singular_label, description, sort_order, market_code, parent_code, group, requires_verification]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
          description: Stable identifier. This is what a client sends back to the API. Its case is significant.
        label:
          type: string
          description: Text shown to people. It can change at any time; do not branch on it.
        singular_label:
          type: [string, "null"]
          description: "`directory_kinds` only: the singular form, e.g. `Estate agency` for `Estate agencies`."
        description:
          type: [string, "null"]
          description: "`directory_kinds` only: one sentence describing the section."
        sort_order:
          type: integer
          description: Display position within the set (within its group for account roles). Items already arrive in order.
        market_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
          description: The market the row belongs to (`cities`, `suburbs`), or null when it applies to every market.
        parent_code:
          type: [string, "null"]
          description: "`property_types`: the `property_categories` code. `cities`: the `regions` code. `suburbs`: the `cities` code. Null elsewhere."
        group:
          oneOf:
            - $ref: "#/components/schemas/ReferenceGroup"
            - type: "null"
          description: "`account_roles` only."
        requires_verification:
          type: [boolean, "null"]
          description: |
            `account_roles` only. `true`: choosing the role at registration only records a
            request (`PENDING_VERIFICATION`). `false`: the role is `ACTIVE` once the email is verified.

    ReferenceData:
      type: object
      required: [market, sets]
      additionalProperties: false
      properties:
        market:
          type: [string, "null"]
          description: The `market` filter that was applied, upper-cased, or null.
        sets:
          type: object
          description: Every set, keyed by its code. All thirteen keys are always present.
          additionalProperties: false
          required: [deal_types, property_categories, property_types, request_types, contact_methods, account_roles, directory_kinds, service_trades, cities, suburbs, listing_features, onboarding_documents, organisation_kinds]
          properties:
            deal_types: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            property_categories: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            property_types: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            request_types: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            contact_methods: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            account_roles: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            directory_kinds: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            service_trades: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            cities: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            suburbs: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            listing_features: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            onboarding_documents: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            organisation_kinds: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }

    ReferenceSet:
      type: object
      required: [set, market, items]
      additionalProperties: false
      properties:
        set:
          $ref: "#/components/schemas/ReferenceSetCode"
        market:
          type: [string, "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceItem"

    User:
      type: object
      description: |
        The signed-in user. Capabilities come only from `memberships` (organisation-scoped) and
        `platform_roles`. `account_roles` are self-declared at registration and grant nothing.
        All three arrays are always present (empty, never null).
      required: [id, name, email, email_verified, platform_roles, memberships, account_roles]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
          description: Lower-cased.
        email_verified:
          type: boolean
          description: Always true for a signed-in user (sessions are only issued after verification).
        platform_roles:
          type: array
          items:
            $ref: "#/components/schemas/PlatformRoleAssignment"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        account_roles:
          type: array
          description: Self-declared account roles, in allowlist order. Informational only.
          items:
            $ref: "#/components/schemas/AccountRole"

    SelectableAccountRole:
      type: string
      description: |
        A role a person may choose for themselves at registration: a code from the
        `account_roles` reference set. The values below are the baseline; the set that is
        accepted is whatever `GET /v1/reference/account_roles` returns. Platform administrator
        roles are never in it and can never be chosen.
      enum:
        - CONSUMER
        - TENANT
        - AGENT
        - SALES_AGENT
        - LETTINGS_AGENT
        - PROPERTY_MANAGER
        - SOLICITOR
        - AGENCY_OWNER
        - AGENCY_ADMIN
        - AGENCY_STAFF
        - LANDLORD
        - PRIVATE_SELLER
        - HOST
        - DEVELOPER
        - SERVICE_PROVIDER
      x-labels:
        CONSUMER: Prospective Buyer
        TENANT: Prospective Tenant
        AGENT: Estate Agent
        SALES_AGENT: Sales Agent
        LETTINGS_AGENT: Lettings Agent
        PROPERTY_MANAGER: Property Manager
        SOLICITOR: Solicitor
        AGENCY_OWNER: Agency Principal
        AGENCY_ADMIN: Agency Administrator
        AGENCY_STAFF: Agency Staff
        LANDLORD: Landlord
        PRIVATE_SELLER: Property Seller (Vendor)
        HOST: Host
        DEVELOPER: Property Developer
        SERVICE_PROVIDER: Property Service Provider

    AccountRole:
      type: object
      description: |
        A role the user chose at registration, with its status. It is **not** an authorisation:
        it creates no organisation or membership and gives no access to organisation data
        (see `memberships`) or to platform administration (see `platform_roles`).
      required: [role, status, onboarding_status]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/SelectableAccountRole"
        status:
          type: string
          enum: [ACTIVE, PENDING_VERIFICATION, REJECTED]
          description: |
            `ACTIVE` for CONSUMER and TENANT. A professional role is `PENDING_VERIFICATION` until
            a platform administrator decides its onboarding application, then `ACTIVE` (approved)
            or `REJECTED`.
        onboarding_status:
          oneOf:
            - $ref: "#/components/schemas/OnboardingStatus"
            - type: "null"
          description: |
            Status of the role's current onboarding application. Null for a role that has no
            onboarding (CONSUMER, TENANT) and for a role that was granted without one.

    OnboardingStatus:
      type: string
      enum: [DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED, REJECTED]

    OnboardingProfileRef:
      type: object
      description: "The address of a public profile: `GET /v1/directory/{kind}/{slug}`."
      required: [kind, slug]
      additionalProperties: false
      properties:
        kind: { type: string, examples: [service-providers] }
        slug: { type: string, examples: [kopje-plumbing] }

    OnboardingRoleRequirements:
      type: object
      required: [role, label, outcome, organisation_kind, directory_kind, fields, documents]
      additionalProperties: false
      properties:
        role: { type: string, description: "Account role code.", examples: [SERVICE_PROVIDER] }
        label: { type: string, description: "The role's label from the `account_roles` reference set." }
        outcome:
          type: string
          enum: [ORGANISATION, AGENCY_MEMBER, NONE]
          description: |
            What an approval creates. `ORGANISATION`: a new organisation owned by the applicant.
            `AGENCY_MEMBER`: a membership in an existing verified agency. `NONE`: nothing; the role
            just becomes ACTIVE.
        organisation_kind:
          type: [string, "null"]
          enum: [AGENCY, LAW_FIRM, PROPERTY_MANAGER, HOST, DEVELOPER, SERVICE_PROVIDER, null]
          description: Set for `ORGANISATION`.
        directory_kind:
          type: [string, "null"]
          description: The public directory the approved applicant appears in (a `directory_kinds` code); null when the role gets no public profile.
        fields:
          type: array
          description: |
            The details that apply to this role, in form order. Names are the keys of
            `OnboardingDetails`.

            **Changed in 0.15.0 for the `ORGANISATION` outcome:** `country` is new and required;
            `city` is no longer flagged `required` and `city_name` is new, because **exactly one
            of the two is needed**, which a per-field flag cannot say: `city` (a code) when the
            chosen country has cities in the reference data, `city_name` (free text) when it has
            none. A form should ask for the country first, load
            `GET /v1/reference/cities?market=<country>` and show a drop-down when it is not
            empty, a text box when it is. An application's `missing.fields` names the one that
            is missing (`city` or `city_name`).
          items:
            type: object
            required: [name, required]
            additionalProperties: false
            properties:
              name: { type: string, enum: [business_name, tagline, description, country, city, city_name, areas, services, trade, registration_number, contact_phone, agency_slug, job_title, bio] }
              required: { type: boolean, description: "Must be set before the application can be submitted. See the note above for `city` and `city_name`." }
        documents:
          type: array
          description: "The documents this role must (`required` true) or may attach, in display order."
          items:
            type: object
            required: [code, label, description, required]
            additionalProperties: false
            properties:
              code: { type: string, description: "A code of the `onboarding_documents` reference set; the `type` of an upload.", examples: [PROOF_OF_IDENTITY] }
              label: { type: string }
              description: { type: string }
              required: { type: boolean }

    OnboardingDetails:
      type: object
      description: |
        Every key is always present. A text field that is not set is null; `areas` and
        `services` are always arrays. Which keys apply to a role is in
        `GET /v1/onboarding/requirements`; the others stay null/empty.
      required: [business_name, tagline, description, city, country, city_name, areas, services, trade, registration_number, contact_phone, agency_slug, job_title, bio]
      additionalProperties: false
      properties:
        business_name: { type: [string, "null"], minLength: 2, maxLength: 120, description: "Organisation outcomes. Becomes the organisation's and the profile's name." }
        tagline: { type: [string, "null"], maxLength: 140, description: "Organisation outcomes. Public." }
        description: { type: [string, "null"], maxLength: 2000, description: "Organisation outcomes. Plain text, line breaks allowed, no HTML. Public." }
        country: { type: [string, "null"], pattern: "^[A-Z]{2}$", description: "New in 0.15.0. Organisation outcomes, **required**. The code of any enabled country (`GET /v1/countries`). It is the application's market (`market_code`), which is what a Market Administrator is scoped by, and becomes the country of the organisation and its profile. Null for the other outcomes." }
        city: { type: [string, "null"], description: "Organisation outcomes. A code of the `cities` reference set, **where the country has cities in the reference data** (`GET /v1/reference/cities?market=GB` is not empty); it must be a city of `country`. Required there. Null when `city_name` is used." }
        city_name: { type: [string, "null"], maxLength: 80, description: "New in 0.15.0. Organisation outcomes. The city as free text (plain text, no HTML), **where the country has no cities in the reference data**; required there. Null when `city` is used. Public: it becomes the profile's `city.label` with `city.code: null`." }
        areas: { type: array, maxItems: 12, items: { type: string, maxLength: 60 }, description: "Areas served. Public. Always an array (empty when unset)." }
        services: { type: array, maxItems: 12, items: { type: string, maxLength: 60 }, description: "Organisation outcomes. Services offered. Public. Always an array." }
        trade: { type: [string, "null"], description: "SERVICE_PROVIDER only (required there). A code of the `service_trades` reference set." }
        registration_number: { type: [string, "null"], maxLength: 60, description: "Organisation outcomes. **Private**: for the verification team only, never public." }
        contact_phone: { type: [string, "null"], pattern: '^\+[1-9][0-9]{7,14}$', description: "Every role. E.164. **Private**: for the verification team only, never public." }
        agency_slug: { type: [string, "null"], description: "AGENT, AGENCY_STAFF, AGENCY_ADMIN. The slug of an existing, verified agency (`GET /v1/directory/agencies`)." }
        job_title: { type: [string, "null"], maxLength: 80, description: "Agency members. Shown on an agent's profile." }
        bio: { type: [string, "null"], maxLength: 1000, description: "AGENT only. Plain text. Public (the agent profile's description)." }

    OnboardingDetailsPatch:
      type: object
      description: Any subset of the detail fields that apply to the role. Absent = unchanged; null or "" = cleared.
      additionalProperties: false
      properties:
        business_name: { type: [string, "null"], minLength: 2, maxLength: 120, description: "Organisation outcomes. Becomes the organisation's and the profile's name." }
        tagline: { type: [string, "null"], maxLength: 140, description: "Organisation outcomes. Public." }
        description: { type: [string, "null"], maxLength: 2000, description: "Organisation outcomes. Plain text, line breaks allowed, no HTML. Public." }
        country: { type: [string, "null"], description: "Organisation outcomes. The code of any enabled country, in any case. `400` when unknown. Changing it clears a stored `city` of another country, and a stored `city_name` when the new country has reference cities." }
        city: { type: [string, "null"], description: "Organisation outcomes. A `cities` code. `400` when unknown, or when it is not a city of the `country` sent in the same request. **Sent without `country`, it sets the country to the city's own** (so a client that only knows `city` keeps working). Clears `city_name`." }
        city_name: { type: [string, "null"], maxLength: 80, description: "Organisation outcomes. Free-text city, plain text without HTML. `400` when the country has cities in the reference data (send `city` instead), or when sent together with a non-null `city`. Clears `city`." }
        areas: { type: [array, "null"], maxItems: 12, items: { type: string, maxLength: 60 }, description: "Areas served. Public. Always an array (empty when unset)." }
        services: { type: [array, "null"], maxItems: 12, items: { type: string, maxLength: 60 }, description: "Organisation outcomes. Services offered. Public. Always an array." }
        trade: { type: [string, "null"], description: "SERVICE_PROVIDER only (required there). A code of the `service_trades` reference set." }
        registration_number: { type: [string, "null"], maxLength: 60, description: "Organisation outcomes. **Private**: for the verification team only, never public." }
        contact_phone: { type: [string, "null"], pattern: '^\+[1-9][0-9]{7,14}$', description: "Every role. E.164. **Private**: for the verification team only, never public." }
        agency_slug: { type: [string, "null"], description: "AGENT, AGENCY_STAFF, AGENCY_ADMIN. The slug of an existing, verified agency (`GET /v1/directory/agencies`)." }
        job_title: { type: [string, "null"], maxLength: 80, description: "Agency members. Shown on an agent's profile." }
        bio: { type: [string, "null"], maxLength: 1000, description: "AGENT only. Plain text. Public (the agent profile's description)." }

    OnboardingDocument:
      type: object
      description: An attached document. Where the file is stored and its checksum are never exposed.
      required: [id, type, file_name, content_type, size_bytes, uploaded_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        type:
          type: object
          required: [code, label]
          additionalProperties: false
          properties:
            code: { type: string, examples: [PROOF_OF_IDENTITY] }
            label: { type: string, examples: [Proof of identity] }
        file_name: { type: string, maxLength: 100, description: "Sanitised display name, with the extension of the detected type." }
        content_type: { type: string, enum: [application/pdf, image/jpeg, image/png], description: "Detected from the content." }
        size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
        uploaded_at: { type: string, format: date-time }

    OnboardingDecision:
      type: object
      description: The administrator's last decision. Both null until there is one, and again after the application is resubmitted.
      required: [reason, decided_at]
      additionalProperties: false
      properties:
        reason: { type: [string, "null"], description: "Why changes were requested or the application was rejected (an optional note for an approval)." }
        decided_at: { type: [string, "null"], format: date-time }

    OnboardingApplication:
      type: object
      description: An application as its owner sees it.
      required: [id, role, role_label, status, status_label, details, documents, missing, can_submit, can_edit, can_reapply, decision, profile, submitted_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        role: { type: string, examples: [SERVICE_PROVIDER] }
        role_label: { type: string, examples: [Service provider] }
        status: { $ref: "#/components/schemas/OnboardingStatus" }
        status_label: { type: string, enum: [Pending Verification, Under Review, Changes Requested, Approved, Rejected], description: "The wording to show for `status`: DRAFT = Pending Verification (not yet submitted), SUBMITTED = Under Review, CHANGES_REQUESTED = Changes Requested, APPROVED = Approved, REJECTED = Rejected." }
        details: { $ref: "#/components/schemas/OnboardingDetails" }
        documents:
          type: array
          description: Newest first.
          items: { $ref: "#/components/schemas/OnboardingDocument" }
        missing:
          type: object
          description: What still has to be provided before the application can be submitted.
          required: [fields, documents]
          additionalProperties: false
          properties:
            fields: { type: array, items: { type: string }, description: "Names of required details that are not set." }
            documents: { type: array, items: { type: string }, description: "Codes of required documents that are not attached." }
        can_submit: { type: boolean, description: "Editable and nothing is missing." }
        can_edit: { type: boolean, description: "`DRAFT` or `CHANGES_REQUESTED`: details and documents can be changed." }
        can_reapply: { type: boolean, description: "`REJECTED`: saving details (PUT) starts a new application for the role." }
        decision: { $ref: "#/components/schemas/OnboardingDecision" }
        profile:
          description: The public profile an approval created; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/OnboardingProfileRef"
            - type: "null"
        submitted_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }

    OnboardingApplicationEnvelope:
      type: object
      required: [application]
      additionalProperties: false
      properties:
        application: { $ref: "#/components/schemas/OnboardingApplication" }

    OnboardingReason:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 5, maxLength: 500, description: "Plain text. Emailed to the applicant and kept in the history." }

    OnboardingAgencyRef:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        slug: { type: string }
        name: { type: string }

    OnboardingAdminItem:
      type: object
      required: [id, role, role_label, status, status_label, applicant, business_name, agency, submitted_at, updated_at, document_count]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        role: { type: string }
        role_label: { type: string }
        status: { $ref: "#/components/schemas/OnboardingStatus" }
        status_label: { type: string, enum: [Pending Verification, Under Review, Changes Requested, Approved, Rejected], description: "The wording to show for `status`: DRAFT = Pending Verification (not yet submitted), SUBMITTED = Under Review, CHANGES_REQUESTED = Changes Requested, APPROVED = Approved, REJECTED = Rejected." }
        applicant:
          type: object
          required: [name, email]
          additionalProperties: false
          properties:
            name: { type: string }
            email: { type: string, format: email }
        business_name: { type: [string, "null"] }
        agency:
          description: The agency the applicant wants to join (agency-member roles); null otherwise.
          oneOf:
            - $ref: "#/components/schemas/OnboardingAgencyRef"
            - type: "null"
        submitted_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }
        document_count: { type: integer, minimum: 0 }

    OnboardingAdminPage:
      type: object
      required: [items, page, page_size, total, total_pages, counts]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/OnboardingAdminItem" } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Applications in the requested status." }
        total_pages: { type: integer }
        counts:
          type: object
          description: Applications per status, within the same `role`, `q` and market scope. All five keys are always present.
          required: [SUBMITTED, CHANGES_REQUESTED, APPROVED, REJECTED, DRAFT]
          additionalProperties: false
          properties:
            SUBMITTED: { type: integer }
            CHANGES_REQUESTED: { type: integer }
            APPROVED: { type: integer }
            REJECTED: { type: integer }
            DRAFT: { type: integer }

    OnboardingAdminApplication:
      type: object
      description: The full application for an administrator, including the private details.
      required: [id, role, role_label, status, status_label, outcome, market_code, applicant, details, agency, documents, requirements, history, decision, profile, submitted_at, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        role: { type: string }
        role_label: { type: string }
        status: { $ref: "#/components/schemas/OnboardingStatus" }
        status_label: { type: string, enum: [Pending Verification, Under Review, Changes Requested, Approved, Rejected], description: "The wording to show for `status`: DRAFT = Pending Verification (not yet submitted), SUBMITTED = Under Review, CHANGES_REQUESTED = Changes Requested, APPROVED = Approved, REJECTED = Rejected." }
        outcome: { type: string, enum: [ORGANISATION, AGENCY_MEMBER, NONE] }
        market_code: { type: [string, "null"], description: "The market the application belongs to; null when it has none (yet)." }
        applicant:
          type: object
          required: [id, name, email, email_verified, created_at]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            email_verified: { type: boolean }
            created_at: { type: string, format: date-time, description: "When the account was created." }
        details: { $ref: "#/components/schemas/OnboardingDetails" }
        agency:
          oneOf:
            - $ref: "#/components/schemas/OnboardingAgencyRef"
            - type: "null"
        documents: { type: array, items: { $ref: "#/components/schemas/OnboardingDocument" } }
        requirements:
          type: object
          description: The requirement checklist, as the tables stand now.
          required: [fields, documents]
          additionalProperties: false
          properties:
            fields:
              type: array
              items:
                type: object
                required: [name, required, provided]
                additionalProperties: false
                properties:
                  name: { type: string }
                  required: { type: boolean }
                  provided: { type: boolean }
            documents:
              type: array
              items:
                type: object
                required: [code, label, description, required, provided]
                additionalProperties: false
                properties:
                  code: { type: string }
                  label: { type: string }
                  description: { type: string }
                  required: { type: boolean }
                  provided: { type: boolean }
        history:
          type: array
          description: Every transition, oldest first. Rows are never changed.
          items:
            type: object
            required: [from, from_label, to, to_label, actor_name, reason, at]
            additionalProperties: false
            properties:
              from: { $ref: "#/components/schemas/OnboardingStatus" }
              to: { $ref: "#/components/schemas/OnboardingStatus" }
              from_label: { type: string, description: "Display wording of `from`." }
              to_label: { type: string, description: "Display wording of `to`." }
              actor_name: { type: string, description: "Who did it: the applicant (submit) or the administrator. Empty if that account no longer exists." }
              reason: { type: [string, "null"] }
              at: { type: string, format: date-time }
        decision: { $ref: "#/components/schemas/OnboardingDecision" }
        profile:
          oneOf:
            - $ref: "#/components/schemas/OnboardingProfileRef"
            - type: "null"
        submitted_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OnboardingAdminApplicationEnvelope:
      type: object
      required: [application]
      additionalProperties: false
      properties:
        application: { $ref: "#/components/schemas/OnboardingAdminApplication" }

    PlatformRoleAssignment:
      type: object
      required: [role, market_code]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [SUPER_ADMIN, PLATFORM_ADMIN, MARKET_ADMIN, FINANCE_ADMIN, CONTENT_ADMIN, MODERATOR, SUPPORT]
        market_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
          description: Set only for the market-scoped role MARKET_ADMIN; null for global roles.

    Membership:
      type: object
      description: The user's role in one organisation and market.
      required: [organisation_id, organisation_name, organisation_kind, market_code, role, role_label]
      additionalProperties: false
      properties:
        organisation_id:
          type: string
          format: uuid
        organisation_name:
          type: string
        organisation_kind:
          type: string
          enum: [AGENCY, LAW_FIRM, PROPERTY_MANAGER, HOST, DEVELOPER, SERVICE_PROVIDER, LANDLORD]
          description: "A code of the `organisation_kinds` reference set, which has the labels (Real Estate Agency, Law Firm, Property Manager, Host, Property Developer, Property Service Provider). A solicitor's firm is `LAW_FIRM`. `LANDLORD` is a legacy value that nothing creates any more."
        market_code:
          type: string
          pattern: "^[A-Z]{2}$"
        role:
          type: string
          enum: [OWNER, MANAGER, AGENT, STAFF]
        role_label:
          type: string
          description: |
            How `role` is shown. In an agency: OWNER "Agency Principal", MANAGER "Agency
            Administrator", AGENT "Estate Agent", STAFF "Agency Staff". In any other
            organisation: OWNER "Principal", MANAGER "Manager", AGENT "Estate Agent", STAFF "Staff".
          examples: [Agency Principal]

    Session:
      type: object
      required: [scope, expires_at]
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [customer, admin]
          description: |
            `customer` for the public login; `admin` for the administrator login. Platform-role
            routes require `admin`.
        expires_at:
          type: string
          format: date-time
          description: |
            Absolute expiry: 30 days after sign-in for `customer` (which also ends after 14 days
            without use), 12 hours for `admin` (which also ends after 30 minutes without use).

    Me:
      type: object
      required: [user, session]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"

    AuthResult:
      type: object
      required: [user]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          allOf:
            - $ref: "#/components/schemas/Session"
          description: |
            Always present for login. Absent only when `verify-email` verified an account that
            holds a platform role (no session is started for those).
        access_token:
          type: string
          description: Opaque session token. Present only when `token_delivery` is `bearer`.

    SignInChallenge:
      type: object
      description: The first step of signing in succeeded; enter the emailed code next.
      required: [status, challenge_id, sent_to, expires_at, code_length]
      properties:
        status:
          type: string
          enum: [CODE_REQUIRED]
        challenge_id:
          type: string
          description: Opaque. Send it back to the verify and resend endpoints of the same sign-in.
        sent_to:
          type: string
          description: The address the code was sent to, masked (first character and domain), for example `u•••@example.com`.
        expires_at:
          type: string
          format: date-time
          description: When the code stops working (10 minutes after it was sent).
        code_length:
          type: integer
          description: Digits in the emailed code (6). The demo code of development and staging may be shorter.
          example: 6

    VerifySignInCodeRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
        code:
          description: The emailed code, as a string of digits. A JSON number is also accepted.
          oneOf:
            - type: string
              example: "123456"
            - type: integer

    TokenDelivery:
      type: string
      enum: [cookie, bearer]
      default: cookie

    NewPassword:
      type: string
      minLength: 10
      maxLength: 128
      description: 10 to 128 characters.

    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    Captcha:
      type: object
      description: A question from `GET /v1/auth/captcha`. The answer is never returned.
      additionalProperties: false
      required: [captcha_id, question, expires_at]
      properties:
        captcha_id:
          type: string
          description: |
            Opaque id of the question. Send it back unchanged as `captcha.captcha_id`. Do not
            parse it; today it is 43 URL-safe characters.
        question:
          type: string
          description: |
            The question to show, in plain English: `What is A + B?` or `What is A - B?` with
            numbers from 1 to 10. The answer is a whole number from 0 to 20.
          examples: ["What is 7 + 5?", "What is 9 - 4?"]
        expires_at:
          type: string
          format: date-time
          description: When the question stops being accepted, 10 minutes after it was asked.

    CaptchaAnswer:
      type: object
      description: The answer to a question from `GET /v1/auth/captcha`.
      additionalProperties: false
      required: [captcha_id, answer]
      properties:
        captcha_id:
          type: string
          minLength: 1
          description: The `captcha_id` of the question that was shown.
        answer:
          type: string
          minLength: 1
          description: |
            What the person typed, as a **string**. Spaces around it are ignored; only digits
            are an answer.
          examples: ["12"]

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, consent, roles, captcha]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          $ref: "#/components/schemas/NewPassword"
        consent:
          type: object
          additionalProperties: false
          required: [privacy_version, accepted]
          properties:
            privacy_version:
              type: string
              minLength: 1
              maxLength: 32
            accepted:
              type: boolean
              const: true
        marketing_opt_in:
          type: boolean
          default: false
        roles:
          type: array
          minItems: 1
          maxItems: 13
          uniqueItems: true
          description: |
            Account roles chosen by the person. Duplicates are rejected. Either property seeker
            roles only (`CONSUMER`, `TENANT`, or both) or roles from the other groups only:
            a seeker role together with any other role is rejected.
          items:
            $ref: "#/components/schemas/SelectableAccountRole"
        captcha:
          $ref: "#/components/schemas/CaptchaAnswer"

    DirectoryKind:
      type: string
      description: |
        The directory a profile is listed in; the first segment of its public address. A code
        from the `directory_kinds` reference set (active rows only). Baseline values: agencies,
        agents, developers, property-managers, solicitors, hosts, service-providers (labels: Real
        Estate Agencies, Estate Agents, Property Developers, Property Managers, Solicitors, Hosts
        and Venues, Property Services).
      examples: [service-providers]

    BusinessEnquiryCreate:
      type: object
      additionalProperties: false
      required:
        - recipient
        - message
        - preferred_contact_method
        - consent
      properties:
        recipient:
          type: object
          additionalProperties: false
          required: [kind, slug]
          properties:
            kind:
              $ref: "#/components/schemas/DirectoryKind"
            slug:
              type: string
              maxLength: 80
              pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        service:
          type: string
          maxLength: 120
          description: Optional. One of the recipient's listed services. Plain text; HTML and control characters are rejected. An empty string is treated as absent.
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain text. Anything containing HTML tags or control characters is rejected. Leading/trailing whitespace is trimmed.
        preferred_contact_method:
          type: string
          description: |
            A code from the `contact_methods` reference set (active rows only). Baseline values:
            EMAIL, PHONE, WHATSAPP. PHONE and WHATSAPP require `guest_contact.phone`.
          examples: [EMAIL]
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
        guest_contact:
          type: object
          additionalProperties: false
          description: |
            Required for guests, with `name` and `email`. Optional for a signed-in customer, for
            whom only `phone` is read (name and email come from the account).
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            email:
              type: string
              format: email
              maxLength: 254
            phone:
              type: string
              pattern: "^\\+[1-9][0-9]{6,14}$"
              description: E.164. Optional unless the preferred contact method is PHONE or WHATSAPP.
        consent:
          type: object
          additionalProperties: false
          required: [privacy_version, accepted]
          properties:
            privacy_version:
              type: string
              minLength: 1
              maxLength: 32
            accepted:
              type: boolean
              const: true

    BusinessEnquiryReceipt:
      type: object
      required: [enquiry_id, reference, status, created_at]
      additionalProperties: false
      properties:
        enquiry_id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^BE-[2-9A-HJKMNP-TV-Z]{8}$"
          description: Human-friendly reference to quote to support.
          examples: [BE-7K3M9QXD]
        status:
          type: string
          const: RECEIVED
          description: The enquiry has been stored. It does not indicate that anyone has been notified.
        created_at:
          type: string
          format: date-time

    ReceivedBusinessEnquiry:
      type: object
      required:
        - enquiry_id
        - reference
        - recipient
        - service
        - message
        - preferred_contact_method
        - contact
        - status
        - created_at
      additionalProperties: false
      properties:
        enquiry_id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^BE-[2-9A-HJKMNP-TV-Z]{8}$"
        recipient:
          type: object
          description: The profile the enquiry was addressed to.
          required: [kind, slug, name]
          additionalProperties: false
          properties:
            kind:
              $ref: "#/components/schemas/DirectoryKind"
            slug:
              type: string
            name:
              type: string
        service:
          type: [string, "null"]
          description: The service the customer picked, or null.
        message:
          type: string
        preferred_contact_method:
          type: string
          enum: [EMAIL, PHONE, WHATSAPP]
        contact:
          type: object
          description: The customer's contact details. Returned only here, to the authorised recipient.
          required: [name, email, phone]
          additionalProperties: false
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            phone:
              type: [string, "null"]
              description: E.164, or null when the customer gave no phone number.
        status:
          type: string
          enum: [RECEIVED]
          description: Internal status. Only RECEIVED can appear in an inbox today.
        created_at:
          type: string
          format: date-time

    ListingSummary:
      type: object
      description: The public name of a listing.
      required: [slug, title, reference]
      additionalProperties: false
      properties:
        slug: { type: string, description: "Use with `GET /v1/listings/{slug}`.", examples: [four-bedroom-family-home-borrowdale] }
        title: { type: string, examples: [Four-bedroom family home with garden] }
        reference: { type: string, examples: [RP-ZW-10001] }

    OrganisationPropertyRequest:
      type: object
      required:
        - stay
        - request_id
        - reference
        - listing_id
        - listing
        - request_type
        - status
        - stage
        - stage_label
        - stage_changed_at
        - message
        - preferred_contact_method
        - contact
        - created_at
        - assigned_to
      # No additionalProperties: false here (changed in 0.20.0), because
      # ReceivedPropertyRequest extends this schema; list items carry exactly these fields.
      properties:
        assigned_to:
          description: |
            New in 0.23.0. The member of the receiving organisation the request is assigned to;
            null in the organisation inbox, and for a direct seller's own request.
          oneOf:
            - type: object
              additionalProperties: false
              required: [user_id, name]
              properties:
                user_id:
                  type: string
                  format: uuid
                name:
                  type: string
            - type: "null"
        stage:
          $ref: "#/components/schemas/LeadStage"
        stage_label:
          type: string
          description: New in 0.20.0. The stage's wording, for example `New enquiry`.
        stage_changed_at:
          type: [string, "null"]
          format: date-time
          description: New in 0.20.0. When the stage last changed; null until somebody moves the request.
        stay:
          oneOf:
            - $ref: "#/components/schemas/StayDetails"
            - type: "null"
          description: "New in 0.16.0. The dates, nights and guests of a `STAY_REQUEST`; null for every other request type."
        request_id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^RP-[2-9A-HJKMNP-TV-Z]{8}$"
        listing_id:
          type: string
          format: uuid
        listing:
          oneOf:
            - $ref: "#/components/schemas/ListingSummary"
            - type: "null"
          description: |
            The listing the request is about, as a public summary, so the inbox can show its
            title. It is present whatever the listing's status (an expired listing is still
            named to its own advertiser) and null only when the listing has no public page.
        request_type:
          type: string
          enum: [ENQUIRY, PROPERTY_INFORMATION, VIEWING_REQUEST, CONSULTATION_REQUEST, STAY_REQUEST]
        status:
          type: string
          enum: [RECEIVED]
          description: Internal routing status. Only RECEIVED can appear in an inbox. The work done on a request is its `stage`.
        message:
          type: string
        preferred_contact_method:
          type: string
          enum: [EMAIL, PHONE, WHATSAPP]
        contact:
          type: object
          description: The customer's contact details (the guest's, or the account's name and email for a signed-in customer).
          required: [name, email, phone]
          additionalProperties: false
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            phone:
              type: [string, "null"]
              description: E.164, or null when the customer gave no phone number.
        created_at:
          type: string
          format: date-time

    LeadStage:
      type: string
      description: |
        New in 0.20.0. The lead stage of a property request, in pipeline order, with its
        label: NEW_ENQUIRY "New enquiry", ASSIGNED "Assigned", CONTACTED "Contacted",
        VIEWING_REQUESTED "Viewing requested", VIEWING_SCHEDULED "Viewing scheduled",
        FOLLOW_UP_REQUIRED "Follow-up required", CONVERTED "Converted", CLOSED "Closed".
      enum: [NEW_ENQUIRY, ASSIGNED, CONTACTED, VIEWING_REQUESTED, VIEWING_SCHEDULED, FOLLOW_UP_REQUIRED, CONVERTED, CLOSED]

    StageCount:
      type: object
      additionalProperties: false
      required: [stage, label, count]
      properties:
        stage:
          $ref: "#/components/schemas/LeadStage"
        label:
          type: string
        count:
          type: integer

    ReceivedPropertyRequestPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, total_pages, stage_counts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrganisationPropertyRequest"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        stage_counts:
          type: array
          description: All 8 stages, in pipeline order, counted under every filter except `stage`.
          items:
            $ref: "#/components/schemas/StageCount"

    ReceivedPropertyRequest:
      description: A received request in full, as the receiving side sees it (new in 0.20.0).
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/OrganisationPropertyRequest"
        - type: object
          required: [preferred_slot_utc, updated_at, allowed_stages, can_assign, timeline, notes]
          properties:
            preferred_slot_utc:
              type: [string, "null"]
              format: date-time
            updated_at:
              type: string
              format: date-time
            allowed_stages:
              type: array
              description: The stages `PATCH` accepts from the current stage (may be empty).
              items:
                type: object
                additionalProperties: false
                required: [stage, label]
                properties:
                  stage:
                    $ref: "#/components/schemas/LeadStage"
                  label:
                    type: string
            can_assign:
              type: boolean
              description: New in 0.23.0. The caller may assign the request (its organisation's OWNER or MANAGER).
            timeline:
              type: array
              description: Oldest first.
              items:
                type: object
                additionalProperties: false
                required: [event, label, from_stage, to_stage, actor, actor_name, assignee_name, at]
                properties:
                  event:
                    type: string
                    enum: [REQUEST_RECEIVED, STAGE_CHANGED, NOTE_ADDED, ASSIGNED, UNASSIGNED]
                  label:
                    type: string
                    description: "`Request received`, `Moved to <stage label>`, `Note added`, `Assigned to <name>` or `Returned to the organisation inbox` (the last two new in 0.23.0)."
                  assignee_name:
                    type: [string, "null"]
                    description: New in 0.23.0. ASSIGNED only - who the request was given to.
                  from_stage:
                    oneOf:
                      - $ref: "#/components/schemas/LeadStage"
                      - type: "null"
                    description: STAGE_CHANGED only.
                  to_stage:
                    oneOf:
                      - $ref: "#/components/schemas/LeadStage"
                      - type: "null"
                    description: STAGE_CHANGED only.
                  actor:
                    type: string
                    enum: [CUSTOMER, PROFESSIONAL, SYSTEM]
                  actor_name:
                    type: [string, "null"]
                    description: Who did it (null for the customer's own entry).
                  at:
                    type: string
                    format: date-time
            notes:
              type: array
              description: Internal notes, oldest first. Never shown to the customer.
              items:
                type: object
                additionalProperties: false
                required: [id, body, author_name, mine, created_at]
                properties:
                  id:
                    type: string
                    format: uuid
                  body:
                    type: string
                  author_name:
                    type: string
                  mine:
                    type: boolean
                    description: True for a note the caller wrote.
                  created_at:
                    type: string
                    format: date-time

    ReceivedPropertyRequestEnvelope:
      type: object
      additionalProperties: false
      required: [request]
      properties:
        request:
          $ref: "#/components/schemas/ReceivedPropertyRequest"

    CustomerRequestStatus:
      type: string
      description: |
        New in 0.20.0. What the customer is told about a request, derived from its lead stage:
        RECEIVED "Received" (NEW_ENQUIRY, and a request nobody could receive); IN_PROGRESS
        "In progress" (ASSIGNED, VIEWING_REQUESTED, FOLLOW_UP_REQUIRED); RESPONDED "Responded"
        (CONTACTED); VIEWING_SCHEDULED "Viewing scheduled"; CLOSED "Closed" (CONVERTED, CLOSED).
      enum: [RECEIVED, IN_PROGRESS, RESPONDED, VIEWING_SCHEDULED, CLOSED]

    CustomerPropertyRequest:
      type: object
      description: |
        A request as the customer who sent it sees it (new in 0.20.0). Never the lead stage,
        the recipient, an internal note or whether routing failed.
      additionalProperties: false
      required: [request_id, reference, listing_id, listing, request_type, status, status_label, message, preferred_contact_method, preferred_slot_utc, stay, created_at]
      properties:
        request_id:
          type: string
          format: uuid
        reference:
          type: string
        listing_id:
          type: string
          format: uuid
        listing:
          oneOf:
            - $ref: "#/components/schemas/ListingSummary"
            - type: "null"
          description: Null when the listing no longer has a public page.
        request_type:
          type: string
          enum: [ENQUIRY, PROPERTY_INFORMATION, VIEWING_REQUEST, CONSULTATION_REQUEST, STAY_REQUEST]
        status:
          $ref: "#/components/schemas/CustomerRequestStatus"
        status_label:
          type: string
        message:
          type: string
        preferred_contact_method:
          type: string
          enum: [EMAIL, PHONE, WHATSAPP]
        preferred_slot_utc:
          type: [string, "null"]
          format: date-time
        stay:
          oneOf:
            - $ref: "#/components/schemas/StayDetails"
            - type: "null"
        created_at:
          type: string
          format: date-time
        timeline:
          type: array
          description: Only in `GET /v1/me/property-requests/{id}` (absent from lists). Oldest first.
          items:
            type: object
            additionalProperties: false
            required: [event, status, status_label, at]
            properties:
              event:
                type: string
                enum: [RECEIVED, STATUS_CHANGED]
              status:
                $ref: "#/components/schemas/CustomerRequestStatus"
              status_label:
                type: string
              at:
                type: string
                format: date-time

    CustomerPropertyRequestPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, total_pages, status_counts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerPropertyRequest"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        status_counts:
          type: array
          description: Every customer status, in order, with the account's count (whatever the filter).
          items:
            type: object
            additionalProperties: false
            required: [status, label, count]
            properties:
              status:
                $ref: "#/components/schemas/CustomerRequestStatus"
              label:
                type: string
              count:
                type: integer

    OrganisationMembers:
      type: object
      additionalProperties: false
      required: [organisation, items]
      properties:
        organisation:
          type: object
          additionalProperties: false
          required: [id, name, kind]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            kind:
              type: string
              description: The organisation kind, for example `AGENCY`, `LAW_FIRM`, `PROPERTY_MANAGER`.
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"

    TeamMember:
      type: object
      description: One member of an organisation (changed in 0.23.0). No email address or phone number.
      additionalProperties: false
      required: [user_id, name, role, role_label, job_title, status, status_label, market_code, joined_at, open_leads, is_you, can_change, allowed_roles, can_hold_leads]
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [OWNER, MANAGER, AGENT, STAFF]
        role_label:
          type: string
          description: In an agency `Agency Principal`, `Agency Administrator`, `Estate Agent`, `Agency Staff`; elsewhere `Principal`, `Manager`, `Estate Agent`, `Staff`.
        job_title:
          type: [string, "null"]
          description: New in 0.23.0.
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
          description: SUSPENDED when the organisation suspended the membership or the member's account is not active. (INVITED is no longer used; invitations are listed separately.)
        status_label:
          type: string
        market_code:
          type: string
        joined_at:
          type: [string, "null"]
          format: date-time
          description: New in 0.23.0. When the membership started (or was reinstated).
        open_leads:
          type: integer
          description: New in 0.23.0. Open requests (not CONVERTED or CLOSED) of the organisation assigned to the member.
        is_you:
          type: boolean
        can_change:
          type: boolean
          description: New in 0.23.0. The caller may change this member's role, status or job title, or remove them.
        allowed_roles:
          type: array
          description: New in 0.23.0. The roles the caller may give this member (empty when `can_change` is false).
          items:
            type: string
            enum: [MANAGER, AGENT, STAFF]
        can_hold_leads:
          type: boolean
          description: New in 0.23.0. Requests can be assigned to this member (an ACTIVE OWNER, MANAGER or AGENT).

    TeamInvitation:
      type: object
      description: New in 0.23.0. A pending invitation as the team's managers see it. Never its token.
      additionalProperties: false
      required: [id, email, role, role_label, job_title, status, invited_by, created_at, expires_at, expired, can_cancel]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [MANAGER, AGENT, STAFF]
        role_label:
          type: string
        job_title:
          type: [string, "null"]
        status:
          type: string
          enum: [PENDING, ACCEPTED, CANCELLED, REPLACED]
        invited_by:
          type: object
          additionalProperties: false
          required: [user_id, name]
          properties:
            user_id:
              type: [string, "null"]
              format: uuid
            name:
              type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        expired:
          type: boolean
        can_cancel:
          type: boolean

    PublicInvitation:
      type: object
      description: New in 0.23.0. What an invitation link shows to anyone holding it.
      additionalProperties: false
      required: [organisation, role, role_label, job_title, invited_by_name, email_masked, expires_at]
      properties:
        organisation:
          type: object
          additionalProperties: false
          required: [name, kind]
          properties:
            name:
              type: string
            kind:
              type: string
        role:
          type: string
          enum: [MANAGER, AGENT, STAFF]
        role_label:
          type: string
        job_title:
          type: [string, "null"]
        invited_by_name:
          type: string
        email_masked:
          type: string
          description: For example `n•••@example.com`.
        expires_at:
          type: string
          format: date-time

    AcceptedInvitation:
      type: object
      description: New in 0.23.0.
      additionalProperties: false
      required: [organisation, role, role_label, profile]
      properties:
        organisation:
          type: object
          additionalProperties: false
          required: [id, name, kind]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            kind:
              type: string
        role:
          type: string
          enum: [MANAGER, AGENT, STAFF]
        role_label:
          type: string
        profile:
          description: The public agent profile created (or reactivated) for an agency's AGENT; null otherwise.
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, slug]
              properties:
                kind:
                  type: string
                slug:
                  type: string
            - type: "null"

    JoinRequest:
      type: object
      description: New in 0.23.0. A submitted onboarding application to join the agency, as the agency sees it.
      additionalProperties: false
      required: [id, role, role_label, membership_role, membership_role_label, status, status_label, applicant, job_title, document_count, submitted_at, decision_reason, decided_at, can_decide]
      properties:
        id:
          type: string
          format: uuid
          description: The onboarding application's ID (the same as in `/v1/admin/onboarding/{id}`).
        role:
          type: string
          description: The account role applied for, for example `AGENT`, `SALES_AGENT`, `AGENCY_ADMIN`.
        role_label:
          type: string
        membership_role:
          type: string
          enum: [MANAGER, AGENT, STAFF]
        membership_role_label:
          type: string
        status:
          type: string
          enum: [SUBMITTED, APPROVED, REJECTED, CHANGES_REQUESTED]
        status_label:
          type: string
        applicant:
          type: object
          additionalProperties: false
          required: [user_id, name, email_masked]
          properties:
            user_id:
              type: string
              format: uuid
            name:
              type: string
            email_masked:
              type: string
        job_title:
          type: [string, "null"]
        document_count:
          type: integer
        submitted_at:
          type: [string, "null"]
          format: date-time
        decision_reason:
          type: [string, "null"]
        decided_at:
          type: [string, "null"]
          format: date-time
        can_decide:
          type: boolean

    TeamAuditEvent:
      type: object
      description: New in 0.23.0. One record of a team's audit trail.
      additionalProperties: false
      required: [id, action, action_label, actor, target, before, after, at]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          enum: [INVITATION_CREATED, INVITATION_CANCELLED, INVITATION_ACCEPTED, JOIN_REQUEST_APPROVED, JOIN_REQUEST_DECLINED, JOIN_REQUEST_CHANGES_REQUESTED, MEMBER_ROLE_CHANGED, MEMBER_JOB_TITLE_CHANGED, MEMBER_SUSPENDED, MEMBER_REACTIVATED, MEMBER_REMOVED, REQUEST_ASSIGNED, REQUEST_UNASSIGNED]
        action_label:
          type: string
        actor:
          type: object
          additionalProperties: false
          required: [user_id, name]
          properties:
            user_id:
              type: [string, "null"]
              format: uuid
              description: Null when the account was deleted since.
            name:
              type: string
              description: The actor's name at the time.
        target:
          type: object
          additionalProperties: false
          required: [type, id, label]
          properties:
            type:
              type: string
              enum: [MEMBER, INVITATION, JOIN_REQUEST, PROPERTY_REQUEST]
            id:
              type: string
              format: uuid
            label:
              type: string
              description: A person's name, the invited email address or a request reference.
        before:
          type: [object, "null"]
          description: "The values before the change (for example `{\"role\": \"AGENT\"}`); null when not applicable."
        after:
          type: [object, "null"]
          description: |
            The values after the change. Removals and suspensions add `released_requests` and
            `released_appointments` (work returned to the organisation inbox); join decisions
            add `decided_by` (`ORGANISATION` or `PLATFORM`).
        at:
          type: string
          format: date-time

    TeamAuditPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamAuditEvent"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    DashboardCounter:
      type: object
      additionalProperties: false
      required: [key, label, value, group, target]
      properties:
        key:
          type: string
          description: Stable. See `GET /v1/me/dashboard` for every key.
          examples: [requests.new, requests.stage.FOLLOW_UP_REQUIRED, listings.status.PUBLISHED]
        label:
          type: string
        value:
          type: integer
        group:
          type: string
          enum: [my_activity, requests, requests_by_stage, business_enquiries, appointments, listings]
        target:
          oneOf:
            - $ref: "#/components/schemas/DashboardTarget"
            - type: "null"

    DashboardTarget:
      type: string
      description: Where a counter or an action leads; the client maps each to one of its own pages.
      enum: [search, my_requests, my_appointments, onboarding, requests, business_enquiries, appointments, listings, team, admin_overview]

    DashboardAction:
      type: object
      additionalProperties: false
      required: [code, text, target, count, role]
      properties:
        code:
          type: string
          enum:
            - RESPOND_TO_NEW_REQUESTS
            - FOLLOW_UP_REQUESTS
            - RESPOND_TO_BUSINESS_ENQUIRIES
            - CONFIRM_APPOINTMENTS
            - REVIEW_RESCHEDULES
            - UPDATE_SHORT_STAY_CALENDARS
            - REPLY_TO_APPOINTMENT
            - COMPLETE_ONBOARDING
            - UPDATE_ONBOARDING
            - AWAIT_VERIFICATION
            - REAPPLY_ONBOARDING
            - FIND_A_PROPERTY
            - OPEN_ADMIN_OVERVIEW
        text:
          type: string
        target:
          $ref: "#/components/schemas/DashboardTarget"
        count:
          type: [integer, "null"]
          description: How many items wait, or null when the action is not about a number.
        role:
          type: [string, "null"]
          description: The account role an onboarding action is about (use with `/v1/me/onboarding/{role}`), else null.

    DashboardAppointment:
      type: object
      additionalProperties: false
      required: [id, reference, type, status, status_label, start_utc, timezone, listing, side]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        type:
          $ref: "#/components/schemas/AppointmentType"
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        status_label:
          type: string
        start_utc:
          type: string
          format: date-time
        timezone:
          type: string
        listing:
          oneOf:
            - $ref: "#/components/schemas/ListingSummary"
            - type: "null"
        side:
          type: string
          enum: [CUSTOMER, PROFESSIONAL]
          description: CUSTOMER when the caller asked for it (open with `/v1/me/appointments/{id}`), PROFESSIONAL when the caller receives it (`/v1/inbox/appointments/{id}`).

    Dashboard:
      type: object
      additionalProperties: false
      required: [kind, name, roles, organisations, direct_owner, capabilities, onboarding, counters, needs_attention, next_actions, recent]
      properties:
        kind:
          type: string
          enum: [SEEKER, PROFESSIONAL_PENDING, PROFESSIONAL, DIRECT_OWNER, ADMIN]
        name:
          type: string
        roles:
          type: array
          description: The caller's account roles.
          items:
            type: object
            additionalProperties: false
            required: [role, label, status]
            properties:
              role:
                type: string
              label:
                type: string
              status:
                type: string
                enum: [ACTIVE, PENDING_VERIFICATION, REJECTED, REVOKED]
        organisations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, kind, market_code, role, role_label, can_see_members, can_assign_work, can_manage_listings, can_manage_team, can_create_leases]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              kind:
                type: string
              market_code:
                type: string
              role:
                type: string
                enum: [OWNER, MANAGER, AGENT, STAFF]
              role_label:
                type: string
              can_see_members:
                type: boolean
                description: "`GET /v1/agent/organisations/{id}/members` is open to the caller (the same as `can_manage_team`)."
              can_assign_work:
                type: boolean
                description: The caller sees all of the organisation's requests and appointments.
              can_manage_listings:
                type: boolean
              can_manage_team:
                type: boolean
                description: New in 0.23.0. The caller may invite people, decide join requests, and change, suspend or remove members (OWNER and MANAGER).
              can_create_leases:
                type: boolean
                description: New in 0.24.0. The caller may draft leases for the organisation (POST /v1/me/leases); the same as can_manage_listings.
        direct_owner:
          type: boolean
          description: The caller is an approved landlord or property seller.
        capabilities:
          type: object
          additionalProperties: false
          required: [receives_requests, receives_business_enquiries, manages_appointments, manages_listings, sees_team, creates_leases]
          properties:
            receives_requests:
              type: boolean
            receives_business_enquiries:
              type: boolean
            manages_appointments:
              type: boolean
            manages_listings:
              type: boolean
            sees_team:
              type: boolean
            creates_leases:
              type: boolean
              description: New in 0.24.0. /v1/me/leases is open to the caller.
        onboarding:
          type: array
          description: One entry per role with an onboarding application.
          items:
            type: object
            additionalProperties: false
            required: [role, role_label, status, status_label, can_submit, can_edit, missing_fields, missing_documents, decision_reason, submitted_at]
            properties:
              role:
                type: string
              role_label:
                type: string
              status:
                $ref: "#/components/schemas/OnboardingStatus"
              status_label:
                type: string
              can_submit:
                type: boolean
              can_edit:
                type: boolean
              missing_fields:
                type: integer
              missing_documents:
                type: integer
              decision_reason:
                type: [string, "null"]
              submitted_at:
                type: [string, "null"]
                format: date-time
        counters:
          type: array
          items:
            $ref: "#/components/schemas/DashboardCounter"
        needs_attention:
          type: integer
          description: The sum of `next_actions[].count` (a badge for the dashboard link).
        next_actions:
          type: array
          items:
            $ref: "#/components/schemas/DashboardAction"
        recent:
          type: object
          additionalProperties: false
          required: [received_requests, my_requests, appointments]
          properties:
            received_requests:
              type: array
              maxItems: 5
              items:
                $ref: "#/components/schemas/OrganisationPropertyRequest"
            my_requests:
              type: array
              maxItems: 5
              items:
                $ref: "#/components/schemas/CustomerPropertyRequest"
            appointments:
              type: array
              maxItems: 5
              items:
                $ref: "#/components/schemas/DashboardAppointment"

    AdminStatusCount:
      type: object
      additionalProperties: false
      required: [status, label, count]
      properties:
        status:
          type: string
        label:
          type: string
        count:
          type: integer

    AdminOverview:
      type: object
      additionalProperties: false
      required: [roles, sections, accounts, verifications, listings, requests]
      properties:
        roles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [role, market_code]
            properties:
              role:
                type: string
              market_code:
                type: [string, "null"]
        sections:
          type: array
          description: The sections that are not null, in display order.
          items:
            type: string
            enum: [accounts, verifications, listings, requests]
        accounts:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [total, administrators, unverified, last_7_days, last_30_days, by_status, by_role, recent]
              properties:
                total:
                  type: integer
                  description: Accounts that hold no platform role.
                administrators:
                  type: integer
                unverified:
                  type: integer
                  description: Email address not verified yet.
                last_7_days:
                  type: integer
                last_30_days:
                  type: integer
                by_status:
                  type: array
                  description: ACTIVE, SUSPENDED, DELETED.
                  items:
                    $ref: "#/components/schemas/AdminStatusCount"
                by_role:
                  type: array
                  description: One entry per account role and role status that occurs.
                  items:
                    type: object
                    additionalProperties: false
                    required: [role, label, status, count]
                    properties:
                      role:
                        type: string
                      label:
                        type: string
                      status:
                        type: string
                        enum: [ACTIVE, PENDING_VERIFICATION, REJECTED, REVOKED]
                      count:
                        type: integer
                recent:
                  type: array
                  maxItems: 10
                  description: The newest sign-ups, newest first.
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, name, email, email_verified, roles, created_at]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                      email_verified:
                        type: boolean
                      roles:
                        type: array
                        items:
                          type: string
                      created_at:
                        type: string
                        format: date-time
        verifications:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [waiting, by_status]
              properties:
                waiting:
                  type: integer
                  description: Applications SUBMITTED and not decided.
                by_status:
                  type: array
                  description: SUBMITTED, CHANGES_REQUESTED, APPROVED, REJECTED, DRAFT.
                  items:
                    $ref: "#/components/schemas/AdminStatusCount"
        listings:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [market_codes, total, by_status]
              properties:
                market_codes:
                  type: [array, "null"]
                  items:
                    type: string
                total:
                  type: integer
                by_status:
                  type: array
                  description: DRAFT, PENDING_REVIEW, PUBLISHED, PAUSED, EXPIRED, SOLD, LET, CLOSED, then any other status found.
                  items:
                    $ref: "#/components/schemas/AdminStatusCount"
        requests:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [market_codes, total, last_7_days, last_30_days, by_stage, routing_exceptions]
              properties:
                market_codes:
                  type: [array, "null"]
                  items:
                    type: string
                total:
                  type: integer
                last_7_days:
                  type: integer
                last_30_days:
                  type: integer
                by_stage:
                  type: array
                  description: Routed requests only, all 8 stages in pipeline order.
                  items:
                    $ref: "#/components/schemas/StageCount"
                routing_exceptions:
                  type: object
                  additionalProperties: false
                  required: [open, resolved]
                  properties:
                    open:
                      type: integer
                    resolved:
                      type: integer

    RoutingException:
      type: object
      additionalProperties: false
      required: [request_id, reference, listing_id, listing, request_type, message, preferred_contact_method, contact, stay, created_at, state, resolved_at, resolution_note]
      properties:
        request_id:
          type: string
          format: uuid
        reference:
          type: string
        listing_id:
          type: string
          format: uuid
        listing:
          oneOf:
            - $ref: "#/components/schemas/ListingSummary"
            - type: "null"
        request_type:
          type: string
          enum: [ENQUIRY, PROPERTY_INFORMATION, VIEWING_REQUEST, CONSULTATION_REQUEST, STAY_REQUEST]
        message:
          type: string
        preferred_contact_method:
          type: string
          enum: [EMAIL, PHONE, WHATSAPP]
        contact:
          type: object
          additionalProperties: false
          required: [name, email, phone]
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            phone:
              type: [string, "null"]
        stay:
          oneOf:
            - $ref: "#/components/schemas/StayDetails"
            - type: "null"
        created_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [OPEN, RESOLVED]
        resolved_at:
          type: [string, "null"]
          format: date-time
        resolution_note:
          type: [string, "null"]

    RoutingExceptionPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoutingException"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    Market:
      type: object
      description: A country. ("Market" is the older name of the same thing.)
      required: [id, code, name, currency_code, timezone, status, listing_count, has_listings]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Stable. The five countries that existed before 0.15.0 (ZW, GB, AE, BW, ZA) keep the IDs they had.
        code:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          pattern: "^[A-Z]{2}$"
        name:
          type: string
          description: "English short name as people say it (`Russia`, `South Korea`), not ISO's inverted form."
        currency_code:
          type: string
          description: ISO 4217 currency code of the country (one per country). Zimbabwe is `USD`.
          pattern: "^[A-Z]{3}$"
        timezone:
          type: string
          description: "IANA time zone name: the country's default zone, its capital's. One per country, also for countries with several zones."
        status:
          type: string
          enum: [ACTIVE]
          description: "**Always `ACTIVE` since 0.15.0.** Kept so existing clients do not break; it no longer gates anything and `PLANNED` no longer exists. A country that has been switched off is not returned at all (and is refused as a `country`)."
        listing_count:
          type: integer
          minimum: 0
          description: New in 0.15.0. Published, unexpired listings in the country right now.
        has_listings:
          type: boolean
          description: "New in 0.15.0. `listing_count > 0`: whether the public should be shown this country."

    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 128
      pattern: "^[\\x21-\\x7E]+$"
      description: Client-generated unique key (a UUID is recommended). Printable ASCII, no spaces.

    PropertyRequestCreate:
      type: object
      additionalProperties: false
      required:
        - listing_id
        - request_type
        - message
        - preferred_contact_method
        - consent
      properties:
        listing_id:
          type: string
          format: uuid
        request_type:
          type: string
          description: |
            A code from the `request_types` reference set (active rows only). Baseline values:
            ENQUIRY, PROPERTY_INFORMATION, VIEWING_REQUEST, CONSULTATION_REQUEST, STAY_REQUEST.

            `STAY_REQUEST` ("Request to stay", new in 0.16.0) is valid only for a listing in
            the `short-stay` category and requires `check_in`, `check_out` and `guests`. It is
            still an enquiry: it does **not** block the dates and creates no appointment or
            booking.
          examples: [VIEWING_REQUEST]
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain text. Anything containing HTML tags or control characters is rejected. Leading/trailing whitespace is trimmed.
        preferred_contact_method:
          type: string
          description: |
            A code from the `contact_methods` reference set (active rows only). Baseline values:
            EMAIL, PHONE, WHATSAPP. PHONE and WHATSAPP require `guest_contact.phone`.
          examples: [EMAIL]
        preferred_slot_utc:
          type: [string, "null"]
          format: date-time
          description: Optional. Only allowed for VIEWING_REQUEST and CONSULTATION_REQUEST and must be in the future.
        check_in:
          type: [string, "null"]
          format: date
          description: "**Required for STAY_REQUEST, not allowed for any other type.** The first night (`YYYY-MM-DD`, in the listing's time zone). Not in the past."
        check_out:
          type: [string, "null"]
          format: date
          description: "**Required for STAY_REQUEST, not allowed otherwise.** The day of leaving: after `check_in`, at least the listing's `min_nights` and at most 90 nights later, inside the booking window."
        guests:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: "**Required for STAY_REQUEST, not allowed otherwise.** At most the listing's `max_guests`."
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
        guest_contact:
          type: object
          additionalProperties: false
          description: |
            Required for guests, with `name` and `email`. Optional for a signed-in customer, for
            whom only `phone` is read (name and email come from the account).
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            email:
              type: string
              format: email
              maxLength: 254
            phone:
              type: string
              pattern: "^\\+[1-9][0-9]{6,14}$"
              description: E.164. Optional unless the preferred contact method is PHONE or WHATSAPP.
        consent:
          type: object
          additionalProperties: false
          required: [privacy_version, accepted]
          properties:
            privacy_version:
              type: string
              minLength: 1
              maxLength: 32
              description: Version of the privacy notice the customer accepted.
            accepted:
              type: boolean
              const: true

    PropertyRequestReceipt:
      type: object
      required: [request_id, reference, status, created_at, appointment]
      additionalProperties: false
      properties:
        request_id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^RP-[2-9A-HJKMNP-TV-Z]{8}$"
          description: Human-friendly reference to quote to support.
          examples: [RP-7K3M9QXD]
        status:
          type: string
          const: RECEIVED
          description: The request has been stored. It does not indicate that anyone has been notified.
        created_at:
          type: string
          format: date-time
        appointment:
          type: [object, "null"]
          additionalProperties: false
          required: [id, reference]
          description: |
            The appointment (status `REQUESTED`) created in the same transaction when the request
            is a `VIEWING_REQUEST` or `CONSULTATION_REQUEST` with a `preferred_slot_utc`. Null
            when there is no slot, for other request types, and when the request could not be
            routed to anyone. A signed-in customer finds it under `/v1/me/appointments`.
          properties:
            id:
              type: string
              format: uuid
            reference:
              type: string
              pattern: "^AP-[2-9A-HJKMNP-TV-Z]{8}$"

    AppointmentType:
      type: string
      enum: [VIEWING, CONSULTATION]
      description: "`VIEWING`: a property viewing (always tied to a listing). `CONSULTATION`: a meeting with a listing's advertiser or with a directory profile."

    AppointmentStatus:
      type: string
      enum: [REQUESTED, CONFIRMED, RESCHEDULE_REQUESTED, COMPLETED, NO_SHOW, CANCELLED]
      description: |
        `REQUESTED` -> `CONFIRMED` -> `COMPLETED` | `NO_SHOW`; `REQUESTED` | `CONFIRMED` ->
        `RESCHEDULE_REQUESTED` -> `CONFIRMED` (the other party accepts the proposed time);
        `REQUESTED` | `CONFIRMED` | `RESCHEDULE_REQUESTED` -> `CANCELLED`. `COMPLETED`,
        `NO_SHOW` and `CANCELLED` are final. Show `status_label` to people.

    AppointmentParty:
      type: string
      enum: [CUSTOMER, PROFESSIONAL]

    AppointmentTimelineEntry:
      type: object
      additionalProperties: false
      required: [event, from, to, to_label, actor, note, start_utc, at]
      properties:
        event:
          type: string
          enum: [REQUESTED, CONFIRMED, RESCHEDULE_REQUESTED, CANCELLED, COMPLETED, NO_SHOW, ASSIGNED, UNASSIGNED]
          description: "`ASSIGNED` (an internal assignment) and `UNASSIGNED` (new in 0.23.0: the assigned member left the team and the appointment went back to the organisation); `from` equals `to` for both, and both are returned to the professional only."
        from:
          type: [string, "null"]
          description: The status before; null for the first entry.
        to:
          $ref: "#/components/schemas/AppointmentStatus"
        to_label:
          type: string
          examples: [Reschedule Requested]
        actor:
          type: string
          enum: [CUSTOMER, PROFESSIONAL, SYSTEM]
          description: Who did it. Never a name or an account.
        note:
          type: [string, "null"]
          description: The note sent with a proposal, or the reason of a cancellation.
        start_utc:
          type: [string, "null"]
          format: date-time
          description: The time the entry is about (requested, confirmed or proposed); null when it is not about a time.
        at:
          type: string
          format: date-time

    Appointment:
      type: object
      description: What both parties see. Never contains the professional's phone number or email address.
      required:
        - id
        - reference
        - type
        - status
        - status_label
        - start_utc
        - end_utc
        - timezone
        - duration_minutes
        - proposed_start_utc
        - proposed_by
        - listing
        - with
        - location_note
        - note
        - property_request_reference
        - business_enquiry_reference
        - cancelled_by
        - cancel_reason
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^AP-[2-9A-HJKMNP-TV-Z]{8}$"
          examples: [AP-7K3M9QXD]
        type:
          $ref: "#/components/schemas/AppointmentType"
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        status_label:
          type: string
          enum: [Requested, Confirmed, Reschedule Requested, Completed, No Show, Cancelled]
        start_utc:
          type: string
          format: date-time
          description: The requested or confirmed start. It does not change while a proposal is waiting.
        end_utc:
          type: string
          format: date-time
          description: "`start_utc` plus `duration_minutes`."
        timezone:
          type: string
          description: The market's IANA time zone; show times to people in it, and name it.
          examples: [Africa/Harare]
        duration_minutes:
          type: integer
          minimum: 15
          maximum: 240
          default: 30
        proposed_start_utc:
          type: [string, "null"]
          format: date-time
          description: Set exactly while `status` is `RESCHEDULE_REQUESTED`.
        proposed_by:
          oneOf:
            - $ref: "#/components/schemas/AppointmentParty"
            - type: "null"
          description: Who proposed `proposed_start_utc`; the OTHER party accepts it.
        listing:
          oneOf:
            - $ref: "#/components/schemas/ListingSummary"
            - type: "null"
          description: |
            The listing as it was named when the appointment was made (kept after the listing
            expires). Null for an appointment addressed to a directory profile.
        with:
          type: [object, "null"]
          additionalProperties: false
          required: [kind, slug, name]
          description: |
            The public profile of the professional or business: the addressed profile, or the
            listing's agent, else its agency. Null for a private owner (landlord or property
            seller), who has no public profile.
          properties:
            kind:
              type: string
              description: A code from the `directory_kinds` reference set.
            slug:
              type: string
            name:
              type: string
        location_note:
          type: [string, "null"]
          maxLength: 200
          description: Where to meet, set by the professional.
        note:
          type: [string, "null"]
          description: The customer's note (for an appointment made from a property request, the request's message).
        property_request_reference:
          type: [string, "null"]
          description: The reference (`RP-...`) of the property request that created the appointment.
        business_enquiry_reference:
          type: [string, "null"]
          description: Always null today; nothing creates an appointment from a business enquiry yet.
        cancelled_by:
          type: [string, "null"]
          enum: [CUSTOMER, PROFESSIONAL, SYSTEM, null]
        cancel_reason:
          type: [string, "null"]
        timeline:
          type: array
          description: Oldest first. Present on a single appointment (read and action responses); **absent from list items**.
          items:
            $ref: "#/components/schemas/AppointmentTimelineEntry"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CustomerAppointment:
      allOf:
        - $ref: "#/components/schemas/Appointment"
        - type: object
          required: [can_cancel, can_reschedule, can_accept]
          properties:
            can_cancel:
              type: boolean
              description: The appointment is still open.
            can_reschedule:
              type: boolean
              description: "`REQUESTED`, `CONFIRMED`, or a professional's proposal is waiting (a counter-proposal)."
            can_accept:
              type: boolean
              description: A professional's proposal is waiting and its time has not passed.

    ReceivedAppointment:
      allOf:
        - $ref: "#/components/schemas/Appointment"
        - type: object
          required:
            - listing_id
            - organisation_id
            - assigned_to
            - contact
            - preferred_contact_method
            - can_confirm
            - can_reschedule
            - can_cancel
            - can_complete
            - can_no_show
            - can_assign
          properties:
            listing_id:
              type: [string, "null"]
              format: uuid
            organisation_id:
              type: [string, "null"]
              format: uuid
              description: Null for a direct owner's appointment.
            assigned_to:
              type: [object, "null"]
              additionalProperties: false
              required: [user_id, name]
              description: The member (or direct owner) it is assigned to; null means the organisation, unassigned.
              properties:
                user_id:
                  type: string
                  format: uuid
                name:
                  type: string
            contact:
              type: object
              additionalProperties: false
              required: [name, email, phone]
              description: The customer's contact details. Returned only to the professional.
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: [string, "null"]
            preferred_contact_method:
              type: string
              description: A code from the `contact_methods` reference set.
            can_confirm:
              type: boolean
              description: A confirm without `start_utc` would confirm (the requested time, or the customer's proposal, is still ahead).
            can_reschedule:
              type: boolean
            can_cancel:
              type: boolean
            can_complete:
              type: boolean
              description: "`CONFIRMED` and the start time has passed."
            can_no_show:
              type: boolean
            can_assign:
              type: boolean
              description: The caller is OWNER or MANAGER of the appointment's organisation and it is open.

    CustomerAppointmentEnvelope:
      type: object
      additionalProperties: false
      required: [appointment]
      properties:
        appointment:
          $ref: "#/components/schemas/CustomerAppointment"

    ReceivedAppointmentEnvelope:
      type: object
      additionalProperties: false
      required: [appointment]
      properties:
        appointment:
          $ref: "#/components/schemas/ReceivedAppointment"

    CustomerAppointmentPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerAppointment"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    ReceivedAppointmentPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReceivedAppointment"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    AppointmentCreate:
      type: object
      additionalProperties: false
      required: [type, start_utc, preferred_contact_method, consent]
      properties:
        type:
          $ref: "#/components/schemas/AppointmentType"
        listing_id:
          type: string
          format: uuid
          description: Exactly one of `listing_id` and `recipient`. Required for a `VIEWING`.
        recipient:
          type: object
          additionalProperties: false
          required: [kind, slug]
          description: A directory profile; `CONSULTATION` only.
          properties:
            kind:
              type: string
              description: A code from the `directory_kinds` reference set.
            slug:
              type: string
        start_utc:
          type: string
          format: date-time
          description: In the future and at most 12 months ahead. Seconds are kept, fractions dropped.
        duration_minutes:
          type: integer
          minimum: 15
          maximum: 240
          default: 30
        note:
          type: string
          maxLength: 1000
          description: Plain text, no HTML.
        preferred_contact_method:
          type: string
          description: A code from the `contact_methods` reference set.
        phone:
          type: string
          pattern: "^\\+[1-9][0-9]{6,14}$"
          description: E.164. Required for `PHONE` and `WHATSAPP`.
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
        consent:
          type: object
          additionalProperties: false
          required: [privacy_version, accepted]
          properties:
            privacy_version:
              type: string
              maxLength: 32
            accepted:
              type: boolean
              const: true

    AppointmentReschedule:
      type: object
      additionalProperties: false
      required: [start_utc]
      properties:
        start_utc:
          type: string
          format: date-time
          description: "The proposed start: in the future, at most 12 months ahead, and different from the current start."
        note:
          type: string
          maxLength: 500
          description: Plain text, shown to the other party in the timeline.

    AppointmentConfirm:
      type: object
      additionalProperties: false
      properties:
        start_utc:
          type: string
          format: date-time
          description: |
            Omit to confirm the time on the table. A different time does **not** confirm: it
            proposes that time to the customer (see the operation).
        duration_minutes:
          type: integer
          minimum: 15
          maximum: 240
        location_note:
          type: string
          maxLength: 200
          description: Where to meet. Plain text, one line.

    InboxSummary:
      type: object
      additionalProperties: false
      required: [property_requests, business_enquiries, appointments]
      properties:
        property_requests:
          type: object
          additionalProperties: false
          required: [new]
          properties:
            new:
              type: integer
        business_enquiries:
          type: object
          additionalProperties: false
          required: [new]
          properties:
            new:
              type: integer
        appointments:
          type: object
          additionalProperties: false
          required: [requested, reschedule_requested, upcoming_confirmed]
          properties:
            requested:
              type: integer
            reschedule_requested:
              type: integer
            upcoming_confirmed:
              type: integer
    LeaseVariable:
      type: object
      additionalProperties: false
      required: [name, description, example]
      properties:
        name:
          type: string
          enum: [reference, agreement_date, landlord_names, tenant_names, landlord_details, tenant_details, property_address,
            country_name, lease_kind, start_date, end_date, term, rent_amount, rent_currency, rent_period, payment_day,
            deposit_amount, notice_period_days, special_conditions]
        description:
          type: string
        example:
          type: string
    LeaseSection:
      type: object
      additionalProperties: false
      required: [heading, text]
      properties:
        heading:
          type: string
          maxLength: 200
        text:
          type: string
          maxLength: 10000
          description: Plain text with `{{variable}}` placeholders; line breaks are kept.
    LeaseClause:
      type: object
      additionalProperties: false
      required: [code, title, text]
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{1,39}$"
        title:
          type: string
        text:
          type: string
    LegalReview:
      type: object
      additionalProperties: false
      required: [reviewer_name, organisation, reviewed_on]
      properties:
        reviewer_name:
          type: string
        organisation:
          type: string
        reviewed_on:
          type: string
          format: date
        note:
          type: string
          maxLength: 2000
    LeaseTemplateInput:
      type: object
      additionalProperties: false
      properties:
        market_code:
          type: string
          pattern: "^[A-Za-z]{2}$"
        name:
          type: string
          maxLength: 120
        lease_kind:
          type: string
          enum: [RESIDENTIAL, COMMERCIAL]
        description:
          type: string
          maxLength: 1000
        sections:
          type: array
          minItems: 1
          maxItems: 60
          items:
            $ref: "#/components/schemas/LeaseSection"
        optional_clauses:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/LeaseClause"
        clauses:
          type: array
          maxItems: 30
          description: Another name for `optional_clauses` (new in 0.26.0); `optional_clauses` wins when both are sent.
          items:
            $ref: "#/components/schemas/LeaseClause"
    OrganisationLeaseTemplateInput:
      description: |
        A new organisation template (as `LeaseTemplateInput`, with `market_code`, `name`,
        `lease_kind` and `sections` required), or a copy: `copy_from_template_id` with an
        optional `name` (default "Copy of <name>") and any other changes. New in 0.26.0.
      type: object
      additionalProperties: false
      properties:
        copy_from_template_id:
          type: string
          format: uuid
        market_code:
          type: string
          pattern: "^[A-Za-z]{2}$"
        name:
          type: string
          maxLength: 120
        lease_kind:
          type: string
          enum: [RESIDENTIAL, COMMERCIAL]
        description:
          type: string
          maxLength: 1000
        sections:
          type: array
          minItems: 1
          maxItems: 60
          items:
            $ref: "#/components/schemas/LeaseSection"
        optional_clauses:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/LeaseClause"
        clauses:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/LeaseClause"
    LeaseTemplate:
      type: object
      additionalProperties: false
      required: [id, family_id, version, organisation_id, source, can_edit, market_code, name, lease_kind, description, sections,
        optional_clauses, status, legal_review, created_by_name, approved_at, approved_by_name, retired_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        family_id:
          type: string
          format: uuid
          description: Groups the versions of one template (the first version's ID).
        version:
          type: integer
          minimum: 1
        organisation_id:
          type: [string, "null"]
          format: uuid
          description: The organisation that owns the template; null for a sample. New in 0.26.0.
        source:
          type: string
          enum: [SAMPLE, ORGANISATION]
          description: New in 0.26.0.
        can_edit:
          type: boolean
          description: True when the caller may manage the template (new in 0.26.0).
        market_code:
          type: string
        name:
          type: string
        lease_kind:
          type: string
          enum: [RESIDENTIAL, COMMERCIAL]
        description:
          type: [string, "null"]
        sections:
          type: array
          items:
            $ref: "#/components/schemas/LeaseSection"
        optional_clauses:
          type: array
          items:
            $ref: "#/components/schemas/LeaseClause"
        status:
          type: string
          enum: [DRAFT, APPROVED, RETIRED]
          description: APPROVED is shown as "Published" for an organisation template.
        legal_review:
          description: Optional (0.26.0); never set on an organisation template.
          oneOf:
            - $ref: "#/components/schemas/LegalReview"
            - type: "null"
        created_by_name:
          type: string
        approved_at:
          type: [string, "null"]
          format: date-time
        approved_by_name:
          type: [string, "null"]
        retired_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LeaseTemplateEnvelope:
      type: object
      additionalProperties: false
      required: [template]
      properties:
        template:
          $ref: "#/components/schemas/LeaseTemplate"
        new_version:
          type: boolean
          description: PATCH only. True when an approved template's next version was created.
    LeaseTemplateList:
      type: object
      additionalProperties: false
      required: [items, variables]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LeaseTemplate"
        variables:
          type: array
          items:
            $ref: "#/components/schemas/LeaseVariable"
    LeaseTemplateEvent:
      type: object
      additionalProperties: false
      required: [id, action, actor, detail, at]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          enum: [CREATED, EDITED, NEW_VERSION, APPROVED, RETIRED]
        actor:
          $ref: "#/components/schemas/LeaseActor"
        detail:
          type: [object, "null"]
        at:
          type: string
          format: date-time
    LeaseActor:
      type: object
      additionalProperties: false
      required: [type, user_id, name]
      properties:
        type:
          type: string
          enum: [USER, SYSTEM, RECIPIENT]
        user_id:
          type: [string, "null"]
          format: uuid
        name:
          type: string
    LeaseParty:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        phone:
          type: string
    LeaseInput:
      type: object
      additionalProperties: false
      properties:
        template_id:
          type: string
          format: uuid
        listing_id:
          type: string
          format: uuid
          description: Create only.
        organisation_id:
          type: string
          format: uuid
          description: Create only, without a listing.
        property_address:
          type: string
          maxLength: 300
        landlords:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/LeaseParty"
        tenants:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/LeaseParty"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        periodic:
          type: boolean
        rent_amount:
          type: string
          pattern: "^\\d{1,12}(\\.\\d{1,2})?$"
        rent_currency:
          type: string
          pattern: "^[A-Z]{3}$"
        rent_period:
          type: string
          enum: [MONTHLY, WEEKLY, ANNUALLY]
        payment_day:
          type: integer
          minimum: 1
          maximum: 31
        deposit_amount:
          type: string
        notice_period_days:
          type: integer
          minimum: 1
          maximum: 365
        optional_clauses:
          type: array
          items:
            type: string
        special_conditions:
          type: string
          maxLength: 4000
        landlord_stamp:
          type: boolean
          default: false
          description: |
            New in 0.26.0. Each landlord also applies their stamp: the signing copy has a STAMP
            field next to each landlord's signature block.
    LeaseDocument:
      type: object
      additionalProperties: false
      required: [kind, sha256, size_bytes, template_version, generated_at]
      properties:
        kind:
          type: string
          enum: [DRAFT, SIGNING, FINAL]
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        size_bytes:
          type: integer
        template_version:
          type: integer
        generated_at:
          type: string
          format: date-time
    Lease:
      type: object
      additionalProperties: false
      required: [id, reference, status, template, organisation, listing, created_by, property_address, landlords, tenants,
        start_date, end_date, periodic, rent_amount, rent_currency, rent_period, payment_day, deposit_amount,
        notice_period_days, optional_clauses, special_conditions, landlord_stamp, document, signing_copy, agreement_id, can_edit, can_send,
        can_cancel, can_delete, created_at, updated_at, sent_at, completed_at, declined_at, cancelled_at, cancel_reason]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^RPL-\\d{4}-\\d{6,}$"
        status:
          type: string
          enum: [DRAFT, SENT_FOR_SIGNING, SIGNED, DECLINED, CANCELLED, EXPIRED]
        template:
          type: object
          additionalProperties: false
          required: [id, name, version, market_code, lease_kind]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            version:
              type: integer
            market_code:
              type: string
            lease_kind:
              type: string
        organisation:
          type: [object, "null"]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        listing:
          type: [object, "null"]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            reference:
              type: string
            title:
              type: string
        created_by:
          type: object
          additionalProperties: false
          properties:
            user_id:
              type: string
              format: uuid
            name:
              type: string
        property_address:
          type: string
        landlords:
          type: array
          items:
            $ref: "#/components/schemas/LeasePartyView"
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/LeasePartyView"
        start_date:
          type: string
          format: date
        end_date:
          type: [string, "null"]
          format: date
        periodic:
          type: boolean
        rent_amount:
          type: string
        rent_currency:
          type: string
        rent_period:
          type: string
          enum: [MONTHLY, WEEKLY, ANNUALLY]
        payment_day:
          type: integer
        deposit_amount:
          type: [string, "null"]
        notice_period_days:
          type: integer
        optional_clauses:
          type: array
          items:
            type: string
        special_conditions:
          type: [string, "null"]
        landlord_stamp:
          type: boolean
          description: New in 0.26.0.
        document:
          description: The PDF `GET .../pdf` returns now.
          oneOf:
            - $ref: "#/components/schemas/LeaseDocument"
            - type: "null"
        signing_copy:
          description: The frozen copy sent for signing.
          oneOf:
            - $ref: "#/components/schemas/LeaseDocument"
            - type: "null"
        agreement_id:
          type: [string, "null"]
          format: uuid
          description: The agreement the lease was sent with (`GET /v1/me/agreements/{id}`).
        can_edit:
          type: boolean
        can_send:
          type: boolean
        can_cancel:
          type: boolean
        can_delete:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        sent_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        declined_at:
          type: [string, "null"]
          format: date-time
        cancelled_at:
          type: [string, "null"]
          format: date-time
        cancel_reason:
          type: [string, "null"]
    LeasePartyView:
      type: object
      additionalProperties: false
      required: [role, name, email, phone]
      properties:
        role:
          type: string
          enum: [LANDLORD, TENANT]
        name:
          type: string
        email:
          type: string
        phone:
          type: [string, "null"]
    LeaseEnvelope:
      type: object
      additionalProperties: false
      required: [lease]
      properties:
        lease:
          $ref: "#/components/schemas/Lease"
    LeasePage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Lease"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    LeaseEvent:
      type: object
      additionalProperties: false
      required: [id, action, actor, detail, at]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        actor:
          $ref: "#/components/schemas/LeaseActor"
        detail:
          type: object
        at:
          type: string
          format: date-time
    ReminderFrequency:
      type: string
      enum: [NONE, DAILY, EVERY_3_DAYS, WEEKLY]
      description: Reminders to the recipients whose turn it is, counted from when they were emailed; each is sent once (the worker records it).
    AgreementRecipientInput:
      type: object
      additionalProperties: false
      required: [name, email, role, order]
      properties:
        id:
          type: string
          format: uuid
          description: PATCH only, to keep an existing recipient and their fields.
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        role:
          type: string
          enum: [SIGNER, APPROVER, CC]
        order:
          type: integer
          minimum: 1
          maximum: 20
    AgreementInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 200
        message:
          type: string
          maxLength: 2000
        expires_at:
          type: string
          format: date-time
        reminder_frequency:
          $ref: "#/components/schemas/ReminderFrequency"
        recipients:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AgreementRecipientInput"
        organisation_id:
          type: string
          format: uuid
          description: Create only; required when the caller manages listings for several organisations.
    AgreementFieldInput:
      type: object
      additionalProperties: false
      required: [recipient_id, type, page, x, y, w, h]
      properties:
        recipient_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [SIGNATURE, INITIALS, DATE_SIGNED, NAME, TEXT, CHECKBOX, STAMP]
          description: |
            STAMP (new in 0.26.0): the signer's generated stamp; SIGNER recipients only; default size
            113 x 113 points (40 mm), at least 57 x 57.
        page:
          type: integer
          minimum: 1
        x:
          type: number
        y:
          type: number
        w:
          type: number
        h:
          type: number
        required:
          type: boolean
          description: TEXT, CHECKBOX and STAMP only (default true); the other types are always required.
        label:
          type: string
          maxLength: 80
    AgreementField:
      type: object
      additionalProperties: false
      required: [id, recipient_id, type, page, x, y, w, h, required, label, value]
      properties:
        id:
          type: string
          format: uuid
        recipient_id:
          type: string
          format: uuid
        type:
          type: string
        page:
          type: integer
        x:
          type: number
        y:
          type: number
        w:
          type: number
        h:
          type: number
        required:
          type: boolean
        label:
          type: [string, "null"]
        value:
          type: [string, "null"]
          description: A TEXT value or "true"/"false" for a CHECKBOX, once filled.
    AgreementRecipient:
      type: object
      additionalProperties: false
      required: [id, order, role, name, email, label, status, activated_at, first_viewed_at, completed_at, declined_at, decline_reason, verification]
      properties:
        id:
          type: string
          format: uuid
        order:
          type: integer
        role:
          type: string
          enum: [SIGNER, APPROVER, CC]
        name:
          type: string
        email:
          type: string
        label:
          type: [string, "null"]
          description: How a generated document names them, e.g. "Tenant 1".
        status:
          type: string
          enum: [WAITING, ACTIVE, SIGNED, APPROVED, DECLINED, CC]
        activated_at:
          type: [string, "null"]
          format: date-time
        first_viewed_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        declined_at:
          type: [string, "null"]
          format: date-time
        decline_reason:
          type: [string, "null"]
        verification:
          type: [string, "null"]
          enum: [EMAIL_CODE, DEMO_CODE, null]
    PageSize:
      type: object
      additionalProperties: false
      required: [width, height]
      properties:
        width:
          type: number
          description: PDF points.
        height:
          type: number
    AgreementDocument:
      type: object
      additionalProperties: false
      required: [sha256, size_bytes, file_name]
      properties:
        sha256:
          type: string
        size_bytes:
          type: integer
        file_name:
          type: string
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PageSize"
    Agreement:
      type: object
      additionalProperties: false
      required: [id, reference, name, message, status, source, lease_id, sender, organisation, expires_at, reminder_frequency, document,
        final_document, recipients, fields, waiting_for_you, can_edit, can_send, can_cancel, created_at, updated_at, sent_at, completed_at,
        declined_at, cancelled_at, expired_at, cancel_reason]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^RPA-\\d{4}-\\d{6,}$"
        name:
          type: string
        message:
          type: [string, "null"]
        status:
          type: string
          enum: [DRAFT, OUT_FOR_SIGNATURE, COMPLETED, DECLINED, CANCELLED, EXPIRED]
        source:
          type: string
          enum: [UPLOAD, LEASE]
        lease_id:
          type: [string, "null"]
          format: uuid
        sender:
          type: object
          additionalProperties: false
          properties:
            user_id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
        organisation:
          type: [object, "null"]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        expires_at:
          type: string
          format: date-time
        reminder_frequency:
          $ref: "#/components/schemas/ReminderFrequency"
        document:
          oneOf:
            - $ref: "#/components/schemas/AgreementDocument"
            - type: "null"
        final_document:
          oneOf:
            - $ref: "#/components/schemas/AgreementDocument"
            - type: "null"
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/AgreementRecipient"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/AgreementField"
        waiting_for_you:
          type: boolean
        can_edit:
          type: boolean
        can_send:
          type: boolean
        can_cancel:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        sent_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        declined_at:
          type: [string, "null"]
          format: date-time
        cancelled_at:
          type: [string, "null"]
          format: date-time
        expired_at:
          type: [string, "null"]
          format: date-time
        cancel_reason:
          type: [string, "null"]
    AgreementEnvelope:
      type: object
      additionalProperties: false
      required: [agreement]
      properties:
        agreement:
          $ref: "#/components/schemas/Agreement"
    AgreementPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agreement"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    AgreementEvent:
      type: object
      additionalProperties: false
      required: [id, action, actor_type, actor_user_id, actor_name, recipient_id, ip, user_agent, detail, at]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        actor_type:
          type: string
          enum: [USER, RECIPIENT, SYSTEM]
        actor_user_id:
          type: [string, "null"]
          format: uuid
        actor_name:
          type: string
        recipient_id:
          type: [string, "null"]
          format: uuid
        ip:
          type: [string, "null"]
        user_agent:
          type: [string, "null"]
        detail:
          type: object
        at:
          type: string
          format: date-time
    SignatureFont:
      type: object
      additionalProperties: false
      required: [key, label]
      properties:
        key:
          type: string
          enum: [FLOWING, BOLD, CLASSIC]
        label:
          type: string
    AdoptedSignatureInput:
      type: object
      additionalProperties: false
      required: [kind]
      description: |
        `TYPED`: `text` (at most 120 characters) and `font` (a `SignatureFont` key, default
        `FLOWING`). `DRAWN`: `image_base64`, a PNG of at most 200 KB. `UPLOADED`: `image_base64`, a
        PNG or JPEG of at most 500 KB. Images: 20 x 10 to 2000 x 1000 pixels, re-encoded as PNG on
        white (metadata dropped). A `data:image/...;base64,` prefix is accepted.
      properties:
        kind:
          type: string
          enum: [TYPED, DRAWN, UPLOADED]
        text:
          type: string
        font:
          type: string
        image_base64:
          type: string
    SubmitInput:
      type: object
      additionalProperties: false
      required: [code, consent]
      properties:
        code:
          type: [string, integer]
        consent:
          type: boolean
          description: Must be true (the `consent_text` of the signing page).
        field_values:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field_id, value]
            properties:
              field_id:
                type: string
                format: uuid
              value:
                type: string
        signature:
          $ref: "#/components/schemas/AdoptedSignatureInput"
        initials:
          $ref: "#/components/schemas/AdoptedSignatureInput"
        stamp:
          $ref: "#/components/schemas/Stamp"
          description: New in 0.26.0. Required when the recipient has a required STAMP field.
    SigningView:
      type: object
      additionalProperties: false
      required: [agreement, recipient, fields, other_recipients, can_act, read_only, code_length, consent_text, statement, signature_fonts, link_expires_at, saved_stamp]
      properties:
        agreement:
          type: object
          additionalProperties: false
          properties:
            reference:
              type: string
            name:
              type: string
            message:
              type: [string, "null"]
            status:
              type: string
            sender_name:
              type: string
            organisation_name:
              type: [string, "null"]
            expires_at:
              type: string
              format: date-time
            document_sha256:
              type: string
            final_sha256:
              type: [string, "null"]
            pages:
              type: array
              items:
                $ref: "#/components/schemas/PageSize"
            completed_at:
              type: [string, "null"]
              format: date-time
        recipient:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            role:
              type: string
            label:
              type: [string, "null"]
            status:
              type: string
            email_masked:
              type: string
            completed_at:
              type: [string, "null"]
              format: date-time
        fields:
          type: array
          items:
            $ref: "#/components/schemas/AgreementField"
        other_recipients:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
              role:
                type: string
              order:
                type: integer
              status:
                type: string
        can_act:
          type: boolean
        read_only:
          type: boolean
        code_length:
          type: integer
        consent_text:
          type: string
        statement:
          type: string
        signature_fonts:
          type: array
          items:
            $ref: "#/components/schemas/SignatureFont"
        link_expires_at:
          type: string
          format: date-time
        saved_stamp:
          description: |
            New in 0.26.0. The signed-in signer's saved stamp, when the caller's account has the
            recipient's email address and the recipient has a STAMP field; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/Stamp"
            - type: "null"
    SigningRequest:
      type: object
      additionalProperties: false
      required: [agreement_id, recipient_id, reference, name, agreement_status, role, recipient_status, sender_name, sent_at, expires_at, completed_at, can_sign]
      properties:
        agreement_id:
          type: string
          format: uuid
        recipient_id:
          type: string
          format: uuid
        reference:
          type: string
        name:
          type: string
        agreement_status:
          type: string
        role:
          type: string
        recipient_status:
          type: string
        sender_name:
          type: string
        sent_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        can_sign:
          type: boolean
    SavedSignature:
      type: object
      additionalProperties: false
      required: [signature, initials, stamp, signature_fonts]
      properties:
        signature:
          oneOf:
            - $ref: "#/components/schemas/SavedAdopted"
            - type: "null"
        initials:
          oneOf:
            - $ref: "#/components/schemas/SavedAdopted"
            - type: "null"
        stamp:
          description: The saved stamp (new in 0.26.0).
          oneOf:
            - $ref: "#/components/schemas/Stamp"
            - type: "null"
        signature_fonts:
          type: array
          items:
            $ref: "#/components/schemas/SignatureFont"
    Stamp:
      description: |
        The text of a generated stamp (new in 0.26.0). The server draws it like a rubber company
        stamp: ROUND and OVAL with `top_text` along the top arc, `bottom_text` along the bottom
        arc, a double ring and the centre lines (and date) across the middle; RECTANGLE with a
        double border and the lines stacked (`top_text` first, larger). Returned upper-cased and
        trimmed (empty centre lines dropped). Plain text (no `<` or `>`); any script the fonts
        cover, a fallback font otherwise.
      type: object
      additionalProperties: false
      required: [top_text]
      properties:
        shape:
          type: string
          enum: [ROUND, OVAL, RECTANGLE]
          default: ROUND
        colour:
          type: string
          enum: [BLUE, RED, BLACK, GREEN, PURPLE]
          default: BLUE
        top_text:
          type: string
          minLength: 1
          maxLength: 60
        centre_lines:
          type: array
          maxItems: 3
          items:
            type: string
            maxLength: 30
        bottom_text:
          type: string
          maxLength: 60
        include_date:
          type: boolean
          description: Prints the date the stamp is applied in the centre, e.g. "16 NOV 2026".
    SavedAdopted:
      type: object
      additionalProperties: false
      required: [kind, text, font, image_base64]
      properties:
        kind:
          type: string
          enum: [TYPED, DRAWN, UPLOADED]
        text:
          type: [string, "null"]
        font:
          type: [string, "null"]
        image_base64:
          type: [string, "null"]
    Verification:
      type: object
      additionalProperties: false
      required: [reference, status, completed_at, original_sha256, final_sha256, signatures, statement]
      properties:
        match:
          type: boolean
          description: POST only.
        document:
          type: string
          enum: [FINAL, ORIGINAL]
          description: POST only, when it matches.
        reference:
          type: string
        status:
          type: string
        completed_at:
          type: [string, "null"]
          format: date-time
        original_sha256:
          type: string
        final_sha256:
          type: string
        signatures:
          type: integer
        statement:
          type: string
    # -----------------------------------------------------------------------
    # The administrators' area (new in 0.25.0)
    # -----------------------------------------------------------------------
    DeleteAccountRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, description: The account's current password. }
    AccountDeleted:
      type: object
      description: |
        What deleting an account did. The account is anonymised in place (name `Deleted
        account`, address `deleted-<id>@deleted.invalid`, no phone, no password, marketing
        consent withdrawn, status `DELETED`); every session, sign-in code and reset link ends;
        every membership is `REMOVED` with the person's open requests and appointments given
        back to the organisation (and a `MEMBER_REMOVED` team audit record); the listings they own
        directly are `ARCHIVED` (withdrawn) and they are removed as the assigned agent of
        organisation listings; their agent profile is hidden; their own pending and active
        subscriptions are `CANCELLED` (no refund is recorded); their saved signature is deleted.
        Audit records, signed agreements, leases, and the requests and enquiries they sent stay as
        they are.
      required: [status, sessions_revoked, organisations_left, listings_withdrawn, listings_unassigned, subscriptions_cancelled]
      properties:
        status: { type: string, enum: [DELETED] }
        sessions_revoked: { type: integer }
        organisations_left: { type: integer }
        listings_withdrawn: { type: integer }
        listings_unassigned: { type: integer }
        subscriptions_cancelled: { type: integer }
    AdminReason:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000, description: Kept in the audit trail; a suspension's reason is emailed to the person. }
    AdminUserSummary:
      type: object
      required: [id, name, email, status, email_verified, created_at, last_sign_in_at, account_roles, platform_roles, market_codes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DELETED] }
        email_verified: { type: boolean }
        created_at: { type: string, format: date-time }
        last_sign_in_at: { type: [string, "null"], format: date-time }
        account_roles: { type: array, items: { type: string } }
        platform_roles: { type: array, items: { type: string } }
        market_codes: { type: array, items: { type: string }, description: Countries of the memberships that were not removed. }
    AdminUserPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUserSummary" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    AdminUserDetail:
      type: object
      required: [user, subscriptions, audit]
      properties:
        user:
          type: object
          required: [id, name, email, status, email_verified, created_at, last_sign_in_at, suspended_at, suspension_reason, deleted_at,
                     platform_roles, account_roles, memberships, listing_counts, listings_total]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string }
            status: { type: string, enum: [ACTIVE, SUSPENDED, DELETED] }
            email_verified: { type: boolean }
            created_at: { type: string, format: date-time }
            last_sign_in_at: { type: [string, "null"], format: date-time, description: When the newest session started. }
            suspended_at: { type: [string, "null"], format: date-time }
            suspension_reason: { type: [string, "null"] }
            deleted_at: { type: [string, "null"], format: date-time }
            platform_roles:
              type: array
              items:
                type: object
                required: [role, market_code]
                properties:
                  role: { type: string }
                  market_code: { type: [string, "null"] }
            account_roles:
              type: array
              items:
                type: object
                required: [role, status, onboarding_status]
                properties:
                  role: { type: string }
                  status: { type: string }
                  onboarding_status: { type: [string, "null"], description: The newest onboarding application's status. }
            memberships:
              type: array
              description: Every membership, in any status (ACTIVE, INVITED, SUSPENDED, REMOVED).
              items:
                type: object
                required: [organisation_id, organisation_name, organisation_kind, market_code, role, role_label, status]
                properties:
                  organisation_id: { type: string, format: uuid }
                  organisation_name: { type: string }
                  organisation_kind: { type: string }
                  market_code: { type: string }
                  role: { type: string, enum: [OWNER, MANAGER, AGENT, STAFF] }
                  role_label: { type: string }
                  status: { type: string }
            listing_counts:
              type: object
              description: Listings the person owns directly or is the assigned agent of, by status (a published one past its expiry is EXPIRED).
              additionalProperties: { type: integer }
            listings_total: { type: integer }
        subscriptions:
          type: array
          items:
            type: object
            required: [id, invoice_number, plan_name, period, status, subscriber_kind, subscriber_name, amount, currency_code, starts_at, ends_at, organisation_id]
            properties:
              id: { type: string, format: uuid }
              invoice_number: { type: string }
              plan_name: { type: string }
              period: { type: string, enum: [QUARTERLY, YEARLY] }
              status: { type: string, enum: [PENDING_PAYMENT, ACTIVE, EXPIRED, REJECTED, CANCELLED] }
              subscriber_kind: { type: string, enum: [INDIVIDUAL, ORGANISATION] }
              subscriber_name: { type: string }
              amount: { type: string }
              currency_code: { type: string }
              starts_at: { type: [string, "null"], format: date-time }
              ends_at: { type: [string, "null"], format: date-time }
              organisation_id: { type: [string, "null"], format: uuid }
              organisation_name: { type: string }
        audit:
          type: array
          description: The newest 20 records about the account.
          items: { $ref: "#/components/schemas/AdminAuditEvent" }
    AdminAuditEvent:
      type: object
      required: [id, actor_user_id, actor_name, action, target_type, target_id, target_label, reason, before, after, at]
      properties:
        id: { type: string, format: uuid }
        actor_user_id: { type: [string, "null"], format: uuid }
        actor_name: { type: string }
        action:
          type: string
          enum: [USER_SUSPENDED, USER_REACTIVATED, USER_DELETED, USER_SELF_DELETED, PLAN_CREATED, PLAN_UPDATED, PLAN_RETIRED,
                 SUBSCRIPTION_APPROVED, SUBSCRIPTION_REJECTED, SUBSCRIPTION_CANCELLED, REFERENCE_ITEM_CREATED, REFERENCE_ITEM_UPDATED,
                 REFERENCE_ITEM_DEACTIVATED, REFERENCE_ITEM_REACTIVATED]
        target_type: { type: string, enum: [USER, SUBSCRIPTION_PLAN, SUBSCRIPTION, REFERENCE_ITEM] }
        target_id: { type: string }
        target_label: { type: string }
        reason: { type: string }
        before: { type: [object, "null"] }
        after: { type: [object, "null"] }
        at: { type: string, format: date-time }
    PlanFeature:
      type: object
      required: [code, limit]
      properties:
        code: { type: string, enum: [MAX_ACTIVE_LISTINGS, MAX_FEATURED_LISTINGS, MAX_TEAM_MEMBERS] }
        label: { type: string, description: Response only. }
        limit: { type: [integer, "null"], minimum: 0, maximum: 1000000, description: null is unlimited. }
    PlanPrice:
      type: object
      required: [currency_code, period, amount]
      properties:
        currency_code: { type: string, pattern: "^[A-Z]{3}$" }
        period: { type: string, enum: [QUARTERLY, YEARLY] }
        amount: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$", description: "A decimal string; responses always have two decimals (\"30.00\")." }
    SubscriptionPlan:
      type: object
      required: [id, name, description, subscriber_kind, eligible_roles, features, benefits, prices, status, sort_order, created_at, updated_at, retired_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        subscriber_kind:
          type: string
          enum: [INDIVIDUAL, ORGANISATION]
          description: INDIVIDUAL is taken by a professional for themselves; ORGANISATION by an organisation's OWNER for it.
        eligible_roles: { type: array, items: { type: string }, description: Account roles (approved) the plan is offered to. }
        features: { type: array, items: { $ref: "#/components/schemas/PlanFeature" } }
        benefits: { type: array, items: { type: string } }
        prices: { type: array, items: { $ref: "#/components/schemas/PlanPrice" } }
        status: { type: string, enum: [ACTIVE, RETIRED] }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        retired_at: { type: [string, "null"], format: date-time }
    SubscriptionPlanInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        subscriber_kind: { type: string, enum: [INDIVIDUAL, ORGANISATION] }
        eligible_roles: { type: array, minItems: 1, items: { type: string } }
        features:
          type: array
          items:
            type: object
            required: [code]
            additionalProperties: false
            properties:
              code: { type: string }
              limit: { type: [integer, "null"] }
        benefits: { type: array, maxItems: 20, items: { type: string, maxLength: 200 } }
        prices: { type: array, minItems: 1, items: { $ref: "#/components/schemas/PlanPrice" } }
        sort_order: { type: integer }
    SubscriptionPlanEnvelope:
      type: object
      required: [plan]
      properties:
        plan: { $ref: "#/components/schemas/SubscriptionPlan" }
    AvailablePlans:
      type: object
      required: [currency_code, plans, payment_note]
      properties:
        currency_code: { type: [string, "null"], description: The market's currency when `market` was given. }
        plans: { type: array, items: { $ref: "#/components/schemas/SubscriptionPlan" } }
        payment_note: { type: string, description: How invoices are paid (no online payment). }
    SubscriptionRequest:
      type: object
      required: [plan_id, period]
      additionalProperties: false
      properties:
        plan_id: { type: string, format: uuid }
        period: { type: string, enum: [QUARTERLY, YEARLY] }
        market_code: { type: string, pattern: "^[A-Za-z]{2}$", description: "INDIVIDUAL plans: the country whose currency is paid in." }
        organisation_id: { type: string, format: uuid, description: ORGANISATION plans only. }
    Subscription:
      type: object
      description: |
        `status` is as of the response: an ACTIVE subscription whose `ends_at` has passed is
        shown EXPIRED at once (the worker records it within minutes). An ACTIVE subscription
        whose `starts_at` is in the future is a paid renewal waiting for the current period.
      required: [id, invoice_number, plan_id, plan_name, period, status, subscriber, organisation_id, requested_by, market_code, currency_code,
                 amount, renewal_of, starts_at, ends_at, activated_at, renewal_opens_at, payment, rejected_at, rejection_reason, cancelled_at,
                 cancel_reason, cancelled_by, refund_due, refund_note, expired_at, created_at, updated_at, payment_instructions]
      properties:
        id: { type: string, format: uuid }
        invoice_number: { type: string, pattern: "^RPS-[0-9]{4}-[0-9]{6,}$" }
        plan_id: { type: string, format: uuid }
        plan_name: { type: string, description: The plan's name when it was requested. }
        period: { type: string, enum: [QUARTERLY, YEARLY] }
        status: { type: string, enum: [PENDING_PAYMENT, ACTIVE, EXPIRED, REJECTED, CANCELLED] }
        subscriber:
          type: object
          required: [kind, id, name]
          properties:
            kind: { type: string, enum: [INDIVIDUAL, ORGANISATION] }
            id: { type: string, format: uuid, description: The person's or the organisation's ID. }
            name: { type: string }
        organisation_id: { type: [string, "null"], format: uuid }
        requested_by:
          type: object
          required: [id, name]
          properties:
            id: { type: [string, "null"], format: uuid }
            name: { type: string }
        market_code: { type: string }
        currency_code: { type: string }
        amount: { type: string, description: The invoice amount, two decimals. }
        renewal_of: { type: [string, "null"], format: uuid }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        activated_at: { type: [string, "null"], format: date-time }
        renewal_opens_at: { type: [string, "null"], format: date-time, description: ACTIVE only; 30 days before `ends_at`. }
        payment:
          type: [object, "null"]
          required: [reference, amount, received_on, recorded_by_name]
          properties:
            reference: { type: string }
            amount: { type: string }
            received_on: { type: string, format: date }
            note: { type: string }
            recorded_by_name: { type: string }
        rejected_at: { type: [string, "null"], format: date-time }
        rejection_reason: { type: [string, "null"] }
        cancelled_at: { type: [string, "null"], format: date-time }
        cancel_reason: { type: [string, "null"] }
        cancelled_by: { type: [string, "null"], enum: [SUBSCRIBER, ADMIN, SYSTEM, null] }
        refund_due: { type: boolean, description: An administrator recorded that a refund is due (no payment is processed here). }
        refund_note: { type: [string, "null"] }
        expired_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        payment_instructions: { type: [string, "null"], description: PENDING_PAYMENT only. }
    SubscriptionEnvelope:
      type: object
      required: [subscription]
      properties:
        subscription: { $ref: "#/components/schemas/Subscription" }
    SubscriptionEvent:
      type: object
      required: [id, action, actor_type, actor_name, note, at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [REQUESTED, RENEWAL_REQUESTED, CANCELLED, PAYMENT_RECORDED, ACTIVATED, REJECTED, EXPIRED] }
        actor_type: { type: string, enum: [SUBSCRIBER, ADMIN, SYSTEM] }
        actor_name: { type: string }
        note: { type: string }
        at: { type: string, format: date-time }
    SubscriptionUsage:
      type: object
      required: [active_listings, max_active_listings, limit_enforced]
      properties:
        active_listings: { type: integer, description: Published, unexpired listings of the subscriber now. }
        max_active_listings: { type: [integer, "null"], description: The plan's MAX_ACTIVE_LISTINGS (null - unlimited or none). }
        limit_enforced: { type: boolean, description: Always false in 0.25.0 - the limit is shown, not enforced. }
    SubscriptionDetail:
      type: object
      required: [subscription, events, usage]
      properties:
        subscription: { $ref: "#/components/schemas/Subscription" }
        events: { type: array, items: { $ref: "#/components/schemas/SubscriptionEvent" } }
        usage: { $ref: "#/components/schemas/SubscriptionUsage" }
    MySubscriptions:
      type: object
      required: [subscribers]
      properties:
        subscribers:
          type: array
          items:
            type: object
            required: [subscriber, current, upcoming, pending, can_renew, usage, history]
            properties:
              subscriber:
                type: object
                required: [kind, id, name]
                properties:
                  kind: { type: string, enum: [INDIVIDUAL, ORGANISATION] }
                  id: { type: string, format: uuid }
                  name: { type: string }
                  market_code: { type: string }
              current: { oneOf: [{ $ref: "#/components/schemas/Subscription" }, { type: "null" }] }
              upcoming: { oneOf: [{ $ref: "#/components/schemas/Subscription" }, { type: "null" }] }
              pending: { oneOf: [{ $ref: "#/components/schemas/Subscription" }, { type: "null" }] }
              can_renew: { type: boolean }
              usage: { $ref: "#/components/schemas/SubscriptionUsage" }
              history: { type: array, items: { $ref: "#/components/schemas/Subscription" } }
    SubscriptionPayment:
      type: object
      required: [payment_reference, amount, received_on]
      additionalProperties: false
      properties:
        payment_reference: { type: string, maxLength: 100, description: The bank reference or receipt number. }
        amount: { type: string, description: In the invoice currency; at least the invoice amount. }
        received_on: { type: string, format: date, description: Not in the future. }
        note: { type: string, maxLength: 1000 }
    SubscriptionDecision:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000, description: Emailed to the requester. }
        refund_due: { type: boolean, default: false }
        refund_note: { type: string, maxLength: 1000 }
    AdminReferenceItem:
      allOf:
        - $ref: "#/components/schemas/ReferenceItem"
        - type: object
          required: [active]
          properties:
            active: { type: boolean }
    AdminReferenceInput:
      type: object
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 80, description: Create only. }
        label: { type: string, maxLength: 120, description: Required to create. }
        singular_label: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        sort_order: { type: integer }
        market_code: { type: string, description: Create only; required for regions, cities and suburbs. }
        parent_code: { type: string, maxLength: 80 }
    AdminReferenceEnvelope:
      type: object
      required: [item]
      properties:
        item: { $ref: "#/components/schemas/AdminReferenceItem" }
    ReportSection:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [group, market_code, count]
            properties:
              group: { type: string, description: A status (or an account role for new users; NONE for none). }
              market_code: { type: [string, "null"] }
              count: { type: integer }
    ReportSummary:
      type: object
      required: [from, to, market_codes, new_users, onboarding_applications, listings, property_requests, business_enquiries, leases,
                 agreements, subscriptions, revenue]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        market_codes: { type: [array, "null"], items: { type: string } }
        new_users: { $ref: "#/components/schemas/ReportSection" }
        onboarding_applications: { $ref: "#/components/schemas/ReportSection" }
        listings: { $ref: "#/components/schemas/ReportSection" }
        property_requests: { $ref: "#/components/schemas/ReportSection" }
        business_enquiries: { $ref: "#/components/schemas/ReportSection" }
        leases: { $ref: "#/components/schemas/ReportSection" }
        agreements: { $ref: "#/components/schemas/ReportSection" }
        subscriptions: { $ref: "#/components/schemas/ReportSection" }
        revenue:
          type: array
          items:
            type: object
            required: [currency_code, market_code, total, payments]
            properties:
              currency_code: { type: string }
              market_code: { type: [string, "null"] }
              total: { type: string, description: Sum of the recorded payments, two decimals. }
              payments: { type: integer }
