      description: |
        The keys sent replace the saved values; the whole lease is validated again (as on
        create). `listing_id` and `organisation_id` cannot change (`400`). A new `template_id`
        must be approved and of the lease's country. The draft PDF is rendered again: **only the
        newest draft PDF is kept** (the previous object is deleted; the audit trail keeps every
        version's SHA-256). Not a draft: `409 LEASE_NOT_EDITABLE`.
      security:
        - cookieSession: []
