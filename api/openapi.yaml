    put:
      tags: [agreements]
      operationId: putMySignature
      summary: Save a signature and initials to reuse
      description: |
        `{signature?, initials?, stamp?}`: `signature` and `initials` are adopted signatures (see
        `AdoptedSignatureInput`), a missing one is cleared. `stamp` (new in 0.26.0) is a `Stamp`:
        left out, the saved stamp is kept; `null` clears it. Nothing is applied automatically: the
