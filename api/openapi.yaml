openapi: 3.1.0
info:
  title: RightProperty365 API
  version: 0.17.0
  summary: Global property marketplace API (every country; Zimbabwe and the United Kingdom first).
  description: |
    Versioned REST API for RightProperty365.

    Conventions
    - Every error response uses the `ErrorEnvelope` shape. Branch on `error.code`, not on `error.message`.
    - Every response carries an `X-Request-Id` header. Clients may supply their own
      (1-128 characters of `A-Z a-z 0-9 . _ -`); otherwise one is generated. The same value is
      returned as `trace_id` in error bodies.
    - Timestamps are RFC 3339 in UTC.
    - Request bodies must be `application/json`, at most 64 KB, and must not contain unknown fields.

    Contacting a business or an agent
    - Directory profiles (agencies, agents, developers, property managers, hosts, service
      providers) have **no public contact details**: this API never returns a profile's phone
      number, email address or street address. The only way to reach a profile is
      `POST /v1/business-enquiries`.
    - The customer's own contact details are stored with the enquiry and returned **only** by
      `GET /v1/inbox/business-enquiries` to the authorised recipient.
    - The public catalogue (`/v1/listings`, `/v1/directory`, `/v1/sitemap`, `/v1/reference`)
      never returns a phone number, an email address or a street address for anyone. A test
      walks every public response to enforce it.

    Verified advertisers, logos and who advertises a listing (new in 0.17.0)
    - **Only listings of a verified advertiser are public.** A listing is returned by any public
      endpoint only while it is PUBLISHED, not expired, **and** its advertiser is verified: the
      organisation that owns it is active and has a published, verified profile of its own, or -
      for a direct owner - the owner's `PRIVATE_SELLER` or `LANDLORD` role is approved (`ACTIVE`).
      The rule is applied when the listing is read (search with every search engine, the detail,
      suggestions, the sitemap, profile pages, the country counts, availability), so it takes
      effect the moment the verification changes. A listing hidden for this reason answers
      `404 LISTING_NOT_FOUND` everywhere - never `410` - and takes no property request,
      appointment or request to stay (`404 LISTING_NOT_FOUND`). An assigned agent's own
      verification does not hide a listing; the agent is then simply not shown as verified.
      `GET /v1/trust/summary` gives the numbers.
    - **What "verified" does and does not mean.** It means the ADVERTISER was verified. It does
      not mean the listing itself was checked: `Listing.verification.listing_reviewed` says
      whether it was, and today only the sample data sets it (there are no endpoints to submit,
      review or publish a listing yet).
    - **Changed response shapes** (additive unless marked):
      - `Listing.advertiser` gains `display` and `agent_display`; `Listing` gains `verification`.
      - `ProfileRef` (in `Listing.advertiser.agency` / `.agent`, `DirectoryProfile.agency`,
        `DirectoryProfileDetail.agents`) gains `logo`.
      - **Changed:** `DirectoryProfile.logo` was always null and documented as a `Photo`
        (`url`, `alt`, `width`, `height`); it is now a `Logo` (`url`, `width`, `height`) or null.
      - **Changed value:** for a direct owner, `Listing.advertiser.name` used to be the fixed
        text `Private seller`; it is now the owner's name (for example `Grace Mhlanga`), the same
        as `advertiser.display.name`. Only the name is public: never an email address, a phone
        number or an address.
      - **Changed status:** `GET /v1/listings/{slug}` and the routes that take a `listing_id`
        answer `404` for a listing whose advertiser is not verified.
    - **Logo URLs are relative to the API.** `Logo.url` is a path such as
      `/v1/directory/agencies/sample-estates/logo?v=3f2a9c0d1b7e`. It is relative to the **API
      origin**, not to the web site: prefix it with the API base URL the client already uses
      (the same value it puts in front of `/v1/listings`). The API does not return an absolute
      URL because it does not know the public address it is reached at behind a proxy, and
      because the same cached JSON must be right for every client. The `v` value changes
      whenever the image changes, so the image can be cached and a new logo is never stale.
      Logos are served as uploaded: they are not resized, cropped or re-encoded.

    Countries and places (changed in 0.15.0)
    - The platform is global: every ISO 3166-1 country can be used (`GET /v1/countries`). Public
      country lists show only the countries that have listings (`?has_listings=true`).
    - **Breaking for clients that read places.** A city, suburb or region is now a `Place`:
      `{code: string | null, label: string}`. `code` used to be always a string; it is **null**
      for a place written as free text (a city in a country without reference places). A
      listing's `suburb` used to be always an object and is now **null** when the listing has
      none. Affected: `Listing.city`, `Listing.suburb`, `Listing.region`,
      `DirectoryProfile.city`, `DirectoryProfile.region`.
    - **Breaking for clients that read the price facet.** `facets.price` is now **null** when no
      `country` or `currency` was chosen and the results span more than one currency (it used
      to be a USD range, silently), and `min_price` / `max_price` are then refused with `400` on
      `currency`. `facets.currencies` is new. See `GET /v1/listings`.

    Reference data
    - Every drop-down, filter and list value comes from `GET /v1/reference` (or
      `GET /v1/reference/{set}`), not from this document. Where a field below is described as
      "a code from the `X` reference set", the accepted values are the active rows of that set
      **at the time of the request**; the values listed in this file are the baseline shipped
      with the API and may be renamed, reordered, extended or retired by an administrator.

    Authentication
    - Sessions are opaque random tokens. The web app receives the token in the HttpOnly cookie
      `rp_session` (SameSite=Lax, Path=/, Secure outside development); mobile clients log in with
      `"token_delivery": "bearer"`, receive `access_token` in the body and send
      `Authorization: Bearer <token>`. When an `Authorization` header is present the cookie is ignored.
    - Sessions have a **scope**. `customer` sessions come from `POST /v1/auth/login` (and
      `verify-email`). `admin` sessions come only from `POST /v1/admin/auth/login`, only for
      accounts holding a platform role, only as a cookie, and last 12 hours at most with a
      30-minute inactivity timeout (both configurable on the server). Platform-role checks require
      an `admin` session; accounts holding a platform role cannot sign in at the customer login.
    - A customer session lasts at most 30 days and ends after 14 days without use. An invalid, expired or
      revoked token is treated as "not signed in" (routes that need a user answer `401 UNAUTHENTICATED`).
    - CORS: allowlisted origins may send credentials (`Access-Control-Allow-Credentials: true`,
      never with `*`). Browser clients must use `credentials: "include"`.
    - CSRF: a request authenticated by the **cookie** with a method other than GET/HEAD/OPTIONS must
      carry an allowlisted `Origin` header, otherwise it is rejected with `403 CSRF_ORIGIN`. Bearer
      requests are exempt.
    - Authorisation is decided on the server from the session's organisation memberships and
      platform roles. Nothing in a request body, query string or header can widen it.
    - Every `POST /v1/auth/*` route shares one per-IP rate limit (bursts of 20, refilled at 20 per
      minute), separate from the property-request limit.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
  - name: markets
  - name: reference
  - name: listings
  - name: directory
  - name: trust
    description: |
      The numbers behind the statement that every listing comes from a verified advertiser.
      The statement itself is enforced where listings are read (see "Verified advertisers" in
      the introduction); this endpoint only counts.
  - name: availability
    description: |
      The availability calendar of short-stay listings (category `short-stay`). Whoever lists
      the property marks nights unavailable (`BLOCKED` by their choice, or `BOOKED`); the
      public sees which nights are free.

      **It is not a booking engine.** There are no payments, no instant booking and no holds.
      A guest asks to stay with `POST /v1/property-requests` (`request_type: STAY_REQUEST`),
      which is an enquiry: it does not block the dates. The lister then marks the nights
      `BOOKED` themselves.

      Dates are calendar nights in the time zone of the listing's country (`YYYY-MM-DD`). A
      stay from `check_in` to `check_out` occupies the nights `check_in` .. `check_out - 1`.
      Every night is available unless marked otherwise, inside a booking window from today to
      365 days ahead.

      Not built: payments, instant booking, holds and their expiry, iCal import / export and
      calendar sync, seasonal pricing, per-night price overrides, and an endpoint for the
      audit trail.
  - name: property-requests
  - name: business-enquiries
  - name: appointments
    description: |
      Appointments for property **viewings** (tied to a listing) and **consultations** (with a
      listing's advertiser or a directory profile). An appointment is created by
      `POST /v1/property-requests` with a `preferred_slot_utc` (guests included) or by
      `POST /v1/appointments` (signed-in customers), and is not confirmed until the
      professional confirms it.

      Status flow: `REQUESTED` -> `CONFIRMED` -> `COMPLETED` | `NO_SHOW`; `REQUESTED` |
      `CONFIRMED` -> `RESCHEDULE_REQUESTED` -> `CONFIRMED` (the other party accepts the
      proposed time); any open status -> `CANCELLED`. One professional cannot have two
      `CONFIRMED` appointments that overlap (`409 SLOT_TAKEN`).

      A guest's appointment has no customer account, so the guest cannot act through the API:
      the professional confirms, proposes or cancels, and the guest is told by email.

      Not built: venue and showroom hourly bookings, short-stay bookings, availability
      calendars and slot configuration, ICS invites, calendar sync, reminders and push
      notifications.
  - name: auth
  - name: account
  - name: organisation-workspace
  - name: onboarding
    description: |
      Verification of professional accounts. Choosing a professional role at sign-up only
      records a request; the role's **onboarding application** (details and documents) has to
      be submitted and approved by a platform administrator before the role is ACTIVE.
      CONSUMER and TENANT have no onboarding.

      Status flow: `DRAFT` -> `SUBMITTED` -> `APPROVED` | `REJECTED` | `CHANGES_REQUESTED`;
      `CHANGES_REQUESTED` -> `SUBMITTED`. `REJECTED` is final for that application; saving
      details again starts a new one.
  - name: admin

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      description: Always 200 while the process is running. Does not check dependencies.
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ok

  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Pings the database when one is configured. In development without `DATABASE_URL`
        the API runs on in-memory stores and reports `"store": "memory"`.
      responses:
        "200":
          description: Ready to serve traffic.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                required: [status, store]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ready
                  store:
                    type: string
                    enum: [memory, postgres]
        "503":
          description: The database is not reachable (`NOT_READY`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/countries:
    get:
      tags: [markets]
      operationId: listCountries
      summary: List countries
      description: |
        **The platform is global.** This returns every enabled country: the full ISO 3166-1
        list (249 countries and territories), each with its ISO 4217 currency and a default
        IANA time zone (the capital's). Any of them may be used by a lister, on a listing, a
        directory profile or an onboarding application. There is no short list of countries
        that are "switched on", and no country is "planned".

        **What the public is shown.** A country list on a public page (a search filter, a
        footer, a home page) should show only the countries that have listings:
        `?has_listings=true` returns the countries with at least one **published, unexpired**
        listing, ordered by `listing_count` (highest first), then name. Use the unfiltered list
        (with `?q=` for a searchable drop-down) only where a person chooses the country of
        something they are creating.

        A country's `code` is the `country` filter of listings and directories and the `market`
        filter of the reference data; its `currency_code` is the currency of price filters when
        that country is selected; its `timezone` is the zone appointment times are shown in.
        Countries with several time zones (the United States, Canada, Russia, Australia,
        Brazil, ...) have **one** default zone here; a per-city time zone is not built.

        Regions, cities and suburbs are reference data per country
        (`GET /v1/reference/cities?market=GB`) and **most countries have none yet**: there, a
        city is written as free text (see the `Place` schema).

        Order without `has_listings`: Zimbabwe, the United Kingdom, then every other country by
        name (accents ignored). `GET /v1/markets` is the older name of this endpoint and
        returns exactly the same response.

        Cacheable like the reference data: `Cache-Control: public, max-age=60,
        stale-while-revalidate=300`, a strong `ETag`, `304` on `If-None-Match`. Counts can
        therefore lag a newly published listing by up to a minute.
      parameters:
        - name: has_listings
          in: query
          description: "`true`: only countries with at least one published, unexpired listing, ordered by listing count (highest first), then name. `false` is accepted and filters nothing."
          schema: { type: boolean }
        - name: q
          in: query
          description: "Keeps countries whose name contains the text, or whose code equals it. Case and diacritics are ignored (`reunion` finds `Réunion`, `king` finds `United Kingdom`, `gb` finds `GB`). At most 100 characters."
          schema: { type: string, maxLength: 100 }
          example: king
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The countries.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              description: "`public, max-age=60, stale-while-revalidate=300`."
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Market"
              example:
                data:
                  - id: 0195c0de-0000-7000-8000-00000000a001
                    code: ZW
                    name: Zimbabwe
                    currency_code: USD
                    timezone: Africa/Harare
                    status: ACTIVE
                    listing_count: 20
                    has_listings: true
                  - id: 0195c0de-0000-7000-8000-00000000a005
                    code: GB
                    name: United Kingdom
                    currency_code: GBP
                    timezone: Europe/London
                    status: ACTIVE
                    listing_count: 3
                    has_listings: true
                  - id: 0195c0de-0000-7000-8000-0000c0de4d55
                    code: MU
                    name: Mauritius
                    currency_code: MUR
                    timezone: Indian/Mauritius
                    status: ACTIVE
                    listing_count: 1
                    has_listings: true
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: "`VALIDATION_FAILED`. `error.fields` is keyed by the parameter: `has_listings` (not `true` or `false`) or `q` (longer than 100 characters)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/markets:
    get:
      tags: [markets]
      operationId: listMarkets
      summary: List countries (older name of GET /v1/countries)
      description: |
        **Kept for compatibility.** Exactly the same parameters, response, caching and errors
        as `GET /v1/countries`; new clients should call that.

        **Changed in 0.15.0 — read this if you already call it.** It used to return five
        markets, two `ACTIVE` and three `PLANNED`. It now returns **every country (249)**, all
        with `status: ACTIVE`, and each item gained `listing_count` and `has_listings`. A
        client that printed this list as "where we operate" must switch to
        `?has_listings=true`. The response is now cacheable (it was not).
      parameters:
        - name: has_listings
          in: query
          description: See `GET /v1/countries`.
          schema: { type: boolean }
        - name: q
          in: query
          description: See `GET /v1/countries`.
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The countries, as `GET /v1/countries`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Market"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: "`VALIDATION_FAILED` on `has_listings` or `q`, as `GET /v1/countries`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/reference:
    get:
      tags: [reference]
      operationId: getReferenceData
      summary: All reference data (every drop-down, filter and list)
      description: |
        Returns the **active** rows of every reference set in one response. These are the
        values behind every drop-down, filter and list in the clients; nothing of the kind
        should be hard-coded.

        The rows live in the database and can be changed by a market administrator without a
        release. The API validates input against the same rows, so what this endpoint offers
        and what the API accepts cannot disagree: a row that is deactivated disappears from
        here and is refused (`400 VALIDATION_FAILED`) at the same moment.

        | Set | Used for | Extra attributes |
        | --- | --- | --- |
        | `deal_types` | listing deal (`sale`, `rent`) | — |
        | `property_categories` | `residential`, `commercial`, `land` | — |
        | `property_types` | house, apartment, office, stand, … | `parent_code` = its category |
        | `request_types` | `request_type` of a property request | — |
        | `contact_methods` | `preferred_contact_method` | — |
        | `account_roles` | `roles` at registration | `group`, `requires_verification` |
        | `directory_kinds` | directory sections and `recipient.kind` | `singular_label`, `description` |
        | `service_trades` | service-provider trades | — |
        | `regions` | regions (provinces, states, nations) of a market; Zimbabwe has its ten provinces, the United Kingdom its four nations, most other countries none yet | `market_code` |
        | `cities` | cities of a market | `market_code`, `parent_code` = its region |
        | `suburbs` | suburbs of a city | `market_code`, `parent_code` = its city |
        | `listing_features` | listing features and amenities | — |
        | `onboarding_documents` | document types for professional onboarding (`description` is set) | — |
        | `organisation_kinds` | organisation kinds and their labels (AGENCY "Real Estate Agency", LAW_FIRM "Law Firm", ...) | — |
        | `price_periods` | what a listing's price is charged per: `month` "per month", `night` "per night" (a listing's `price_period`; null there means a sale price) | — |

        `property_categories` has `residential`, `commercial`, `land` and `short-stay` ("Short
        stays", with a `description`); the short-stay `property_types` are `holiday-home`,
        `serviced-apartment`, `guest-house`, `private-room` and `lodge`. `regions`, `cities` and
        `suburbs` exist for Zimbabwe (`market_code` `ZW`) and the United Kingdom (`GB`: regions
        `england`, `scotland`, `wales`, `northern-ireland`; ten cities; a few areas of London and
        one of Manchester).

        Countries are not a set: use `GET /v1/countries`. Platform administrator roles are never in
        `account_roles` and can never be chosen at registration, whatever this endpoint returns.

        **Order.** Each set is ordered by `sort_order`, then `label` (account roles by their
        group's `sort_order` first). Render in the order given.

        **Caching.** The response is public and identical for every caller (it never depends on
        a session). It carries `Cache-Control: public, max-age=60, stale-while-revalidate=300`
        and a strong `ETag`; send it back in `If-None-Match` to get `304 Not Modified`.
      parameters:
        - $ref: "#/components/parameters/ReferenceMarket"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Every set, keyed by set code. Every set is always present (possibly empty).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceData"
              example:
                market: null
                sets:
                  deal_types:
                    - { code: sale, label: For sale, singular_label: null, description: null, sort_order: 10, market_code: null, parent_code: null, group: null, requires_verification: null }
                    - { code: rent, label: To rent, singular_label: null, description: null, sort_order: 20, market_code: null, parent_code: null, group: null, requires_verification: null }
                  property_categories: []
                  property_types:
                    - { code: house, label: House, singular_label: null, description: null, sort_order: 10, market_code: null, parent_code: residential, group: null, requires_verification: null }
                  request_types: []
                  contact_methods: []
                  account_roles:
                    - code: PRIVATE_SELLER
                      label: Property Seller (Vendor)
                      singular_label: null
                      description: null
                      sort_order: 30
                      market_code: null
                      parent_code: null
                      group: { code: listing, label: Listing or managing property, sort_order: 2 }
                      requires_verification: true
                  directory_kinds:
                    - { code: agencies, label: Estate agencies, singular_label: Estate agency, description: Registered agencies selling and letting property across Zimbabwe., sort_order: 10, market_code: null, parent_code: null, group: null, requires_verification: null }
                  service_trades: []
                  regions:
                    - { code: matabeleland-north, label: Matabeleland North, singular_label: null, description: null, sort_order: 80, market_code: ZW, parent_code: null, group: null, requires_verification: null }
                  cities:
                    - { code: harare, label: Harare, singular_label: null, description: null, sort_order: 10, market_code: ZW, parent_code: harare, group: null, requires_verification: null }
                  suburbs:
                    - { code: borrowdale, label: Borrowdale, singular_label: null, description: null, sort_order: 10, market_code: ZW, parent_code: harare, group: null, requires_verification: null }
                  listing_features: []
                  onboarding_documents: []
                  organisation_kinds: []
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: "`VALIDATION_FAILED` with field `market`: the market code is not a known market."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/reference/{set}:
    get:
      tags: [reference]
      operationId: getReferenceSet
      summary: One reference set
      description: |
        The active rows of one set, in display order. Same rows, order, caching and validation
        rules as `GET /v1/reference`.
      parameters:
        - name: set
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ReferenceSetCode"
        - $ref: "#/components/parameters/ReferenceMarket"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The rows of the set (possibly an empty array).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceSet"
              example:
                set: contact_methods
                market: null
                items:
                  - { code: EMAIL, label: Email, singular_label: null, description: null, sort_order: 10, market_code: null, parent_code: null, group: null, requires_verification: null }
                  - { code: PHONE, label: Phone call, singular_label: null, description: null, sort_order: 20, market_code: null, parent_code: null, group: null, requires_verification: null }
                  - { code: WHATSAPP, label: WhatsApp, singular_label: null, description: null, sort_order: 30, market_code: null, parent_code: null, group: null, requires_verification: null }
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: "`VALIDATION_FAILED` with field `market`: the market code is not a known market."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No set has this code (`REFERENCE_SET_NOT_FOUND`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/listings:
    get:
      tags: [listings]
      operationId: searchListings
      summary: Search listings
      description: |
        Public search over listings. **Only listings that are PUBLISHED, not yet expired and
        advertised by a verified advertiser are ever returned** (status, `expires_at > now` and
        the advertiser's verification are enforced in the query, and every search hit is
        re-read from the database before it is returned, so a search index that is behind
        cannot bring back a listing whose advertiser is no longer verified).

        Every filter is optional and filters combine with AND. Code filters take codes from the
        reference data; a code that is unknown or inactive is `400 VALIDATION_FAILED` on that
        parameter.

        **Location.** Listings can be narrowed at four levels, which form one hierarchy in the
        reference data: `country` (any country: `GET /v1/countries`) > `region` (the `regions` set,
        for example Zimbabwe's provinces) > `city` (`cities`; `parent_code` is its region) >
        `suburb` (`suburbs`; `parent_code` is its city). A listing stores its market, city and
        suburb; its region is the region of its city. The levels combine, and they must agree:
        a suburb must belong to the city, a city to the region, a region to the country (also
        when a level in between is left out). A mismatch is `400 VALIDATION_FAILED` on the
        **narrower** parameter (`region=bulawayo&city=harare` -> field `city`).

        **Any country, and free-text places.** `country` accepts the code of any enabled
        country. One that has no listings is a valid search: `200`, no items, and a price facet
        in that country's currency. An unknown code is `400` on `country`. Most countries have
        no regions, cities or suburbs in the reference data yet; a listing there carries its
        city (and optionally its region) as **free text**: `city: {code: null, label: "Grand
        Baie"}`. Free-text places are matched by `q` and returned on the item, but they are
        **not filterable** (`city=`, `region=` and `suburb=` take reference codes only) and do
        not appear in the `city`, `suburb` or `region` facets or in suggestions. The hierarchy
        check applies only to codes.

        **Price and currency: one currency per search (changed in 0.15.0).** Prices are never
        converted, so a price range only means something within one currency. The currency
        of a search is, in this order: `currency` when given; the currency of the selected
        `country`; otherwise the **only** currency the results are priced in.

        When no `currency` or `country` is given and the results span **more than one**
        currency there is no currency to use:
        - `facets.price` is `null`, and `facets.currencies` lists the currencies of the
          results (`[{code, count}]`, most listings first) so the client can ask the user to
          pick one;
        - `min_price` / `max_price` are refused: `400 VALIDATION_FAILED`, field `currency`,
          message "Choose a currency or a country to filter by price.".

        When the results share one currency, or `currency` or `country` is given, the price
        filter and facet work as before. **This replaces the old behaviour**, where a search
        without a country silently used `USD`: a price filter then dropped every listing
        priced in another currency without saying so. `facets.currencies` is always present.
        When nothing matches, `facets.price` is `{currency: "USD", min: null, max: null}` unless
        a currency or country was chosen.

        **Sorting.** `newest` (default without `q`), `relevance` (default with `q`; title matches
        rank above suburb/city, then property type, then the rest; without `q` featured listings
        come first), `price_asc`, `price_desc`, `oldest`, `area_desc` (largest floor area first;
        listings without a floor area last). Ties are broken by newest, then id.

        **Paging.** `page` starts at 1; `page_size` is 1–48, default 12. A page past the end is
        `200` with an empty `items` array.

        **Facets.** Each facet counts the listings that match every *other* filter (and `q`),
        so selecting a value does not hide its alternatives (`bedrooms` leaves out both
        `bedrooms_min` and `bedrooms_max`). `features` counts within the full result. `country`
        and `region` are facets too, and each `suburb` value names its `city`. Only values with at least one listing appear:
        the `country` facet lists the countries that have results, never all 249.

        **Sitemaps** should use `GET /v1/sitemap`, not this endpoint.

        **Search engine.** The server answers this endpoint from Elasticsearch when it is
        configured and from the database otherwise; if Elasticsearch fails, the same request is
        answered from the database. The request and response are identical either way. What can
        differ is which listings match a free-text `q` and in what order under `relevance`:
        Elasticsearch tolerates typos (`borowdale` finds Borrowdale) and ranks by its own score,
        the database matches substrings exactly. Filters, facets, paging and the other sort
        orders mean the same thing in both.

        Public, the same for every caller, and cacheable (`Cache-Control`, `ETag`, `304`).
      parameters:
        - name: q
          in: query
          description: |
            Free text, at most 100 characters. Every word must match the title, suburb, city,
            property type, summary, description or reference, or the label or description of the
            listing's category (case-insensitive). The category description is what makes
            `q=airbnb` find the short stays: no category, type or code is named after that brand.
          schema: { type: string, maxLength: 100 }
          example: borrowdale house
        - name: deal
          in: query
          description: A `deal_types` code.
          schema: { type: string }
          example: sale
        - name: category
          in: query
          description: |
            A `property_categories` code: `residential`, `commercial`, `land` or `short-stay`
            (holiday homes, serviced apartments, guest houses and rooms let by the night). A
            short stay is always deal `rent` with `price_period` `night`.
          schema: { type: string }
          example: residential
        - name: check_in
          in: query
          description: |
            First night of a stay (`YYYY-MM-DD`). **With `check_out`** (both or neither). The
            results are then limited to short stays that are available for **every** night of
            the stay (`check_in` .. `check_out - 1`) and whose `min_nights` the stay satisfies;
            combine with `guests_min` for the number of guests. They imply
            `category=short-stay`; any other `category` is `400` on `category`.

            The stay must be 1 to 90 nights, must not start in the past and must end inside
            the booking window (365 days from today). "Today" is each listing's own (its
            country's time zone), so a stay starting today is no longer offered in countries
            where that day has already ended.

            Which listings are not free is read from the database on every search and passed
            to the search engine as an exclusion, so the answer is the same whichever engine
            answers and a calendar change needs no reindex. **Every facet count is computed
            with the exclusion applied**; as always, the `category` facet leaves out its own
            filter, so it still lists the other categories.
          schema: { type: string, format: date }
          example: "2026-12-24"
        - name: check_out
          in: query
          description: "The day of leaving (`YYYY-MM-DD`): after `check_in`, at most 90 nights later. See `check_in`."
          schema: { type: string, format: date }
          example: "2026-12-27"
        - name: guests_min
          in: query
          description: Short stays that sleep at least this many guests (`max_guests` >= n). Listings without `max_guests` (everything that is not a short stay) never match.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: property_type
          in: query
          description: A `property_types` code.
          schema: { type: string }
          example: house
        - name: city
          in: query
          description: A `cities` code.
          schema: { type: string }
          example: harare
        - name: suburb
          in: query
          description: A `suburbs` code. Must belong to `city`, `region` and `country` when those are given.
          schema: { type: string }
          example: borrowdale
        - name: country
          in: query
          description: "The code of any enabled country (`GET /v1/countries`; ISO 3166-1 alpha-2), in any case. Also sets the `currency` of the search unless `currency` is given. A country without listings is valid: `200`, no items, price facet in that country's currency. Unknown code: `400` on `country`."
          schema: { type: string, pattern: "^[A-Za-z]{2}$" }
          example: ZW
        - name: market
          in: query
          description: Alias of `country`. If both are sent they must be equal (`400` on `market` otherwise).
          schema: { type: string, pattern: "^[A-Za-z]{2}$" }
        - name: region
          in: query
          description: A `regions` code (`GET /v1/reference/regions`). Matches listings whose city is in that region. Must belong to `country` when given.
          schema: { type: string }
          example: matabeleland-north
        - name: bedrooms_max
          in: query
          description: At most this many bedrooms (0–50). Must not be lower than `bedrooms_min`. Listings without a bedroom count never match.
          schema: { type: integer, minimum: 0, maximum: 50 }
        - name: bathrooms_max
          in: query
          description: At most this many bathrooms (0–50). Must not be lower than `bathrooms_min`.
          schema: { type: integer, minimum: 0, maximum: 50 }
        - name: floor_area_min
          in: query
          description: Floor area of at least this many square metres. Listings without a floor area never match a floor-area filter.
          schema: { type: integer, minimum: 0, maximum: 100000000 }
        - name: floor_area_max
          in: query
          description: Floor area of at most this many square metres. Must not be lower than `floor_area_min`.
          schema: { type: integer, minimum: 0, maximum: 100000000 }
        - name: land_area_min
          in: query
          description: Land area of at least this many square metres. Listings without a land area never match a land-area filter.
          schema: { type: integer, minimum: 0, maximum: 100000000 }
        - name: land_area_max
          in: query
          description: Land area of at most this many square metres. Must not be lower than `land_area_min`.
          schema: { type: integer, minimum: 0, maximum: 100000000 }
        - name: listed_within_days
          in: query
          description: Only listings published in the last N days (`published_at` not older than N x 24 hours).
          schema: { type: integer, minimum: 1, maximum: 365 }
        - name: advertiser_type
          in: query
          description: "`agency`: advertised by an organisation (`advertiser.type` `agency`). `private`: advertised by its owner (`advertiser.type` `private_seller`)."
          schema: { type: string, enum: [agency, private] }
        - name: reference
          in: query
          description: An exact listing reference, compared without regard to case. Letters, digits and hyphens, at most 40.
          schema: { type: string, pattern: "^[A-Za-z0-9-]{1,40}$" }
          example: RP-ZW-10001
        - name: has_photos
          in: query
          description: "`true`: only listings with at least one photo. `false` is accepted and filters nothing."
          schema: { type: boolean }
        - name: min_price
          in: query
          description: "Lowest price, as a decimal amount. With a price filter only listings priced in the search's one currency match. `400` on `currency` when neither `currency` nor `country` is given and the results span more than one currency."
          schema: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
          example: "100000"
        - name: max_price
          in: query
          description: Highest price, as a decimal amount. Must not be lower than `min_price`.
          schema: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
          example: "300000"
        - name: currency
          in: query
          description: "ISO 4217 code for `min_price` / `max_price` and for the price facet. Without it: the currency of the selected `country`, else the only currency the results are priced in. There is no default any more (it used to be `USD`): with results in several currencies and neither `currency` nor `country`, `facets.price` is null and a price filter is `400` on this parameter. Prices are never converted."
          schema: { type: string, pattern: "^[A-Za-z]{3}$" }
        - name: bedrooms_min
          in: query
          description: At least this many bedrooms (0–50). Listings without a bedroom count never match.
          schema: { type: integer, minimum: 0, maximum: 50 }
        - name: bathrooms_min
          in: query
          description: At least this many bathrooms (0–50).
          schema: { type: integer, minimum: 0, maximum: 50 }
        - name: features
          in: query
          description: "`listing_features` codes; the listing must have ALL of them. Repeat the parameter (`features=a&features=b`) or separate with commas. At most 20."
          schema: { type: array, items: { type: string }, maxItems: 20 }
          style: form
          explode: true
          example: [borehole, solar-backup]
        - name: featured
          in: query
          description: "`true` for featured listings only, `false` for the rest."
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, oldest, price_asc, price_desc, area_desc, relevance] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: One page of listings with facets.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CatalogueCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingPage"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: |
            `VALIDATION_FAILED`. `error.fields` is keyed by the parameter: `q`, `deal`,
            `category`, `property_type`, `city`, `suburb`, `min_price`, `max_price`, `currency`,
            `bedrooms_min`, `bathrooms_min`, `features`, `featured`, `sort`, `page`, `page_size`,
            `country`, `market`, `region`, `bedrooms_max`, `bathrooms_max`, `floor_area_min`,
            `floor_area_max`, `land_area_min`, `land_area_max`, `listed_within_days`,
            `advertiser_type`, `reference`, `has_photos`, `guests_min`, `check_in`, `check_out`. A maximum lower than its minimum is
            reported on the `_max` parameter; a location that does not belong to the wider one
            on the narrower parameter (`suburb`, `city` or `region`). `currency` is also where a
            price filter without a single currency is reported: `min_price` or `max_price`
            with neither `currency` nor `country`, when the results span more than one currency
            ("Choose a currency or a country to filter by price.").
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/listings/suggest:
    get:
      tags: [listings]
      operationId: suggestListings
      summary: Search suggestions
      description: |
        Up to 8 suggestions for a search box: suburbs first, then cities, then regions, then
        countries, then listing titles; within each, names that start with the term come first.
        Only suburbs, cities, regions and countries that have at least one public listing, and
        only public listings, are suggested: a `country` suggestion is never one of the 249
        countries without listings. Free-text cities and regions are not suggested (a
        suggestion's `value` is a filter code, and they have none). A term shorter than 2 characters returns an empty
        list.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          example: bor
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The suggestions (possibly empty).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CatalogueCacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                additionalProperties: false
                properties:
                  suggestions:
                    type: array
                    maxItems: 8
                    items:
                      $ref: "#/components/schemas/ListingSuggestion"
              example:
                suggestions:
                  - { type: suburb, label: "Borrowdale, Harare", value: borrowdale }
                  - { type: listing, label: Four-bedroom family home with garden, value: four-bedroom-family-home-borrowdale }
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: "`VALIDATION_FAILED` with field `q` (longer than 100 characters)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/listings/{slug}:
    get:
      tags: [listings]
      operationId: getListing
      summary: One listing
      description: |
        The listing, if it is PUBLISHED, not expired and advertised by a verified advertiser.

        - `410 LISTING_UNAVAILABLE`: the listing was public once and no longer is (expired, sold,
          let, paused or closed). The page can say "This listing is no longer available".
        - `404 LISTING_NOT_FOUND`: no such slug, **or** a listing that has never been public
          (draft, pending review), **or** (new in 0.17.0) a listing whose advertiser is not
          verified right now, whatever its status. Drafts and listings of unverified advertisers
          are deliberately indistinguishable from unknown slugs: `410` would reveal that an
          advertiser lost its verification.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 200 }
          example: four-bedroom-family-home-borrowdale
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The listing.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CatalogueCacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [listing]
                additionalProperties: false
                properties:
                  listing:
                    $ref: "#/components/schemas/Listing"
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          description: "`LISTING_NOT_FOUND`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: "`LISTING_UNAVAILABLE`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/listings/{slug}/availability:
    get:
      tags: [availability]
      operationId: getListingAvailability
      summary: Availability calendar of a short stay (public)
      description: |
        Which nights of a short-stay listing are available. **Available or unavailable per
        night, and nothing else**: why a night is unavailable (blocked by the owner, or
        booked), the lister's notes and who changed the calendar are private and are never in
        this response.

        - Dates are calendar **nights** in the time zone of the listing's country
          (`timezone`), written `YYYY-MM-DD`, with no time of day. A stay from `check_in` to
          `check_out` occupies the nights `check_in` .. `check_out - 1`: the day of leaving is
          not a night of the stay.
        - Every night is available unless the lister marked it otherwise, inside a **booking
          window** from today (in that time zone) to 365 days ahead. Nights in the past or
          beyond the window are never available.
        - **This is not a booking.** Nothing can be reserved, held or paid for through the
          API. To ask to stay, send `POST /v1/property-requests` with `request_type:
          STAY_REQUEST`; the lister answers and marks the nights themselves.

        Public, the same for every caller (it never reads the session) and cacheable like the
        listing (`Cache-Control: public, max-age=30, stale-while-revalidate=120`, an `ETag`),
        so a change by the lister can take up to 30 seconds to show.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          description: "First night to return (`YYYY-MM-DD`). Default: today in the listing's time zone."
          schema: { type: string, format: date }
        - name: to
          in: query
          description: "Last night to return, inclusive. Default: `from` + 90 days. The span `from`..`to` is at most 366 nights."
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The calendar.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicAvailability" }
              example:
                listing: { slug: safari-lodge-victoria-falls }
                timezone: Africa/Harare
                min_nights: 2
                max_guests: 8
                from: "2026-12-23"
                to: "2026-12-25"
                days:
                  - { date: "2026-12-23", available: true }
                  - { date: "2026-12-24", available: false }
                  - { date: "2026-12-25", available: false }
                availability_updated_at: "2026-11-14T08:00:00Z"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: "`VALIDATION_FAILED` on `from` or `to`: not a `YYYY-MM-DD` date, `to` before `from`, or a span of more than 366 nights."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: "`LISTING_NOT_FOUND`: no such slug, or a listing that has never been public (as `GET /v1/listings/{slug}`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`NOT_SHORT_STAY`: the listing is public but is not in the `short-stay` category, so it has no calendar."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "410":
          description: "`LISTING_UNAVAILABLE`: the listing was public once and no longer is."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/listings:
    get:
      tags: [availability]
      operationId: listMyListings
      summary: The listings the caller may manage
      description: |
        The first "my listings" endpoint, and it is **read-only: creating, editing and
        publishing listings is still not built.** It exists so a lister can find the short
        stays whose calendar they manage.

        Returns the listings, **whatever their status**, that the caller may manage (newest
        first):
        - every listing of an organisation in which the caller is `OWNER`, `MANAGER` or
          `AGENT`, when the organisation's kind manages listings (`AGENCY`, `LAW_FIRM`,
          `PROPERTY_MANAGER`, `DEVELOPER`, `HOST`) — all of the organisation's listings, not
          only those assigned to the caller;
        - the caller's own listings as an **approved** (ACTIVE) Landlord or Property Seller.

        `STAFF`, members of a `SERVICE_PROVIDER` and people without either get `403`.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: category
          in: query
          description: "A `property_categories` code, for example `short-stay`."
          schema: { type: string }
        - name: status
          in: query
          description: "A listing status: `PUBLISHED`, `EXPIRED`, `DRAFT`, `PAUSED`, `SOLD`, `LET`, `CLOSED`."
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
      responses:
        "200":
          description: One page of the caller's listings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyListingPage" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN`: the caller manages no listings at all."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/listings/{id}/availability:
    parameters:
      - name: id
        in: path
        required: true
        description: The listing's `id` (not its slug).
        schema: { type: string, format: uuid }
    get:
      tags: [availability]
      operationId: getMyListingAvailability
      summary: The lister's calendar of a short stay
      description: |
        The calendar with the **private** parts: for each night whether it is available and,
        when the lister marked it, the reason (`BLOCKED`: the owner's choice; `BOOKED`: taken)
        and the note; and the stored ranges. A night that is unavailable only because it is in
        the past or beyond the booking window has `available: false` and `reason: null`.

        Who may call it: someone who may manage the listing (see `GET /v1/me/listings`). A
        listing the caller may not manage, and one that does not exist, are both `404`.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: from
          in: query
          description: "First night to return (`YYYY-MM-DD`). Default: today in the listing's time zone."
          schema: { type: string, format: date }
        - name: to
          in: query
          description: "Last night to return, inclusive. Default: `from` + 90 days. At most 366 nights."
          schema: { type: string, format: date }
      responses:
        "200":
          description: The calendar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListerAvailability" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "`LISTING_NOT_FOUND`: no such listing, or one the caller may not manage."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`NOT_SHORT_STAY`: the listing is not in the `short-stay` category."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"
    put:
      tags: [availability]
      operationId: changeMyListingAvailability
      summary: Mark nights available, blocked or booked
      description: |
        Applies 1 to 50 changes **in order and atomically**: either all are applied or none
        is. Each change marks an inclusive run of nights (`from`..`to`, at most 366 nights)
        `AVAILABLE`, `BLOCKED` or `BOOKED`:

        - `BLOCKED` / `BOOKED` replace whatever those nights were, with the optional private
          `note`;
        - `AVAILABLE` re-opens them: a stored range inside them disappears, one that sticks
          out is trimmed, one that contains them is split in two;
        - neighbouring ranges with the same reason and note are merged.

        Nights must not be in the past and must be inside the booking window (today .. 365
        days ahead, in the listing's time zone). Every change is written to an audit trail
        (who, which nights, what, when), which no endpoint returns yet.

        The response is the calendar for the default span (today .. +90 days), in the same
        shape as the GET. Rate limited per IP (bursts of 30, 30 per minute, shared with the
        stay rules). A cookie session needs the web app's `Origin` (CSRF rule).
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvailabilityChanges" }
            example:
              changes:
                - { from: "2026-12-24", to: "2026-12-30", status: BOOKED, note: "The Moyo family" }
                - { from: "2027-01-10", to: "2027-01-11", status: BLOCKED }
                - { from: "2026-12-27", to: "2026-12-27", status: AVAILABLE }
      responses:
        "200":
          description: The calendar after the changes, for today .. +90 days.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListerAvailability" }
        "400":
          description: |
            `VALIDATION_FAILED`. `error.fields` names the change: `changes` (not 1 to 50 items),
            `changes[i].from` (not a date, or in the past), `changes[i].to` (not a date, before
            `from`, more than 366 nights, or beyond the booking window), `changes[i].status`
            (not `AVAILABLE`, `BLOCKED` or `BOOKED`), `changes[i].note` (longer than 200
            characters, not plain text, or sent with `AVAILABLE`). Also malformed JSON or an
            unknown field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: VALIDATION_FAILED
                  message: Some fields need your attention.
                  fields:
                    "changes[1].to": must not be before from
                trace_id: 4b0b8f0e-5d0c-4e0e-9a39-0a5a4f1f6c55
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "404":
          description: "`LISTING_NOT_FOUND`: no such listing, or one the caller may not manage."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`NOT_SHORT_STAY`: the listing is not in the `short-stay` category."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/listings/{id}/stay-rules:
    patch:
      tags: [availability]
      operationId: setMyListingStayRules
      summary: Change a short stay's shortest stay and number of guests
      description: |
        Sets `min_nights` (1–365) and / or `max_guests` (1–50) of a short stay the caller may
        manage; a key that is absent is left unchanged, and at least one must be sent. These
        are the only listing fields that can be edited through the API today.

        Same authorisation, rate limit and CSRF rule as the calendar. With Elasticsearch, the
        search index follows after the worker has processed the listing's update event
        (`guests_min` and the stay search read these values).
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                min_nights: { type: integer, minimum: 1, maximum: 365 }
                max_guests: { type: integer, minimum: 1, maximum: 50 }
            example: { min_nights: 3 }
      responses:
        "200":
          description: The listing's summary after the change.
          content:
            application/json:
              schema:
                type: object
                required: [listing]
                additionalProperties: false
                properties:
                  listing: { $ref: "#/components/schemas/MyListing" }
        "400":
          description: "`VALIDATION_FAILED` on `min_nights` or `max_guests` (out of range, or neither sent), malformed JSON or an unknown field."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "404":
          description: "`LISTING_NOT_FOUND`: no such listing, or one the caller may not manage."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`NOT_SHORT_STAY`: the listing is not in the `short-stay` category."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/directory:
    get:
      tags: [directory]
