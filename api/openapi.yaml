  /v1/agent/property-requests:
    get:
      tags: [organisation-workspace]
      operationId: listOrganisationPropertyRequests
      summary: Property requests received by the caller (organisation member or direct seller)
      description: |
        **Who may call it.** `200` when the signed-in user
        - has at least one organisation membership (any role), **or**
        - is the direct seller of at least one listing, **or**
        - holds the `PRIVATE_SELLER` account role (in any status, including
          `PENDING_VERIFICATION`).

        Otherwise `403 FORBIDDEN`; `401` when not signed in. Any other self-declared account role
        (for example `AGENT` without a membership) does not open this route.

        **What is returned** (decided on the server from the caller's user ID and memberships;
        there are no filter parameters). The union of:
        - for OWNER and MANAGER: every request whose recipient organisation is one of theirs;
        - for AGENT and STAFF: the requests of their organisation that are assigned to them
          personally or to the organisation inbox (no assigned agent) — not those assigned to a
          colleague;
        - for a direct seller: the requests routed to them for their own listings.

        The `PRIVATE_SELLER` account role only opens the route. It never adds data: a user who
        declared it but sells nothing gets an empty `items` array. Requests of other
        organisations and of other sellers are never returned. `status` is the internal status;
        because unroutable requests have no recipient, `ROUTING_EXCEPTION` never appears here.

        Newest first, capped at 100 items. **There is no pagination yet.**
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The requests visible to the caller (possibly an empty array).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/OrganisationPropertyRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/appointments:
    post:
      tags: [appointments]
      operationId: createAppointment
      summary: Ask for an appointment (signed-in customer)
      description: |
        Creates an appointment in status `REQUESTED` for the signed-in customer: a property
        `VIEWING` of a listing, or a `CONSULTATION` with a listing's advertiser (`listing_id`) or
        with a directory profile (`recipient`, for example a solicitor or an estate agent).
        Send **exactly one** of `listing_id` and `recipient`; a `VIEWING` needs `listing_id`.

        The appointment is routed with the same rules as property requests (the listing's
        assigned agent, else the organisation, else the direct owner) and business enquiries
        (the profile's organisation; for an agent profile the named agent). It is **not
        confirmed** until the professional confirms it.

        The customer's name and email come from the account. `phone` is required when
        `preferred_contact_method` is `PHONE` or `WHATSAPP`. These contact details are returned
        only to the professional, by `/v1/inbox/appointments`.

        Idempotent exactly like property requests: `idempotency_key` in the body or the
        `Idempotency-Key` header (the body wins); the same key with the same content answers
        `200` with the original appointment, the same key with different content `409
        IDEMPOTENCY_CONFLICT`. The key space is separate from requests and enquiries.

        Own per-IP rate limit: bursts of 10, refilled at 10 per minute.

        The other way an appointment is created is `POST /v1/property-requests` with a
        `preferred_slot_utc` (guests included).
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreate"
            examples:
              viewing:
                value:
                  type: VIEWING
                  listing_id: 0195c0de-0000-7000-8000-000000000001
                  start_utc: "2026-11-17T08:00:00Z"
                  note: I would like to see the garden as well.
                  preferred_contact_method: EMAIL
                  idempotency_key: 6f1c2f0a-8f0e-4f43-9a55-2f6f3f1f9c11
                  consent: { privacy_version: "2026-01", accepted: true }
              consultation:
                value:
                  type: CONSULTATION
                  recipient: { kind: solicitors, slug: sample-law-chambers }
                  start_utc: "2026-11-18T12:00:00Z"
                  duration_minutes: 60
                  preferred_contact_method: PHONE
                  phone: "+263771234567"
                  idempotency_key: 0b0f5d0e-3a53-4f1e-9a0e-7b1f0f3f2a10
                  consent: { privacy_version: "2026-01", accepted: true }
      responses:
        "201":
          description: Created and committed, in status `REQUESTED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAppointmentEnvelope"
        "200":
          description: Idempotent replay; the original appointment (in its current state).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAppointmentEnvelope"
        "400":
          description: |
            `VALIDATION_FAILED` or `INVALID_JSON`. Fields: `type`, `listing_id` (missing, not a
            UUID, neither target given, or a VIEWING without a listing), `recipient` (both targets
            given), `recipient.kind`, `recipient.slug`, `start_utc` (not RFC 3339, not in the
            future, or more than 12 months ahead), `duration_minutes` (15 to 240), `note`,
            `preferred_contact_method`, `phone`, `idempotency_key`, `consent`,
            `consent.privacy_version`, `consent.accepted`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "404":
          description: "`LISTING_NOT_FOUND` (also, since 0.17.0, for a listing whose advertiser is not verified right now) or `RECIPIENT_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`: the key was already used for different content."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: |
            `LISTING_UNAVAILABLE` (not published, expired, or nobody can receive appointments for
            it) or `RECIPIENT_UNAVAILABLE` (the profile is suspended, unverified, or has nobody to
            receive appointments).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/appointments:
    get:
      tags: [appointments]
      operationId: listMyAppointments
      summary: The signed-in customer's own appointments
      description: |
        Only appointments whose customer is the caller. `upcoming` (the default) is every
        appointment that is still open (`REQUESTED`, `CONFIRMED`, `RESCHEDULE_REQUESTED`) and
        has not ended, **soonest first**; `past` is everything else (ended, completed, no-show,
        cancelled), **newest first**; `all` is both, newest first. List items carry no
        `timeline`; read one appointment for it.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: when
          in: query
          schema:
            type: string
            enum: [upcoming, past, all]
            default: upcoming
        - $ref: "#/components/parameters/AppointmentStatusFilter"
        - $ref: "#/components/parameters/AppointmentPage"
        - $ref: "#/components/parameters/AppointmentPageSize"
      responses:
