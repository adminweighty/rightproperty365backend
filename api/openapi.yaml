        `sha256`), `SENT`, `SIGNED`, `DECLINED`, `CANCELLED`, `EXPIRED`.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The audit trail.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
