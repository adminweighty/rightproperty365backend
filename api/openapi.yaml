  /v1/directory/{kind}:
    get:
      tags: [directory]
      operationId: listDirectoryProfiles
      summary: Profiles in one directory
      x-visibility-rule: Only profiles that are published and verified are ever returned by the directory endpoints and the sitemap.
      description: |
        Public profiles of one kind: sponsored profiles first, then by name. Only ACTIVE
        profiles are returned. **No phone number, email address or street address is ever
        returned**; a profile is contacted with `POST /v1/business-enquiries`.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DirectoryKind"
        - name: q
          in: query
          description: Free text, at most 100 characters. Every word must match the name, role, tagline, description, services or areas.
          schema: { type: string, maxLength: 100 }
        - name: city
          in: query
          description: A `cities` code.
          schema: { type: string }
          example: harare
        - name: country
          in: query
          description: "The code of any enabled country (`GET /v1/countries`), in any case (`market` is an alias). Keeps the profiles of that country — the profile's own country, whether its city is a reference city or free text. A country without profiles is valid and returns nothing. `400` on `country` when unknown."
          schema: { type: string, pattern: "^[A-Za-z]{2}$" }
          example: ZW
        - name: market
          in: query
          description: Alias of `country`. If both are sent they must be equal (`400` on `market` otherwise).
          schema: { type: string, pattern: "^[A-Za-z]{2}$" }
        - name: region
          in: query
          description: |
            A `regions` code. Keeps profiles whose city is in that region. `400` on `region` when
            unknown or not a region of `country`; `400` on `city` when `city` is not in the
            region or country asked for.
          schema: { type: string }
          example: harare
        - name: trade
          in: query
          description: A `service_trades` code. Only service providers have a trade; for other kinds it matches nothing.
          schema: { type: string }
          example: plumbing
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: One page of profiles.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CatalogueCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryPage"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: "`VALIDATION_FAILED` with fields `q`, `city`, `trade`, `page` or `page_size`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: "`DIRECTORY_KIND_NOT_FOUND`: no active directory kind has this code."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/directory/{kind}/{slug}:
    get:
