          description: Default `SUBMITTED`.
        - name: role
          in: query
          schema: { type: string }
          description: An onboarding role code.
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          description: Matches the applicant's name or email, or the business name (case-insensitive substring).
        - name: page
          in: query
