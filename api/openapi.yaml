      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                signature:
                  $ref: "#/components/schemas/AdoptedSignatureInput"
                initials:
                  $ref: "#/components/schemas/AdoptedSignatureInput"
                stamp:
                  oneOf:
                    - $ref: "#/components/schemas/Stamp"
