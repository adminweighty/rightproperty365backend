              example:
                listings:
                  - { slug: four-bedroom-house-highlands, updated_at: "2026-11-12T00:00:00Z" }
                profiles:
                  - { kind: agencies, slug: sample-estates, updated_at: "2026-11-14T00:00:00Z" }
        "304":
          $ref: "#/components/responses/NotModified"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/property-requests:
    post:
      tags: [property-requests]
      operationId: createPropertyRequest
      summary: Submit a property request (enquiry)
      description: |
        The single entry point for every customer enquiry about a listing.

        The request, its timeline entry, the customer activity record and the notification
        outbox event are committed in one database transaction; `201` is returned only after
        that commit. The response status is always `RECEIVED` — acceptance does not mean the
        recipient has been notified.

        **Idempotency.** An idempotency key is required, either as `idempotency_key` in the
        body or in the `Idempotency-Key` header (the body wins when both are present).
        Repeating a key with identical content returns `200` with the original response.
        Repeating a key with different content returns `409`. Content is compared after
        normalisation (trimmed strings, lower-cased email, slot converted to UTC).

        **Rate limit.** Per client IP: bursts of 10 requests, refilled at 10 per minute.

        **Guests and signed-in customers.** Authentication is optional. For a guest,
        `guest_contact` (name and email) is required. For a signed-in customer `guest_contact`
        may be omitted: name and email are taken from the account (any name/email sent in
        `guest_contact` is ignored), the customer's user ID is stored on the request, and only
        `guest_contact.phone` is read. In both cases the phone is required when the preferred
        contact method is PHONE or WHATSAPP (reported as field `guest_contact.phone`) and
        `consent` is required. The same idempotency key used by a different customer is a `409`.
      security:
        - {}
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Alternative to `idempotency_key` in the body. Required if the body omits it.
          schema:
            $ref: "#/components/schemas/IdempotencyKey"
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyRequestCreate"
            example:
              listing_id: 0195c0de-0000-7000-8000-000000000001
              request_type: VIEWING_REQUEST
              message: I would like to view this property next week.
              preferred_contact_method: WHATSAPP
              preferred_slot_utc: "2027-01-15T08:00:00Z"
              idempotency_key: 6f1c2f0a-8f0e-4f43-9a55-2f6f3f1f9c11
              guest_contact:
                name: Tariro Moyo
                email: tariro@example.com
                phone: "+263771234567"
              consent:
                privacy_version: "2026-01"
                accepted: true
      responses:
        "201":
          description: The request was stored.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyRequestReceipt"
        "200":
          description: Idempotent replay. The key was already used with identical content; the original receipt is returned.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyRequestReceipt"
        "400":
          description: |
            `VALIDATION_FAILED` (with per-field messages in `error.fields`) or `INVALID_JSON`
            (malformed JSON, wrong types, unknown fields).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: VALIDATION_FAILED
                  message: Some fields need your attention.
                  fields:
                    message: must be plain text without HTML
                    consent.accepted: must be true
                trace_id: 4b0b8f0e-5d0c-4e0e-9a39-0a5a4f1f6c55
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "404":
          description: The listing does not exist (`LISTING_NOT_FOUND`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The idempotency key was already used with different content (`IDEMPOTENCY_CONFLICT`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: The listing is not published or has expired (`LISTING_UNAVAILABLE`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: The body exceeds 64 KB (`PAYLOAD_TOO_LARGE`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: The Content-Type is not `application/json` (`UNSUPPORTED_MEDIA_TYPE`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many requests from this IP (`RATE_LIMITED`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/business-enquiries:
    post:
      tags: [business-enquiries]
      operationId: createBusinessEnquiry
      summary: Send an enquiry to a directory profile
      description: |
        The **only** way to contact a directory profile (an agency, agent, developer, property
        manager, host or service provider). Profiles never expose a phone number or an email
        address.

        The enquiry, its timeline entry, the customer activity record and the outbox event
        `BUSINESS_ENQUIRY_CREATED` (identifiers only, no personal data) are committed in one
        database transaction; `201` is returned only after that commit. The response status is
        always `RECEIVED` — acceptance does not mean the recipient has been notified.

        **Recipient.** `recipient.kind` + `recipient.slug` are the profile's public address, for
        example `service-providers` / `sample-plumbers`.

        **Routing.** The enquiry goes to the inbox of the organisation that owns the profile.
        For kind `agents` it goes to the named agent, and their agency's OWNER and MANAGER see
        it too. If nobody can receive it the enquiry is still stored and the customer still gets
        `201 RECEIVED`; internally it is a `ROUTING_EXCEPTION` for operations to resolve.

        **Idempotency.** As for property requests: a key is required, as `idempotency_key` in
        the body or the `Idempotency-Key` header (the body wins). Same key and same content →
        `200` with the original receipt; same key and different content → `409`. The key space
        is separate from property requests.

        **Guests and signed-in customers.** For a guest, `guest_contact.name` and
        `guest_contact.email` are required. For a signed-in customer `guest_contact` may be
        omitted: name and email come from the account (anything sent for them is ignored), the
        user ID is stored on the enquiry and only `guest_contact.phone` is read. The phone is
        required when the preferred contact method is PHONE or WHATSAPP. `consent` is always
        required.

        **Rate limit.** Its own per-IP bucket: bursts of 10 requests, refilled at 10 per minute.
      security:
        - {}
        - cookieSession: []
        - bearerToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Alternative to `idempotency_key` in the body. Required if the body omits it.
          schema:
            $ref: "#/components/schemas/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessEnquiryCreate"
            example:
              recipient:
                kind: service-providers
                slug: sample-plumbers
              service: Burst pipes and leaks
              message: The geyser is leaking. Can someone come this week?
              preferred_contact_method: WHATSAPP
              idempotency_key: 6f1c2f0a-8f0e-4f43-9a55-2f6f3f1f9c11
              guest_contact:
                name: Tariro Moyo
                email: tariro@example.com
                phone: "+263771234567"
              consent:
                privacy_version: "2026-01"
                accepted: true
      responses:
        "201":
          description: The enquiry was stored.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessEnquiryReceipt"
        "200":
          description: Idempotent replay. The key was already used with identical content; the original receipt is returned.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessEnquiryReceipt"
        "400":
          description: |
            `VALIDATION_FAILED` with `error.fields` keyed by `recipient.kind`, `recipient.slug`,
            `service`, `message`, `preferred_contact_method`, `guest_contact.name`,
            `guest_contact.email`, `guest_contact.phone`, `consent.accepted`,
            `consent.privacy_version` or `idempotency_key`; or `INVALID_JSON` (malformed JSON,
            wrong types, unknown fields).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: VALIDATION_FAILED
                  message: Some fields need your attention.
                  fields:
                    message: must be plain text without HTML
                    guest_contact.phone: is required when the preferred contact method is PHONE or WHATSAPP
                trace_id: 4b0b8f0e-5d0c-4e0e-9a39-0a5a4f1f6c55
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "404":
          description: No profile has this kind and slug (`RECIPIENT_NOT_FOUND`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The idempotency key was already used with different content (`IDEMPOTENCY_CONFLICT`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: The profile exists but is not accepting enquiries, because it is suspended or not yet verified (`RECIPIENT_UNAVAILABLE`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/inbox/business-enquiries:
    get:
      tags: [business-enquiries]
      operationId: listReceivedBusinessEnquiries
      summary: Business enquiries received by the caller's organisation(s)
      description: |
        Requires at least one organisation membership (any role): `403 FORBIDDEN` otherwise,
        `401` when not signed in. Self-declared account roles do not open this route.

        **What is returned** (decided on the server from the caller's memberships; there are no
        filter parameters):
        - OWNER and MANAGER see every enquiry routed to their organisation, including those
          addressed to the profiles of the organisation's agents.
        - AGENT and STAFF see only the enquiries addressed to their own agent profile.

        Another organisation's enquiries are never returned. `status` is the internal status;
        because unroutable enquiries have no recipient, `ROUTING_EXCEPTION` never appears here.

        **This is the only place the customer's contact details are returned.**

        Newest first, capped at 100 items. **There is no pagination yet.**
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The enquiries visible to the caller (possibly an empty array).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/ReceivedBusinessEnquiry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account
      description: |
        Creates an unverified account and sends a verification email. **Does not sign in.**

        Enumeration-safe: for valid input the answer is always `202 VERIFICATION_SENT`, whether
        or not the email already has an account.
        - New email: the account is created and a verification link is sent.
        - Existing unverified account: its name, password and role selection are replaced by this
          registration, earlier verification links stop working and a new link is sent.
        - Existing verified account: nothing changes; the owner is told by email that they
          already have an account.

        The verification link is `{PUBLIC_WEB_URL}/verify-email?token=...` and is valid for 24 hours.

        **Account roles.** `roles` is required: 1 to 11 codes from the active rows of the
        `account_roles` reference set (`GET /v1/reference/account_roles`), enforced on the server.
        A role that has been deactivated there is refused like an unknown one. A missing or empty array, a platform
        administrator role (`SUPER_ADMIN`, `PLATFORM_ADMIN`, `MARKET_ADMIN`, `FINANCE_ADMIN`,
        `CONTENT_ADMIN`, `MODERATOR`, `SUPPORT`), any other unknown value, a non-string entry or a
        **duplicate** is rejected with `400 VALIDATION_FAILED` and a plain-language message in
        `error.fields.roles`. `CONSUMER` and `TENANT` become `ACTIVE`; every other role is recorded
        as `PENDING_VERIFICATION` (decided by the row's `requires_verification`). Platform roles
        are refused by a fixed deny-list before the reference data is consulted, so they cannot
        be chosen even if such a row existed.

        Selecting a professional role only records a request. It does **not** create an
        organisation or a membership and grants no access to any organisation's data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              name: Rudo Ncube
              email: rudo@example.com
              password: correct-horse-battery
              consent:
                privacy_version: "2026-01"
                accepted: true
              marketing_opt_in: false
              roles: [CONSUMER, LANDLORD, AGENT]
      responses:
        "202":
          $ref: "#/components/responses/VerificationSent"
        "400":
          description: |
            `VALIDATION_FAILED` with `error.fields` keyed by `name`, `email`, `password`,
            `consent.accepted`, `consent.privacy_version` or `roles`; or `INVALID_JSON`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: VALIDATION_FAILED
                  message: Some fields need your attention.
                  fields:
                    password: must be at least 10 characters
                    consent.accepted: must be true
                    roles: That role cannot be chosen at sign-up.
                trace_id: 4b0b8f0e-5d0c-4e0e-9a39-0a5a4f1f6c55
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Verify an email address and sign in
      description: |
        Consumes the single-use token from the verification email (valid for 24 hours), marks the
        email verified and starts a session. By default the session is delivered in the
        `rp_session` cookie; `"token_delivery": "bearer"` returns `access_token` instead.

        Exception: if the account holds a platform role, the email is verified but **no session
        is started** — the response is `200` with `user` only (no `session`, no cookie, no
        `access_token`). Administrators sign in only at `POST /v1/admin/auth/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                token_delivery:
                  $ref: "#/components/schemas/TokenDelivery"
      responses:
        "200":
          $ref: "#/components/responses/Authenticated"
        "400":
          description: |
            `INVALID_TOKEN` (unknown, expired or already used), `VALIDATION_FAILED` (missing
            `token`, bad `token_delivery`) or `INVALID_JSON`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Send the verification email again
      description: |
        Always `202` for a well-formed email. A new link is sent only when the address belongs to
        an account that is not verified yet; otherwise nothing happens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          $ref: "#/components/responses/VerificationSent"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in
      description: |
        `token_delivery` selects how the session token is returned:
        - `cookie` (default): sets the HttpOnly `rp_session` cookie; no token in the body.
        - `bearer`: returns `access_token` in the body and sets **no** cookie.

        An unknown email and a wrong password are indistinguishable (`401 INVALID_CREDENTIALS`,
        same body, comparable timing). `403 EMAIL_NOT_VERIFIED` is returned only when the
        password is correct.

        **Platform administrators cannot sign in here.** An account holding a platform role gets
        the same `401 INVALID_CREDENTIALS` whatever the password; it must use
        `POST /v1/admin/auth/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                token_delivery:
                  $ref: "#/components/schemas/TokenDelivery"
      responses:
        "200":
          $ref: "#/components/responses/Authenticated"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: Unknown email, wrong password, or an account holding a platform role (`INVALID_CREDENTIALS`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: |
            `EMAIL_NOT_VERIFIED` (correct password, email not verified yet), or `CSRF_ORIGIN`
            when a valid session cookie was sent without an allowlisted `Origin`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out
      description: |
        Revokes the current session (cookie or bearer) and clears the cookie. Answers `204` even
        when nobody is signed in. No request body.
      security:
        - {}
        - cookieSession: []
        - bearerToken: []
      responses:
        "204":
          description: Signed out. The `rp_session` cookie is cleared.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              description: Expires the `rp_session` cookie.
              schema:
                type: string
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/password-reset/request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Ask for a password-reset email
      description: |
        Always `202` for a well-formed email, whether or not an account exists. The link is
        `{PUBLIC_WEB_URL}/reset-password?token=...`, single-use and valid for 1 hour.

        No email is sent for an account holding a platform role (still `202`): administrator
        passwords are changed with the `adminctl` command, not by email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: RESET_SENT
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password with a reset token
      description: |
        Sets the new password and revokes **all** of that user's sessions (every device must
        sign in again). The `rp_session` cookie of the calling browser is cleared. Because the
        token was delivered to the mailbox, a successful reset also marks the email verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  $ref: "#/components/schemas/NewPassword"
      responses:
        "204":
          description: Password changed; all sessions revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          description: |
            `INVALID_TOKEN` (unknown, expired or already used), `VALIDATION_FAILED` (field
            `password` or `token`) or `INVALID_JSON`. A rejected password does not consume the token.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me:
    get:
      tags: [account]
      operationId: getMe
      summary: The signed-in user
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The current user with their roles, and the session that authenticated the request.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              example:
                session:
                  scope: customer
                  expires_at: "2026-12-13T21:25:22.210025Z"
                user:
                  id: 0195c0de-0000-7000-8000-00000000d002
                  name: Alex Agent
                  email: agent@example.test
                  email_verified: true
                  platform_roles: []
                  memberships:
                    - organisation_id: 0195c0de-0000-7000-8000-00000000b001
                      organisation_name: Sample Estates
                      organisation_kind: AGENCY
                      market_code: ZW
                      role: AGENT
                  account_roles:
                    - role: CONSUMER
                      status: ACTIVE
                    - role: AGENT
                      status: ACTIVE
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/admin/auth/login:
    post:
      tags: [admin]
      operationId: adminLogin
      summary: Sign in as a platform administrator
      description: |
        Succeeds only for a verified account that holds at least one platform role
        (`SUPER_ADMIN`, `PLATFORM_ADMIN`, `MARKET_ADMIN`, `FINANCE_ADMIN`, `CONTENT_ADMIN`,
        `MODERATOR`, `SUPPORT`). It issues an **admin-scope** session in the same `rp_session`
        cookie (12 hours absolute, 30 minutes idle by default).

        Every other outcome — unknown email, wrong password, an ordinary customer, a
        self-registered professional, an unverified account — is the same
        `401 INVALID_CREDENTIALS` with an identical body and comparable timing (one Argon2
        verification always runs), so the endpoint does not reveal which accounts are
        administrators.

        **Cookie only.** There is no `token_delivery` here: sending it is rejected with
        `400 INVALID_JSON` (unknown field) and `access_token` is never returned. An admin session
        token presented as `Authorization: Bearer` does not authenticate.

        **Rate limit.** Its own per-IP bucket: bursts of 5, refilled at 5 per minute.

        Sign out with `POST /v1/auth/logout`. Sign-in attempts are written to the server log as
        audit lines (log-only; not a durable audit record). **MFA is not implemented.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Signed in. Sets the `rp_session` cookie (admin scope). Never contains `access_token`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              description: "`rp_session=<token>; Path=/; HttpOnly; SameSite=Lax` (plus `Secure` outside development), Max-Age = the admin session lifetime."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              example:
                user:
                  id: 0195c0de-0000-7000-8000-00000000d003
                  name: Sam Admin
                  email: admin@example.test
                  email_verified: true
                  platform_roles:
                    - role: SUPER_ADMIN
                      market_code: null
                  memberships: []
                  account_roles:
                    - role: CONSUMER
                      status: ACTIVE
                session:
                  scope: admin
                  expires_at: "2026-11-14T21:00:00Z"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: |
            `INVALID_CREDENTIALS`: unknown email, wrong password, or an account that is not a
            verified platform administrator. The body is the same in every case.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/CsrfOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/admin/me:
    get:
      tags: [admin]
      operationId: getAdminMe
      summary: The signed-in platform administrator
      description: |
        Same body as `GET /v1/me`, but only for an **admin-scope** session whose user holds a
        platform role. A customer-scope session is `403 FORBIDDEN` even if its user holds a
        platform role.
      security:
        - cookieSession: []
      responses:
        "200":
          description: The administrator and their admin session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/agent/property-requests:
    get:
      tags: [organisation-workspace]
      operationId: listOrganisationPropertyRequests
      summary: Property requests received by the caller (organisation member or direct seller)
      description: |
        **Who may call it.** `200` when the signed-in user
        - has at least one organisation membership (any role), **or**
        - is the direct seller of at least one listing, **or**
        - holds the `PRIVATE_SELLER` account role (in any status, including
          `PENDING_VERIFICATION`).

        Otherwise `403 FORBIDDEN`; `401` when not signed in. Any other self-declared account role
        (for example `AGENT` without a membership) does not open this route.

        **What is returned** (decided on the server from the caller's user ID and memberships;
        there are no filter parameters). The union of:
        - for OWNER and MANAGER: every request whose recipient organisation is one of theirs;
        - for AGENT and STAFF: the requests of their organisation that are assigned to them
          personally or to the organisation inbox (no assigned agent) — not those assigned to a
          colleague;
        - for a direct seller: the requests routed to them for their own listings.

        The `PRIVATE_SELLER` account role only opens the route. It never adds data: a user who
        declared it but sells nothing gets an empty `items` array. Requests of other
        organisations and of other sellers are never returned. `status` is the internal status;
        because unroutable requests have no recipient, `ROUTING_EXCEPTION` never appears here.

        Newest first, capped at 100 items. **There is no pagination yet.**
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The requests visible to the caller (possibly an empty array).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/OrganisationPropertyRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

components:
  parameters:
    ReferenceMarket:
      name: market
      in: query
      required: false
      description: |
        Market code (case-insensitive). Keeps the rows of that market plus the rows that apply
        to every market. Without it, rows of all markets are returned.
      schema:
        type: string
        pattern: "^[A-Za-z]{2}$"
      example: ZW
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The `ETag` of a previous response. A match answers `304` with no body.
      schema:
        type: string

  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: rp_session
      description: |
        Web session. Set by `POST /v1/auth/login` and `POST /v1/auth/verify-email`; HttpOnly,
        SameSite=Lax, Path=/, Secure outside development. State-changing requests authenticated
        this way must carry an allowlisted `Origin` header (`403 CSRF_ORIGIN` otherwise).
    bearerToken:
      type: http
      scheme: bearer
      description: |
        Mobile/API session: the opaque `access_token` returned by login with
        `"token_delivery": "bearer"`. Not a JWT. Exempt from the CSRF origin check. Customer
        scope only: admin sessions are never issued or accepted as bearer tokens.

  headers:
    ETag:
      description: Strong validator of the response body. Changes whenever the content changes.
      schema:
        type: string
      example: '"8884076b694c80c9a86962905377343a"'
    Cache-Control:
      description: "`public, max-age=60, stale-while-revalidate=300`. The response is the same for every caller."
      schema:
        type: string
    CatalogueCacheControl:
      description: "`public, max-age=30, stale-while-revalidate=120`. The response is the same for every caller and never depends on a session."
      schema:
        type: string
    X-Request-Id:
      description: Request identifier (echoed from the request or generated). Equals `trace_id` in error bodies.
      schema:
        type: string

  responses:
    NotModified:
      description: The `If-None-Match` validator still matches. No body.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/Cache-Control"
    VerificationSent:
      description: Accepted. The same answer is given whether or not the email has an account.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [status]
            properties:
              status:
                type: string
                const: VERIFICATION_SENT
    Authenticated:
      description: |
        Signed in. With cookie delivery the response sets `rp_session` and has no
        `access_token`; with bearer delivery it has `access_token` and sets no cookie.
        (`verify-email` for an account holding a platform role returns `user` only.)
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        Set-Cookie:
          description: "`rp_session=<token>; Path=/; HttpOnly; SameSite=Lax` (plus `Secure` outside development). Cookie delivery only."
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResult"
    ValidationFailed:
      description: "`VALIDATION_FAILED` (per-field messages in `error.fields`) or `INVALID_JSON`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: "Not signed in, or the session is invalid, expired or revoked (`UNAUTHENTICATED`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: "Signed in but not allowed to use this route (`FORBIDDEN`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CsrfOrigin:
      description: |
        `CSRF_ORIGIN`: the request was authenticated by the session cookie but its `Origin`
        header is missing or not allowlisted. Never returned for bearer or anonymous requests.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLarge:
      description: The body exceeds 64 KB (`PAYLOAD_TOO_LARGE`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnsupportedMediaType:
      description: The Content-Type is not `application/json` (`UNSUPPORTED_MEDIA_TYPE`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Too many requests from this IP (`RATE_LIMITED`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected server error (`INTERNAL`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Timeout:
      description: The request exceeded the server-side time limit (`TIMEOUT`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      required: [error, trace_id]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              enum:
                - VALIDATION_FAILED
                - INVALID_JSON
                - UNSUPPORTED_MEDIA_TYPE
                - PAYLOAD_TOO_LARGE
                - LISTING_NOT_FOUND
                - LISTING_UNAVAILABLE
                - IDEMPOTENCY_CONFLICT
                - REFERENCE_SET_NOT_FOUND
                - DIRECTORY_KIND_NOT_FOUND
                - PROFILE_NOT_FOUND
                - RECIPIENT_NOT_FOUND
                - RECIPIENT_UNAVAILABLE
                - UNAUTHENTICATED
                - FORBIDDEN
                - CSRF_ORIGIN
                - INVALID_CREDENTIALS
                - EMAIL_NOT_VERIFIED
                - INVALID_TOKEN
                - RATE_LIMITED
                - ORIGIN_NOT_ALLOWED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - NOT_READY
                - TIMEOUT
                - INTERNAL
            message:
              type: string
              description: Human-readable summary. Not stable; do not parse.
            fields:
              type: object
              description: Per-field messages, present for `VALIDATION_FAILED`. Keys are JSON paths such as `guest_contact.email`.
              additionalProperties:
                type: string
        trace_id:
          type: string
          description: Same value as the `X-Request-Id` response header.

    Coded:
      type: object
      description: A reference-data code with its current label. If the row has been retired the label repeats the code.
      required: [code, label]
      additionalProperties: false
      properties:
        code: { type: string }
        label: { type: string }

    Money:
      type: object
      description: An exact amount. `amount` is a decimal string with two decimal places; never parse it as a float for arithmetic.
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$", examples: ["385000.00"] }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: ISO 4217, examples: [USD] }

    Photo:
      type: object
      required: [url, alt, width, height]
      additionalProperties: false
      properties:
        url:
          type: string
          description: |
            Today a site-relative path served by the web app (`/assets/images/<file>.jpg`),
            returned exactly as stored. Object storage and uploads are not built; when they are,
            this becomes an absolute URL.
          examples: [/assets/images/listing-house-borrowdale.jpg]
        alt: { type: string }
        width: { type: integer, minimum: 1, description: Pixel width of the image file. }
        height: { type: integer, minimum: 1 }

    ProfileRef:
      type: object
      description: A PUBLIC reference to a directory profile (`/v1/directory/{kind}/{slug}`). Never contact details.
      required: [kind, slug, name, verified]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/DirectoryKind"
        slug: { type: string }
        name: { type: string }
        verified: { type: boolean }

    ListingAdvertiser:
      type: object
      description: |
        Who advertises the listing, as public profile references only. There is no phone
        number, email address or street address here or anywhere else in a listing: a listing
        is answered with `POST /v1/property-requests`.
      required: [type, name, verified, agency, agent]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [agency, private_seller]
        name:
          type: string
          description: The agency's name, or the private seller's display name (`Private seller` in the sample data).
        verified: { type: boolean }
        agency:
          oneOf:
            - $ref: "#/components/schemas/ProfileRef"
            - type: "null"
          description: The agency's profile. Null for a private seller.
        agent:
          oneOf:
            - $ref: "#/components/schemas/ProfileRef"
            - type: "null"
          description: The assigned agent's profile. Null for a private seller, or when no agent is assigned.

    Listing:
      type: object
      description: A public listing. The same object is used in search results, on the detail endpoint and on profiles.
      required: [id, slug, reference, title, deal, category, property_type, price, price_period, suburb, city, market_code,
                 bedrooms, bathrooms, floor_area, land_area, summary, description, features, featured, photos, advertiser,
                 published_at, expires_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: "Use as `listing_id` in `POST /v1/property-requests`." }
        slug: { type: string, examples: [four-bedroom-family-home-borrowdale] }
        reference: { type: string, description: Human reference of the listing., examples: [RP-ZW-10001] }
        title: { type: string }
        deal:
          allOf: [{ $ref: "#/components/schemas/Coded" }]
          description: "`deal_types` code and label, e.g. `sale` / `For sale`."
        category:
          allOf: [{ $ref: "#/components/schemas/Coded" }]
          description: "`property_categories` code and label."
        property_type:
          allOf: [{ $ref: "#/components/schemas/Coded" }]
          description: "`property_types` code and label."
        price:
          $ref: "#/components/schemas/Money"
        price_period:
          type: [string, "null"]
          enum: [month, null]
          description: "`month` for a monthly rent; null for a sale price."
        suburb:
          allOf: [{ $ref: "#/components/schemas/Coded" }]
          description: "`suburbs` code and label."
        city:
          allOf: [{ $ref: "#/components/schemas/Coded" }]
          description: "`cities` code and label."
        market_code: { type: string, pattern: "^[A-Z]{2}$" }
        bedrooms: { type: [integer, "null"], minimum: 0 }
        bathrooms: { type: [integer, "null"], minimum: 0 }
        floor_area: { type: [integer, "null"], minimum: 0, description: Square metres. }
        land_area: { type: [integer, "null"], minimum: 0, description: Square metres. }
        summary: { type: string, description: One sentence for cards. }
        description: { type: string, description: Plain text. }
        features:
          type: array
          description: "`listing_features` codes and labels, in the advertiser's order."
          items:
            $ref: "#/components/schemas/Coded"
        featured: { type: boolean }
        photos:
          type: array
          description: In display order; the first is the cover. May be empty.
          items:
            $ref: "#/components/schemas/Photo"
        advertiser:
          $ref: "#/components/schemas/ListingAdvertiser"
        published_at: { type: string, format: date-time, description: Start of the current publication cycle (UTC). }
        expires_at: { type: string, format: date-time, description: End of the current publication cycle (90 days after `published_at`). Always in the future for a returned listing. }
        updated_at: { type: string, format: date-time }
      example:
        id: 0195c0de-0000-7000-8000-000000000001
        slug: four-bedroom-family-home-borrowdale
        reference: RP-ZW-10001
        title: Four-bedroom family home with garden
        deal: { code: sale, label: For sale }
        category: { code: residential, label: Residential }
        property_type: { code: house, label: House }
        price: { amount: "385000.00", currency: USD }
        price_period: null
        suburb: { code: borrowdale, label: Borrowdale }
        city: { code: harare, label: Harare }
        market_code: ZW
        bedrooms: 4
        bathrooms: 3
        floor_area: 320
        land_area: 2000
        summary: Single-storey home on a walled half-acre with borehole and solar backup.
        description: A well-kept single-storey home set back from a quiet road.
        features:
          - { code: borehole, label: Borehole }
          - { code: solar-backup, label: Solar backup }
        featured: true
        photos:
          - { url: /assets/images/listing-house-borrowdale.jpg, alt: White two-storey house with a tiled roof under a blue sky, width: 1200, height: 800 }
        advertiser:
          type: agency
          name: Sample Estates
          verified: true
          agency: { kind: agencies, slug: sample-estates, name: Sample Estates, verified: true }
          agent: { kind: agents, slug: tendai-ncube, name: Tendai Ncube, verified: true }
        published_at: "2026-11-10T08:00:00Z"
        expires_at: "2027-02-08T08:00:00Z"
        updated_at: "2026-11-10T08:00:00Z"

    FacetCount:
      type: object
      required: [code, label, count]
      additionalProperties: false
      properties:
        code: { type: string }
        label: { type: string }
        count: { type: integer, minimum: 1 }

    ListingFacets:
      type: object
      description: All keys are always present; a facet with no values is an empty array.
      required: [deal, category, property_type, city, suburb, bedrooms, features, price]
      additionalProperties: false
      properties:
        deal: { type: array, items: { $ref: "#/components/schemas/FacetCount" }, description: Ordered by label. }
        category: { type: array, items: { $ref: "#/components/schemas/FacetCount" } }
        property_type: { type: array, items: { $ref: "#/components/schemas/FacetCount" } }
        city: { type: array, items: { $ref: "#/components/schemas/FacetCount" } }
        suburb: { type: array, items: { $ref: "#/components/schemas/FacetCount" } }
        bedrooms:
          type: array
          description: "Exact bedroom counts in ascending order; `code` is the number as a string (`\"3\"`), `label` is e.g. `3 bedrooms`."
          items: { $ref: "#/components/schemas/FacetCount" }
        features:
          type: array
          description: Ordered by count (highest first), then label.
          items: { $ref: "#/components/schemas/FacetCount" }
        price:
          type: object
          description: Lowest and highest price, in `currency`, among the listings matching every filter except the price filter. Both null when there are none.
          required: [currency, min, max]
          additionalProperties: false
          properties:
            currency: { type: string, pattern: "^[A-Z]{3}$" }
            min: { type: [string, "null"], examples: ["600.00"] }
            max: { type: [string, "null"], examples: ["640000.00"] }

    ListingPage:
      type: object
      required: [items, page, page_size, total, total_pages, facets]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 48 }
        total: { type: integer, minimum: 0, description: Number of listings matching the filters. }
        total_pages: { type: integer, minimum: 0 }
        facets:
          $ref: "#/components/schemas/ListingFacets"

    ListingSuggestion:
      type: object
      required: [type, label, value]
      additionalProperties: false
      properties:
        type: { type: string, enum: [suburb, city, listing] }
        label: { type: string, description: "Text to show. For a suburb it includes the city: `Borrowdale, Harare`." }
        value:
          type: string
          description: "For `suburb` and `city`: the reference code, to use as the `suburb` / `city` filter. For `listing`: the listing's slug."

    DirectoryKindInfo:
      type: object
      required: [code, label, singular_label, description]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/DirectoryKind"
        label: { type: string, examples: [Estate agencies] }
        singular_label: { type: string, examples: [Estate agency] }
        description: { type: string }

    DirectoryKindCount:
      type: object
      required: [code, label, singular_label, description, count]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/DirectoryKind"
        label: { type: string }
        singular_label: { type: string }
        description: { type: string }
        count: { type: integer, minimum: 0, description: Public profiles of this kind. }

    DirectoryProfile:
      type: object
      description: |
        A public profile. It has no phone number, email address or street address, and never
        will: use `POST /v1/business-enquiries` with its `kind` and `slug` to contact it.
      required: [kind, slug, name, role, tagline, description, city, areas, services, offerings, trade, verified, sponsored,
                 since, logo, agency, listing_count, updated_at]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/DirectoryKind"
        slug: { type: string }
        name: { type: string }
        role: { type: string, description: Job title for a person, speciality for a business. }
        tagline: { type: string }
        description: { type: string, description: Plain text "about" paragraph. }
        city:
          allOf: [{ $ref: "#/components/schemas/Coded" }]
          description: "`cities` code and label."
        areas: { type: array, items: { type: string }, description: Free-text names of the areas served. Not reference codes. }
        services: { type: array, items: { type: string }, description: "Names of the services offered; any of them can be sent as `service` in a business enquiry." }
        offerings:
          type: array
          description: Services described in detail. Empty for most kinds.
          items:
            type: object
            required: [name, description]
            additionalProperties: false
            properties:
              name: { type: string }
              description: { type: string }
        trade:
          oneOf:
            - $ref: "#/components/schemas/Coded"
            - type: "null"
          description: "`service_trades` code and label. Service providers only; null otherwise."
        verified: { type: boolean }
        sponsored: { type: boolean, description: Paid placement. Must be labelled "Sponsored" wherever it is shown. }
        since: { type: [integer, "null"], description: Year the business started, when known. }
        logo:
          oneOf:
            - $ref: "#/components/schemas/Photo"
            - type: "null"
          description: Always null today (the sample data has no logos and uploads are not built).
        agency:
          oneOf:
            - $ref: "#/components/schemas/ProfileRef"
            - type: "null"
          description: "Agent profiles only: the agency they work for."
        listing_count: { type: integer, minimum: 0, description: Number of public listings of an agency or agent; 0 for other kinds. }
        updated_at: { type: string, format: date-time }

    DirectoryProfileDetail:
      description: A profile with its agents and listings.
      allOf:
        - $ref: "#/components/schemas/DirectoryProfile"
        - type: object
          required: [agents, listings]
          properties:
            agents:
              type: array
              description: An agency's agent profiles, by name. Empty for every other kind.
              items:
                $ref: "#/components/schemas/ProfileRef"
            listings:
              type: array
              description: The profile's public listings, newest first. Empty for kinds that own no listings.
              items:
                $ref: "#/components/schemas/Listing"

    DirectoryPage:
      type: object
      required: [kind, items, page, page_size, total, total_pages]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/DirectoryKindInfo"
        items:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryProfile"
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 48 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }

    ReferenceSetCode:
      type: string
      enum:
        - deal_types
        - property_categories
        - property_types
        - request_types
        - contact_methods
        - account_roles
        - directory_kinds
        - service_trades
        - cities
        - suburbs
        - listing_features

    ReferenceGroup:
      type: object
      description: The heading an account role is listed under.
      required: [code, label, sort_order]
      additionalProperties: false
      properties:
        code:
          type: string
          examples: [looking, listing, agency]
        label:
          type: string
          examples: [Looking for property]
        sort_order:
          type: integer

    ReferenceItem:
      type: object
      description: |
        One row of a reference set. **Every key is always present**; a key that does not apply
        to the set is `null`.
      required: [code, label, singular_label, description, sort_order, market_code, parent_code, group, requires_verification]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
          description: Stable identifier. This is what a client sends back to the API. Its case is significant.
        label:
          type: string
          description: Text shown to people. It can change at any time; do not branch on it.
        singular_label:
          type: [string, "null"]
          description: "`directory_kinds` only: the singular form, e.g. `Estate agency` for `Estate agencies`."
        description:
          type: [string, "null"]
          description: "`directory_kinds` only: one sentence describing the section."
        sort_order:
          type: integer
          description: Display position within the set (within its group for account roles). Items already arrive in order.
        market_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
          description: The market the row belongs to (`cities`, `suburbs`), or null when it applies to every market.
        parent_code:
          type: [string, "null"]
          description: "`property_types`: the `property_categories` code. `suburbs`: the `cities` code. Null elsewhere."
        group:
          oneOf:
            - $ref: "#/components/schemas/ReferenceGroup"
            - type: "null"
          description: "`account_roles` only."
        requires_verification:
          type: [boolean, "null"]
          description: |
            `account_roles` only. `true`: choosing the role at registration only records a
            request (`PENDING_VERIFICATION`). `false`: the role is `ACTIVE` once the email is verified.

    ReferenceData:
      type: object
      required: [market, sets]
      additionalProperties: false
      properties:
        market:
          type: [string, "null"]
          description: The `market` filter that was applied, upper-cased, or null.
        sets:
          type: object
          description: Every set, keyed by its code. All eleven keys are always present.
          additionalProperties: false
          required: [deal_types, property_categories, property_types, request_types, contact_methods, account_roles, directory_kinds, service_trades, cities, suburbs, listing_features]
          properties:
            deal_types: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            property_categories: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            property_types: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            request_types: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            contact_methods: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            account_roles: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            directory_kinds: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            service_trades: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            cities: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            suburbs: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
            listing_features: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }

    ReferenceSet:
      type: object
      required: [set, market, items]
      additionalProperties: false
      properties:
        set:
          $ref: "#/components/schemas/ReferenceSetCode"
        market:
          type: [string, "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceItem"

    User:
      type: object
      description: |
        The signed-in user. Capabilities come only from `memberships` (organisation-scoped) and
        `platform_roles`. `account_roles` are self-declared at registration and grant nothing.
        All three arrays are always present (empty, never null).
      required: [id, name, email, email_verified, platform_roles, memberships, account_roles]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
          description: Lower-cased.
        email_verified:
          type: boolean
          description: Always true for a signed-in user (sessions are only issued after verification).
        platform_roles:
          type: array
          items:
            $ref: "#/components/schemas/PlatformRoleAssignment"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        account_roles:
          type: array
          description: Self-declared account roles, in allowlist order. Informational only.
          items:
            $ref: "#/components/schemas/AccountRole"

    SelectableAccountRole:
      type: string
      description: |
        A role a person may choose for themselves at registration: a code from the
        `account_roles` reference set. The values below are the baseline; the set that is
        accepted is whatever `GET /v1/reference/account_roles` returns. Platform administrator
        roles are never in it and can never be chosen.
      enum:
        - CONSUMER
        - TENANT
        - PRIVATE_SELLER
        - LANDLORD
        - HOST
        - DEVELOPER
        - SERVICE_PROVIDER
        - AGENT
        - AGENCY_STAFF
        - AGENCY_ADMIN
        - AGENCY_OWNER

    AccountRole:
      type: object
      description: |
        A role the user chose at registration, with its status. It is **not** an authorisation:
        it creates no organisation or membership and gives no access to organisation data
        (see `memberships`) or to platform administration (see `platform_roles`).
      required: [role, status]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/SelectableAccountRole"
        status:
          type: string
          enum: [ACTIVE, PENDING_VERIFICATION]
          description: |
            `ACTIVE` for CONSUMER and TENANT. `PENDING_VERIFICATION` for every professional role
            until an approval workflow exists.

    PlatformRoleAssignment:
      type: object
      required: [role, market_code]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [SUPER_ADMIN, PLATFORM_ADMIN, MARKET_ADMIN, FINANCE_ADMIN, CONTENT_ADMIN, MODERATOR, SUPPORT]
        market_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
          description: Set only for the market-scoped role MARKET_ADMIN; null for global roles.

    Membership:
      type: object
      description: The user's role in one organisation and market.
      required: [organisation_id, organisation_name, organisation_kind, market_code, role]
      additionalProperties: false
      properties:
        organisation_id:
          type: string
          format: uuid
        organisation_name:
          type: string
        organisation_kind:
          type: string
          enum: [AGENCY, LANDLORD, HOST, DEVELOPER, SERVICE_PROVIDER]
        market_code:
          type: string
          pattern: "^[A-Z]{2}$"
        role:
          type: string
          enum: [OWNER, MANAGER, AGENT, STAFF]

    Session:
      type: object
      required: [scope, expires_at]
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [customer, admin]
          description: |
            `customer` for the public login; `admin` for the administrator login. Platform-role
            routes require `admin`.
        expires_at:
          type: string
          format: date-time
          description: |
            Absolute expiry: 30 days after sign-in for `customer` (which also ends after 14 days
            without use), 12 hours for `admin` (which also ends after 30 minutes without use).

    Me:
      type: object
      required: [user, session]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"

    AuthResult:
      type: object
      required: [user]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          allOf:
            - $ref: "#/components/schemas/Session"
          description: |
            Always present for login. Absent only when `verify-email` verified an account that
            holds a platform role (no session is started for those).
        access_token:
          type: string
          description: Opaque session token. Present only when `token_delivery` is `bearer`.

    TokenDelivery:
      type: string
      enum: [cookie, bearer]
      default: cookie

    NewPassword:
      type: string
      minLength: 10
      maxLength: 128
      description: 10 to 128 characters.

    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, consent, roles]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          $ref: "#/components/schemas/NewPassword"
        consent:
          type: object
          additionalProperties: false
          required: [privacy_version, accepted]
          properties:
            privacy_version:
              type: string
              minLength: 1
              maxLength: 32
            accepted:
              type: boolean
              const: true
        marketing_opt_in:
          type: boolean
          default: false
        roles:
          type: array
          minItems: 1
          maxItems: 11
          uniqueItems: true
          description: Account roles chosen by the person. Duplicates are rejected.
          items:
            $ref: "#/components/schemas/SelectableAccountRole"

    DirectoryKind:
      type: string
      description: |
        The directory a profile is listed in; the first segment of its public address. A code
        from the `directory_kinds` reference set (active rows only). Baseline values: agencies,
        agents, developers, property-managers, hosts, service-providers.
      examples: [service-providers]

    BusinessEnquiryCreate:
      type: object
      additionalProperties: false
      required:
        - recipient
        - message
        - preferred_contact_method
        - consent
      properties:
        recipient:
          type: object
          additionalProperties: false
          required: [kind, slug]
          properties:
            kind:
              $ref: "#/components/schemas/DirectoryKind"
            slug:
              type: string
              maxLength: 80
              pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        service:
          type: string
          maxLength: 120
          description: Optional. One of the recipient's listed services. Plain text; HTML and control characters are rejected. An empty string is treated as absent.
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain text. Anything containing HTML tags or control characters is rejected. Leading/trailing whitespace is trimmed.
        preferred_contact_method:
          type: string
          description: |
            A code from the `contact_methods` reference set (active rows only). Baseline values:
            EMAIL, PHONE, WHATSAPP. PHONE and WHATSAPP require `guest_contact.phone`.
          examples: [EMAIL]
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
        guest_contact:
          type: object
          additionalProperties: false
          description: |
            Required for guests, with `name` and `email`. Optional for a signed-in customer, for
            whom only `phone` is read (name and email come from the account).
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            email:
              type: string
              format: email
              maxLength: 254
            phone:
              type: string
              pattern: "^\\+[1-9][0-9]{6,14}$"
              description: E.164. Optional unless the preferred contact method is PHONE or WHATSAPP.
        consent:
          type: object
          additionalProperties: false
          required: [privacy_version, accepted]
          properties:
            privacy_version:
              type: string
              minLength: 1
              maxLength: 32
            accepted:
              type: boolean
              const: true

    BusinessEnquiryReceipt:
      type: object
      required: [enquiry_id, reference, status, created_at]
      additionalProperties: false
      properties:
        enquiry_id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^BE-[2-9A-HJKMNP-TV-Z]{8}$"
          description: Human-friendly reference to quote to support.
          examples: [BE-7K3M9QXD]
        status:
          type: string
          const: RECEIVED
          description: The enquiry has been stored. It does not indicate that anyone has been notified.
        created_at:
          type: string
          format: date-time

    ReceivedBusinessEnquiry:
      type: object
      required:
        - enquiry_id
        - reference
        - recipient
        - service
        - message
        - preferred_contact_method
        - contact
        - status
        - created_at
      additionalProperties: false
      properties:
        enquiry_id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^BE-[2-9A-HJKMNP-TV-Z]{8}$"
        recipient:
          type: object
          description: The profile the enquiry was addressed to.
          required: [kind, slug, name]
          additionalProperties: false
          properties:
            kind:
              $ref: "#/components/schemas/DirectoryKind"
            slug:
              type: string
            name:
              type: string
        service:
          type: [string, "null"]
          description: The service the customer picked, or null.
        message:
          type: string
        preferred_contact_method:
          type: string
          enum: [EMAIL, PHONE, WHATSAPP]
        contact:
          type: object
          description: The customer's contact details. Returned only here, to the authorised recipient.
          required: [name, email, phone]
          additionalProperties: false
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            phone:
              type: [string, "null"]
              description: E.164, or null when the customer gave no phone number.
        status:
          type: string
          enum: [RECEIVED]
          description: Internal status. Only RECEIVED can appear in an inbox today.
        created_at:
          type: string
          format: date-time

    OrganisationPropertyRequest:
      type: object
      required:
        - request_id
        - reference
        - listing_id
        - request_type
        - status
        - message
        - preferred_contact_method
        - contact
        - created_at
      additionalProperties: false
      properties:
        request_id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^RP-[2-9A-HJKMNP-TV-Z]{8}$"
        listing_id:
          type: string
          format: uuid
        request_type:
          type: string
          enum: [ENQUIRY, PROPERTY_INFORMATION, VIEWING_REQUEST, CONSULTATION_REQUEST]
        status:
          type: string
          enum: [RECEIVED]
          description: Internal status. Only RECEIVED can appear in an organisation inbox today.
        message:
          type: string
        preferred_contact_method:
          type: string
          enum: [EMAIL, PHONE, WHATSAPP]
        contact:
          type: object
          description: The customer's contact details (the guest's, or the account's name and email for a signed-in customer).
          required: [name, email, phone]
          additionalProperties: false
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            phone:
              type: [string, "null"]
              description: E.164, or null when the customer gave no phone number.
        created_at:
          type: string
          format: date-time

    Market:
      type: object
      required: [id, code, name, currency_code, timezone, status]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          pattern: "^[A-Z]{2}$"
        name:
          type: string
        currency_code:
          type: string
          description: ISO 4217 currency code.
          pattern: "^[A-Z]{3}$"
        timezone:
          type: string
          description: IANA time zone name.
        status:
          type: string
          enum: [ACTIVE, PLANNED, SUSPENDED]

    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 128
      pattern: "^[\\x21-\\x7E]+$"
      description: Client-generated unique key (a UUID is recommended). Printable ASCII, no spaces.

    PropertyRequestCreate:
      type: object
      additionalProperties: false
      required:
        - listing_id
        - request_type
        - message
        - preferred_contact_method
        - consent
      properties:
        listing_id:
          type: string
          format: uuid
        request_type:
          type: string
          description: |
            A code from the `request_types` reference set (active rows only). Baseline values:
            ENQUIRY, PROPERTY_INFORMATION, VIEWING_REQUEST, CONSULTATION_REQUEST.
          examples: [VIEWING_REQUEST]
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain text. Anything containing HTML tags or control characters is rejected. Leading/trailing whitespace is trimmed.
        preferred_contact_method:
          type: string
          description: |
            A code from the `contact_methods` reference set (active rows only). Baseline values:
            EMAIL, PHONE, WHATSAPP. PHONE and WHATSAPP require `guest_contact.phone`.
          examples: [EMAIL]
        preferred_slot_utc:
          type: [string, "null"]
          format: date-time
          description: Optional. Only allowed for VIEWING_REQUEST and CONSULTATION_REQUEST and must be in the future.
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
        guest_contact:
          type: object
          additionalProperties: false
          description: |
            Required for guests, with `name` and `email`. Optional for a signed-in customer, for
            whom only `phone` is read (name and email come from the account).
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            email:
              type: string
              format: email
              maxLength: 254
            phone:
              type: string
              pattern: "^\\+[1-9][0-9]{6,14}$"
              description: E.164. Optional unless the preferred contact method is PHONE or WHATSAPP.
        consent:
          type: object
          additionalProperties: false
          required: [privacy_version, accepted]
          properties:
            privacy_version:
              type: string
              minLength: 1
              maxLength: 32
              description: Version of the privacy notice the customer accepted.
            accepted:
              type: boolean
              const: true

    PropertyRequestReceipt:
      type: object
      required: [request_id, reference, status, created_at]
      additionalProperties: false
      properties:
        request_id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: "^RP-[2-9A-HJKMNP-TV-Z]{8}$"
          description: Human-friendly reference to quote to support.
          examples: [RP-7K3M9QXD]
        status:
          type: string
          const: RECEIVED
          description: The request has been stored. It does not indicate that anyone has been notified.
        created_at:
          type: string
          format: date-time
