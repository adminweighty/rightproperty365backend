  /v1/me/agreements/{id}/document:
    parameters:
      - $ref: "#/components/parameters/AgreementId"
    put:
      tags: [agreements]
      operationId: putAgreementDocument
      summary: Upload the PDF to be signed (DRAFT, uploaded agreements)
      description: |
        `multipart/form-data` with one part `file`: a PDF of at most 20 MB (`413 FILE_TOO_LARGE`)
        and 50 pages (`422 UNSUPPORTED_FILE_TYPE` with `fields.file`), that opens without a password
        and whose every page can be imported (`415 UNSUPPORTED_FILE_TYPE` otherwise). Stored privately;
        `document.pages` gives every page's width and height in PDF points, for pdf.js. A new PDF
        drops the fields placed on the previous one. Rate limit: the upload bucket.
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgreementNotFound"
        "409":
          $ref: "#/components/responses/AgreementConflict"
        "413":
          $ref: "#/components/responses/AgreementFile"
        "415":
          $ref: "#/components/responses/AgreementFile"
        "422":
          $ref: "#/components/responses/AgreementFile"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/agreements/{id}/fields:
    parameters:
      - $ref: "#/components/parameters/AgreementId"
    put:
      tags: [agreements]
      operationId: putAgreementFields
      summary: Replace the fields placed on the document (DRAFT)
      description: |
        Each field: `recipient_id` (a SIGNER or APPROVER; never a CC), `type` (`SIGNATURE`,
        `INITIALS`, `DATE_SIGNED` filled when they sign, `NAME` filled, `TEXT`, `CHECKBOX`),
        `page`, and `x`, `y`, `w`, `h` in PDF points from the page's top-left corner, inside the
        page and at least 6 x 6. An APPROVER has no SIGNATURE or INITIALS. TEXT and CHECKBOX take
        `required` (default true) and `label`; the others are always required. Every SIGNER needs
        at least one SIGNATURE field. Problems: `422 AGREEMENT_FIELDS_INCOMPLETE` with
        `error.fields`.
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fields]
              properties:
                fields:
                  type: array
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/AgreementFieldInput"
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgreementNotFound"
        "409":
          $ref: "#/components/responses/AgreementConflict"
        "422":
          $ref: "#/components/responses/AgreementFile"
        "500":
