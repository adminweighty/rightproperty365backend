  /v1/inbox/appointments/{id}/assign:
    post:
      tags: [appointments]
      operationId: assignReceivedAppointment
      summary: Assign to a member of the organisation (OWNER and MANAGER only)
      description: |
        Gives an open appointment of the caller's organisation to one of its members; the
        status does not change, and a timeline entry `ASSIGNED` is added (not shown to the
        customer). `403 FORBIDDEN` for AGENT and STAFF (and for a direct owner); `400
        VALIDATION_FAILED` on `user_id` when that user is not an active member of the same
        organisation; `409 INVALID_STATE` when the appointment is closed; `409 SLOT_TAKEN` when
        the appointment is `CONFIRMED` and the new assignee already has a confirmed appointment
        at that time.

        To offer the people to assign, list the organisation's members with
        `GET /v1/agent/organisations/{id}/members` (any ACTIVE member can hold an appointment).
        When a member is suspended or removed, their open appointments go back to the
        organisation (an `UNASSIGNED` timeline entry, not shown to the customer).
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
      responses:
        "200":
          $ref: "#/components/responses/ReceivedAppointment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "409":
          $ref: "#/components/responses/AppointmentConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/inbox/summary:
    get:
      tags: [appointments]
      operationId: getInboxSummary
      summary: Badge counts for the apps
      description: |
        The numbers behind the app's badges, each scoped exactly as its own inbox. Any
        signed-in caller may ask (`401` otherwise); a caller who receives nothing gets zeros,
        never `403`.

        - `property_requests.new` (changed in 0.20.0): the requests the caller can see in
          `GET /v1/agent/property-requests` whose lead stage is `NEW_ENQUIRY`, uncapped.
        - `business_enquiries.new`: the enquiries the caller can see in
          `GET /v1/inbox/business-enquiries`. They have no read or lead status yet, so "new"
          is **every** one of them, capped at 100.
        - `GET /v1/me/dashboard` uses these same numbers.
        - `appointments.requested` and `appointments.reschedule_requested`: appointments in
          those statuses (whoever proposed the new time). `appointments.upcoming_confirmed`:
          `CONFIRMED` appointments that have not ended.
      security:
        - cookieSession: []
        - bearerToken: []
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/admin/lease-templates:
    get:
      tags: [leases]
      operationId: adminListLeaseTemplates
      summary: The sample template library, every version (new in 0.24.0)
      description: |
        The platform's sample templates only (`source: SAMPLE`; organisation templates are never
        listed or changed here, `404` by ID). Admin-scope session with SUPER_ADMIN or
        CONTENT_ADMIN (`403` otherwise). Filters:
        `market` (country code), `status` (`DRAFT`, `APPROVED`, `RETIRED`). Ordered by country,
        name, newest version first. `variables` is the fixed list of placeholders a template may
        use. `Cache-Control: private, no-store`.
      security:
        - cookieSession: []
      parameters:
        - name: market
          in: query
          schema: {type: string, pattern: "^[A-Za-z]{2}$"}
        - name: status
          in: query
          schema: {type: string, enum: [DRAFT, APPROVED, RETIRED]}
      responses:
        "200":
          description: The templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseTemplateList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [leases]
      operationId: adminCreateLeaseTemplate
      summary: Create a lease template (version 1, DRAFT)
      description: |
        `market_code`, `name`, `lease_kind` and `sections` are required. Every `{{placeholder}}` in
        a heading, a section text or an optional clause must be one of `variables` (`400
        VALIDATION_FAILED` naming the unknown ones, also for a stray `{{` or `}}`). Text is plain
        (no `<` or `>`). Audited (`CREATED`). Rate limit: the lease bucket (30 / 30 per minute).
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
