  /v1/admin/onboarding/{id}/approve:
    post:
      tags: [admin, onboarding]
      operationId: adminApproveOnboarding
      summary: Approve an application
      description: |
        **Join requests (new in 0.23.0).** An application to join an agency (AGENT, SALES_AGENT,
        LETTINGS_AGENT, AGENCY_STAFF, AGENCY_ADMIN) can also be decided by that agency's OWNER or
        MANAGER (`/v1/agent/organisations/{id}/join-requests`). Whoever decides first wins: when the
        agency already did, this answers `409 INVALID_STATE`. A decision on a join request is also
        written to the agency's audit trail.

        Only from `SUBMITTED`. In **one transaction**: the application becomes `APPROVED`, the
        account role `ACTIVE`, and what the role's outcome says is created:

        | Role | Created |
        | --- | --- |
        | AGENCY_OWNER, PROPERTY_MANAGER, SOLICITOR, HOST, DEVELOPER, SERVICE_PROVIDER | a new organisation (kind AGENCY, PROPERTY_MANAGER, LAW_FIRM, HOST, DEVELOPER, SERVICE_PROVIDER), an OWNER membership, and a public profile (`agencies`, `property-managers`, `solicitors`, `hosts`, `developers`, `service-providers`) |
        | AGENT, SALES_AGENT, LETTINGS_AGENT | an AGENT membership in the chosen agency and a public `agents` profile linked to it, with `specialism` null, SALES or LETTINGS |
        | AGENCY_STAFF / AGENCY_ADMIN | a STAFF / MANAGER membership in the chosen agency; no profile |
        | LANDLORD, PRIVATE_SELLER | nothing (individual owners); the role becomes ACTIVE |

        A created profile is published and **verified**; its slug is derived from the name,
        with `-2`, `-3`, ... on a collision. It carries public content only: never the phone,
        the registration number or the documents. The applicant is emailed.

        The body is optional; `note` is recorded in the history.
      security:
        - cookieSession: []
      parameters:
        - name: id
          in: path
          required: true
          description: The application's ID.
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The application and what was created.
          content:
            application/json:
              schema:
                type: object
                required: [application, created]
                additionalProperties: false
                properties:
                  application: { $ref: "#/components/schemas/OnboardingAdminApplication" }
                  created:
                    type: object
                    required: [organisation_id, profile, membership_role]
                    additionalProperties: false
                    properties:
                      organisation_id: { type: [string, "null"], format: uuid, description: "The organisation created; null when none was (agency members, private sellers)." }
                      profile:
                        oneOf:
                          - $ref: "#/components/schemas/OnboardingProfileRef"
                          - type: "null"
                      membership_role:
                        type: [string, "null"]
                        enum: [OWNER, MANAGER, AGENT, STAFF, null]
        "400":
          description: "`VALIDATION_FAILED`: the application no longer meets the requirements (they changed since it was submitted); request changes instead."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: |
            `INVALID_STATE`: the application is not `SUBMITTED`. `AGENCY_NOT_VERIFIED`: the agency
            the applicant wants to join is no longer a published, verified agency; nothing was changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            `FORBIDDEN`: not an admin-scope session, or the administrator holds none of
            SUPER_ADMIN, PLATFORM_ADMIN, MODERATOR, MARKET_ADMIN. (`CSRF_ORIGIN` for a write
            without the web app's `Origin`.)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: |
            `ONBOARDING_NOT_FOUND`: no such application, or it belongs to a market this
            MARKET_ADMIN does not administer. (`DOCUMENT_NOT_FOUND` on the file route.)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

