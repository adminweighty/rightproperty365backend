        view, with IP and user agent), `CODE_SENT`, `EMAIL_VERIFIED` (`detail.method` `EMAIL_CODE` or
        `DEMO_CODE`), `SIGNED`, `APPROVED`, `DECLINED`, `REMINDED`, `RECIPIENT_REPLACED`, `CANCELLED`,
