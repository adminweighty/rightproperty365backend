  /v1/admin/onboarding/{id}/documents/{docId}/file:
    get:
      tags: [admin, onboarding]
      operationId: adminDownloadOnboardingDocument
      summary: Download a document of an application
      description: |
        Same access rule as the list. **Every access is written to the audit log** (who, which
        document, when; never the content).
      security:
