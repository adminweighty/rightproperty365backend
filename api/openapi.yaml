  /v1/me/leases/{id}/send:
    parameters:
      - $ref: "#/components/parameters/LeaseId"
    post:
      tags: [leases]
      operationId: sendLease
      summary: Send a DRAFT lease for signing
      description: |
        Optional body. The lease is frozen: its signing copy is rendered (no watermark) with its
        SHA-256, and an agreement is created and sent (see `agreements`): every landlord and tenant
        is a SIGNER of order 1 (any order), with INITIALS on every page and SIGNATURE, NAME and
        DATE_SIGNED in the signature section, placed where the renderer left room. The lease becomes
        `SENT_FOR_SIGNING` and follows the agreement: `SIGNED` (its PDF is then the signed one),
        `DECLINED`, `CANCELLED`, `EXPIRED`. A lease whose template was retired since can still be
        sent (it keeps its version). Not a draft: `409 LEASE_STATE_CONFLICT`.
      security:
        - cookieSession: []
        - bearerToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                message:
                  type: string
                  maxLength: 2000
                expires_at:
                  type: string
                  format: date-time
                  description: Default 30 days from now; at least an hour, at most a year.
                reminder_frequency:
                  $ref: "#/components/schemas/ReminderFrequency"
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
