  /v1/inbox/appointments/{id}/confirm:
    post:
      tags: [appointments]
      operationId: confirmReceivedAppointment
      summary: Confirm the requested time, or accept the customer's proposed time (professional)
      description: |
        The body is optional. What happens depends on the appointment and on `start_utc`:

        | Appointment | `start_utc` in the body | Result |
        | --- | --- | --- |
        | `REQUESTED` | absent, or equal to the appointment's `start_utc` | `CONFIRMED` at the requested time |
        | `RESCHEDULE_REQUESTED`, `proposed_by` `CUSTOMER` | absent, or equal to `proposed_start_utc` | `CONFIRMED` at the customer's proposed time (**this is how a professional accepts a customer's proposal: `POST .../confirm` with no body or `{}`**) |
        | either of the above | a **different** time | **Not confirmed.** `RESCHEDULE_REQUESTED` with that time as `proposed_start_utc` and `proposed_by` `PROFESSIONAL`; the customer must accept it (`POST /v1/me/appointments/{id}/accept`) |
        | anything else | any | `409 INVALID_STATE` |

        `duration_minutes` and `location_note`, when sent, are saved in every successful case.

        `409 SLOT_TAKEN`: confirming would give the professional (the assigned user, or the
        organisation when nobody is assigned) two `CONFIRMED` appointments that overlap.
        Back-to-back appointments are fine. `409 INVALID_STATE` also when the time to confirm
        has already passed. The customer is told by email.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentConfirm"
      responses:
        "200":
          $ref: "#/components/responses/ReceivedAppointment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "409":
          $ref: "#/components/responses/AppointmentConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/inbox/appointments/{id}/reschedule:
    post:
      tags: [appointments]
      operationId: rescheduleReceivedAppointment
      summary: Propose a new time (professional)
      description: |
        `REQUESTED` or `CONFIRMED` -> `RESCHEDULE_REQUESTED` with `proposed_by` `PROFESSIONAL`;
        the customer must accept. Also allowed as a counter-proposal while the customer's
        proposal is waiting. `409 INVALID_STATE` when the professional's own proposal is still
        waiting, or the appointment is closed. `start_utc` must differ from the current start.
      security:
        - cookieSession: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentReschedule"
      responses:
        "200":
          $ref: "#/components/responses/ReceivedAppointment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "409":
          $ref: "#/components/responses/AppointmentConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/inbox/appointments/{id}/cancel:
